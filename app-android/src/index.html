<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ORIGEN</title>
<meta name="theme-color" content="#0A2A26">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{ --teal:#0A2A26; --teal2:#12493F; --or:#F2B705; --orsoft:#fff6d8; --fond:#E9EFEC; --carte:#fff; --txt:#10201d; --mut:#5d6f6a; --bord:#d9e2de; --soft:#eef3f0; --rouge:#C9462A; --rougesoft:#fbe0d8; --vert:#2f9e6b; --vertsoft:#d9f0e5; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;font:15px/1.45 "IBM Plex Sans",Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--txt);background:var(--fond)}
  body{display:flex;flex-direction:column;overflow:hidden}
  button{font:inherit;cursor:pointer;border:0;color:inherit}
  header{background:var(--teal);color:#fff;padding:12px 14px;padding-top:max(12px,env(safe-area-inset-top));display:flex;align-items:center;gap:8px;flex:none;font-weight:600}
  header .titre{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  header .retour{background:#ffffff22;color:#fff;border-radius:8px;padding:2px 11px;font-size:18px;line-height:1.3}
  .reseau{font-size:11.5px;font-weight:700;border-radius:99px;padding:3px 10px;background:var(--or);color:var(--teal);white-space:nowrap}
  .reseau.on{background:var(--vert);color:#fff}
  main{flex:1;position:relative;min-height:0}
  .ecran{position:absolute;inset:0;display:none;overflow:auto;padding:14px 14px 20px}
  .ecran.actif{display:block}
  #e-carte{padding:0;overflow:hidden}
  #map{position:absolute;inset:0}
  nav{flex:none;display:flex;background:#fff;border-top:1px solid var(--bord);padding-bottom:env(safe-area-inset-bottom)}
  nav.cache{display:none}
  nav button{flex:1;background:none;padding:10px 4px 8px;font-size:12px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px}
  nav button .ic{font-size:20px;line-height:1}
  nav button.actif{color:var(--teal);font-weight:700}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:11px;padding:11px 16px;font-weight:600;background:var(--soft);color:var(--txt)}
  .btn.p{background:var(--or);color:var(--teal)} .btn.d{background:var(--teal2);color:#fff} .btn.sm{padding:7px 12px;font-size:13px} .btn:disabled{opacity:.45}
  .plein{width:100%}
  .chip{display:inline-block;border-radius:99px;padding:6px 12px;font-size:12.5px;font-weight:600;background:var(--soft);color:var(--txt);white-space:nowrap}
  .chip.on{background:var(--or);color:var(--teal)}
  .rang{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .defile{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
  .champ{border:1.5px solid var(--bord);border-radius:11px;padding:8px 12px;margin:8px 0;background:#fff}
  .champ.auto{border-color:var(--or);background:var(--orsoft)}
  .champ span{display:block;font-size:11.5px;color:var(--mut)}
  .champ b{font-size:15px}
  .champ input{width:100%;border:0;background:transparent;color:var(--txt);font:inherit;font-size:15px;font-weight:600;padding:2px 0;outline:0}
  .li{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--bord);border-radius:11px;padding:9px 12px;margin:7px 0;background:#fff}
  .li b{display:block} .li small{color:var(--mut);font-size:12px}
  .mut{color:var(--mut)} .petit{font-size:12.5px}
  .avert{background:var(--orsoft);border-radius:11px;padding:9px 12px;font-size:13px;margin:8px 0}
  .avert.r{background:var(--rougesoft)} .avert.g{background:var(--vertsoft)}
  .kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;margin:10px 0}
  .kpi div{background:var(--soft);border-radius:12px;padding:9px 12px} .kpi b{display:block;font-size:20px} .kpi span{font-size:12px;color:var(--mut)}
  .st{display:inline-block;border-radius:99px;padding:2px 10px;font-size:11.5px;font-weight:700;background:var(--or);color:var(--teal);white-space:nowrap}
  .st.g{background:var(--vertsoft);color:var(--vert)} .st.m{background:var(--soft);color:var(--mut)}
  .barre{height:8px;background:var(--soft);border-radius:9px;overflow:hidden;margin-top:6px} .barre i{display:block;height:100%;background:var(--vert)}
  .carte{background:#fff;border:1px solid var(--bord);border-radius:12px;padding:14px;margin:0 0 12px} .carte h2{margin:0 0 6px;font-size:15px}
  .est{background:var(--soft);border-radius:12px;padding:10px 12px;margin:10px 0}
  /* carte */
  .rond{width:46px;height:46px;border-radius:50%;background:#fff;color:var(--teal);box-shadow:0 2px 10px #0003;display:flex;align-items:center;justify-content:center;flex:none;padding:0}
  .rond svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .rond:active{transform:scale(.94)} .rond:disabled{opacity:.45}
  #haut{position:absolute;z-index:520;left:10px;right:10px;top:calc(10px + env(safe-area-inset-top));display:flex;gap:10px;align-items:center}
  #pilule{flex:1;min-width:0;height:46px;background:#fff;border-radius:23px;box-shadow:0 2px 10px #0003;padding:5px 18px;display:flex;flex-direction:column;justify-content:center}
  #pilule b{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
  #pilule span{font-size:12px;color:var(--mut);line-height:1.2;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden}
  #pilule .pt{width:9px;height:9px;flex:none}
  #e-carte.mm #bandeau{position:absolute;z-index:510;left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100% - 20px);top:calc(64px + env(safe-area-inset-top));padding:6px 14px;border-radius:18px;font-size:12.5px;font-weight:600;display:none;box-shadow:0 2px 8px #0003;text-align:center}
  #e-carte.mm #bandeau.rouge{display:block;background:var(--rouge);color:#fff} #e-carte.mm #bandeau.orange{display:block;background:var(--or);color:var(--teal)} #e-carte.mm #bandeau.gris{display:block;background:#ffffffee;color:var(--teal);font-weight:500}
  #surface-live{position:absolute;z-index:510;left:50%;transform:translateX(-50%);top:calc(104px + env(safe-area-inset-top));padding:7px 16px;border-radius:20px;background:var(--teal);color:#fff;font-size:15px;font-weight:700;display:none;box-shadow:0 2px 10px #0004;white-space:nowrap}
  #surface-live small{font-weight:500;opacity:.8;font-size:12px;margin-left:6px}
  #menu-couches{position:absolute;z-index:530;right:10px;top:calc(64px + env(safe-area-inset-top));background:#fff;border-radius:16px;box-shadow:0 4px 18px #0004;padding:10px;display:none;min-width:230px}
  #menu-couches.vu{display:block}
  #menu-couches .seg{display:flex;background:var(--soft);border-radius:11px;padding:3px;margin-bottom:8px}
  #menu-couches .seg button{flex:1;padding:8px;border-radius:9px;background:none;font-weight:600;font-size:13px;color:var(--mut)}
  #menu-couches .seg button.on{background:#fff;color:var(--teal);box-shadow:0 1px 4px #0002}
  #menu-couches .lig{display:flex;align-items:center;gap:10px;width:100%;background:none;padding:9px 6px;font-size:14px;text-align:left;border-radius:10px}
  #menu-couches .lig i{width:14px;height:14px;border-radius:4px;flex:none}
  #menu-couches .lig u{margin-left:auto;width:38px;height:22px;border-radius:11px;background:#cfd8d4;position:relative;text-decoration:none;flex:none}
  #menu-couches .lig u::after{content:'';position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
  #menu-couches .lig.on u{background:var(--vert)} #menu-couches .lig.on u::after{left:19px}
  #e-carte.mm #flottants{position:absolute;z-index:500;right:10px;bottom:calc(var(--bas,130px) + 14px);display:flex;flex-direction:column;gap:10px}
  #action{position:absolute;z-index:520;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:12px;pointer-events:none}
  #action>*{pointer-events:auto}
  #action .ligne{display:flex;align-items:center;justify-content:center;gap:26px}
  #action .slot{width:64px;display:flex;justify-content:center}
  #action .cap{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;font-size:11.5px;font-weight:600;color:#fff;text-shadow:0 1px 4px #000c}
  .gros{width:80px;height:80px;border-radius:50%;background:var(--or);color:var(--teal);box-shadow:0 4px 18px #0006;border:4px solid #fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:12px;font-weight:800;padding:0}
  .gros svg{width:30px;height:30px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  .gros svg [fill]{fill:currentColor}
  .gros.stop{background:var(--rouge);color:#fff} .gros:disabled{opacity:.5} .gros:active{transform:scale(.95)}
  .pastille{background:#fff;color:var(--teal);border-radius:20px;padding:9px 18px;font-weight:700;font-size:14px;box-shadow:0 2px 10px #0004}
  .pastille.fort{background:var(--teal);color:#fff}
  .aide{background:#ffffffee;color:var(--teal);border-radius:16px;padding:7px 14px;font-size:12.5px;font-weight:500;box-shadow:0 2px 8px #0003;max-width:calc(100% - 40px);text-align:center}
  #e-carte.mm #feuille{position:absolute;z-index:600;left:0;right:0;bottom:0;background:#fff;border-radius:22px 22px 0 0;box-shadow:0 -4px 22px #0004;padding:4px 16px calc(14px + env(safe-area-inset-bottom));max-height:82%;overflow:auto;display:none}
  #e-carte.mm #feuille.vue{display:block}
  #e-carte.mm #feuille .poignee{width:44px;height:5px;border-radius:3px;background:#cfd8d4;margin:6px auto 12px;cursor:pointer}
  #e-carte.mm #feuille .detail{display:none} #e-carte.mm #feuille.ouverte .detail{display:block}
  #e-carte.mm #feuille .resume{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  #e-carte.mm #feuille .ha{font-size:30px;font-weight:800;line-height:1.1}
  #e-carte.mm #feuille .badges{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
  .badge{border-radius:99px;padding:4px 11px;font-size:12.5px;font-weight:700}
  .badge.rouge{background:var(--rougesoft);color:var(--rouge)} .badge.orange{background:var(--orsoft);color:#7a5a00} .badge.ok{background:var(--vertsoft);color:var(--vert)}
  /* ancien style de la carte (choix dans Zone › Affichage de la carte) */
  #e-carte.cl #bandeau{position:absolute;z-index:500;left:10px;right:10px;top:10px;padding:9px 12px;border-radius:10px;font-size:13.5px;font-weight:600;display:none;box-shadow:0 2px 8px #0003}
  #e-carte.cl #bandeau.rouge{display:block;background:var(--rouge);color:#fff} #e-carte.cl #bandeau.orange{display:block;background:var(--or);color:var(--teal)} #e-carte.cl #bandeau.gris{display:block;background:var(--teal);color:#fff;font-weight:500}
  #e-carte.cl #couches-map{position:absolute;z-index:500;left:10px;right:10px;top:58px;display:flex;gap:6px;overflow-x:auto}
  #e-carte.cl #couches-map .chip{box-shadow:0 1px 5px #0003}
  #e-carte.cl #flottants{position:absolute;z-index:500;right:10px;bottom:calc(var(--feuille,150px) + 12px)}
  #e-carte.cl #flottants button{width:44px;height:44px;border-radius:50%;background:#fff;box-shadow:0 2px 8px #0004;font-size:20px}
  #e-carte.cl #feuille{position:absolute;z-index:600;left:0;right:0;bottom:0;background:#fff;border-radius:16px 16px 0 0;box-shadow:0 -3px 14px #0003;padding:12px 14px calc(14px + env(safe-area-inset-bottom));max-height:66%;overflow:auto}
  #e-carte.cl #feuille h3{margin:0 0 6px;font-size:15px}
  #e-carte.cl #haut,#e-carte.cl #surface-live,#e-carte.cl #menu-couches,#e-carte.cl #action{display:none!important}
  #e-carte.mm #couches-map{display:none}
  .prec{display:flex;align-items:center;gap:8px;font-size:13px;margin:4px 0 8px}
  .pt{width:12px;height:12px;border-radius:50%;background:var(--vert)} .pt.o{background:var(--or)} .pt.r{background:var(--rouge)}
  .sommet{width:24px;height:24px;border-radius:50%;background:var(--or);border:2px solid var(--teal);color:var(--teal);font:700 11px/20px system-ui;text-align:center;box-shadow:0 1px 4px #0006}
  .alerte{padding:8px 10px;border-radius:8px;margin:6px 0;font-size:13.5px}
  .alerte.rouge{background:var(--rougesoft);color:var(--rouge)} .alerte.orange{background:var(--orsoft);color:#7a5a00} .alerte.ok{background:var(--vertsoft);color:var(--vert)}
  #connexion{position:absolute;inset:0;z-index:1000;background:var(--fond);padding:28px;display:none;overflow:auto}
  #connexion.actif{display:block}
  #connexion label{display:block;font-size:13px;color:var(--mut);margin:10px 0 2px}
  #connexion input{width:100%;font:inherit;padding:12px;border:1.5px solid var(--bord);border-radius:11px;background:#fff}
  .toast{position:fixed;z-index:2000;left:12px;right:12px;bottom:90px;background:var(--teal);color:#fff;border-radius:12px;padding:11px 14px;font-size:14px;display:none;text-align:center}
</style>
</head>
<body>
<header><button class="retour" id="h-retour" style="display:none" aria-label="Retour">‹</button><span class="titre" id="h-titre">ORIGEN</span><span class="reseau" id="h-reseau">réseau</span></header>
<main>
  <section class="ecran actif" id="e-accueil"></section>
  <section class="ecran" id="e-nouveau"></section>
  <section class="ecran" id="e-carte">
    <div id="map"></div>
    <div id="haut">
      <button class="rond" id="c-retour" aria-label="Retour"></button>
      <div id="pilule"><b id="pl-t">Tracé</b><span id="pl-s"></span></div>
      <button class="rond" id="c-couches" aria-label="Couches"></button>
    </div>
    <div id="bandeau"></div>
    <div id="couches-map"></div>
    <div id="surface-live"></div>
    <div id="menu-couches"></div>
    <div id="flottants"><button class="rond" id="b-centrer" aria-label="Me centrer"></button></div>
    <div id="action"></div>
    <div id="feuille"></div>
  </section>
  <section class="ecran" id="e-couches"></section>
  <section class="ecran" id="e-traces"></section>
  <section id="connexion">
    <h2 style="margin:24px 0 4px">ORIGEN</h2>
    <p class="mut">Connecte-toi avec le compte de ta coopérative. Tes producteurs et tes sections se chargent tout seuls.</p>
    <form id="f-login" autocomplete="on">
      <label for="l-email">Email</label><input id="l-email" type="email" autocomplete="username" required>
      <label for="l-mdp">Mot de passe</label><input id="l-mdp" type="password" autocomplete="current-password" required>
      <p id="l-err" style="color:var(--rouge);font-size:13.5px;min-height:20px"></p>
      <button class="btn p plein" type="submit">Se connecter</button>
    </form>
  </section>
</main>
<nav id="nav">
  <button data-e="accueil" class="actif"><span class="ic">🏠</span>Accueil</button>
  <button data-e="couches"><span class="ic">⬇</span>Zone</button>
  <button data-e="traces"><span class="ic">📍</span>Mes tracés <span id="n-attente"></span></button>
</nav>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Turf.js/6.5.0/turf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const APP_VERSION = '2026-11-04-app6';
const SB_URL = 'https://sfjvtwzrnzjvyhfqxswm.supabase.co';
const SB_KEY = 'sb_publishable_P4v62H4iEYLyD5uE2PVQig_MY4AnL_Y';
const ECO_INCOMPLET = 'Contrôle ECORIGINE NON FAIT : les parcelles de cette zone ne sont pas sur le téléphone et il n’y a pas de réseau. Il sera refait automatiquement dès que le réseau revient, avant l’envoi.';
const COUCHE_PA = 'couches/espaces_proteges_v1.json';
const IC = {
  retour:'<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',
  couches:'<svg viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/></svg>',
  centrer:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>',
  marcher:'<svg viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z" fill="currentColor"/></svg>',
  stop:'<svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></svg>',
  plus:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  annuler:'<svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg>',
  corbeille:'<svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>',
  fermer:'<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>' };
const sb = supabase.createClient(SB_URL, SB_KEY);
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (n,d) => Number(n).toLocaleString('fr-FR',{minimumFractionDigits:d||0,maximumFractionDigits:d||0});
let STYLE0 = 'maps'; try { STYLE0 = localStorage.getItem('style_carte') === 'classique' ? 'classique' : 'maps'; } catch(e){}
const S = { styleCarte:STYLE0, coop:null, producteurs:[], sections:[], serveurIds:new Set(), traces:[], sectionSel:null, prod:null, ecran:'accueil', pile:[],
  pa:null, paIdx:[], eco:null, ecoCouches:new Map(), couchEco:true, ecoTel:null, pos:null, pts:[], collecte:null, marche:null, rawTrail:null, meta:null, fermeture:null, verif:null, maxAcc:15, suivre:true, couchePA:true, tel:null, majLe:null };

/* ---------- stockage local ---------- */
function idb(){ return new Promise((ok,ko)=>{ const r = indexedDB.open('origen-terrain',1); r.onupgradeneeded = ()=>{ r.result.createObjectStore('kv'); r.result.createObjectStore('traces',{keyPath:'id'}); }; r.onsuccess = ()=>ok(r.result); r.onerror = ()=>ko(r.error); }); }
async function kvGet(k){ try { const db = await idb(); return await new Promise((ok,ko)=>{ const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = ()=>ok(q.result); q.onerror = ()=>ko(q.error); }); } catch(e){ return null; } }
async function kvSet(k,v){ const db = await idb(); return new Promise((ok,ko)=>{ const t = db.transaction('kv','readwrite'); t.objectStore('kv').put(v,k); t.oncomplete = ()=>ok(); t.onerror = ()=>ko(t.error); }); }
async function trAll(){ try { const db = await idb(); return await new Promise((ok,ko)=>{ const q = db.transaction('traces').objectStore('traces').getAll(); q.onsuccess = ()=>ok(q.result||[]); q.onerror = ()=>ko(q.error); }); } catch(e){ return []; } }
async function trPut(t){ const db = await idb(); return new Promise((ok,ko)=>{ const x = db.transaction('traces','readwrite'); x.objectStore('traces').put(t); x.oncomplete = ()=>ok(); x.onerror = ()=>ko(x.error); }); }
async function trDel(id){ const db = await idb(); return new Promise((ok,ko)=>{ const x = db.transaction('traces','readwrite'); x.objectStore('traces').delete(id); x.oncomplete = ()=>ok(); x.onerror = ()=>ko(x.error); }); }
function toast(m){ const t = $('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(()=>{ t.style.display = 'none'; }, 3800); }

/* ---------- connexion et chargement automatique depuis la base ---------- */
$('f-login').addEventListener('submit', async ev=>{
  ev.preventDefault(); $('l-err').textContent = '';
  const r = await sb.auth.signInWithPassword({ email:$('l-email').value.trim(), password:$('l-mdp').value });
  if (r.error){ $('l-err').textContent = 'Connexion impossible : '+r.error.message; return; }
  $('connexion').classList.remove('actif'); await demarrer();
});
async function demarrer(){
  let coop = null;
  const s = await sb.auth.getSession();
  if (s.data && s.data.session && navigator.onLine){
    const r = await sb.from('cooperatives').select('id,nom').order('nom').limit(100);
    if (!r.error && r.data && r.data.length){
      coop = r.data.length===1 ? r.data[0] : (r.data.find(c=>c.id===localStorage.getItem('terrain_coop')) || r.data[0]);
      await kvSet('coop', coop);
    }
  }
  if (!coop) coop = await kvGet('coop');
  if (!coop){ $('connexion').classList.add('actif'); return; }
  S.coop = coop;
  S.traces = await trAll();
  activerGPS();
  await chargerPA();
  await chargerEco();
  await chargerRegistre();
  aller('accueil'); synchroniser();

}
// Les couches se téléchargent toutes seules (absentes, ou plus vieilles que 7 jours) : plus rien à faire à la main
async function autoCouches(){
  if (!navigator.onLine || S.tel || S.ecoTel) return;
  const vieux = o => !o || !o.le || (Date.now()-new Date(o.le).getTime()) > 7*864e5;
  try { if (vieux(S.pa)) await telechargerCouche(); } catch(e){}
  try { if (vieux(S.eco) && boiteZone()) await telechargerEco(); } catch(e){}
}
async function chargerRegistre(){
  if (navigator.onLine){
    try {
      let prods = [];
      for (let de=0; ; de+=1000){
        const r = await sb.from('producteurs').select('id,nom,code,section,village_district,polygon_filename,lat,lon').eq('cooperative_id',S.coop.id).order('nom').range(de,de+999);
        if (r.error) throw r.error; prods = prods.concat(r.data); if (r.data.length<1000) break;
      }
      const sec = await sb.from('sections').select('id,nom,lat,lon,localite,infrastructures').eq('cooperative_id',S.coop.id).order('nom');
      const tr = await sb.from('traces_terrain').select('producteur_id').eq('cooperative_id',S.coop.id).not('producteur_id','is',null);
      const reg = { prods, sections:sec.error?[]:sec.data, serveur:tr.error?[]:tr.data.map(x=>x.producteur_id), le:new Date().toISOString() };
      await kvSet('registre:'+S.coop.id, reg);
    } catch(e){ toast('Chargement des producteurs impossible : '+((e&&e.message)||e)); }
  }
  const reg = await kvGet('registre:'+S.coop.id);
  S.producteurs = reg ? reg.prods : []; S.sections = reg ? reg.sections : []; S.serveurIds = new Set(reg ? reg.serveur : []); S.majLe = reg ? reg.le : null;
  if (reg){ const noms = new Set(S.producteurs.map(p=>p.section).filter(Boolean)); S.sections.forEach(x=>noms.delete(x.nom)); noms.forEach(n=>S.sections.push({ nom:n })); }
}
function estMappe(p){ return !!(p.polygon_filename && String(p.polygon_filename).trim()) || S.serveurIds.has(p.id) || S.traces.some(t=>t.producteur_id===p.id); }
function nomSection(p){ return p.section || 'Sans section'; }
function sectionsListe(){ const l = S.sections.map(s=>s.nom); if (S.producteurs.some(p=>!p.section)) l.push('Sans section'); return l; }
function sectionProposee(){
  if (S.sectionSel) return S.sectionSel;
  const avec = S.sections.filter(s=>s.lat!=null && s.lon!=null);
  if (S.pos && avec.length){ let best = null; avec.forEach(s=>{ const d = dMetres(S.pos,{ lat:s.lat, lng:s.lon }); if (!best || d<best.d) best = { s, d }; }); return best.s.nom; }
  const liste = sectionsListe(); return liste.length ? liste[0] : null;
}

function norm(s){ return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(Boolean); }
function similaire(a,b){ const A = norm(a), B = norm(b); if (!A.length||!B.length) return false; const [p,g] = A.length<=B.length ? [A,B] : [B,A]; return p.length>=2 ? p.every(t=>g.includes(t)) : (p[0].length>3 && g.includes(p[0]) && g.length<=2); }
function tousLesNoms(){ return S.producteurs.map(p=>({ nom:p.nom, code:p.code })).concat(S.traces.filter(t=>t.nouveau).map(t=>({ nom:t.producteur_nom, code:t.code_producteur }))); }
function prefixeCode(){ const c = S.producteurs.map(p=>p.code).find(x=>x&&x.includes('-')); if (c){ const p = c.split('-'); return p.length>=3 ? p[0] : p[0]; } return (S.coop.nom.match(/[A-Za-zÀ-ÿ]+/g)||['COP']).map(w=>w[0]).join('').toUpperCase().slice(0,4); }
function codePropose(section){
  const pre = prefixeCode(); const tous = new Set(tousLesNoms().map(x=>x.code).filter(Boolean)); let max = 0;
  tous.forEach(c=>{ const m = String(c).match(/(\d+)\s*$/); if (m && String(c).startsWith(pre)) max = Math.max(max,+m[1]); });
  const ab = section && section!=='Sans section' ? '-'+norm(section).join('').slice(0,3).toUpperCase() : '';
  return pre+ab+'-'+String(max+1).padStart(4,'0');
}

async function chargerPA(){
  const c = await kvGet('pa'); S.pa = c || null; S.paIdx = [];
  if (!c) { dessinerPA(); return; }
  c.json.features.forEach(f=>{
    const polys = f.geometry.type==='Polygon' ? [f.geometry.coordinates] : f.geometry.coordinates;
    let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
    polys.forEach(p=>p[0].forEach(q=>{ if(q[0]<x0)x0=q[0]; if(q[0]>x1)x1=q[0]; if(q[1]<y0)y0=q[1]; if(q[1]>y1)y1=q[1]; }));
    S.paIdx.push({ nom:f.properties.nom, type:f.properties.type, polys, bbox:[x0,y0,x1,y1], f });
  });
  dessinerPA();
}
function dessinerPA(){ if (!S.paLayer) return; S.paLayer.clearLayers(); if (S.pa) L.geoJSON(S.pa.json,{ style:{ color:'#ff8f6b', weight:2, dashArray:'6 4', fillColor:'#C9462A', fillOpacity:.2 }, onEachFeature:(f,l)=>l.bindPopup('<b>'+esc(f.properties.nom)+'</b><br>'+esc(f.properties.type)) }).addTo(S.paLayer); }
function pip(lng,lat,rings){ let dedans = false; for (const ring of rings){ for (let i=0,j=ring.length-1;i<ring.length;j=i++){ const xi=ring[i][0],yi=ring[i][1],xj=ring[j][0],yj=ring[j][1]; if (((yi>lat)!==(yj>lat)) && (lng < (xj-xi)*(lat-yi)/(yj-yi)+xi)) dedans = !dedans; } } return dedans; }
function distAnneaux(lng,lat,rings){
  const k = 111320, cl = Math.cos(lat*Math.PI/180); let best = Infinity;
  for (const ring of rings){ for (let i=0;i<ring.length-1;i++){
    const ax=(ring[i][0]-lng)*k*cl, ay=(ring[i][1]-lat)*k, bx=(ring[i+1][0]-lng)*k*cl, by=(ring[i+1][1]-lat)*k, dx=bx-ax, dy=by-ay, l2=dx*dx+dy*dy;
    let t = l2 ? -(ax*dx+ay*dy)/l2 : 0; t = Math.max(0,Math.min(1,t)); const d = Math.hypot(ax+t*dx, ay+t*dy); if (d<best) best = d;
  } } return best;
}
function proximite(lng,lat){
  let meilleur = null;
  for (const z of S.paIdx){
    const m = 0.03; if (lng<z.bbox[0]-m || lng>z.bbox[2]+m || lat<z.bbox[1]-m || lat>z.bbox[3]+m) continue;
    for (const p of z.polys){
      if (pip(lng,lat,p)) return { dedans:true, nom:z.nom, type:z.type, d:0 };
      const d = distAnneaux(lng,lat,p); if (!meilleur || d<meilleur.d) meilleur = { dedans:false, nom:z.nom, type:z.type, d };
    }
  }
  return meilleur;
}
function majBandeau(){
  const b = $('bandeau'); if (!b) return;
  if (!S.pos){ b.className = 'gris'; b.textContent = 'Recherche du signal GPS…'; return; }
  if (!S.pa){ b.className = 'gris'; b.textContent = 'Couches non téléchargées : onglet Zone.'; return; }
  const p = proximite(S.pos.lng, S.pos.lat);
  if (p && p.dedans){ b.className = 'rouge'; b.textContent = 'Tu es dans une aire protégée : '+p.nom+'. Tu peux continuer.'; }
  else if (p && p.d<=300){ b.className = 'orange'; b.textContent = 'Aire protégée dans '+Math.round(p.d)+' m : '+p.nom; }
  else { b.className = 'gris'; b.textContent = p && p.d<5000 ? 'Aire protégée la plus proche : '+(p.d>=1000?fmt(p.d/1000,1)+' km':Math.round(p.d)+' m') : 'Aucune aire protégée à moins de 5 km.'; }
}

/* ---------- parcelles ECORIGINE (autres coopératives, en pointillé, sans nom ni donnée) ---------- */
async function chargerEco(){ S.eco = (await kvGet('eco')) || null; S.ecoCouches.forEach(l=>{ if (S.ecoLayer) S.ecoLayer.removeLayer(l); }); S.ecoCouches.clear(); majEco(); }
function majEco(){
  if (!S.map || !S.ecoLayer) return;
  const z = S.map.getZoom(), garder = new Set();
  if (S.eco && S.couchEco && z>=13){
    const b = S.map.getBounds().pad(0.25), pas = S.eco.pas||0.25;
    for (let ix=Math.floor(b.getWest()/pas); ix<=Math.floor(b.getEast()/pas); ix++) for (let iy=Math.floor(b.getSouth()/pas); iy<=Math.floor(b.getNorth()/pas); iy++){
      const k = ix+'_'+iy, fc = S.eco.cases[k]; if (!fc) continue; garder.add(k);
      if (!S.ecoCouches.has(k)){
        const l = L.geoJSON({ type:'FeatureCollection', features:fc.features.filter(f=>!S.coop || f.properties.k!==S.coop.id) },{ renderer:S.canvas, interactive:false, style:{ color:'#ffffff', weight:1.4, dashArray:'4 4', fill:false, opacity:.9 } });
        S.ecoCouches.set(k,l);
      }
    }
  }
  S.ecoCouches.forEach((l,k)=>{ if (garder.has(k)){ if (!S.ecoLayer.hasLayer(l)) S.ecoLayer.addLayer(l); } else if (S.ecoLayer.hasLayer(l)) S.ecoLayer.removeLayer(l); });
}
function boiteZone(){
  const pts = [];
  S.sections.forEach(x=>{ if (x.lat!=null && x.lon!=null) pts.push([+x.lon,+x.lat]); });
  S.producteurs.forEach(p=>{ const la = parseFloat(p.lat), lo = parseFloat(p.lon); if (isFinite(la) && isFinite(lo) && la>0 && la<12 && lo<-1 && lo>-10) pts.push([lo,la]); });
  if (S.pos) pts.push([S.pos.lng,S.pos.lat]);
  if (!pts.length) return null;

// Cellules (grille ECORIGINE) déjà examinées : téléchargées, ou vérifiées vides. Sert à savoir si le contrôle de chevauchement est exact à un endroit.
function ecoRects(e){
  if (!e) return [];
  if (e.couvert) return e.couvert;
  const pas = e.pas||0.25, z = e.zone; if (!z) return [];       // anciennes données : on déduit la zone couverte
  return [[Math.floor(z.w/pas), Math.floor(z.e/pas), Math.floor(z.s/pas), Math.floor(z.n/pas)]];
}
function ecoCellulesPour(bb, pas){
  const c = []; for (let ix=Math.floor(bb[0]/pas); ix<=Math.floor(bb[2]/pas); ix++) for (let iy=Math.floor(bb[1]/pas); iy<=Math.floor(bb[3]/pas); iy++) c.push([ix,iy]);
  return c;
}
function ecoCouvre(bb){
  if (!S.eco) return false;
  const R = ecoRects(S.eco);
  return ecoCellulesPour(bb, S.eco.pas||0.25).every(([ix,iy])=>R.some(r=>ix>=r[0] && ix<=r[1] && iy>=r[2] && iy<=r[3]));

// Télécharge (et ajoute à ce qu'on a déjà) les parcelles ECORIGINE d'une zone. bzArg = {w,e,s,n} ; sinon la zone de travail de la coopérative.
async function telechargerEco(bzArg, silencieux){
  if (!navigator.onLine){ if (!silencieux) toast('Il faut du réseau pour télécharger la zone.'); return false; }
  const bz = (bzArg && bzArg.w!=null) ? bzArg : boiteZone(); if (!bz){ if (!silencieux) toast('Attends le signal GPS ou charge d’abord les sections de la coopérative.'); activerGPS(); return false; }
  S.ecoTel = true; rendreCouches();
  const txt = () => $('t-eco'), barre = () => $('p-eco');
  let ok = false;
  try {
    const bi = await sb.storage.from('documents-coop').download('couches/ecorigine/index.json'); if (bi.error) throw bi.error;
    const index = JSON.parse(await bi.data.text()), pas = index.pas||0.25;
    const ancien = (S.eco && S.eco.version===index.version && S.eco.pas===pas) ? S.eco : null;        // nouvelle version de la base : on repart de zéro
    const cases = ancien ? ancien.cases : {}; let taille = ancien ? ancien.taille : 0;
    const ix0 = Math.floor(bz.w/pas), ix1 = Math.floor(bz.e/pas), iy0 = Math.floor(bz.s/pas), iy1 = Math.floor(bz.n/pas);
    const cles = Object.keys(index.cases).filter(k=>{ const [ix,iy] = k.split('_').map(Number); return ix>=ix0 && ix<=ix1 && iy>=iy0 && iy<=iy1 && !cases[k]; });
    if (barre()) barre().style.display = 'block';
    let fait = 0;
    for (const k of cles){
      const r = await sb.storage.from('documents-coop').download('couches/ecorigine/c_'+k+'.json'); if (r.error) throw r.error;
      const t = await r.data.text(); taille += t.length; cases[k] = JSON.parse(t); fait++;
      if (barre()) barre().firstChild.style.width = Math.round(100*fait/cles.length)+'%'; if (txt()) txt().textContent = fait+' carreaux sur '+cles.length;
    }
    const nb = Object.values(cases).reduce((a,c)=>a+c.features.length,0);
    const couvert = (ancien ? ecoRects(ancien) : []).concat([[ix0,ix1,iy0,iy1]]);
    await kvSet('eco', { version:index.version, le:new Date().toISOString(), pas, cases, taille, nb, zone:bz, couvert });

    if (!silencieux) toast('Zone téléchargée : '+fmt(nb)+' parcelles, disponibles sans réseau.');
  } catch(e){ if (!silencieux) toast('Téléchargement impossible : '+((e&&e.message)||e)); }
  S.ecoTel = null; rendreCouches(); return ok;
}
// Garantit que le contrôle de chevauchement est EXACT autour d'un tracé : télécharge la zone manquante si besoin (réseau), sinon dit que le contrôle n'est pas fait.
async function assurerEcoPour(bb){
  if (ecoCouvre(bb)) return true;
  if (!navigator.onLine) return false;
  const m = 0.1; toast('Téléchargement des parcelles ECORIGINE de cette zone pour un contrôle exact…');
  await telechargerEco({ w:bb[0]-m, e:bb[2]+m, s:bb[1]-m, n:bb[3]+m }, true);
  return ecoCouvre(bb);
}
function chevauchementEco(poly){
  if (!S.eco) return null;
  const bb = turf.bbox(poly), pas = S.eco.pas||0.25; let total = 0, nb = 0;
  for (let ix=Math.floor(bb[0]/pas); ix<=Math.floor(bb[2]/pas); ix++) for (let iy=Math.floor(bb[1]/pas); iy<=Math.floor(bb[3]/pas); iy++){
    const fc = S.eco.cases[ix+'_'+iy]; if (!fc) continue;
    for (const f of fc.features){
      if (S.coop && f.properties.k===S.coop.id) continue;
      if (!f._bb) f._bb = turf.bbox(f);
      if (f._bb[2]<bb[0] || f._bb[0]>bb[2] || f._bb[3]<bb[1] || f._bb[1]>bb[3]) continue;
      try { const i = turf.intersect(poly,f); if (i){ const h = turf.area(i)/10000; if (h>0.005){ total += h; nb++; } } } catch(e){}
    }

}

/* ---------- GPS ---------- */
// Une position arrive (du GPS du navigateur, ou du service d'arrière-plan quand l'écran est éteint)
function appliquerPosition(lat, lng, acc, tt){
  if (S.pos && tt && S.pos.t && tt <= S.pos.t) return;          // même mesure reçue par les deux sources, ou plus ancienne
  S.pos = { lat:lat, lng:lng, acc:acc, t:tt||Date.now() };
  if (S.posLayer){
    S.posLayer.clearLayers();
    L.circle([S.pos.lat,S.pos.lng],{ radius:S.pos.acc, color:'#2563eb', weight:1, fillOpacity:.1 }).addTo(S.posLayer);
    L.circleMarker([S.pos.lat,S.pos.lng],{ radius:7, color:'#fff', weight:2, fillColor:'#2563eb', fillOpacity:1 }).addTo(S.posLayer);
    if (S.suivre && !S.vuDejaCentre){ S.vuDejaCentre = true; S.map.setView([S.pos.lat,S.pos.lng],17); } else if (S.suivre && S.ecran==='carte') S.map.panTo([S.pos.lat,S.pos.lng],{ animate:true });
  }
  if (S.marche) marcheFix(S.pos);
  if (S.collecte && S.pos.acc <= S.maxAcc) S.collecte.fixes.push({ lat:S.pos.lat, lng:S.pos.lng, acc:S.pos.acc });
  if (S.ecran==='carte'){ majBandeau(); majPrec(); }

}
function activerGPS(){
  if (!navigator.geolocation){ toast('Ce téléphone ne donne pas la position.'); return; }
  if (S.watch != null) return;
  S.watch = navigator.geolocation.watchPosition(p=>appliquerPosition(p.coords.latitude, p.coords.longitude, p.coords.accuracy, p.timestamp),
    e=>{ S.watch = null; if (S.ecran==='carte') toast(e.code===1 ? 'Position refusée : autorise la position pour ORIGEN.' : 'GPS indisponible : '+e.message); }, { enableHighAccuracy:true, maximumAge:0, timeout:20000 });
}
/* ---------- GPS en arrière-plan (écran éteint, application réduite) : service Android de premier plan ----------

// Pastille de surface en direct (ou de marche / mesure en cours)

function majPrecClassique(){ const e = $('prec'); if (!e || !S.pos) return; const a = S.pos.acc; e.innerHTML = '<span class="pt '+(a<=5?'':a<=S.maxAcc?'o':'r')+'"></span><b>Précision ±'+Math.round(a)+' m</b><span class="mut petit">'+(a<=5?'excellent signal':a<=S.maxAcc?'signal correct':'signal trop faible : attends')+'</span>'; }

function dMetres(a,b){ const k = 111320, cl = Math.cos(((a.lat+b.lat)/2)*Math.PI/180); return Math.hypot((a.lng-b.lng)*k*cl,(a.lat-b.lat)*k); }
function dessiner(){
  S.traceLayer.clearLayers();

  if (ll.length>=3) L.polygon(ll,{ color:'#F2B705', weight:3, fillOpacity:.15, interactive:false }).addTo(S.traceLayer); else if (ll.length===2) L.polyline(ll,{ color:'#F2B705', weight:3, interactive:false }).addTo(S.traceLayer);

    const m = L.marker([p.lat,p.lng],{ draggable:true, icon:L.divIcon({ className:'', html:'<div class="sommet">'+(i+1)+'</div>', iconSize:[24,24], iconAnchor:[12,12] }) });

    m.on('dragend', ()=>{ const q = m.getLatLng(); S.pts[i].lat = q.lat; S.pts[i].lng = q.lng; S.pts[i].edite = true; if (S.verif) verifierTrace(); else dessiner(); });

function supprimerPoint(i){ S.map.closePopup(); S.pts.splice(i,1); if (S.pts.length<3) S.verif = null; dessiner(); if (S.verif) verifierTrace(); else rendreFeuille(); }
function ajouterPoint(p){ S.pts.push(p); S.verif = null; dessiner(); rendreFeuille(); }
async function marquerPoint(){

  const duree = 10000; S.collecte = { fixes:[], debut:Date.now() }; rendreFeuille();
  await new Promise(r=>{ const iv = setInterval(()=>{ const reste = Math.max(0, Math.ceil((duree-(Date.now()-S.collecte.debut))/1000)); S.collecte.reste = reste; if (S.styleCarte==='classique'){ const b = $('b-marquer'); if (b) b.textContent = 'Mesure… '+reste+' s'; } else majChip(); if (Date.now()-S.collecte.debut>=duree){ clearInterval(iv); r(); } },250); });

function simplifier(pts,tol){
  if (pts.length<3) return pts.slice();

  garde[0] = garde[P.length-1] = true; const pile = [[0,P.length-1]];
  while (pile.length){

    for (let n=i+1;n<j;n++){ let t = l2 ? ((P[n][0]-ax)*dx+(P[n][1]-ay)*dy)/l2 : 0; t = Math.max(0,Math.min(1,t)); const d = Math.hypot(P[n][0]-(ax+t*dx), P[n][1]-(ay+t*dy)); if (d>max){ max = d; idx = n; } }

function marcherDebut(){

  S.marche = { trail:[], dist:0, rejetes:0, debut:Date.now() }; S.marcheLayer.clearLayers(); S.suivre = true;

function marcheFix(p){

function majMarche(){ if (S.styleCarte==='classique') return majMarcheClassique(); majChip(); }
function majMarcheClassique(){ const e = $('st-marche'), m = S.marche; if (e && m) e.textContent = m.trail.length+' points · '+Math.round(m.dist)+' m parcourus'+(m.rejetes?' · '+m.rejetes+' mesure'+(m.rejetes>1?'s':'')+' écartée'+(m.rejetes>1?'s':''):''); }

      + (n>=3 && !S.collecte ? '<button class="pastille fort" id="b-fermer">Fermer le tracé · '+n+' sommets</button>' : '')

  b('b-marche',marcherDebut); b('b-marquer',marquerPoint); b('b-fermer',verifierTrace); b('b-dernier',annulerDernier); b('b-eff',effacerTrace);
  b('b-fin',marcherFin); b('b-ann',marcherAnnuler); b('b-save',enregistrerTrace); b('b-retrace',()=>{ S.verif = null; S.feuilleOuverte = false; effacerTrace(); });
  const ouvrir = ()=>{ S.feuilleOuverte = !S.feuilleOuverte; f.classList.toggle('ouverte', S.feuilleOuverte); setBas(); };

}
// Les boutons flottants (me centrer) restent au-dessus du bas de l'écran (action ou feuille)

async function enregistrerTrace(){
  const v = S.verif; if (!v) return; const p = S.prod;
  const manuel = S.pts.some(x=>x.acc===0);
  const t = { id:'tr_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6), cooperative_id:S.coop.id, producteur_id:p.id||null, nouveau:!!p.nouveau, section:p.section||null, code_producteur:p.nouveau?p.code:(p.code||null),
    producteur_nom:p.nom, code_parcelle:S.parcelle,
    geojson:{ type:'Feature', properties:{ surface_ha:+v.ha.toFixed(4), surface_min_ha:v.marge?+v.marge.min.toFixed(4):null, surface_max_ha:v.marge?+v.marge.max.toFixed(4):null, precision_moy_m:v.accMoy!=null?+v.accMoy.toFixed(1):null, producteur:p.nom, code:S.parcelle,
      releve:S.meta?S.meta.mode:(manuel?'manuel':'points'), fermeture_m:S.fermeture!=null?+S.fermeture.toFixed(1):null, sommets_deplaces:S.pts.filter(x=>x.edite).length, distance_marchee_m:S.meta?Math.round(S.meta.dist):null,
      piste:S.rawTrail?S.rawTrail.slice(0,1500).map(x=>[+x.lng.toFixed(6),+x.lat.toFixed(6),Math.round(x.acc),Math.round(x.t/1000)]):null }, geometry:v.geom },
    surface_ha:+v.ha.toFixed(4), precision_moy_m:v.accMoy!=null?+v.accMoy.toFixed(1):null, alertes:v.al.filter(a=>a.n!=='ok').map(a=>a.t), mode:manuel?'manuel':'gps',
    appareil:navigator.userAgent.slice(0,140), releve_le:new Date().toISOString(), statut:'en_attente', eco_incomplet:!!v.ecoIncomplet };
  await trPut(t); S.traces = await trAll(); resetTrace(); dessiner();
  S.pile = []; S.prod = null; aller('accueil'); majAttente();
  toast('Mapping enregistré sur le téléphone. Il sera envoyé dès que le réseau est là.'); synchroniser();
}

/* ---------- synchronisation ---------- */
async function synchroniser(){
  if (!navigator.onLine || !S.coop) return;
  const att = (await trAll()).filter(t=>t.statut==='en_attente'); let envoyes = 0;
  for (const t of att){
    if (t.eco_incomplet){                                  // contrôle ECORIGINE pas fait au relevé : on le fait maintenant, avant d'envoyer
      try {
        const poly = turf.feature(t.geojson.geometry), bb = turf.bbox(poly);
        if (await assurerEcoPour(bb)){
          const ce = chevauchementEco(poly);
          t.alertes = (t.alertes||[]).filter(x=>x!==ECO_INCOMPLET);
          if (ce && ce.nb) t.alertes.push('Chevauche '+ce.nb+' parcelle'+(ce.nb>1?'s':'')+' déjà cartographiée'+(ce.nb>1?'s':'')+' par d’autres coopératives, sur '+fmt(ce.ha,2)+' ha. Le bureau vérifiera.');
          t.eco_incomplet = false; delete t.erreur; await trPut(t);
        } else { t.erreur = 'Contrôle ECORIGINE à refaire : réseau insuffisant pour télécharger la zone.'; await trPut(t); continue; }
      } catch(e){ t.erreur = 'Contrôle ECORIGINE impossible : '+((e&&e.message)||e); await trPut(t); continue; }
    }
    const r = await sb.from('traces_terrain').insert({ id:t.id, cooperative_id:t.cooperative_id, producteur_id:t.producteur_id||null, nouveau:!!t.nouveau, section:t.section||null, producteur_nom:t.producteur_nom, code_parcelle:t.code_parcelle, geojson:t.geojson, surface_ha:t.surface_ha, precision_moy_m:t.precision_moy_m, alertes:t.alertes, mode:t.mode, statut:'a_confirmer', appareil:t.appareil, releve_le:t.releve_le });
    if (!r.error || r.error.code==='23505'){ t.statut = 'envoye'; delete t.erreur; envoyes++; if (t.producteur_id) S.serveurIds.add(t.producteur_id); } else t.erreur = r.error.message;
    await trPut(t);
  }
  S.traces = await trAll(); majAttente(); if (S.ecran==='traces') rendreTraces(); if (S.ecran==='accueil') rendreAccueil();
  if (envoyes) toast(envoyes+' mapping'+(envoyes>1?'s':'')+' envoyé'+(envoyes>1?'s':'')+' au bureau.');
}
function majAttente(){ const n = S.traces.filter(t=>t.statut==='en_attente').length; $('n-attente').innerHTML = n ? '<span class="st">'+n+'</span>' : ''; }
function majReseau(){ const e = $('h-reseau'); if (navigator.onLine){ e.textContent = 'réseau'; e.className = 'reseau on'; synchroniser(); } else { e.textContent = 'hors réseau'; e.className = 'reseau'; } }
addEventListener('online', majReseau); addEventListener('offline', majReseau);

/* ---------- zone et couches ---------- */
function rendreCouches(){
  const c = $('e-couches'); const pa = S.pa;
  let h = '<div class="carte"><h2>Producteurs et sections</h2><p class="mut petit">'+fmt(S.producteurs.length)+' producteurs, '+S.sections.length+' sections'+(S.majLe?' · à jour le '+esc(new Date(S.majLe).toLocaleString('fr-FR')):'')+'. Ils se chargent tout seuls à la connexion et marchent sans réseau.</p><button class="btn sm" id="b-actu2">Actualiser</button></div>';
  h += '<div class="carte"><h2>Aires protégées et forêts classées</h2>'
    + (pa ? '<p><span class="st g">Téléchargées</span> '+pa.json.features.length+' zones · '+fmt(pa.taille/1e6,1)+' Mo · le '+esc(new Date(pa.le).toLocaleDateString('fr-FR'))+'</p><p class="mut petit">Elles fonctionnent sans réseau.</p>' : '<p><span class="st">Pas encore téléchargées</span></p><p class="mut petit">À télécharger avant de partir (environ 1 Mo).</p>')
    + '<div class="barre" id="p-couche" style="display:none"><i style="width:0"></i></div><p class="mut petit" id="t-couche"></p>'
    + '<button class="btn p" id="b-tel" '+(S.tel?'disabled':'')+'>'+(pa?'Mettre à jour':'Télécharger les couches')+'</button></div>';
  const e = S.eco;
  h += '<div class="carte"><h2>Parcelles ECORIGINE (en pointillé)</h2>'
    + (e ? '<p><span class="st g">Téléchargées</span> '+fmt(e.nb)+' parcelles · '+fmt(e.taille/1e6,1)+' Mo · le '+esc(new Date(e.le).toLocaleDateString('fr-FR'))+'</p><p class="mut petit">Parcelles des autres coopératives de ta zone : contours seulement, sans nom ni donnée. Elles marchent sans réseau et s’affichent en zoomant.</p>' : '<p><span class="st">Pas encore téléchargées</span></p><p class="mut petit">À télécharger avant de partir : la zone de ta coopérative (environ 30 km autour).</p>')
    + '<div class="barre" id="p-eco" style="display:none"><i style="width:0"></i></div><p class="mut petit" id="t-eco"></p>'
    + '<button class="btn p" id="b-eco" '+(S.ecoTel?'disabled':'')+'>'+(e?'Mettre à jour':'Télécharger la zone')+'</button></div>';
  h += '<div class="carte"><h2>Images satellite et plan</h2><p class="mut petit" id="t-tuiles">…</p><p class="mut petit">Les images que tu as regardées avec du réseau restent disponibles sans réseau. Le téléchargement d’une zone entière viendra avec une source d’images sous licence.</p><button class="btn sm" id="b-vider">Vider les images gardées</button></div>';
  h += '<div class="carte"><h2>GPS pendant la marche</h2><p class="mut petit">'+(BG ? 'Quand tu marches le contour, le GPS continue même si l’écran s’éteint ou si tu quittes l’application. Une notification « ORIGEN enregistre ton tracé » reste affichée pendant ce temps.' : 'Disponible dans l’application Android.')+'</p>'+(BG ? '<button class="btn sm '+(gpsArriereActif()?'p':'')+'" id="b-bg">'+(gpsArriereActif()?'Activé · toucher pour désactiver':'Désactivé · toucher pour activer')+'</button>' : '')+'</div>';
  h += '<div class="carte"><h2>Affichage de la carte</h2><p class="mut petit">Le déroulement du mapping est le même dans les deux styles.</p><div class="rang"><button class="btn sm '+(S.styleCarte!=='classique'?'p':'')+'" id="b-st-mm">Style Maps.me (nouveau)</button><button class="btn sm '+(S.styleCarte==='classique'?'p':'')+'" id="b-st-cl">Classique (ancien)</button></div></div>';
  h += '<div class="carte"><h2>À propos</h2><p class="mut petit" id="t-stock">…</p><p class="mut petit">ORIGEN, version '+APP_VERSION+'. Précision : GPS du téléphone ; chaque sommet est moyenné sur 10 secondes, ou le tour est marché en continu.</p><button class="btn sm" id="b-deco">Se déconnecter</button></div>';
  c.innerHTML = h; majTuiles(); majStock();
  $('b-actu2').onclick = async ()=>{ await actualiser(); rendreCouches(); };
  const bgb = $('b-bg'); if (bgb) bgb.onclick = ()=>{ try { localStorage.setItem('gps_arriere', gpsArriereActif() ? 'non' : 'oui'); } catch(e){} rendreCouches(); toast(gpsArriereActif() ? 'GPS en arrière-plan activé.' : 'GPS en arrière-plan désactivé.'); };
  const choisir = s=>{ S.styleCarte = s; try { localStorage.setItem('style_carte', s); } catch(e){} rendreCouches(); toast(s==='classique' ? 'Carte : style classique.' : 'Carte : style Maps.me.'); };
  $('b-st-mm').onclick = ()=>choisir('maps'); $('b-st-cl').onclick = ()=>choisir('classique');
  $('b-eco').onclick = ()=>telechargerEco(); $('b-tel').onclick = telechargerCouche; $('b-vider').onclick = viderTuiles;
  $('b-deco').onclick = async ()=>{ if (S.traces.some(t=>t.statut==='en_attente') && !confirm('Des mappings ne sont pas encore envoyés. Se déconnecter quand même ?')) return; await sb.auth.signOut(); S.coop = null; $('connexion').classList.add('actif'); };
}
async function majStock(){ try { const e = $('t-stock'); if (!e || !navigator.storage || !navigator.storage.estimate) { if (e) e.textContent = ''; return; } const s = await navigator.storage.estimate(), p = navigator.storage.persisted ? await navigator.storage.persisted() : false; e.textContent = 'Stockage : '+fmt((s.usage||0)/1e6,0)+' Mo utilisés sur '+fmt((s.quota||0)/1e6,0)+' Mo disponibles · '+(p?'données protégées : une mise à jour de l’application ne les efface pas.':'données non protégées.'); } catch(e){} }
async function majTuiles(){ try { const n = (await (await caches.open('terrain-tuiles-v1')).keys()).length; const e = $('t-tuiles'); if (e) e.textContent = n+' image'+(n>1?'s':'')+' gardée'+(n>1?'s':'')+' sur ce téléphone.'; } catch(e){ const el = $('t-tuiles'); if (el) el.textContent = 'Information indisponible.'; } }
async function viderTuiles(){ try { await caches.delete('terrain-tuiles-v1'); toast('Images supprimées.'); } catch(e){} majTuiles(); }
async function telechargerCouche(){
  if (!navigator.onLine){ toast('Il faut du réseau pour télécharger les couches.'); return; }
  S.tel = true; rendreCouches();
  const barre = () => $('p-couche'), txt = () => $('t-couche');
  try {
    const u = await sb.storage.from('documents-coop').createSignedUrl(COUCHE_PA, 300); if (u.error) throw u.error;
    const resp = await fetch(u.data.signedUrl); if (!resp.ok) throw new Error('Téléchargement refusé ('+resp.status+')');
    const total = +resp.headers.get('content-length') || 0, rd = resp.body.getReader(), morceaux = []; let lu = 0;
    if (barre()) barre().style.display = 'block';
    for (;;){ const { done, value } = await rd.read(); if (done) break; morceaux.push(value); lu += value.length; if (barre()){ barre().firstChild.style.width = (total ? Math.round(100*lu/total) : 50)+'%'; txt().textContent = fmt(lu/1e6,2)+' Mo'+(total?' sur '+fmt(total/1e6,2)+' Mo':''); } }
    const buf = new Uint8Array(lu); let o = 0; morceaux.forEach(m=>{ buf.set(m,o); o += m.length; });
    const json = JSON.parse(new TextDecoder().decode(buf));
    await kvSet('pa', { json, le:new Date().toISOString(), taille:lu });
    await chargerPA(); toast('Couches téléchargées : elles marchent hors réseau.');
  } catch(e){ toast('Téléchargement impossible : '+((e&&e.message)||e)); }
  S.tel = null; rendreCouches();
}

/* ---------- mes tracés ---------- */
function rendreTraces(){
  const c = $('e-traces'); const l = S.traces.slice().sort((a,b)=>String(b.releve_le).localeCompare(String(a.releve_le)));
  let h = '<div class="rang" style="margin-bottom:10px"><button class="btn sm" id="b-sync">↻ Envoyer au bureau</button><button class="btn sm" id="b-exp" '+(l.length?'':'disabled')+'>Tout exporter (GeoJSON)</button></div>';
  if (!l.length) h += '<div class="carte"><p class="mut petit">Aucun mapping pour le moment. Choisis un producteur à l’accueil.</p></div>';
  h += l.map(t=>'<div class="carte"><div class="rang" style="justify-content:space-between"><b>'+esc(t.producteur_nom||'—')+'</b><span class="st '+(t.statut==='envoye'?'g':'')+'">'+(t.statut==='envoye'?'Envoyé':'En attente')+'</span></div>'
    + '<p class="mut petit">'+fmt(t.surface_ha,2)+' ha · '+esc(t.code_parcelle||'')+(t.nouveau?' · nouveau producteur':'')+(t.precision_moy_m!=null?' · ±'+Math.round(t.precision_moy_m)+' m':'')+' · '+esc(new Date(t.releve_le).toLocaleString('fr-FR'))+'</p>'
    + (t.alertes&&t.alertes.length ? t.alertes.map(a=>'<div class="alerte orange">'+esc(a)+'</div>').join('') : '')
    + (t.erreur ? '<div class="alerte rouge">Envoi impossible : '+esc(t.erreur)+'</div>' : '')
    + '<div class="rang" style="margin-top:6px"><button class="btn sm" data-x="'+t.id+'">⬇ GeoJSON</button><button class="btn sm" data-d="'+t.id+'">Supprimer</button></div></div>').join('');
  c.innerHTML = h;
  $('b-sync').onclick = synchroniser; $('b-exp').onclick = ()=>telecharger('mes_traces.geojson',{ type:'FeatureCollection', features:S.traces.map(t=>t.geojson) });
  c.querySelectorAll('[data-x]').forEach(b=>b.onclick = ()=>{ const t = S.traces.find(x=>x.id===b.dataset.x); if (t) telecharger('trace_'+(t.code_parcelle||t.id)+'.geojson', t.geojson); });
  c.querySelectorAll('[data-d]').forEach(b=>b.onclick = async ()=>{ const t = S.traces.find(x=>x.id===b.dataset.d); if (!t) return; if (t.statut==='en_attente' && !confirm('Ce mapping n’est pas encore envoyé. Le supprimer quand même ?')) return; await trDel(t.id); S.traces = await trAll(); majAttente(); rendreTraces(); });
}
function telecharger(nom, objet){ const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(objet)],{ type:'application/geo+json' })); a.download = nom; document.body.appendChild(a); a.click(); a.remove(); }

majReseau();
demarrer();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('terrain-sw.js').catch(()=>{});
