<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ECORIGINE — Plateforme de traçabilité cacao</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{
    --bg:#F6F4EE; --surface:#FFFFFF; --surface-2:#FBFAF6;
    --ink:#241F19; --ink-soft:#6B6255; --ink-faint:#9A9184;
    --accent:#42693C; --accent-soft:#E9F0E7; --accent-line:#A9C2A3;
    --border:#E4DFD1;
    --ok:#3F7A4D; --ok-bg:#E6F0E6; --ok-line:#B7D2B9;
    --warn:#9A6512; --warn-bg:#FBEEDA; --warn-line:#E7C384;
    --danger:#A6392C; --danger-bg:#FBE7E2; --danger-line:#E4AFA4;
    --gray-bg:#EDEAE2;
    --sans:'IBM Plex Sans', system-ui, sans-serif;
    --mono:'IBM Plex Mono', ui-monospace, monospace;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;}
  #app{max-width:1120px;margin:0 auto;padding:28px 20px 60px;}
  .top{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:16px;margin-bottom:14px;}
  .top h1{font-size:20px;font-weight:600;margin:0 0 4px;letter-spacing:-0.01em;}
  .top .sub{font-size:13px;color:var(--ink-soft);margin:0;max-width:560px;}
  .tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:20px;flex-wrap:wrap;}
  .tab-btn{font-family:var(--sans);font-size:13.5px;font-weight:500;padding:10px 4px;margin-right:24px;border:none;background:none;color:var(--ink-soft);cursor:pointer;border-bottom:2px solid transparent;}
  .tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);}
  .controls{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:20px;}
  select, input[type=number], input[type=text], input[type=date], input[type=email]{
    font-family:var(--sans);font-size:13px;padding:7px 10px;border:1px solid var(--border);
    border-radius:8px;background:var(--surface);color:var(--ink);
  }
  label.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink-soft);}
  fieldset{border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin:0;}
  fieldset legend{font-size:11.5px;color:var(--ink-soft);padding:0 4px;}
  fieldset .field{margin-bottom:8px;}
  fieldset .field:last-child{margin-bottom:0;}
  .btn{font-family:var(--sans);font-size:13px;font-weight:500;padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--ink);cursor:pointer;}
  .btn:hover{border-color:var(--ink-faint);}
  .btn-primary{background:var(--accent);color:#fff;border-color:var(--accent);}
  .btn-primary:hover{opacity:0.92;}
  .btn:disabled{opacity:0.5;cursor:not-allowed;}
  .btn-ghost{border:none;background:none;color:var(--accent);padding:6px 8px;font-size:12.5px;white-space:nowrap;cursor:pointer;}
  .btn-danger-text{border:none;background:none;color:var(--danger);font-size:12px;cursor:pointer;padding:2px 4px;white-space:nowrap;}

  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;}
  .card .label{font-size:12px;color:var(--ink-soft);margin-bottom:6px;}
  .card .value{font-family:var(--mono);font-size:22px;font-weight:500;}
  .card.alert .value{color:var(--danger);}

  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:20px;}
  .panel-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:8px;}
  .panel-head h2{font-size:15px;font-weight:600;margin:0;}
  .panel-note{padding:10px 18px;font-size:12px;color:var(--ink-faint);border-bottom:1px solid var(--border);background:var(--surface-2);}
  .group-header{padding:9px 18px;font-size:12.5px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-bottom:1px solid var(--border);}

  .row{display:grid;grid-template-columns:2fr 1fr 1fr 1.4fr 1fr auto;gap:14px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--border);}
  .row.coop-row{grid-template-columns:2fr 1fr 1fr 1fr auto;}
  .row.achat-row{grid-template-columns:1.8fr 1.1fr 1fr 1fr 1fr 0.7fr auto;}
  .achat-card{padding:14px 18px;border-bottom:1px solid var(--border);}
  .achat-card:last-child{border-bottom:none;}
  .achat-card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
  .achat-compare{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .achat-compare-col{border:1px solid var(--border);border-radius:8px;padding:10px 12px;background:var(--surface-2);}
  .achat-compare-col.pending{opacity:0.75;}
  .achat-compare-col h4{font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-faint);margin:0 0 8px;font-weight:600;}
  .achat-field{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;padding:3px 0;gap:10px;}
  .achat-field .lbl{color:var(--ink-soft);}
  .achat-field .val{font-family:var(--mono);font-weight:500;white-space:nowrap;}
  .achat-field .val.empty{color:var(--ink-faint);font-family:var(--sans);font-weight:400;font-style:italic;}
  .row:last-child{border-bottom:none;}
  .row-head{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-faint);background:var(--surface-2);}
  .stat-label{display:none;}
  .p-name .name{font-weight:500;}
  .p-name .coop{font-size:12px;color:var(--ink-soft);}
  .num{font-family:var(--mono);font-size:13.5px;}
  .bar-wrap{display:flex;flex-direction:column;gap:4px;}
  .bar-track{position:relative;height:8px;border-radius:6px;background:var(--gray-bg);overflow:visible;}
  .bar-fill{height:100%;border-radius:6px;}
  .bar-pct{font-family:var(--mono);font-size:12px;color:var(--ink-soft);}
  .badge{display:inline-block;font-size:11.5px;font-weight:500;padding:3px 9px;border-radius:20px;white-space:nowrap;}
  .badge.ok{background:var(--ok-bg);color:var(--ok);}
  .badge.warn{background:var(--warn-bg);color:var(--warn);}
  .badge.danger{background:var(--danger-bg);color:var(--danger);}
  .badge.neutral{background:var(--gray-bg);color:var(--ink-soft);}
  .row-actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}

  .detail{background:var(--surface-2);padding:16px 18px 20px;border-bottom:1px solid var(--border);}
  .detail-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:24px;}
  .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;font-size:12.5px;margin-bottom:14px;}
  .info-grid div span{color:var(--ink-soft);}
  .achat-list{border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--surface);}
  .achat-item{display:flex;justify-content:space-between;align-items:center;padding:9px 14px;font-size:13px;border-bottom:1px solid var(--border);gap:10px;flex-wrap:wrap;}
  .achat-item:last-child{border-bottom:none;}
  .achat-item .num{color:var(--ink);}
  .nc-item{border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin:0 18px 12px;background:var(--surface-2);}
  .nc-item:last-child{margin-bottom:18px;}
  .empty{padding:40px 20px;text-align:center;color:var(--ink-soft);}
  .empty .btn{margin-top:10px;}

  .modal-overlay{position:fixed;inset:0;background:rgba(36,31,25,0.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .modal{background:var(--surface);border-radius:12px;padding:22px 24px;width:100%;max-width:460px;max-height:86vh;overflow:auto;}
  .modal.wide{max-width:600px;}
  .modal h3{margin:0 0 16px;font-size:16px;font-weight:600;}
  .modal form{display:flex;flex-direction:column;gap:12px;}
  .modal .field input, .modal .field select{width:100%;}
  .modal .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:6px;}
  .hint{font-size:11px;color:var(--ink-faint);}
  .error-banner{background:var(--danger-bg);color:var(--danger);border:1px solid var(--danger-line);border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;}
  .toast{position:sticky;top:10px;z-index:60;border-radius:8px;padding:12px 16px;font-size:13.5px;font-weight:500;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;gap:12px;box-shadow:0 4px 16px rgba(0,0,0,0.12);}
  .toast.error{background:var(--danger-bg);color:var(--danger);border:1px solid var(--danger-line);}
  .toast.success{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok-line);}
  .toast button.close{background:none;border:none;font-size:16px;cursor:pointer;color:inherit;line-height:1;padding:0 4px;}
  .loading{padding:60px 0;text-align:center;color:var(--ink-soft);font-size:14px;}
  .login-screen{min-height:80vh;display:flex;align-items:center;justify-content:center;}
  .login-box{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:36px 32px;width:100%;max-width:380px;box-shadow:0 4px 20px rgba(0,0,0,0.06);}
  .login-box h2{margin:0 0 6px;font-size:19px;color:var(--accent);}
  .footer-note{font-size:11.5px;color:var(--ink-faint);margin-top:18px;text-align:right;}
  .footer-note button{background:none;border:none;color:var(--ink-faint);text-decoration:underline;cursor:pointer;font-size:11.5px;padding:0;}
  .preview-table{border:1px solid var(--border);border-radius:8px;overflow:hidden;margin:12px 0;}
  .preview-row{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px;padding:7px 10px;font-size:12.5px;border-bottom:1px solid var(--border);}
  .preview-row:last-child{border-bottom:none;}
  .preview-head{background:var(--surface-2);font-weight:500;color:var(--ink-soft);font-size:11px;text-transform:uppercase;}
  .check-item{display:flex;justify-content:space-between;align-items:center;padding:10px 18px;font-size:13.5px;border-bottom:1px solid var(--border);gap:10px;}
  .check-item:last-child{border-bottom:none;}
  .check-item label{display:flex;align-items:center;gap:10px;cursor:pointer;flex:1;}
  .check-item input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);}

  @media (max-width:820px){
    .cards{grid-template-columns:repeat(2,1fr);}
    .row-head{display:none;}
    .row{grid-template-columns:1fr;gap:8px;padding:14px;}
    .row.coop-row{grid-template-columns:1fr;}
    .row.achat-row{grid-template-columns:1fr;}
    .achat-compare{grid-template-columns:1fr;}
    .stat-label{display:inline;font-size:11px;color:var(--ink-faint);margin-right:6px;}
    .row-actions{justify-content:flex-start;}
    .detail-grid{grid-template-columns:1fr;}
    .info-grid{grid-template-columns:1fr;}
    .preview-row{grid-template-columns:1fr 1fr;}
  }
</style>
</head>
<body>
<div id="app"><div class="loading">Chargement des données…</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docx@8.5/build/index.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const KEY_COOP = 'ecorigine_cooperatives';
const KEY_PROD = 'ecorigine_producteurs';
const KEY_ACHATS = 'ecorigine_achats';
const KEY_SETTINGS = 'ecorigine_settings';
const KEY_DOCCHECK = 'ecorigine_doc_checklist';
const KEY_NONCONF = 'ecorigine_nonconformites';
const KEY_CAMPAGNES = 'ecorigine_campagnes';

// Colonnes alignées sur le modele fourni (feuille "3. Farm-Farmer Data")
const NOM_KEYS = ['farmer name','nom du producteur','nom producteur','producteur','nom','name'];
const CODE_KEYS = ['farmer id','code producteur','code_producteur','id producteur','code','id'];
const FARMID_KEYS = ['farm id'];
const PAYS_KEYS = ['country','pays'];
const VILLAGE_KEYS = ['village, district','village','district','region'];
const MATRICULE_KEYS = ['national traceability id','traceability id','matricule ccc','matricule_ccc','matricule','code ccc'];
const AGGREGATOR_KEYS = ['agrregator name','aggregator name','first aggregator','aggregator','premier agregateur'];
const POLYGON_KEYS = ['boundary polygon','polygon'];
const MAPDATE_KEYS = ['mapping date'];
const SURFACE_KEYS = ['farm size','surface ha','surface (ha)','surface_ha','superficie ha','superficie (ha)','superficie','surface'];
const VOLUME_KEYS = ['estimated volume','volume per farm','volume estime','volume estimé'];
const RENDEMENT_KEYS = ['rendement kg/ha','rendement (kg/ha)','rendement_kg_ha','rendement estime','rendement estime (kg/ha)','rendement estimé','rendement estimé (kg/ha)','rendement'];
const LAT_KEYS = ['lat for geopoint','latitude','coordonnee y','coordonnée y','lat'];
const LON_KEYS = ['long for geopoint','longitude','coordonnee x','coordonnée x','long','lon'];

// Colonnes pour l'import du fichier de tracabilite (livraisons)
const LIV_CODE_KEYS = ['farmer id','code producteur','code'];
const LIV_DATE_KEYS = ["date d'emission",'date emission','date de livraison','date'];
const LIV_POIDS_KEYS = ['poids livre','poids livré','poids','quantite livree','quantite','weight','kg'];
const LIV_SACS_KEYS = ['nombre de sacs','nb sacs','sacs','bags'];
const LIV_CONN_KEYS = ['numero de connaissement','numero connaissement','connaissement','waybill','bl number'];
const PLAFOND_PRINCIPALE = 0.70;   // plafond pendant la campagne principale
const PLAFOND_ANNUEL = 1.00;       // plafond cumule (principale + intermediaire), continuite sur l'annee

const DOCS_REQUIS = [
  'Registre de commerce',
  'Délégation de pouvoir',
  'BIC (si disponible)',
  'Journal officiel',
  'DFE',
  "Attestation d'agrément",
  'ARF (Attestation de Régularité Fiscale)',
  'Procuration pour les personnes mandataires (procuration de justice)',
  'Statuts et règlement intérieur',
  "Procès-verbal de la dernière Assemblée Générale Ordinaire (AGO)",
  'Liste des producteurs avec leur matricule CCC',
  'Certificat(s) (si disponible(s))'
];

let leafletMapInstance = null;

let state = {
  loading: true,
  session: null,
  authLoading: true,
  authError: '',
  error: null,
  storageOk: true,
  coopDashboardId: null,
  expandedSections: new Set(),
  storageErrorMsg: '',
  changesSinceExport: 0,
  toast: null,
  confirmDialog: null,
  tab: 'cooperatives',
  cooperatives: [],
  producteurs: [],
  achats: [],
  docCheck: [],
  nonconformites: [],
  campagnes: [],
  coopUsers: null,
  demandesCoop: null,
  demandesSousOnglet: null,
  newDemandeTypes: new Set(),
  settings: { seuil: 90 },
  campagneFilter: 'all',
  periodeFilter: 'principale',
  coopFilter: 'all',
  conformiteCoopFilter: 'all',
  expanded: new Set(),
  expandedCoop: new Set(),
  modal: null,
  pendingImport: null,
  pendingImportLivraisons: null
};

function genId(prefix){
  return prefix + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,7);
}
function esc(str){
  return String(str==null?'':str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function showEmailPreview(to, subject, body){
  state.modal = {type:'emailPreview', payload:{to, subject, body}};
  render();
  // tentative discrete d'ouverture directe du client mail, sans dependre de son succes
  try { window.open('mailto:'+to+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body), '_blank'); } catch(e){}
}
function copyEmailPreview(){
  const ta = document.getElementById('email-preview-full');
  if (ta){
    ta.select();
    ta.setSelectionRange(0, 999999);
    try {
      document.execCommand('copy');
      showToast('Copié dans le presse-papiers.', 'success');
    } catch(e){
      showToast("Impossible de copier automatiquement — sélectionnez le texte et faites Ctrl+C (Cmd+C sur Mac).");
    }
  }
}

function buildAlertEmailForCoop(coopId){
  const coop = coopById(coopId);
  if (!coop) return null;
  const emails = [coop.email1, coop.email2, coop.email3].map(e=>String(e||'').trim()).filter(Boolean);
  const rows = computeRows();
  const concerned = rows.filter(x=> x.p.cooperative_id===coopId && (x.st.key==='warn' || x.st.key==='danger'));
  if (concerned.length===0) return null;
  const r0 = concerned[0];
  const label = r0.periode==='principale' ? "50% et plus de leur potentiel — plafond de la campagne principale fixé à 70%"
    : r0.periode==='intermediaire' ? "un niveau élevé du plafond cumulé sur l'année (principale + intermédiaire, 100%)"
    : 'un niveau élevé de leur potentiel de production estimé';
  const subject = 'Alerte livraisons — ' + concerned.length + ' producteur(s) — ' + coop.nom;
  const bodyLines = [
    'Bonjour,', '',
    'Les producteurs suivants ont atteint '+label+' :', '',
    buildTexteTableau(concerned), '',
    'Merci de vérifier ces situations avec les producteurs concernés, notamment ceux en dépassement.', '',
    'Cordialement,', "L'équipe Durabilité — ECORIGINE"
  ];
  return { coop, emails, count: concerned.length, subject, body: bodyLines.join('\n') };
}

function pendingAlertCoopIds(){
  const rows = computeRows();
  const ids = new Set();
  rows.forEach(r=>{ if (r.st.key==='warn'||r.st.key==='danger') ids.add(r.p.cooperative_id); });
  return Array.from(ids).filter(id=>{
    const e = buildAlertEmailForCoop(id);
    return e && e.emails.length>0;
  });
}

function openAlertQueue(){
  const ids = pendingAlertCoopIds();
  if (ids.length===0){ showToast("Aucune coopérative en alerte n'a d'adresse email enregistrée pour le moment.", 'success'); return; }
  state.modal = {type:'alertQueue', payload:{ids, index:0}};
  render();
}
function alertQueueGo(delta){
  const m = state.modal;
  if (!m || m.type!=='alertQueue') return;
  const next = m.payload.index + delta;
  if (next < 0 || next >= m.payload.ids.length){ closeModal(); return; }
  m.payload.index = next;
  render();

function openContratRAModal(coopId){
  const coop = coopById(coopId);
  if (!coop) return;
  if (coop.statut==='Non certifiée'){ showToast("Cette coopérative n'est pas certifiée."); return; }
  const missing = [];
  if (!coop.rccm) missing.push('N° RCCM');
  if (!coop.ccc_num) missing.push('N° agrément CCC');
  if (!coop.identifiant_certification) missing.push('Identifiant de certification');
  if (!coop.responsable_nom) missing.push('Nom du représentant légal');
  if (!coop.siege_social && !coop.ville) missing.push('Ville ou Siège social');
  if (missing.length>0){
    showToast('Champs manquants pour générer le contrat : '+missing.join(', ')+'. Complète la fiche coopérative (Modifier) avant de continuer.');
    return;
  }
  state.modal = {type:'contratRA', payload:{coopId, campagne_label:'2026-2027', periode_label:'Septembre 2026 à août 2027', date_debut:'2026-09-01', volume:''}};
  render();
}

function fonctionRepresentantFor(nom){
  const n = String(nom||'').trim().toUpperCase();
  if (n.startsWith('COOP-CA') || n.includes('COOP-CA')) return 'Président du Conseil d\'Administration';
  if (n.startsWith('SCOOPS') || n.includes('SCOOPS')) return 'Président du Comité de gestion';
  return 'Représentant légal';
}

function genererContratRA(){
  const m = state.modal;
  if (!m || m.type!=='contratRA') return;
  const coop = coopById(m.payload.coopId);
  if (!coop) return;
  const campagne_label = fv('campagne_label').trim() || '—';
  const periode_label = fv('periode_label').trim() || '—';
  const date_debut_raw = fv('date_debut');
  const volume = fv('volume').trim();
  if (!volume){ showToast('Indique le volume contractuel.'); return; }
  const dateDebut = date_debut_raw ? new Date(date_debut_raw+'T00:00:00').toLocaleDateString('fr-FR') : '—';
  const capaciteTotale = fmtNum(Math.round(coopStats(coop.id).potentiel)) + ' kg (potentiel estimé cumulé)';
  const fonctionRepresentant = fonctionRepresentantFor(coop.nom);

  if (typeof docx === 'undefined'){ showToast("La bibliothèque de génération Word n'a pas pu se charger (connexion internet requise). Réessaie dans un instant."); return; }
  const { Document, Packer, Paragraph, TextRun, AlignmentType, LevelFormat, Table, TableRow, TableCell, WidthType, ShadingType, BorderStyle, VerticalAlign, Header, Footer, PageNumber, ImageRun } = docx;

  const INK="1A1A1A", ACCENT="42693C", SOFT_GRAY="5A5A5A", BORDER="A9BBA3", HEAD_FILL="42693C", FONT="Times New Roman";
  function run(text, opts){ opts=opts||{}; return new TextRun({ text:String(text==null?'':text), font:FONT, size:22, bold:!!opts.bold, italics:!!opts.italics, color: opts.color||INK }); }
  function p(children, opts){ opts=opts||{}; return new Paragraph({ spacing:Object.assign({after:160, line:300}, opts.spacing||{}), alignment: opts.align || AlignmentType.JUSTIFIED, children }); }
  function artTitle(num, title){ return new Paragraph({ spacing:{before:340, after:180}, children:[ new TextRun({ text:'Article '+num+' — '+title, font:FONT, size:24, bold:true, color:ACCENT }) ] }); }
  function subArt(text){ return new Paragraph({ spacing:{before:140, after:120}, children:[ new TextRun({ text, font:FONT, size:22, bold:true, color:INK }) ] }); }
  function bullet(text){ return new Paragraph({ numbering:{reference:"main-bullets", level:0}, spacing:{after:110, line:290}, alignment:AlignmentType.JUSTIFIED, children:[run(text)] }); }
  function spacer(h){ return new Paragraph({spacing:{after:h||120}, children:[]}); }

  function labelCell(text, w){ return new TableCell({width:{size:w,type:WidthType.DXA}, shading:{type:ShadingType.CLEAR, fill:"ECF1EA"}, verticalAlign:VerticalAlign.CENTER, margins:{top:110,bottom:110,left:160,right:120}, children:[new Paragraph({children:[new TextRun({text, bold:true, font:FONT, size:21, color:ACCENT})]})]}); }
  function valueCell(text, w){ return new TableCell({width:{size:w,type:WidthType.DXA}, verticalAlign:VerticalAlign.CENTER, margins:{top:110,bottom:110,left:160,right:120}, children:[new Paragraph({children:[new TextRun({text:String(text==null?'':text), font:FONT, size:21, color:INK})]})]}); }
  function planTable(rows){
    const lw=3200, vw=6300;
    const trs = rows.map(r=> new TableRow({children:[labelCell(r[0],lw), valueCell(r[1],vw)]}));

function genererFicheImportBatch(coopId, campagneId, producteurIds){
  const coop = coopById(coopId);
  if (!coop || producteurIds.length===0) return;

  const lignes = producteurIds.map(pid=>{
    const p = state.producteurs.find(x=>x.id===pid);
    if (!p) return null;
    const pot = potentiel(p);
    const ceiling70 = pot * PLAFOND_PRINCIPALE;
    const cumul = cumulAchats(p.id, campagneId || 'all', 'principale');
    const livreCetteFois = state.achats.filter(a=>a.producteur_id===p.id && a.campagne_id===campagneId).reduce((s,a)=>s+(Number(a.quantite_kg)||0),0);
    const reste = Math.max(ceiling70 - cumul, 0);
    const pct = ceiling70>0 ? (cumul/pot)*100 : 0;
    let statut = 'Conforme';
    if (pct>=70) statut = 'Dépassement (>=70%)';
    else if (pct>=50) statut = 'À surveiller (>=50%)';
    return { p, pot, ceiling70, cumul, reste, pct, statut };
  }).filter(Boolean);

  if (lignes.length===0) return;

  const totalLivre = lignes.reduce((s,l)=>s+l.cumul,0);
  const aSurveiller = lignes.filter(l=>l.pct>=50);

  // 1) Fichier Excel groupe
  const wsData = [
    ['Fiche de suivi des livraisons — ' + coop.nom],
    [],
    ['Producteur','Code','Cumul livré (kg)','Potentiel estimé (kg)','Plafond 70% campagne principale (kg)','Reste à livrer (kg)','Statut'],
  ];
  lignes.forEach(l=>{
    wsData.push([l.p.nom, l.p.code||'', Math.round(l.cumul), Math.round(l.pot), Math.round(l.ceiling70), Math.round(l.reste), l.statut]);
  });
  const ws = XLSX.utils.aoa_to_sheet(wsData);
  ws['!cols'] = [{wch:26},{wch:14},{wch:16},{wch:16},{wch:20},{wch:16},{wch:20}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Suivi livraisons');
  const fname = 'suivi_livraisons_'+coop.nom.replace(/[^a-z0-9]+/gi,'_')+'_'+new Date().toISOString().slice(0,10)+'.xlsx';
  XLSX.writeFile(wb, fname);

  // 2) Email automatique
  const emails = [coop.email1, coop.email2, coop.email3].map(e=>String(e||'').trim()).filter(Boolean);
  const subject = 'Suivi des livraisons — ' + lignes.length + ' producteur(s) — ' + coop.nom;
  const bodyLines = [
    'Bonjour,', '',
    lignes.length+' producteur(s) ont livré dans le cadre de cet import, pour un cumul total de '+fmtKg(totalLivre)+' sur la campagne principale.', '',
    'La fiche Excel jointe détaille, pour chaque producteur : la quantité cumulée livrée, le plafond de la campagne principale (70% du potentiel estimé), et la quantité qu\'il lui reste à livrer pour atteindre ce plafond.', '',
  ];
  if (aSurveiller.length>0){
    bodyLines.push('⚠ '+aSurveiller.length+' producteur(s) à surveiller (50% du potentiel atteint ou plus) :', '');
    aSurveiller.forEach(l=>{
      bodyLines.push('- '+l.p.nom+(l.p.code?' ('+l.p.code+')':'')+' — '+l.pct.toFixed(0)+'% de son potentiel, reste '+fmtKg(l.reste)+' avant le plafond 70%'+(l.pct>=70?' — DÉPASSEMENT':''));
    });
    bodyLines.push('');
  }
  bodyLines.push("Le fichier Excel détaillé vient d'être téléchargé sur notre poste — merci de le joindre à votre réponse ou de le transmettre en interne.", '', 'Cordialement,', "L'équipe Durabilité — ECORIGINE");
  const body = bodyLines.join('\n');
  showToast('Fichier Excel téléchargé : '+fname, 'success');
  showEmailPreview(emails.length ? emails.join(', ') : '(aucune adresse enregistrée pour cette coopérative)', subject, body);
}

function fmtKg(n){
  if (n==null || isNaN(n)) return '—';
  return Math.round(n).toLocaleString('fr-FR') + ' kg';
}
function fmtNum(n){
  return Math.round(n).toLocaleString('fr-FR');
}
function stripAccents(s){
  return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}
function normKey(s){
  return stripAccents(s).trim().toLowerCase();
}
function pickField(row, candidates){
  const keys = Object.keys(row);
  for (const cand of candidates){
    const nc = normKey(cand);
    const found = keys.find(k => normKey(k) === nc);
    if (found !== undefined) return row[found];
  }
  return undefined;
}
function normHeader(s){
  return stripAccents(String(s||''))
    .replace(/\r?\n/g,' ')
    .replace(/\*.*$/,'')
    .trim().toLowerCase()
    .replace(/\s+/g,' ');
}
function pickFieldContains(row, phrases){
  const keys = Object.keys(row);
  for (const phrase of phrases){
    const found = keys.find(k => normHeader(k).includes(phrase));
    if (found !== undefined && String(row[found]).trim()!=='') return row[found];
  }
  return undefined;
}

// correspondance entre les anciennes cles de stockage local et les tables Supabase
const KEY_TO_TABLE = {
  'ecorigine_cooperatives': 'cooperatives',
  'ecorigine_producteurs': 'producteurs',
  'ecorigine_achats': 'achats',
  'ecorigine_doc_checklist': 'doc_check',
  'ecorigine_nonconformites': 'nonconformites',
  'ecorigine_campagnes': 'campagnes',
};

async function recupererDonneesLocales(){
  if (typeof window.storage === 'undefined' || !window.storage){
    showToast("Le stockage Claude.ai n'est pas accessible ici. Ouvre ce document comme aperçu directement dans la conversation (pas un fichier téléchargé) pour récupérer les anciennes données.");
    return;
  }
  const oldKeys = {
    cooperatives: 'ecorigine_cooperatives',
    producteurs: 'ecorigine_producteurs',
    achats: 'ecorigine_achats',
    settings: 'ecorigine_settings',
    doc_check: 'ecorigine_doc_checklist',
    nonconformites: 'ecorigine_nonconformites',
    campagnes: 'ecorigine_campagnes',
  };
  const out = {};
  let totalFound = 0;
  for (const [name, key] of Object.entries(oldKeys)){
    try{
      const res = await window.storage.get(key, false);
      if (res && res.value != null){
        out[name] = JSON.parse(res.value);
        if (Array.isArray(out[name])) totalFound += out[name].length;
      } else {
        out[name] = name==='settings' ? {} : [];
      }
    }catch(e){
      out[name] = name==='settings' ? {} : [];
    }
  }
  if (totalFound === 0){
    showToast("Aucune ancienne donnée trouvée dans le stockage Claude.ai de cette conversation.");
    return;
  }
  const blob = new Blob([JSON.stringify(out, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const aTag = document.createElement('a');
  aTag.href = url;
  aTag.download = 'ecorigine_sauvegarde_'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(aTag); aTag.click(); document.body.removeChild(aTag);
  URL.revokeObjectURL(url);
  showToast(totalFound+' enregistrement(s) récupéré(s) et téléchargé(s) en fichier JSON. Garde-le précieusement — on va s\'en servir pour tout réimporter dans Supabase.', 'success');
}

async function importerSauvegardeJSON(input){
  const file = input.files[0];
  if (!file) return;
  if (window.self !== window.top){
    showToast("Import impossible depuis l'aperçu du chat. Téléchargez ce fichier et ouvrez-le dans un onglet de navigateur séparé avant de réessayer.");
    input.value = '';
    return;
  }
  try{
    const text = await file.text();
    const data = JSON.parse(text);
    let imported = 0;
    const errors = [];
    async function tryImport(label, arr, applyToState, key){
      if (!arr || !arr.length) return;
      applyToState(arr);
      const ok = await saveKey(key, arr);
      if (ok) imported += arr.length;
      else errors.push(label + ' : ' + (state.storageErrorMsg||'erreur inconnue'));
    }
    await tryImport('Coopératives', data.cooperatives, v=>state.cooperatives=v, KEY_COOP);
    await tryImport('Producteurs', data.producteurs, v=>state.producteurs=v, KEY_PROD);
    await tryImport('Campagnes', data.campagnes, v=>state.campagnes=v, KEY_CAMPAGNES);
    await tryImport('Achats', data.achats, v=>state.achats=v, KEY_ACHATS);
    await tryImport('Documents à vérifier', data.doc_check, v=>state.docCheck=v, KEY_DOCCHECK);
    await tryImport('Non-conformités', data.nonconformites, v=>state.nonconformites=v, KEY_NONCONF);
    if (data.settings && Object.keys(data.settings).length){
      state.settings = data.settings;
      const ok = await saveKey(KEY_SETTINGS, state.settings);
      if (!ok) errors.push('Réglages : ' + (state.storageErrorMsg||'erreur inconnue'));
    }
    if (errors.length===0){
      showToast(imported+' enregistrement(s) réimporté(s) et confirmés dans Supabase.', 'success');
    } else {
      showToast('Échec sur : '+errors.join(' | '), 'error');
    }
    render();
  }catch(e){
    showToast("Le fichier n'a pas pu être lu : "+e.message);
  }
  input.value = '';
}

async function safeGet(key, fallback){
  try{
    if (!supabaseClient) return fallback;
    if (key === 'ecorigine_settings'){
      const { data, error } = await supabaseClient.from('settings').select('*').eq('id','default').maybeSingle();
      if (error || !data) return fallback;
      return { seuil: data.seuil, prime_ra: data.prime_ra, prime_ft: data.prime_ft };
    }
    const table = KEY_TO_TABLE[key];
    if (!table) return fallback;
    const { data, error } = await supabaseClient.from(table).select('*').order('created_at', {ascending:true, nullsFirst:true});
    if (error) return fallback;
    return (data||[]).map(rowToRecord);
  }catch(e){
    return fallback;
  }
}

// Supabase renvoie null pour les champs vides ; l'outil attend des chaines vides ('')
function rowToRecord(row){
  const out = {};
  for (const k in row){
    if (k==='created_at') continue;
    out[k] = row[k]==null ? '' : row[k];
  }
  return out;
}

async function saveKey(key, value){
  state.changesSinceExport++;
  try{
    if (!supabaseClient){ state.storageOk = false; return false; }

    if (key === 'ecorigine_settings'){
      const { error } = await supabaseClient.from('settings').upsert({ id:'default', seuil:value.seuil, prime_ra:value.prime_ra, prime_ft:value.prime_ft });
      if (error){ state.storageOk = false; state.storageErrorMsg = error.message; return false; }
      state.storageOk = true; return true;
    }

    const table = KEY_TO_TABLE[key];
    if (!table){ state.storageOk = false; return false; }

    // Postgres exige NULL (pas '') pour les references vers d'autres tables (cle etrangere)
    const FK_FIELDS = ['cooperative_id','producteur_id','campagne_id'];
    const sanitized = value.map(row=>{
      const r = Object.assign({}, row);
      FK_FIELDS.forEach(f=>{ if (r[f] === '') r[f] = null; });
      return r;
    });

    // 1) enregistre (insere ou met a jour) chaque ligne du tableau actuel
    if (sanitized.length > 0){
      const { error: upsertErr } = await supabaseClient.from(table).upsert(sanitized);
      if (upsertErr){ state.storageOk = false; state.storageErrorMsg = upsertErr.message; return false; }
    }
    // 2) supprime dans la table les lignes qui ne sont plus dans le tableau local
    const { data: existing, error: listErr } = await supabaseClient.from(table).select('id');
    if (!listErr && existing){
      const currentIds = new Set(sanitized.map(v=>v.id));
      const toDelete = existing.map(r=>r.id).filter(id=>!currentIds.has(id));
      if (toDelete.length>0){
        await supabaseClient.from(table).delete().in('id', toDelete);
      }
    }
    state.storageOk = true;
    return true;
  }catch(e){
    state.storageOk = false;
    state.storageErrorMsg = (e && e.message) ? e.message : String(e);
    return false;
  }
}

async function lierCompteCooperative(){
  const userId = fv('link_user_id').trim();
  const coopId = fv('link_cooperative_id');
  if (!userId || !coopId){ showToast("Renseigne l'identifiant du compte (UUID) et choisis une coopérative."); return; }
  const uuidPattern = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
  if (!uuidPattern.test(userId)){ showToast("Cet identifiant ne ressemble pas à un UUID valide (format attendu : 8-4-4-4-12 caractères). Copie-le depuis Supabase → Authentication → Users."); return; }
  const { error } = await supabaseClient.from('cooperative_users').insert({ user_id: userId, cooperative_id: coopId });
  if (error){ showToast("Échec de la liaison : "+error.message); return; }
  showToast('Compte lié avec succès.', 'success');
  await refreshAccesTab();
}

async function delierCompteCooperative(userId, coopId){
  askConfirm('Retirer cet accès pour cette coopérative ?', async ()=>{
    const { error } = await supabaseClient.from('cooperative_users').delete().eq('user_id', userId).eq('cooperative_id', coopId);
    if (error){ showToast('Échec : '+error.message); return; }
    showToast('Accès retiré.', 'success');
    await refreshAccesTab();
  });
}

async function creerDemande(){
  const name = fv('demande_name').trim();
  const coopId = fv('demande_cooperative_id');
  const deadline = fv('demande_deadline');
  const message = fv('demande_message').trim();

    id: 'req_'+Date.now(),

    statut: 'demandee',
    types: Array.from(state.newDemandeTypes),

    requested_at: new Date().toISOString().slice(0,10),

    if (error){
      showToast("Échec de l'analyse Whisp : "+error.message);

function coopById(id){ return state.cooperatives.find(c=>c.id===id) || null; }
function coopStats(coopId){
  const list = state.producteurs.filter(p=>p.cooperative_id===coopId);
  const pot = list.reduce((s,p)=> s + potentiel(p), 0);
  const achete = list.reduce((s,p)=> s + cumulAchats(p.id, 'all', 'all'), 0);
  const pct = pot>0 ? (achete/pot*100) : null;
  const connList = state.achats.filter(a=>!a.producteur_id && a.cooperative_id===coopId);
  const netProduit = connList.reduce((s,a)=>s+(Number(a.poids_net_produit)||0),0);
  const netProduitPending = connList.filter(a=>!(Number(a.poids_net_produit)>0)).length;
  return { count: list.length, potentiel: pot, achete, pct, netProduit, netProduitPending, connCount: connList.length };
}

function potentiel(p){
  const v = Number(p.volume_estime_kg);
  if (v > 0) return v;
  const s = Number(p.surface_ha)||0;
  const r = Number(p.rendement_kg_ha)||0;
  return s*r;
}
// filtre continu : en periode "intermediaire", on compte aussi les livraisons "principale"
// de la meme campagne, pour que le plafond soit une continuite sur l'annee (70% puis 100%)
function achatsProducteur(producteurId, campagneId, periode){
  return state.achats.filter(a=>{
    if (a.producteur_id !== producteurId) return false;
    if (campagneId==='all') return true; // toutes campagnes : la notion de periode ne s'applique pas
    if ((a.campagne_id||'')!==campagneId) return false;
    if (periode==='principale') return a.periode==='principale';
    if (periode==='intermediaire') return a.periode==='principale' || a.periode==='intermediaire';
    return true;
  });
}
function cumulAchats(producteurId, campagneId, periode){
  return achatsProducteur(producteurId, campagneId, periode)
    .reduce((sum,a) => sum + (Number(a.quantite_kg)||0), 0);
}
function statusFor(pot, ceiling, cumul, seuil, periode){
  if (!ceiling || ceiling<=0) return {key:'neutral', label:'À configurer'};
  const pct = (cumul/ceiling)*100;
  if (periode==='principale' && pot>0){
    const pctOfPot = (cumul/pot)*100;
    if (pctOfPot >= 70) return {key:'danger', label:'Dépassement', pct};
    if (pctOfPot >= 50) return {key:'warn', label:'Alerte précoce (50%)', pct};
    return {key:'ok', label:'Conforme', pct};
  }
  if (pct >= 100) return {key:'danger', label:'Dépassement', pct};
  if (pct >= seuil) return {key:'warn', label:'À surveiller', pct};
  return {key:'ok', label:'Conforme', pct};
}
function effectiveCeiling(p, campagneId, periode){
  const pot = potentiel(p);
  if (campagneId==='all' || !campagneId) return pot;
  if (periode==='principale') return pot * PLAFOND_PRINCIPALE;
  if (periode==='intermediaire') return pot * PLAFOND_ANNUEL;
  return pot;
}

function computeRows(){
  const seuil = Number(state.settings.seuil)||90;
  const periode = state.periodeFilter;
  return state.producteurs
    .filter(p => state.coopFilter==='all' || p.cooperative_id===state.coopFilter)
    .map(p=>{
      const pot = potentiel(p);
      const ceiling = effectiveCeiling(p, state.campagneFilter, periode);
      const cumul = cumulAchats(p.id, state.campagneFilter, periode);
      const st = statusFor(pot, ceiling, cumul, seuil, state.campagneFilter!=='all' ? periode : null);
      const restant = ceiling>0 ? Math.max(ceiling - cumul, 0) : null;
      return { p, pot, ceiling, cumul, restant, st, periode: state.campagneFilter!=='all' ? periode : null };
    }).sort((a,b)=>{
      const pa = a.st.pct==null ? -1 : a.st.pct;
      const pb = b.st.pct==null ? -1 : b.st.pct;
      return pb-pa;
    });
}

// Repere une valeur associee a un libelle, dans une feuille lue en mode "array of arrays"
// (utile pour un formulaire avec libelle + valeur juxtaposes, comme la fiche d'accompagnement)
function normDateValue(v){
  if (v instanceof Date && !isNaN(v)) return v.toISOString().slice(0,10);
  if (v==null || v==='') return '';
  return String(v).trim();
}
function findLabelValue(rows, patterns){
  for (let r=0;r<rows.length;r++){
    const row = rows[r]||[];
    for (let c=0;c<row.length;c++){
      const raw = row[c];
      if (raw==null || String(raw).trim()==='') continue;
      const norm = normHeader(String(raw));
      if (patterns.some(p=>norm.includes(p))){
        // priorite aux cellules adjacentes (valeur saisie a cote du libelle) : le libelle
        // garde souvent son texte de placeholder meme une fois la fiche remplie.
        for (let cc=c+1; cc<Math.min(c+6,row.length); cc++){
          const v = row[cc];
          if (v!=null && String(v).trim()!=='') return normDateValue(v);
        }
        const below = (rows[r+1]||[])[c];
        if (below!=null && String(below).trim()!=='') return normDateValue(below);
        // repli : texte apres ':' dans la cellule elle-meme (edition en place)
        const rawStr = String(raw);
        const idx = rawStr.indexOf(':');
        if (idx>=0){
          const after = rawStr.slice(idx+1).trim();
          if (after) return after;
        }
      }
    }
  }
  return '';
}
function findHeaderRowIdx(rows, mustIncludeAny){
  for (let r=0;r<rows.length;r++){
    const normRow = (rows[r]||[]).map(v=>normHeader(String(v==null?'':v)));
    if (mustIncludeAny.every(pats=> normRow.some(nc=> pats.some(p=>nc.includes(p)) ))){
      return r;
    }
  }
  return -1;
}
// Parse une feuille au format "fiche d'accompagnement" : bloc d'en-tete (connaissement, type de
// cacao, poids/sacs declares) + tableau producteurs (nom, carte CCC, identifiant, poids, sacs...).
function parseFicheAccompagnement(rows){
  const connaissement = findLabelValue(rows, ['numero du connaissement','n du connaissement','connaissement']);
  const dateEdition = findLabelValue(rows, ["date d'edition",'date edition']);
  const fournisseur = findLabelValue(rows, ['fournisseur']);
  const poidsNetDeclareRaw = findLabelValue(rows, ['poids net declare']);
  const poidsBrutDeclareRaw = findLabelValue(rows, ['poids brut declare']);
  const nbSacsDeclareRaw = findLabelValue(rows, ['nombre de sac declare','nombre de sacs declare']);
  const poidsNetDeclare = Number(poidsNetDeclareRaw)||0;
  const poidsBrutDeclare = Number(poidsBrutDeclareRaw)||0;
  const nbSacsDeclare = Number(nbSacsDeclareRaw)||0;

  let ordinaireRow=-1, raRow=-1, xRow=-1;
  rows.forEach((row,r)=> (row||[]).forEach(v=>{
    const n = normHeader(String(v==null?'':v));
    if (n==='ordinaire') ordinaireRow = r;
    if (n.includes('rainforest')) raRow = r;
    if (n==='x' && xRow===-1) xRow = r;
  }));
  let typeCacao = '';
  if (xRow>=0){
    const dOrd = ordinaireRow>=0?Math.abs(xRow-ordinaireRow):999;
    const dRa = raRow>=0?Math.abs(xRow-raRow):999;
    if (dOrd<999 || dRa<999) typeCacao = dOrd<=dRa ? 'Ordinaire' : 'RA';
  }

  const headerRow = findHeaderRowIdx(rows, [['nom et prenom'],['poids net livre']]);
  const items = [];
  if (headerRow>=0){
    const hdr = (rows[headerRow]||[]).map(v=>normHeader(String(v==null?'':v)));
    const colIdx = (patterns)=> hdr.findIndex(h=>patterns.some(p=>h.includes(p)));
    const cNom = colIdx(['nom et prenom']);
    const cSection = colIdx(['section']);
    const cParcelle = colIdx(['code parcelle','parcelle']);
    const cCarte = colIdx(['carte producteur ccc','carte ccc']);
    const cIdent = colIdx(['identifiant du producteur','identifiant producteur']);
    const cRecu = colIdx(["recu d'achat",'recu d achat','numero de recu']);
    const cDate = colIdx(["date d'achat",'date achat']);
    const cPoids = colIdx(['poids net livre']);
    const cSacs = colIdx(['nombre de sacs livres','nombre de sacs']);
    for (let r=headerRow+1; r<rows.length; r++){
      const row = rows[r]||[];
      const nomRaw = cNom>=0 ? row[cNom] : '';
      const nom = nomRaw==null ? '' : String(nomRaw).trim();
      if (!nom || normHeader(nom)==='total') continue;
      const poids = Number(cPoids>=0?row[cPoids]:0)||0;
      if (poids<=0) continue;
      items.push({
        nom,
        section: cSection>=0 ? String(row[cSection]||'').trim() : '',
        code_parcelle: cParcelle>=0 ? String(row[cParcelle]||'').trim() : '',
        carte_ccc: cCarte>=0 ? String(row[cCarte]||'').trim() : '',
        identifiant: cIdent>=0 ? String(row[cIdent]||'').trim() : '',
        recu: cRecu>=0 ? String(row[cRecu]||'').trim() : '',
        date: (cDate>=0 && row[cDate]) ? normDateValue(row[cDate]) : dateEdition,
        poids,
        sacs: Number(cSacs>=0?row[cSacs]:0)||0
      });
    }
  }
  return { connaissement, dateEdition, fournisseur, typeCacao, items, poidsNetDeclare, poidsBrutDeclare, nbSacsDeclare, isFiche: headerRow>=0 };
}

async function handleLivraisonFile(input){
  const file = input.files && input.files[0];
  if (!file) return;
  const coopId = document.getElementById('liv-coop').value;
  const campId = document.getElementById('liv-campagne').value;
  const periode = document.getElementById('liv-periode').value;
  if (!coopId){ showToast("Sélectionne d'abord une coopérative."); input.value=''; return; }
  if (!campId){ showToast("Sélectionne la campagne avant d'importer."); input.value=''; return; }
  if (!periode){ showToast("Précise la période (Principale ou Intermédiaire) avant d'importer."); input.value=''; return; }
  try{
    const data = await file.arrayBuffer();
    const wb = XLSX.read(data, {type:'array', cellDates:true});
    const rows = []; let skipped = 0; let nonMatches = 0;
    const fiches = [];

    wb.SheetNames.forEach(sheetName=>{
      const sheet = wb.Sheets[sheetName];
      const aoa = XLSX.utils.sheet_to_json(sheet, {header:1, defval:''});
      const parsed = parseFicheAccompagnement(aoa);

      if (parsed.isFiche){
        const sumPoids = parsed.items.reduce((s,it)=>s+(Number(it.poids)||0),0);
        const sumSacs = parsed.items.reduce((s,it)=>s+(Number(it.sacs)||0),0);
        const ecartPoids = parsed.poidsNetDeclare>0 ? Math.round((parsed.poidsNetDeclare - sumPoids)*10)/10 : null;
        const ecartSacs = parsed.nbSacsDeclare>0 ? (parsed.nbSacsDeclare - sumSacs) : null;
        const inconnus = [];
        fiches.push({ sheetName, connaissement: parsed.connaissement, typeCacao: parsed.typeCacao, dateEdition: parsed.dateEdition, count: parsed.items.length,
          poidsNetDeclare: parsed.poidsNetDeclare, nbSacsDeclare: parsed.nbSacsDeclare, sumPoids, sumSacs, ecartPoids, ecartSacs, inconnus });
        const ficheEntry = fiches[fiches.length-1];
        parsed.items.forEach(it=>{
          const prod = state.producteurs.find(p=>p.cooperative_id===coopId && (
            (it.carte_ccc && p.matricule_ccc && p.matricule_ccc===it.carte_ccc) ||
            (it.identifiant && p.code && p.code===it.identifiant)
          ));
          if (!prod){ nonMatches++; ficheEntry.inconnus.push(it.nom + (it.identifiant?' ('+it.identifiant+')':(it.carte_ccc?' (CCC '+it.carte_ccc+')':''))); }
          rows.push({
            code: it.carte_ccc || it.identifiant, poids: it.poids,
            date: it.date || new Date().toISOString().slice(0,10),
            sacs: it.sacs,
            connaissement: parsed.connaissement,
            type_cacao: parsed.typeCacao,
            recu: it.recu,
            section: it.section, code_parcelle: it.code_parcelle,
            producteur_id: prod ? prod.id : null,
            nom: prod ? prod.nom : it.nom
          });
        });
      } else {
        // repli : feuille tabulaire simple (une ligne = une livraison, en-tetes en ligne 1)
        const json = XLSX.utils.sheet_to_json(sheet, {defval:''});
        json.forEach(r=>{
          const code = String(pickFieldContains(r, LIV_CODE_KEYS)||'').trim();
          const poids = Number(pickFieldContains(r, LIV_POIDS_KEYS))||0;
          if (!code || poids<=0){ skipped++; return; }
          const prod = state.producteurs.find(p=>p.cooperative_id===coopId && p.code && p.code===code);
          if (!prod) nonMatches++;
          const rawDate = pickFieldContains(r, LIV_DATE_KEYS);
          rows.push({
            code, poids,
            date: rawDate ? normDateValue(rawDate) : new Date().toISOString().slice(0,10),
            sacs: Number(pickFieldContains(r, LIV_SACS_KEYS))||0,
            connaissement: String(pickFieldContains(r, LIV_CONN_KEYS)||'').trim(),
            type_cacao: '', recu: '',
            producteur_id: prod ? prod.id : null,
            nom: prod ? prod.nom : null
          });
        });
      }
    });

async function confirmImportLivraisons(){
  const pi = state.pendingImportLivraisons;
  if (!pi) return;
  let added = 0; let enriched = false;
  const importedProducteurIds = [];
  pi.rows.forEach(r=>{
    if (!r.producteur_id) return;
    state.achats.push({ id: genId('a'), producteur_id: r.producteur_id, date: r.date, quantite_kg: r.poids, nombre_sacs: r.sacs, connaissement: r.connaissement, type_cacao: r.type_cacao||'', recu: r.recu||'', campagne_id: pi.campagne_id||'', periode: pi.periode||'' });
    added++;
    importedProducteurIds.push(r.producteur_id);
    if (r.section || r.code_parcelle){
      const prod = state.producteurs.find(p=>p.id===r.producteur_id);
      if (prod){
        if (r.section) prod.section = r.section;
        if (r.code_parcelle) prod.code_parcelle = r.code_parcelle;
        enriched = true;
      }
    }
  });
  await saveKey(KEY_ACHATS, state.achats);
  if (enriched) await saveKey(KEY_PROD, state.producteurs);

  // Signalement persistant : ecarts poids/sacs et producteurs inconnus, sous forme de non-conformites
  let ncCount = 0;
  (pi.fiches||[]).forEach(f=>{
    const dateNC = new Date().toISOString().slice(0,10);
    if (f.ecartPoids!=null && Math.abs(f.ecartPoids)>=1){
      state.nonconformites.push({
        id: genId('n'), cooperative_id: pi.cooperative_id, producteur_id: '',
        type: 'Écart poids/sacs déclaré vs détail producteurs',
        description: 'Fiche '+(f.connaissement||f.sheetName)+' : poids net déclaré '+Math.round(f.poidsNetDeclare)+' kg, somme des lignes producteurs '+Math.round(f.sumPoids)+' kg (écart de '+(f.ecartPoids>0?'-':'+')+Math.abs(f.ecartPoids)+' kg).',
        mesure: '', statut: 'ouverte', date_creation: dateNC
      });
      ncCount++;
    }
    if (f.ecartSacs!=null && f.ecartSacs!==0){
      state.nonconformites.push({
        id: genId('n'), cooperative_id: pi.cooperative_id, producteur_id: '',
        type: 'Écart poids/sacs déclaré vs détail producteurs',
        description: 'Fiche '+(f.connaissement||f.sheetName)+' : nombre de sacs déclaré '+f.nbSacsDeclare+', somme des lignes producteurs '+f.sumSacs+' (écart de '+(f.ecartSacs>0?'-':'+')+Math.abs(f.ecartSacs)+' sac(s)).',
        mesure: '', statut: 'ouverte', date_creation: dateNC
      });
      ncCount++;
    }
    if (f.inconnus && f.inconnus.length>0){
      state.nonconformites.push({
        id: genId('n'), cooperative_id: pi.cooperative_id, producteur_id: '',
        type: 'Producteur inconnu dans la fiche d\'accompagnement',
        description: 'Fiche '+(f.connaissement||f.sheetName)+' : '+f.inconnus.length+' producteur(s) non reconnu(s) dans notre base — '+f.inconnus.join(', ')+'.',
        mesure: '', statut: 'ouverte', date_creation: dateNC
      });
      ncCount++;
    }
  });
  if (ncCount>0) await saveKey(KEY_NONCONF, state.nonconformites);

  state.pendingImportLivraisons = null;
  closeModal();
  const uniqueIds = Array.from(new Set(importedProducteurIds));
  if (ncCount>0){
    showToast(added+' livraison(s) importée(s). '+ncCount+' non-conformité(s) créée(s) automatiquement (écarts / producteurs inconnus) — voir l\'onglet Conformité.', 'error');
  }
  if (uniqueIds.length>0){
    genererFicheImportBatch(pi.cooperative_id, pi.campagne_id, uniqueIds);
  } else if (ncCount===0){
    showToast(added+' livraison(s) importée(s).', 'success');
  }
}

function padCol(str, width){
  str = String(str==null?'':str);
  if (str.length >= width) return str.slice(0, width-1)+'…';
  return str + ' '.repeat(width-str.length);
}
function buildTexteTableau(entries){
  const cols = [
    {label:'Producteur', w:22, get:r=>r.p.nom},
    {label:'Section', w:12, get:r=>r.p.section||'—'},
    {label:'Code producteur', w:16, get:r=>r.p.code||'—'},
    {label:'Code parcelle', w:14, get:r=>r.p.code_parcelle||'—'},
    {label:'Livré (kg)', w:12, get:r=>Math.round(r.cumul)},
    {label:'Restant (kg)', w:13, get:r=>r.restant!=null?Math.round(r.restant):'—'}
  ];
  const headerLine = cols.map(c=>padCol(c.label,c.w)).join('| ');
  const sepLine = cols.map(c=>'-'.repeat(c.w)).join('|-');
  const rowLines = entries.map(r=> cols.map(c=>padCol(c.get(r), c.w)).join('| '));
  return [headerLine, sepLine].concat(rowLines).join('\n');
}

async function handleExcelFile(input, cooperativeId){
  const file = input.files && input.files[0];
  if (!file) return;
  try{
    const data = await file.arrayBuffer();
    const wb = XLSX.read(data, {type:'array', cellDates:true});
    let sheetName = wb.SheetNames.find(n => normHeader(n).includes('farm') && normHeader(n).includes('data'));
    if (!sheetName) sheetName = wb.SheetNames.find(n => normHeader(n).includes('farm'));
    if (!sheetName) sheetName = wb.SheetNames[0];
    const sheet = wb.Sheets[sheetName];
    // Le modele a son entete en ligne 2 (ligne 1 = titre de section fusionne) ; on essaie range:1,
    // et si ca ne detecte aucune colonne utile on retente sans range (feuille "simple").
    let json = XLSX.utils.sheet_to_json(sheet, {range:1, defval:''});
    const hasUsefulHeaders = (rows) => rows.length>0 && Object.keys(rows[0]).some(k=>{
      const nk = normHeader(k);
      return nk.includes('farmer name') || nk.includes('nom');
    });
    if (!hasUsefulHeaders(json)){
      const alt = XLSX.utils.sheet_to_json(sheet, {defval:''});
      if (hasUsefulHeaders(alt)) json = alt;
    }
    const rows = []; let skipped = 0;
    json.forEach(r=>{
      const nom = pickFieldContains(r, NOM_KEYS) ?? pickField(r, NOM_KEYS);
      if (!nom || String(nom).trim()===''){ skipped++; return; }
      const rawDate = pickFieldContains(r, MAPDATE_KEYS);
      rows.push({
        nom: String(nom).trim(),
        code: String(pickFieldContains(r, CODE_KEYS) ?? pickField(r, CODE_KEYS) ?? '').trim(),
        farm_id: String(pickFieldContains(r, FARMID_KEYS) || '').trim(),
        pays: String(pickFieldContains(r, PAYS_KEYS) || '').trim(),
        village_district: String(pickFieldContains(r, VILLAGE_KEYS) || '').trim(),
        matricule_ccc: String(pickFieldContains(r, MATRICULE_KEYS) ?? pickField(r, MATRICULE_KEYS) ?? '').trim(),
        first_aggregator: String(pickFieldContains(r, AGGREGATOR_KEYS) || '').trim(),
        polygon_filename: String(pickFieldContains(r, POLYGON_KEYS) || '').trim(),
        farm_mapping_date: rawDate ? normDateValue(rawDate) : '',
        surface_ha: Number(pickFieldContains(r, SURFACE_KEYS) ?? pickField(r, SURFACE_KEYS))||0,
        rendement_kg_ha: Number(pickFieldContains(r, RENDEMENT_KEYS) ?? pickField(r, RENDEMENT_KEYS))||0,
        volume_estime_kg: Number(pickFieldContains(r, VOLUME_KEYS))||0,
        lat: String(pickFieldContains(r, LAT_KEYS) ?? pickField(r, LAT_KEYS) ?? '').trim(),
        lon: String(pickFieldContains(r, LON_KEYS) ?? pickField(r, LON_KEYS) ?? '').trim()
      });
    });
    state.pendingImport = { cooperative_id: cooperativeId, fileName: file.name, sheetUsed: sheetName, rows, skipped };
    state.modal = { type: 'importPreview' };
    render();
  }catch(err){
    showToast("Impossible de lire ce fichier. Vérifiez qu'il s'agit bien d'un fichier Excel (.xlsx ou .xls).");
  }
  input.value = '';
}

function evolutionSvg(achatsSorted, pot){
  const w=380,h=120,padL=36,padR=10,padT=10,padB=22;
  if (achatsSorted.length===0){
    return '<div class="hint">Aucun achat enregistré pour cette période.</div>';
  }
  let cum=0; const pts = achatsSorted.map(a=>{ cum += Number(a.quantite_kg)||0; return cum; });
  const maxY = Math.max(pot||0, cum) * 1.15 || 1;
  const n = pts.length;
  const xStep = n>1 ? (w-padL-padR)/(n-1) : 0;
  const scaleY = (v)=> h-padB - (v/maxY)*(h-padT-padB);
  const coords = pts.map((v,i)=> [padL + (n>1?i*xStep:0), scaleY(v)]);
  const path = coords.map((c,i)=> (i===0?'M':'L')+c[0].toFixed(1)+' '+c[1].toFixed(1)).join(' ');
  const ceilingY = scaleY(pot||0);
  const circles = coords.map(c=>'<circle cx="'+c[0].toFixed(1)+'" cy="'+c[1].toFixed(1)+'" r="2.5" fill="#42693C"/>').join('');
  return '<svg width="100%" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="Évolution des achats cumulés">'
    + (pot>0 ? '<line x1="'+padL+'" y1="'+ceilingY.toFixed(1)+'" x2="'+(w-padR)+'" y2="'+ceilingY.toFixed(1)+'" stroke="#B23B2E" stroke-width="1" stroke-dasharray="4 3"/>'
      + '<text x="'+(w-padR)+'" y="'+(ceilingY-4).toFixed(1)+'" font-size="10" fill="#B23B2E" text-anchor="end" font-family="IBM Plex Mono, monospace">plafond '+fmtKg(pot)+'</text>' : '')
    + '<path d="'+path+'" fill="none" stroke="#42693C" stroke-width="1.6"/>'
    + circles
    + '<text x="'+padL+'" y="'+(h-6)+'" font-size="10" fill="#9A9184" font-family="IBM Plex Mono, monospace">1er achat</text>'
    + '<text x="'+(w-padR)+'" y="'+(h-6)+'" font-size="10" fill="#9A9184" text-anchor="end" font-family="IBM Plex Mono, monospace">dernier</text>'
    + '</svg>';
}

function missingDocs(coopId){
  return DOCS_REQUIS.filter(doc=>{
    const rec = getDocCheck(coopId, doc);

  });
}
async function genererEmailManquants(coopId){
  const coop = coopById(coopId); if (!coop) return;
  const emails = [coop.email1, coop.email2, coop.email3].map(e=>String(e||'').trim()).filter(Boolean);
  if (emails.length===0){ showToast("Aucune adresse email enregistrée pour cette coopérative. Ajoute au moins une adresse via 'Modifier'."); return; }
  const missing = missingDocs(coopId);
  if (missing.length===0){ showToast('Tous les documents requis sont marqués disponibles pour cette coopérative.', 'success'); return; }
  const subject = 'Documents manquants — ' + coop.nom;
  const bodyLines = [
    'Bonjour,', '',
    "Dans le cadre du suivi de conformité, il nous manque encore les documents suivants pour " + coop.nom + " :", ''
  ].concat(missing.map((d,i)=> (i+1)+'. '+d)).concat(['', 'Merci de nous les transmettre dès que possible.', '', 'Cordialement,', "L'équipe Durabilité — ECORIGINE"]);
  const body = bodyLines.join('\n');
  showEmailPreview(emails.join(', '), subject, body);
  missing.forEach(doc=>{
    let rec = getDocCheck(coopId, doc);
    if (!rec){ rec = { id: genId('dc'), cooperative_id: coopId, doc, disponible:false, rappels:[] }; state.docCheck.push(rec); }
    rec.rappels.push(new Date().toISOString().slice(0,10));
  });
  await saveKey(KEY_DOCCHECK, state.docCheck);
}

  if (!type){ showToast('Le type de non-conformité est obligatoire.'); return; }

    type: type, description: fv('description').trim(), mesure: fv('mesure').trim(),

  };

function renderMapIfNeeded(){
  const el = document.getElementById('geoMap');
  if (!el || typeof L === 'undefined'){
    if (leafletMapInstance){ leafletMapInstance.remove(); leafletMapInstance = null; }
    return;
  }
  const coopId = state.conformiteCoopFilter;
  const pts = state.producteurs
    .filter(p => coopId==='all' || p.cooperative_id===coopId)
    .filter(p => p.lat!=null && p.lat!=='' && p.lon!=null && p.lon!=='' && !isNaN(Number(p.lat)) && !isNaN(Number(p.lon)))
    .map(p => ({ lat:Number(p.lat), lon:Number(p.lon), nom:p.nom }));
  if (leafletMapInstance){ leafletMapInstance.remove(); leafletMapInstance = null; }
  const center = pts.length>0 ? [pts[0].lat, pts[0].lon] : [7.5399, -5.5471];
  leafletMapInstance = L.map('geoMap').setView(center, pts.length>0?9:6);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap', maxZoom:18 }).addTo(leafletMapInstance);
  pts.forEach(pt=>{
    L.circleMarker([pt.lat, pt.lon], {radius:6, color:'#42693C', fillColor:'#42693C', fillOpacity:0.85, weight:1}).addTo(leafletMapInstance).bindPopup(esc(pt.nom));
  });
  if (pts.length>1){
    leafletMapInstance.fitBounds(L.latLngBounds(pts.map(p=>[p.lat,p.lon])), {padding:[24,24]});
  }
}

function poidsBaseForPrime(a){
  return Number(a.poids_net_produit)>0 ? Number(a.poids_net_produit) : Number(a.quantite_kg)||0;
}
function calcPrime(a){
  const poids = poidsBaseForPrime(a);
  const tauxRA = Number(state.settings.prime_ra)||0;
  const tauxFT = Number(state.settings.prime_ft)||0;
  const t = a.type_cacao || '';
  let taux = 0;
  if (t==='RA') taux = tauxRA;
  else if (t==='Fairtrade') taux = tauxFT;
  else if (t==='RA+FT' || t==='RA+Fairtrade') taux = tauxRA+tauxFT;
  return Math.round(poids*taux);
}
async function savePrimes(){
  state.settings.prime_ra = Number(document.getElementById('prime-ra-input').value)||0;
  state.settings.prime_ft = Number(document.getElementById('prime-ft-input').value)||0;
  await saveKey(KEY_SETTINGS, state.settings);
  showToast('Taux de prime enregistrés.', 'success');
  closeModal();
}

function achatsFiltered(){
  const coopId = state.coopFilter;
  const campId = state.campagneFilter;
  const periode = state.periodeFilter;
  return state.achats.filter(a=>{
    if (campId!=='all'){
      if ((a.campagne_id||'')!==campId) return false;
      if (periode==='principale' && a.periode!=='principale') return false;
      if (periode==='intermediaire' && !(a.periode==='principale' || a.periode==='intermediaire')) return false;
    }
    const prod = a.producteur_id ? state.producteurs.find(p=>p.id===a.producteur_id) : null;
    const acoopId = prod ? prod.cooperative_id : a.cooperative_id;
    if (coopId!=='all' && acoopId!==coopId) return false;
    return true;
  });
}

  const list = achatsFiltered().filter(a=>!a.producteur_id);

  const totalNetProduit = list.reduce((s,a)=>s+(Number(a.poids_net_produit)||0),0);

  const groups = new Map();
  list.forEach(a=>{
    const key = a.campagne_id || '__none__';
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(a);
  });
  const orderedKeys = state.campagnes.map(c=>c.id).filter(id=>groups.has(id));
  if (groups.has('__none__')) orderedKeys.push('__none__');

  const totalPrime = list.reduce((s,a)=>s+calcPrime(a),0);
  let html = '<div class="panel">';
  html += '<div class="panel-head"><h2>Achats par connaissement ('+fmtNum(list.length)+')</h2><span class="num" style="color:var(--ink-soft)">'+fmtKg(totalKg)+' déclaré'+(totalNetProduit>0?' · '+fmtKg(totalNetProduit)+' net payé':'')+(totalPrime>0?' · '+fmtNum(totalPrime)+' FCFA de prime':'')+'</span>'+sectionToggleHtml('connaissement', list.length)+'</div>';
  html += '<div class="panel-note">Un chargement par coopérative, dissocié par campagne. Poids brut et net déclarés par la coopérative à l\'émission du connaissement ; poids net payé = après analyse qualité et réfraction éventuelle à l\'usine, validé par le Conseil Café-Cacao — c\'est sur cette base qu\'ECORIGINE paie la coopérative et calcule la prime de certification. Pas de détail producteur à ce niveau.</div>';
  if (list.length===0){
    html += '<div class="empty">Aucun achat par connaissement pour ce filtre.<br><button class="btn" '+((state.cooperatives.length===0||state.campagnes.length===0)?'disabled title="Crée une coopérative et une campagne d\'abord"':'onclick="openModal(\'achat\')"')+'>+ Achat (connaissement)</button></div>';
  } else if (!sectionIsOpen('connaissement', list.length)){
    html += '<div class="empty">Liste repliée ('+fmtNum(list.length)+' achats) — clique sur « Dérouler » ci-dessus pour l\'afficher.</div>';
  } else {
    orderedKeys.forEach(key=>{
      const camp = key==='__none__' ? null : state.campagnes.find(c=>c.id===key);
      const items = groups.get(key).sort((a,b)=> b.date.localeCompare(a.date));
      const subTotal = items.reduce((s,a)=>s+(Number(a.quantite_kg)||0),0);
      const primeSubTotal = items.reduce((s,a)=>s+calcPrime(a),0);
      html += '<div class="group-header">'+(camp?esc(camp.nom):'Sans campagne (à corriger)')+' <span class="hint">— '+fmtNum(items.length)+' achat(s), '+fmtKg(subTotal)+' déclaré'+(primeSubTotal>0?' · prime '+fmtNum(primeSubTotal)+' FCFA':'')+'</span></div>';
      items.forEach(a=>{
        const coop = coopById(a.cooperative_id);
        const hasAccepte = a.poids_net_produit || a.poids_brut_accepte || a.nombre_sacs_accepte;
        const prime = calcPrime(a);
        const fld = (label, val, unit)=> '<div class="achat-field"><span class="lbl">'+label+'</span><span class="val'+(val?'':' empty')+'">'+(val?(fmtNum(val)+(unit?' '+unit:'')):'à saisir')+'</span></div>';
        html += '<div class="achat-card">'
          + '<div class="achat-card-head">'
          + '<div><div class="name">'+esc(a.connaissement||'(sans numéro)')+(a.type_cacao?' <span class="badge neutral">'+esc(a.type_cacao)+'</span>':'')+'</div><div class="coop">'+esc(coop?coop.nom:'—')+' · '+esc(a.date)+(a.periode?' · '+(a.periode==='principale'?'principale':'intermédiaire'):'')+(prime>0?' · <span class="num">prime '+fmtNum(prime)+' FCFA</span>':'')+'</div></div>'
          + '<div class="row-actions"><button class="btn-ghost" onclick="openModal(\'achat\','+esc(JSON.stringify(a)).replace(/&#39;/g,"&apos;")+')">Modifier</button><button class="btn-danger-text" onclick="deleteAchat(\''+a.id+'\')">Supprimer</button></div>'
          + '</div>'
          + '<div class="achat-compare">'
          + '<div class="achat-compare-col"><h4>Déclaré à l\'émission</h4>'
            + fld('Sacs déclarés', a.nombre_sacs, '')
            + fld('Poids brut déclaré', a.poids_brut, 'kg')
            + fld('Poids net déclaré', a.quantite_kg, 'kg')
          + '</div>'
          + '<div class="achat-compare-col'+(hasAccepte?'':' pending')+'"><h4>Accepté / produit à l\'usine</h4>'
            + fld('Sacs acceptés', a.nombre_sacs_accepte, '')
            + fld('Poids net livré', a.poids_brut_accepte, 'kg')
            + fld('Poids net payé', a.poids_net_produit, 'kg')
          + '</div>'
          + '</div>'
          + '</div>';
      });
    });
  }
  html += '</div>';
  return html;
}

function openCoopDashboard(coopId){

    const pa = a.st.pct==null?-1:a.st.pct; const pb = b.st.pct==null?-1:b.st.pct; return pb-pa;
  });
  const nAlert = rows.filter(r=>r.st.key==='warn'||r.st.key==='danger').length;
  const missing = missingDocs(coop.id);
  const nOuvertes = state.nonconformites.filter(n=>n.cooperative_id===coop.id && n.statut!=='resolue').length;

        + '<div><span class="badge '+r.st.key+'">'+r.st.label+'</span></div>'

        + '</div>';

  }
  html += '</div>';

  html += renderAchatsConnaissementPanel();

  return html;

function render(){
  const app = document.getElementById('app');
  if (state.authLoading){
    app.innerHTML = '<div class="loading">Vérification de la connexion…</div>';
    return;
  }
  if (!state.session){
    app.innerHTML = '<div class="login-screen">'
      + '<div class="login-box">'
      + '<h2>ECORIGINE — Traçabilité cacao</h2>'
      + '<p class="hint" style="margin-bottom:18px;">Connecte-toi pour accéder aux données.</p>'
      + (state.authError ? '<div class="error-banner" style="margin-bottom:14px;"><span>'+esc(state.authError)+'</span></div>' : '')
      + '<div id="modal-fields">'
      + '<label class="field">Email<input type="email" name="login_email" autocomplete="username"></label>'
      + '<label class="field">Mot de passe<input type="password" name="login_password" autocomplete="current-password" onkeydown="if(event.key===\'Enter\')signIn()"></label>'
      + '</div>'
      + '<button class="btn btn-primary" style="width:100%;margin-top:8px;" onclick="signIn()">Se connecter</button>'
      + '</div></div>';
    return;
  }
  if (state.loading){
    app.innerHTML = '<div class="loading">Chargement des données…</div>';
    return;
  }

  let html = '';

  html += '<div style="display:flex;justify-content:flex-end;margin-bottom:8px;">'
    + '<span class="hint" style="margin-right:10px;">Connecté : '+esc(state.session.user.email)+'</span>'
    + '<button class="btn-ghost" onclick="openModal(\'changerMotDePasse\')">Changer mon mot de passe</button>'
    + '<button class="btn-ghost" onclick="signOut()">Se déconnecter</button></div>';

  if (window.self !== window.top){
    html += '<div class="error-banner" style="align-items:flex-start;background:#3D2115;color:#FBEEDA;border-color:#9A6512;">'
      + '<span><strong>⚠ Vous êtes dans l\'aperçu intégré à la conversation Claude.ai.</strong><br>'
      + 'Dans ce mode, la connexion à Supabase ne fonctionne pas (limitation technique du navigateur intégré) — toute donnée saisie ou importée ici semblera fonctionner, mais ne sera <u>pas réellement enregistrée</u>. '
      + 'Utilisez uniquement ce mode pour le bouton « Récupérer en fichier JSON » ci-dessous. Pour tout le reste (import, saisie), téléchargez le fichier et ouvrez-le dans un onglet de navigateur séparé.'
      + '</span></div>';
  }
