/* ============================================================
   Import du rapport de réception CCC (Conseil Café-Cacao)
   Remplace la saisie manuelle des achats : le rapport officiel
   fournit directement le nombre de sacs et le poids accepte/paye
   par livraison (numero de connaissement), pour chaque cooperative
   (retrouvee via son numero d'agrement CCC = Code Fournisseur).
   ============================================================ */
function parseRapportCCC(aoa){
  let headerRow = -1;
  for (let r=0;r<Math.min(20,aoa.length);r++){
    const row = aoa[r]||[];
    if (row.some(c=>normHeader(String(c||'')).includes('date pesee'))) { headerRow = r; break; }
  }
  if (headerRow===-1) return { error: "Impossible de trouver l'en-tête du rapport (colonne « Date Pesée » introuvable). Vérifie qu'il s'agit bien d'un export « État de réception de produits » du CCC." };

  const hdr = (aoa[headerRow]||[]).map(c=>normHeader(String(c||'')));
  const findCol = (...patterns) => hdr.findIndex(h => patterns.every(p=>h.includes(p)));
  const cDate = findCol('date','pesee');
  const cCnsment = findCol('cnsment');
  const cCodeFourn = findCol('code','fournisseur');
  const cNomFourn = findCol('nom','fournisseur');
  const cSacs = findCol('sacs');
  const cPoids = findCol('poids','accepte');
  const cGradNat = findCol('grad','nat');
  const cGradFcc = findCol('grad','fcc');
  if (cDate<0 || cCodeFourn<0 || cSacs<0 || cPoids<0){
    return { error: "Colonnes attendues introuvables dans ce fichier (Date Pesée / Code Fournisseur / Nbre Sacs / Poids Accepté)." };
  }

  let campagneLabel = '';
  for (let r=0;r<Math.min(10,aoa.length) && !campagneLabel;r++){
    const row = aoa[r]||[];
    for (let c=0;c<row.length && !campagneLabel;c++){
      if (normHeader(String(row[c]||'')).includes('campagne')){
        for (let cc=c; cc<row.length; cc++){
          const m = String(row[cc]||'').match(/(\d{4})\s*-\s*(\d{4})/);
          if (m){ campagneLabel = m[1]+'-'+m[2]; break; }
        }
      }
    }
  }

  function normDateFromCCC(v){
    if (v instanceof Date && !isNaN(v)) return v.toISOString().slice(0,10);
    const m = String(v||'').trim().match(/^(\d{4}-\d{2}-\d{2})/);
    return m ? m[1] : '';
  }

  const rows = [];
  for (let r=headerRow+1; r<aoa.length; r++){
    const row = aoa[r]||[];
    const dateVal = row[cDate];
    if (dateVal==null || String(dateVal).trim()==='') continue;
    const codeFourn = String(row[cCodeFourn]||'').trim();
    if (!codeFourn) continue;
    rows.push({
      date: normDateFromCCC(dateVal),
      connaissement: cCnsment>=0 ? String(row[cCnsment]||'').trim() : '',
      code_fournisseur: codeFourn,
      nom_fournisseur: cNomFourn>=0 ? String(row[cNomFourn]||'').trim() : '',
      sacs: Number(row[cSacs])||0,
      poids_accepte: Number(row[cPoids])||0,
      grad_nat: cGradNat>=0 ? String(row[cGradNat]||'').trim() : '',
      grad_fcc: cGradFcc>=0 ? String(row[cGradFcc]||'').trim() : '',
    });
  }
  return { campagneLabel, rows };
}

async function handleRapportCCCFile(input){
  const file = input.files && input.files[0];
  if (!file) return;
  try{
    const data = await file.arrayBuffer();
    const wb = XLSX.read(data, {type:'array', cellDates:true});
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const aoa = XLSX.utils.sheet_to_json(sheet, {header:1, defval:''});
    const parsed = parseRapportCCC(aoa);
    if (parsed.error){ showToast(parsed.error); input.value=''; return; }
    if (parsed.rows.length===0){ showToast("Aucune ligne de réception trouvée dans ce fichier."); input.value=''; return; }

    let campagne = null;
    if (parsed.campagneLabel){
      const norm = s => String(s||'').replace(/\s+/g,'');
      campagne = state.campagnes.find(c=> norm(c.nom)===norm(parsed.campagneLabel)) || null;
    }

    const parCoop = {};
    const nonReconnues = new Set();
    parsed.rows.forEach(r=>{
      const coop = state.cooperatives.find(c=> String(c.ccc_num||'').trim()===r.code_fournisseur);
      if (!coop){ nonReconnues.add(r.code_fournisseur+' ('+r.nom_fournisseur+')'); return; }
      if (!parCoop[coop.id]) parCoop[coop.id] = { coop, rows: [] };
      parCoop[coop.id].rows.push(r);
    });

    state.pendingRapportCCC = { fileName: file.name, campagneLabel: parsed.campagneLabel, campagneId: campagne?campagne.id:'', parCoop, nonReconnues: Array.from(nonReconnues), totalRows: parsed.rows.length };
    render();
  }catch(e){
    showToast("Impossible de lire ce fichier : "+e.message);
  }
  input.value = '';
}

async function confirmImportRapportCCC(){
  const pi = state.pendingRapportCCC;
  if (!pi) return;
  const campagneId = fv('rapport_ccc_campagne') || pi.campagneId;
  if (!campagneId){ showToast('Sélectionne la campagne correspondant à ce rapport avant de confirmer.'); return; }

  let created = 0, updated = 0, unchanged = 0;
  const aEnregistrer = [];
  Object.values(pi.parCoop).forEach(({coop, rows})=>{
    rows.forEach(r=>{
      const month = r.date ? Number(r.date.slice(5,7)) : 0;
      // Depuis l'annee derniere, la campagne principale a ete decalee d'un mois :
      // septembre a fevrier (auparavant octobre a mars). Meme regle que cote
      // fiche de vente automatique, pour que la periode d'une livraison ne
      // depende jamais du chemin (import CCC ou declaration coop) par lequel
      // elle a ete enregistree.
      const periode = (month>=9 || month<=2) ? 'principale' : 'intermediaire';
      const existing = r.connaissement ? state.achats.find(a=>a.cooperative_id===coop.id && a.connaissement===r.connaissement) : null;
      if (existing){
        const changed = Number(existing.nombre_sacs_accepte||0)!==r.sacs || Number(existing.poids_brut_accepte||0)!==r.poids_accepte || Number(existing.poids_net_produit||0)!==r.poids_accepte;
        if (changed){
          existing.nombre_sacs_accepte = r.sacs;
          existing.poids_brut_accepte = r.poids_accepte;
          existing.poids_net_produit = r.poids_accepte;
          aEnregistrer.push(existing);
          updated++;
        } else {
          unchanged++;
        }
      } else {
        const nouvel = {
          id: genId('a'), cooperative_id: coop.id, producteur_id: '',
          date: r.date || new Date().toISOString().slice(0,10),
          quantite_kg: 0, poids_brut: 0, nombre_sacs: 0,
          poids_brut_accepte: r.poids_accepte, poids_net_produit: r.poids_accepte, nombre_sacs_accepte: r.sacs,
          connaissement: r.connaissement, type_cacao: '', campagne_id: campagneId, periode,
        };
        state.achats.push(nouvel);
        aEnregistrer.push(nouvel);
        created++;
      }
    });
  });

  // Deduplique par id avant l'envoi (meme raison que pour l'import producteurs :
  // deux connaissements identiques dans le rapport donneraient sinon le meme achat
  // deux fois dans le tableau).
  const dedupMap = new Map();
  aEnregistrer.forEach(r=> dedupMap.set(r.id, r));
  const aEnregistrerUnique = Array.from(dedupMap.values());
  let ok = true;
  if (aEnregistrerUnique.length>0){
    const { error } = await supabaseClient.from('achats').upsert(aEnregistrerUnique);
    if (error){ ok = false; state.storageErrorMsg = error.message; }
  }
  state.pendingRapportCCC = null;
  closeModal();
  if (ok){
    showToast(created+' nouveau(x) achat(s), '+updated+' mis à jour, '+unchanged+' déjà à jour.', 'success');
  } else {
    showToast("Les données ont été mises à jour à l'écran, mais l'enregistrement a échoué : "+(state.storageErrorMsg||'erreur inconnue'));
  }
}

// Coeur reutilisable de l'import producteurs : accepte un fichier directement (File
// ou Blob), qu'il vienne d'un champ <input> local (import manuel, depot "Base de
// donnees coop.") ou d'un telechargement depuis le stockage (registre soumis par une
// cooperative via une demande Masterdata, valide par ECORIGINE). Meme pipeline, meme
// reconciliation Farm ID, meme fenetre de confirmation -- une seule source de verite
// pour la table producteurs, quel que soit le chemin d'entree du registre.
async function traiterFichierRegistreExcel(file, cooperativeId, geojsonFile){
  // Empeche qu'un nouveau depot ecrase silencieusement un import deja detecte mais
  // pas encore confirme par un clic sur "Confirmer l'import" -- sans ca, deposer
  // plusieurs registres a la suite sans valider chacun perdrait les precedents.
  if (state.pendingImport){
    showToast("Un import est déjà en attente de confirmation (« "+state.pendingImport.fileName+" »). Confirme-le ou annule-le avant d'en déposer un autre.");
    return;
  }
  let polygones = null;
  if (geojsonFile){
    polygones = await analyserGeojson(geojsonFile);
  }
  try{
    const data = await file.arrayBuffer();
    const wb = XLSX.read(data, {type:'array', cellDates:true});
    let sheetName = wb.SheetNames.find(n => normHeader(n).includes('farm') && normHeader(n).includes('data'));
    if (!sheetName) sheetName = wb.SheetNames.find(n => normHeader(n).includes('farm'));
    if (!sheetName) sheetName = wb.SheetNames[0];
    const sheet = wb.Sheets[sheetName];
    // Le modele a son entete en ligne 2 (ligne 1 = titre de section fusionne) ; on essaie range:1,
    // et si ca ne detecte aucune colonne utile on retente sans range (feuille "simple").
    let json = XLSX.utils.sheet_to_json(sheet, {range:1, defval:''});
    const hasUsefulHeaders = (rows) => rows.length>0 && Object.keys(rows[0]).some(k=>{
      const nk = normHeader(k);
      return nk.includes('farmer name') || nk.includes('nom');
    });
    if (!hasUsefulHeaders(json)){
      const alt = XLSX.utils.sheet_to_json(sheet, {defval:''});
      if (hasUsefulHeaders(alt)) json = alt;
    }
    const rows = []; let skipped = 0;
    json.forEach(r=>{
      const nom = pickFieldContains(r, NOM_KEYS) ?? pickField(r, NOM_KEYS);
      if (!nom || String(nom).trim()===''){ skipped++; return; }
      const rawDate = pickFieldContains(r, MAPDATE_KEYS);
      rows.push({
        nom: String(nom).trim(),
        code: String(pickFieldContains(r, CODE_KEYS) ?? pickField(r, CODE_KEYS) ?? '').trim(),
        farm_id: String(pickFieldContains(r, FARMID_KEYS) || '').trim(),
        pays: String(pickFieldContains(r, PAYS_KEYS) || '').trim(),
        village_district: String(pickFieldContains(r, VILLAGE_KEYS) || '').trim(),
        matricule_ccc: String(pickFieldContains(r, MATRICULE_KEYS) ?? pickField(r, MATRICULE_KEYS) ?? '').trim(),
        first_aggregator: String(pickFieldContains(r, AGGREGATOR_KEYS) || '').trim(),
        polygon_filename: String(pickFieldContains(r, POLYGON_KEYS) || '').trim(),
        farm_mapping_date: rawDate ? normDateValue(rawDate) : '',
        surface_ha: Number(pickFieldContains(r, SURFACE_KEYS) ?? pickField(r, SURFACE_KEYS))||0,
        rendement_kg_ha: Number(pickFieldContains(r, RENDEMENT_KEYS) ?? pickField(r, RENDEMENT_KEYS))||0,
        volume_estime_kg: Number(pickFieldContains(r, VOLUME_KEYS))||0,
        lat: String(pickFieldContains(r, LAT_KEYS) ?? pickField(r, LAT_KEYS) ?? '').trim(),
        lon: String(pickFieldContains(r, LON_KEYS) ?? pickField(r, LON_KEYS) ?? '').trim()
      });
    });
    // Un meme producteur (meme code) peut legitimement avoir plusieurs parcelles
    // (plusieurs lignes) -- ce n'est jamais un doublon en soi. Le vrai probleme,
    // c'est un Farm ID (identifiant de PARCELLE) qui se retrouve sur deux lignes :
    // soit la meme parcelle saisie deux fois (doublon reel, a supprimer), soit deux
    // parcelles distinctes ayant recu le meme identifiant par erreur de numerotation
    // (a corriger en renumerotant -P1/-P2/... dans l'ordre).
    const reconciliation = reconcilierDoublonsFarmId(rows, polygones);
    state.pendingImport = { cooperative_id: cooperativeId, fileName: file.name, sheetUsed: sheetName, rows: reconciliation.rows, skipped, reconciliation };
    state.modal = { type: 'importPreview' };
    render();
  }catch(err){
    showToast("Impossible de lire ce fichier. Vérifiez qu'il s'agit bien d'un fichier Excel (.xlsx ou .xls).");
  }
}

// Analyse les doublons de Farm ID (identifiant de parcelle) dans les lignes importees.
// Pour chaque Farm ID qui apparait plusieurs fois : si la surface et les coordonnees
// GPS sont identiques sur toutes les lignes concernees, c'est la meme parcelle saisie
// en double -- on ne garde qu'une occurrence. Sinon, ce sont des parcelles distinctes
// qui partagent le meme identifiant par erreur -- on renumerote en sequence (-P1, -P2...)
// a partir de la base commune du Farm ID.
// Analyse un fichier GeoJSON : calcule pour chaque parcelle (feature) sa surface reelle
// et son centroide par un calcul geodesique (Turf.js), plutot que de faire confiance a
// des proprietes eventuellement presentes (souvent absentes ou peu fiables sur les
// fichiers recus -- cf. note de la specification : "souvent juste {Name: ...}").
async function analyserGeojson(file){
  if (typeof turf === 'undefined') return null;
  try{
    const text = await file.text();
    const geojson = JSON.parse(text);
    const features = geojson.features || (geojson.type==='Feature' ? [geojson] : []);
    return features.map((f, idx)=>{
      try{
        const aire_m2 = turf.area(f);
        const centroid = turf.centroid(f);
        const [lon, lat] = centroid.geometry.coordinates;
        return { idx, surface_ha: aire_m2/10000, lat, lon, nomProp: f.properties && (f.properties.Name||f.properties.name||f.properties.PlotID||f.properties.FarmID||f.properties.farm_id) };
      }catch(e){ return null; }
    }).filter(Boolean);
  }catch(e){ return null; }
}

// Distance geodesique en metres entre deux points GPS.
function distanceMetres(lat1, lon1, lat2, lon2){
  if (lat1===''||lon1===''||lat2===''||lon2===''||lat1==null||lon1==null||lat2==null||lon2==null) return Infinity;
  if (typeof turf === 'undefined') return Infinity;
  try{ return turf.distance([Number(lon1),Number(lat1)], [Number(lon2),Number(lat2)], {units:'meters'}); }
  catch(e){ return Infinity; }
}

// Cherche, parmi les polygones du GeoJSON, celui dont le centroide est le plus proche
// des coordonnees declarees dans la ligne du registre -- avec un niveau de confiance
// par tranche de distance (reprend les seuils de la specification : <200m fiable,
// <1km correcte, <5km moyenne, au-dela rejetee).
function trouverMeilleurPolygone(row, polygones){
  if (!polygones || polygones.length===0 || !row.lat || !row.lon) return null;
  let meilleur = null, meilleureDistance = Infinity;
  polygones.forEach(p=>{
    const d = distanceMetres(row.lat, row.lon, p.lat, p.lon);
    if (d < meilleureDistance){ meilleureDistance = d; meilleur = p; }
  });
  if (!meilleur || !isFinite(meilleureDistance)) return null;
  let confiance;
  if (meilleureDistance < 200) confiance = 'fiable';
  else if (meilleureDistance < 1000) confiance = 'correcte';
  else if (meilleureDistance < 5000) confiance = 'moyenne';
  else confiance = 'rejetée';
  const surfaceProche = Math.abs((Number(row.surface_ha)||0) - meilleur.surface_ha) < 0.3;
  return { polygone: meilleur, distance_m: Math.round(meilleureDistance), confiance, surfaceProche };
}

function reconcilierDoublonsFarmId(rows, polygones){
  const parFarmId = {};
  rows.forEach((r,idx)=>{
    const fid = String(r.farm_id||'').trim();
    if (!fid) return;
    if (!parFarmId[fid]) parFarmId[fid] = [];
    parFarmId[fid].push(idx);
  });

  const aSupprimer = new Set();
  const renumerotations = [];
  const conflits = [];
  let doublonsSupprimes = 0;

  Object.entries(parFarmId).forEach(([farmId, idxs])=>{
    if (idxs.length < 2) return;
    const surfaceProche = (a,b)=> Math.abs((Number(a.surface_ha)||0) - (Number(b.surface_ha)||0)) < 0.01;
    const gpsIdentiques = (a,b)=> String(a.lat||'').trim()===String(b.lat||'').trim() && String(a.lon||'').trim()===String(b.lon||'').trim();
    const nomIdentique = (a,b)=> String(a.nom||'').trim().toLowerCase()===String(b.nom||'').trim().toLowerCase();
    const codeIdentique = (a,b)=> a.code && b.code && String(a.code).trim()===String(b.code).trim();

    const premiere = rows[idxs[0]];
    const toutesIdentiques = idxs.every(i => surfaceProche(rows[i], premiere) && gpsIdentiques(rows[i], premiere));

    if (toutesIdentiques){
      idxs.slice(1).forEach(i=>{ aSupprimer.add(i); doublonsSupprimes++; });
      return;
    }

    // Farm ID en double sur des lignes differentes : on ne renumerote en -P1/-P2/...
    // que si c'est bien le MEME producteur (meme nom et/ou meme code) -- ce suffixe
    // designe plusieurs parcelles d'UNE seule personne, jamais un moyen de distinguer
    // deux producteurs differents.
    const memeProducteur = idxs.every(i => nomIdentique(rows[i], premiere) || codeIdentique(rows[i], premiere));

    if (memeProducteur){
      const m = farmId.match(/^(.*?)[-_]?P\d+$/i);
      const base = m ? m[1] : farmId;
      idxs.forEach((i, n)=>{
        const nouveauFarmId = base + '-P' + (n+1);
        if (nouveauFarmId !== rows[i].farm_id){
          renumerotations.push({ ancien: rows[i].farm_id, nouveau: nouveauFarmId, nom: rows[i].nom });
          rows[i].farm_id = nouveauFarmId;
        }
      });
    } else {
      // Producteurs clairement differents partageant le meme Farm ID par erreur de
      // saisie -- jamais de correction automatique du Farm ID ici. Si un GeoJSON est
      // disponible, on l'utilise pour renseigner l'admin sur la parcelle reelle de
      // chacun (surface + coordonnees, cle de rapprochement fiable), sans jamais
      // trancher automatiquement a sa place.
      const analyseGeo = polygones ? idxs.map(i=>({ nom: rows[i].nom, match: trouverMeilleurPolygone(rows[i], polygones) })) : null;
      conflits.push({ farmId, producteurs: idxs.map(i=>({ nom: rows[i].nom, code: rows[i].code })), analyseGeo });
    }
  });

  const cleanedRows = rows.filter((r,idx)=>!aSupprimer.has(idx));
  return { rows: cleanedRows, doublonsSupprimes, renumerotations, conflits };
}

async function confirmImport(){
  const pi = state.pendingImport;
  if (!pi) return;
  const aEnregistrer = [];
  pi.rows.forEach(r=>{
    // La correspondance se fait sur le Farm ID (identifiant de PARCELLE), jamais sur
    // le seul code producteur -- un meme producteur peut avoir plusieurs parcelles
    // (donc plusieurs lignes avec le meme code), et matcher par code ecraserait la
    // premiere parcelle avec les donnees de la seconde. A defaut de Farm ID renseigne,
    // on retombe sur le code, mais uniquement contre d'autres lignes sans Farm ID non plus.
    let existing = null;
    if (r.farm_id){
      existing = state.producteurs.find(p=>p.cooperative_id===pi.cooperative_id && p.farm_id && p.farm_id===r.farm_id);
    } else if (r.code){
      existing = state.producteurs.find(p=>p.cooperative_id===pi.cooperative_id && !p.farm_id && p.code && p.code===r.code);
    }
    const fields = ['nom','surface_ha','rendement_kg_ha','matricule_ccc','lat','lon','farm_id','pays','village_district','first_aggregator','polygon_filename','farm_mapping_date','volume_estime_kg'];
    if (existing){
      fields.forEach(f=>{ existing[f] = r[f]; });
      aEnregistrer.push(existing);
    } else {
      const rec = { id: genId('p'), cooperative_id: pi.cooperative_id, code:r.code };
      fields.forEach(f=>{ rec[f] = r[f]; });
      state.producteurs.push(rec);
      aEnregistrer.push(rec);
    }
  });
  // Deduplique par id avant l'envoi : si le fichier contient deux lignes pour le
  // meme code producteur, le meme enregistrement pourrait sinon se retrouver deux
  // fois dans le tableau, ce que Postgres refuse dans un seul upsert (on garde la
  // derniere occurrence, qui reflete l'etat final apres traitement de toutes les
  // lignes correspondantes).
  const dedupMap = new Map();
  aEnregistrer.forEach(r=> dedupMap.set(r.id, r));
  const aEnregistrerUnique = Array.from(dedupMap.values());
  if (aEnregistrerUnique.length>0){
    const { error } = await supabaseClient.from('producteurs').upsert(aEnregistrerUnique);
    if (error){ showToast('Échec de l\'enregistrement : '+error.message); }
  }

  // Remplacement complet (optionnel, decoche par defaut) : supprime les producteurs
  // de cette cooperative absents de ce fichier -- jamais silencieux, seulement si
  // l'admin a explicitement coche la case dans la fenetre de confirmation.
  const remplacerCheck = document.getElementById('import_remplacer_check');
  let nbSupprimes = 0;
  if (remplacerCheck && remplacerCheck.checked){
    const idsDansFichier = new Set(pi.rows.map(r=>r.farm_id||r.code).filter(Boolean));
    const producteursObsoletes = state.producteurs.filter(p=>p.cooperative_id===pi.cooperative_id && !idsDansFichier.has(p.farm_id||p.code));
    if (producteursObsoletes.length>0){
      const idsASupprimer = producteursObsoletes.map(p=>p.id);
      const delErr = await deleteByIdsBatched('producteurs', idsASupprimer);
      if (delErr){
        showToast('Import enregistré, mais échec de la suppression des producteurs obsolètes : '+delErr.message);
      } else {
        state.producteurs = state.producteurs.filter(p=>!idsASupprimer.includes(p.id));
        nbSupprimes = producteursObsoletes.length;
      }
    }
  }

  state.pendingImport = null;
  closeModal();
  showToast(aEnregistrerUnique.length+' producteur(s) importé(s)/mis à jour'+(nbSupprimes>0?', '+nbSupprimes+' supprimé(s) (absents du fichier)':'')+'.', 'success');
}
function cancelImport(){ state.pendingImport = null; closeModal(); }

function evolutionSvg(achatsSorted, pot){
  const w=380,h=120,padL=36,padR=10,padT=10,padB=22;
  if (achatsSorted.length===0){
    return '<div class="hint">Aucun achat enregistré pour cette période.</div>';
  }
  let cum=0; const pts = achatsSorted.map(a=>{ cum += Number(a.quantite_kg)||0; return cum; });
  const maxY = Math.max(pot||0, cum) * 1.15 || 1;
  const n = pts.length;
  const xStep = n>1 ? (w-padL-padR)/(n-1) : 0;
  const scaleY = (v)=> h-padB - (v/maxY)*(h-padT-padB);
  const coords = pts.map((v,i)=> [padL + (n>1?i*xStep:0), scaleY(v)]);
  const path = coords.map((c,i)=> (i===0?'M':'L')+c[0].toFixed(1)+' '+c[1].toFixed(1)).join(' ');
  const ceilingY = scaleY(pot||0);
  const circles = coords.map(c=>'<circle cx="'+c[0].toFixed(1)+'" cy="'+c[1].toFixed(1)+'" r="2.5" fill="#42693C"/>').join('');
  return '<svg width="100%" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="Évolution des achats cumulés">'
    + (pot>0 ? '<line x1="'+padL+'" y1="'+ceilingY.toFixed(1)+'" x2="'+(w-padR)+'" y2="'+ceilingY.toFixed(1)+'" stroke="#B23B2E" stroke-width="1" stroke-dasharray="4 3"/>'
      + '<text x="'+(w-padR)+'" y="'+(ceilingY-4).toFixed(1)+'" font-size="10" fill="#B23B2E" text-anchor="end" font-family="IBM Plex Mono, monospace">plafond '+fmtKg(pot)+'</text>' : '')
    + '<path d="'+path+'" fill="none" stroke="#42693C" stroke-width="1.6"/>'
    + circles
    + '<text x="'+padL+'" y="'+(h-6)+'" font-size="10" fill="#9A9184" font-family="IBM Plex Mono, monospace">1er achat</text>'
    + '<text x="'+(w-padR)+'" y="'+(h-6)+'" font-size="10" fill="#9A9184" text-anchor="end" font-family="IBM Plex Mono, monospace">dernier</text>'
    + '</svg>';
}

async function telechargerDossierZip(){
  const coopId = fv('dossier_coop_id');
  if (!coopId){ showToast('Choisis une coopérative.'); return; }
  const coop = coopById(coopId);
  const docs = state.docCheck.filter(d=>d.cooperative_id===coopId && d.disponible && d.fichier_path);
  if (docs.length===0){ showToast('Aucun document disponible pour cette coopérative.'); return; }
  if (typeof JSZip === 'undefined'){ showToast("La bibliothèque de compression n'a pas pu se charger (connexion internet requise). Réessaie dans un instant."); return; }
  const btn = document.getElementById('telecharger-zip-btn');
  if (btn){ btn.disabled = true; btn.textContent = 'Préparation du ZIP…'; }
  try{
    const zip = new JSZip();
    const usedNames = new Set();
    let ok = 0;
    for (const d of docs){
      const { data, error } = await supabaseClient.storage.from('documents-coop').download(d.fichier_path);
      if (error){ showToast("Échec du téléchargement de "+(d.fichier_nom||d.doc)+" : "+error.message); continue; }
      let name = d.fichier_nom || (String(d.doc).replace(/[^a-z0-9]+/gi,'_')+'.bin');
      if (usedNames.has(name)){
        const parts = name.split('.');
        const ext = parts.length>1 ? '.'+parts.pop() : '';
        name = parts.join('.') + '_' + d.id + ext;
      }
      usedNames.add(name);
      zip.file(name, data);
      ok++;
    }
    if (ok===0){ showToast("Aucun document n'a pu être récupéré."); if(btn){btn.disabled=false;btn.textContent='Télécharger le ZIP';} return; }
    const blob = await zip.generateAsync({type:'blob'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = 'documents_'+(coop?coop.nom.replace(/[^a-z0-9]+/gi,'_'):coopId)+'.zip';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast(ok+' document(s) regroupé(s) dans le ZIP.', 'success');
    closeModal();
  }catch(e){
    showToast('Erreur : '+e.message);
  }
  if (btn){ btn.disabled = false; btn.textContent = 'Télécharger le ZIP'; }
}

function renderDemandeZipByCoop(typeKey, typeLabel){
  const demandeById = {};
  (state.demandesCoop||[]).forEach(d=>{ demandeById[d.id] = d; });
  const parCoop = {};
  (state.demandeFichiers||[]).forEach(f=>{
    if (f.type!==typeKey) return;
    const d = demandeById[f.demande_id];
    if (!d || d.statut!=='acceptee') return;
    const coop = coopById(d.cooperative_id);
    if (!coop) return;
    if (!parCoop[coop.id]) parCoop[coop.id] = { coop, count: 0 };
    parCoop[coop.id].count++;
  });
  const list = Object.values(parCoop).sort((a,b)=> String(a.coop.nom||'').localeCompare(String(b.coop.nom||''), 'fr', {sensitivity:'base'}));

  let html = '<div class="panel"><div class="panel-head"><h2>Dossier de documents — '+esc(typeLabel)+'</h2></div>';
  if (list.length===0){
    html += '<div class="empty">Aucun document accepté pour ce type pour le moment.</div>';
  } else {
    html += '<div class="checklist-grid">';
    list.forEach(({coop,count})=>{
      html += '<div class="achat-item"><span>'+esc(coop.nom)+' — <span class="num">'+count+' fichier(s)</span></span>'
        + '<div style="display:flex;gap:8px;">'

        + '</div></div>';

}

// Extrait les lignes de livraison ("Delivery Data") de tous les fichiers de traçabilité
// acceptes d'une cooperative, et les compile en un seul CSV. Structure attendue :
// en-tete en ligne 13, donnees a partir de la ligne 14, colonnes C a I (Date, Farmer ID,
// Last Name, First Name, Farm ID, Bags, Quantity in kilos) -- correspond exactement au
// modele "Fiche de lot ECORIGINE" genere cote portail.
async function extraireDonneesTracabilite(coopId, typeKey){
  const coop = coopById(coopId);
  if (typeof XLSX === 'undefined'){ showToast("La bibliothèque de lecture Excel n'a pas pu se charger (connexion internet requise)."); return; }
  const demandeById = {};
  (state.demandesCoop||[]).forEach(d=>{ demandeById[d.id] = d; });
  const fichiers = (state.demandeFichiers||[]).filter(f=>{
    if (f.type!==typeKey) return false;
    const d = demandeById[f.demande_id];
    return d && d.statut==='acceptee' && d.cooperative_id===coopId;
  });
  if (fichiers.length===0){ showToast('Aucun fichier à extraire pour cette coopérative.'); return; }

  const lignes = [];
  for (const f of fichiers){
    try{
      const { data, error } = await supabaseClient.storage.from('documents-coop').download(f.path);
      if (error){ showToast("Échec du téléchargement de "+f.nom+" : "+error.message); continue; }
      const buf = await data.arrayBuffer();
      const wb = XLSX.read(buf, {type:'array', cellDates:true});
      const sheetName = wb.SheetNames.includes('Delivery Data') ? 'Delivery Data' : wb.SheetNames[0];
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], {header:1, defval:''});
      for (let r=13; r<rows.length; r++){
        const row = rows[r] || [];
        const farmerId = row[3]; // colonne D
        if (!farmerId) continue;
        lignes.push({
          fichier: f.nom,
          date: row[2] || '', farmerId, lastname: row[4]||'', firstname: row[5]||'',
          farmId: row[6]||'', bags: row[7]||'', quantiteKg: row[8]||'',
        });
      }
    }catch(e){
      showToast("Échec de la lecture de "+f.nom+" : "+e.message);
    }
  }
  if (lignes.length===0){ showToast('Aucune ligne de livraison trouvée dans les fichiers de cette coopérative.'); return; }

  const entetes = ['Fichier source','Date','Farmer ID','Nom','Prénom','Farm ID','Sacs','Quantité (kg)'];
  const echapper = v => '"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const csvLignes = [entetes.map(echapper).join(',')].concat(
    lignes.map(l=>[l.fichier,l.date,l.farmerId,l.lastname,l.firstname,l.farmId,l.bags,l.quantiteKg].map(echapper).join(','))
  );
  const blob = new Blob(['\uFEFF'+csvLignes.join('\r\n')], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download='tracabilite_'+(coop?coop.nom.replace(/[^a-z0-9]+/gi,'_'):coopId)+'.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
  showToast(lignes.length+' ligne(s) de livraison extraite(s).', 'success');
}

// Verifie, pour une demande de traçabilite en attente de validation, si les
// quantites qu'elle contient feraient depasser le plafond de la periode principale
// (70% du potentiel) a une ou plusieurs parcelles -- en tenant compte de ce qui est
// deja enregistre comme achete pour ce Farm ID. Produit un rapport (pas un blocage
// automatique dans le fichier lui-meme, qui serait contournable) : les depassements
// sont signales avec un motif de rejet pre-rempli, prêt a valider ; les parcelles
// qui atteindraient 50% ou plus sans depasser sont listees separement, comme rappel
// de surveillance en complement du mail d'alerte existant.
async function verifierLimitesFicheTracabilite(demandeId){
  const demande = (state.demandesCoop||[]).find(d=>d.id===demandeId);
  if (!demande){ showToast('Demande introuvable.'); return; }
  const fichierTracabilite = (state.demandeFichiers||[]).find(f=>f.demande_id===demandeId && f.type==='product_movements');
  if (!fichierTracabilite){ showToast('Aucun fichier de traçabilité trouvé pour cette demande.'); return; }

  try{
    const { data: fileBlob, error: dlErr } = await supabaseClient.storage.from('documents-coop').download(fichierTracabilite.path);
    if (dlErr){ showToast('Échec du téléchargement : '+dlErr.message); return; }
    const buf = await fileBlob.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array', cellDates:true});
    const sheetName = wb.SheetNames.includes('Delivery Data') ? 'Delivery Data' : wb.SheetNames[0];
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], {header:1, defval:''});

    // Regroupe par Farm ID : plusieurs lignes pour la meme parcelle dans un seul
    // fichier sont sommees ensemble avant comparaison au plafond.
    const quantitesParFarmId = {};
    for (let r=13; r<rows.length; r++){
      const row = rows[r] || [];
      const farmId = String(row[6]||'').trim();
      const qte = Number(row[8])||0;
      if (!farmId) continue;
      quantitesParFarmId[farmId] = (quantitesParFarmId[farmId]||0) + qte;
    }
    if (Object.keys(quantitesParFarmId).length===0){ showToast('Aucune ligne de livraison exploitable trouvée dans ce fichier.'); return; }

    const campagneId = state.campagneFilter!=='all' ? state.campagneFilter : (state.campagnes[0] ? state.campagnes[0].id : 'all');
    const periode = state.periodeFilter || 'principale';

    const depassements = [], surveillances = [];
    Object.entries(quantitesParFarmId).forEach(([farmId, qteNouvelle])=>{
      const p = state.producteurs.find(x=>x.farm_id===farmId && x.cooperative_id===demande.cooperative_id);
      if (!p){ depassements.push({ farmId, nom:null, code:null, introuvable:true, qteNouvelle }); return; }
      const ceiling = effectiveCeiling(p, campagneId, periode);
      const cumulActuel = cumulAchats(farmId, campagneId, periode);
      const nouveauCumul = cumulActuel + qteNouvelle;
      const pct = ceiling>0 ? (nouveauCumul/ceiling*100) : null;
      const item = { farmId, nom:p.nom, code:p.code, cumulActuel, qteNouvelle, nouveauCumul, ceiling, pct };
      if (ceiling>0 && nouveauCumul>ceiling) depassements.push(item);
      else if (ceiling>0 && pct>=50) surveillances.push(item);
    });

    state.modal = { type:'rapportLimitesTracabilite', payload:{ demandeId, campagneId, periode, depassements, surveillances, fichierNom: fichierTracabilite.nom } };
    render();
  }catch(e){
    showToast('Échec de la vérification : '+e.message);
  }
}

async function telechargerDossierDemandesZip(coopId, typeKey){
  const coop = coopById(coopId);
  const demandeById = {};
  (state.demandesCoop||[]).forEach(d=>{ demandeById[d.id] = d; });
  const fichiers = (state.demandeFichiers||[]).filter(f=>{
    if (f.type!==typeKey) return false;
    const d = demandeById[f.demande_id];
    return d && d.cooperative_id===coopId && d.statut==='acceptee';
  });
  if (fichiers.length===0){ showToast('Aucun document disponible pour cette coopérative.'); return; }
  if (typeof JSZip === 'undefined'){ showToast("La bibliothèque de compression n'a pas pu se charger (connexion internet requise). Réessaie dans un instant."); return; }
  const btn = document.getElementById('dl-demande-zip-'+coopId+'-'+typeKey);
  if (btn){ btn.disabled = true; btn.textContent = 'Préparation…'; }
  try{
    const zip = new JSZip();
    const usedNames = new Set();
    let ok = 0;
    for (const f of fichiers){
      const { data, error } = await supabaseClient.storage.from('documents-coop').download(f.path);
      if (error){ showToast("Échec du téléchargement de "+(f.nom||f.path)+" : "+error.message); continue; }
      let name = f.nom || f.path.split('/').pop();
      if (usedNames.has(name)){
        const parts = name.split('.');
        const ext = parts.length>1 ? '.'+parts.pop() : '';
        name = parts.join('.') + '_' + f.id + ext;
      }
      usedNames.add(name);
      zip.file(name, data);
      ok++;
    }
    if (ok===0){ showToast("Aucun document n'a pu être récupéré."); if(btn){btn.disabled=false;btn.textContent='Télécharger (ZIP)';} return; }
    const blob = await zip.generateAsync({type:'blob'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = 'documents_'+(DEMANDE_TYPE_LABELS[typeKey]||typeKey).replace(/[^a-z0-9]+/gi,'_')+'_'+(coop?coop.nom.replace(/[^a-z0-9]+/gi,'_'):coopId)+'.zip';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast(ok+' document(s) regroupé(s) dans le ZIP.', 'success');
  }catch(e){
    showToast('Erreur : '+e.message);
  }
  if (btn){ btn.disabled = false; btn.textContent = 'Télécharger (ZIP)'; }
}

async function genererEmailManquants(coopId){
  const coop = coopById(coopId); if (!coop) return;
  const emails = [coop.email1, coop.email2, coop.email3].map(e=>String(e||'').trim()).filter(Boolean);
  if (emails.length===0){ showToast("Aucune adresse email enregistrée pour cette coopérative. Ajoute au moins une adresse via 'Modifier'."); return; }
  const missing = missingDocs(coopId);
  if (missing.length===0){ showToast('Tous les documents requis sont marqués disponibles pour cette coopérative.', 'success'); return; }
  const subject = 'Documents manquants — ' + coop.nom;
  const bodyLines = [
    'Bonjour,', '',
    "Dans le cadre du suivi de conformité, il nous manque encore les documents suivants pour " + coop.nom + " :", ''
  ].concat(missing.map((d,i)=> (i+1)+'. '+d)).concat(['', 'Merci de nous les transmettre dès que possible.', '', 'Cordialement,', "L'équipe Durabilité — ECORIGINE"]);
  const body = bodyLines.join('\n');
  showEmailPreview(emails.join(', '), subject, body);
  const recsAMaj = [];
  missing.forEach(doc=>{
    let rec = getDocCheck(coopId, doc);
    if (!rec){ rec = { id: genId('dc'), cooperative_id: coopId, doc, disponible:false, rappels:[] }; state.docCheck.push(rec); }
    rec.rappels.push(new Date().toISOString().slice(0,10));
    recsAMaj.push(rec);
  });
  // Ecriture ciblee sur les seules lignes concernees par ce rappel, jamais une
  // resynchronisation de toute la table.
  const { error } = await supabaseClient.from('doc_check').upsert(recsAMaj);
  if (error){ showToast('Échec de l\'enregistrement du rappel : '+error.message); }
}

function renderMapIfNeeded(){
  const el = document.getElementById('geoMap');
  if (!el || typeof L === 'undefined'){
    if (leafletMapInstance){ leafletMapInstance.remove(); leafletMapInstance = null; }
    return;
  }
  const coopId = state.conformiteCoopFilter;
  const pts = state.producteurs
    .filter(p => coopId==='all' || p.cooperative_id===coopId)
    .filter(p => p.lat!=null && p.lat!=='' && p.lon!=null && p.lon!=='' && !isNaN(Number(p.lat)) && !isNaN(Number(p.lon)))
    .map(p => ({ lat:Number(p.lat), lon:Number(p.lon), nom:p.nom }));
  if (leafletMapInstance){ leafletMapInstance.remove(); leafletMapInstance = null; }
  const center = pts.length>0 ? [pts[0].lat, pts[0].lon] : [7.5399, -5.5471];
  leafletMapInstance = L.map('geoMap').setView(center, pts.length>0?9:6);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap', maxZoom:18 }).addTo(leafletMapInstance);
  pts.forEach(pt=>{
    L.circleMarker([pt.lat, pt.lon], {radius:6, color:'#42693C', fillColor:'#42693C', fillOpacity:0.85, weight:1}).addTo(leafletMapInstance).bindPopup(esc(pt.nom));
  });
  if (pts.length>1){
    leafletMapInstance.fitBounds(L.latLngBounds(pts.map(p=>[p.lat,p.lon])), {padding:[24,24]});
  }
}

function poidsBaseForPrime(a){
  return Number(a.poids_net_produit)>0 ? Number(a.poids_net_produit) : Number(a.quantite_kg)||0;
}
function calcPrime(a){
  const poids = poidsBaseForPrime(a);
  const tauxRA = Number(state.settings.prime_ra)||0;
  const tauxFT = Number(state.settings.prime_ft)||0;
  const t = a.type_cacao || '';
  let taux = 0;
  if (t==='RA') taux = tauxRA;
  else if (t==='Fairtrade') taux = tauxFT;
  else if (t==='RA+FT' || t==='RA+Fairtrade') taux = tauxRA+tauxFT;
  return Math.round(poids*taux);
}

  state.settings.prime_ra = Number(document.getElementById('prime-ra-input').value)||0;

// Coop a-t-elle fourni son document BIC ? Si oui, la retenue ne s'applique pas.
function coopABic(coopId){
  return (state.docCheck||[]).some(d=>d.cooperative_id===coopId && d.doc==='BIC (si disponible)' && d.disponible);
}

// Calcule le montant a payer a la cooperative pour un achat, selon la formule :
// Montant = ((Prix entree usine + TKM + Commission) x Poids) - Retenue BIC
// Le poids utilise est le poids net PAYE (apres analyse/refraction a l'usine)
// une fois connu -- jamais le poids declare au connaissement, qui ne sert qu'a
// un cout de transport theorique, pas au paiement final (poidsBaseForPrime
// applique deja cette priorite, reutilisee ici pour rester coherent avec les primes).
function calcMontantPaiement(a){
  const poids = poidsBaseForPrime(a);
  if (poids<=0) return null;
  const prixEntreeUsine = Number(state.settings.prix_entree_usine)||0;
  const tkm = Number(a.tkm)||0;
  const commission = Number(a.commission)||0;
  const tauxBic = Number(state.settings.taux_bic)||0;
  const aBic = coopABic(a.cooperative_id);
  const retenueBic = aBic ? 0 : Math.round(tauxBic*poids);
  const montant = Math.round(((prixEntreeUsine+tkm+commission)*poids) - retenueBic);
  return { poids, prixEntreeUsine, tkm, commission, tauxBic, retenueBic, aBic, montant };
}

// Enregistre les parametres de calcul (poids net paye, sacs acceptes, prix
// entree usine, TKM deja fige, commission, taux BIC) -- determine le montant a
// payer UNE FOIS ; ne concerne pas encore le paiement effectif (cheques), gere
// separement pour supporter les versements partiels.
// Version simplifiee (campagne 26-27) : seulement date, poids net, sacs et la
// prime calculee automatiquement. Le moteur de calcul du montant a payer
// (calcMontantPaiement, ajouterPaiement, table paiements) reste en place, non
// utilise pour l'instant -- a reactiver plus tard sans tout reconstruire.
async function enregistrerReceptionUsine(){
  const pl = state.modal.payload;
  const a = state.achats.find(x=>x.id===pl.achatId);
  if (!a) return;
  const dateLivraison = fv('fp_date_livraison');
  const poidsNet = Number(fv('fp_poids_net'))||0;
  const sacs = Number(fv('fp_sacs'))||0;
  if (!poidsNet || poidsNet<=0){ showToast('Indique le poids net.'); return; }

  const data = {
    date: dateLivraison || a.date,
    poids_net_produit: poidsNet,
    nombre_sacs_accepte: sacs || null,
  };
  Object.assign(a, data);
  const { error } = await supabaseClient.from('achats').upsert(a);
  if (error){ showToast('Échec de l\'enregistrement : '+error.message); return; }
  showToast('Réception enregistrée.', 'success');
  render();
}

// Ajoute UN versement (cheque) pour cet achat, sans ecraser les versements
// precedents -- permet un paiement partiel suivi plus tard du solde, chacun
// avec sa propre banque/cheque.
async function ajouterPaiement(){
  const pl = state.modal.payload;
  const a = state.achats.find(x=>x.id===pl.achatId);
  if (!a) return;
  const montantPaye = Number(fv('fp_montant_paye'))||0;
  if (!montantPaye || montantPaye<=0){ showToast('Indique le montant payé pour ce versement.'); return; }

  const paiement = {
    id: 'pai_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),
    achat_id: a.id,
    date_paiement: fv('fp_date_paiement') || new Date().toISOString().slice(0,10),
    montant_paye: montantPaye,
    banque: fv('fp_banque').trim() || null,
    libelle_cheque: fv('fp_libelle_cheque').trim() || null,
    numero_cheque: fv('fp_numero_cheque').trim() || null,
  };
  const { error } = await supabaseClient.from('paiements').insert(paiement);
  if (error){ showToast('Échec de l\'enregistrement du versement : '+error.message); return; }
  state.paiements = (state.paiements||[]).concat(paiement);
  showToast('Versement de '+fmtNum(montantPaye)+' FCFA enregistré.', 'success');
  render();
}

function achatsFiltered(){
  const coopId = state.coopFilter;
  const campId = state.campagneFilter;
  const periode = state.periodeFilter;
  return state.achats.filter(a=>{
    if (campId!=='all'){
      if ((a.campagne_id||'')!==campId) return false;
      if (periode==='principale' && a.periode!=='principale') return false;
      if (periode==='intermediaire' && !(a.periode==='principale' || a.periode==='intermediaire')) return false;
    }
    const prod = a.producteur_id ? state.producteurs.find(p=>p.farm_id===a.producteur_id && p.cooperative_id===a.cooperative_id) : null;
    const acoopId = prod ? prod.cooperative_id : a.cooperative_id;
    if (coopId!=='all' && acoopId!==coopId) return false;
    return true;
  });
}

            + fld('Poids net payé', a.poids_net_produit, 'kg')
            // Montant a payer (attestation) desactive pour l'instant, a la
            // demande d'ECORIGINE -- calcMontantPaiement() reste disponible
            // pour une reactivation future, juste plus affiche ici.

          + '</div>'
          + '</div>'
          + '</div>';
      });
    });
  }
  html += '</div>';
  return html;
}

// Fiches de tracabilite envoyees (avec connaissement extrait et enregistre a
// l'envoi) dont aucun achat correspondant n'existe encore -- purement
// comparaison de donnees deja en memoire, aucun re-telechargement necessaire.
function fichesEnAttenteAchat(){
  const achatsConnaissements = new Set((state.achats||[]).map(a=>String(a.connaissement||'').toUpperCase()).filter(Boolean));
  const demandeById = {};
  (state.demandesCoop||[]).forEach(d=>{ demandeById[d.id]=d; });
  return (state.demandeFichiers||[])
    .filter(f=>f.type==='product_movements' && f.connaissement && !achatsConnaissements.has(String(f.connaissement).toUpperCase()))
    .map(f=>{
      const d = demandeById[f.demande_id];
      const coop = d ? coopById(d.cooperative_id) : null;
      return Object.assign({}, f, { coopId: coop?coop.id:null, coopNom: coop?coop.nom:'—' });
    })
    .filter(f=>f.coopId);
}

      + Object.entries(DEMANDE_TYPE_LABELS).map(([k,label])=>{
          const active = state.newDemandeTypes.has(k);
          return '<div onclick="toggleDemandeType(\''+k+'\')" style="cursor:pointer;padding:14px 12px;border-radius:9px;text-align:center;font-size:13px;border:2px solid '+(active?'var(--accent)':'var(--border)')+';background:'+(active?'var(--accent-soft)':'var(--surface)')+';color:'+(active?'var(--accent)':'var(--ink)')+';font-weight:'+(active?'600':'400')+';">'+esc(label)+'</div>';
        }).join('')
      + '</div></div>'
      + '<label class="field">Échéance<input type="date" name="demande_deadline" value="'+esc(nd.demande_deadline||'')+'"></label>'
      + (state.newDemandeTypes.has('autres')
          ? '<label class="field">Document à joindre (optionnel)<input type="file" id="demande_fichier_source_input"></label>'
            + '<div class="field" style="margin:4px 0 14px;"><label style="font-weight:600;font-size:13px;display:block;margin-bottom:6px;">Nature du document joint</label>'
            + '<label style="display:flex;align-items:flex-start;gap:8px;font-weight:400;margin-bottom:6px;cursor:pointer;"><input type="radio" name="demande_doc_nature" value="signer" '+((nd.demande_doc_nature||'signer')==='signer'?'checked':'')+' style="margin-top:3px;"><span>À signer et retourner — la coopérative doit le télécharger, le signer, puis soumettre la version signée en retour (contrat, code de conduite...).</span></label>'
            + '<label style="display:flex;align-items:flex-start;gap:8px;font-weight:400;cursor:pointer;"><input type="radio" name="demande_doc_nature" value="transmettre" '+(nd.demande_doc_nature==='transmettre'?'checked':'')+' style="margin-top:3px;"><span>À transmettre simplement — la coopérative le télécharge pour information, aucun retour n\'est nécessaire.</span></label>'
            + '</div>'
          : '')
      + '<label class="field">Ton nom (affiché à la coopérative)<input type="text" name="demande_demandeur_nom" value="'+esc(nd.demande_demandeur_nom||'')+'" placeholder="ex : Nabi Ouague"></label>'
      + '<label class="field">Message pour la coopérative<textarea name="demande_message" rows="3" placeholder="'+esc(placeholderMessageDemande(state.newDemandeTypes))+'">'+esc(nd.demande_message||'')+'</textarea></label>'
      + '</div>'
      + '<div class="actions"><button class="btn" onclick="closeModal()">Annuler</button><button class="btn btn-primary" onclick="creerDemande()">Créer la demande</button></div>'
      + '</div></div>';
  }

  if (state.modal && state.modal.type==='emailPreview'){
    const pre = state.modal.payload || {};
    const fullText = 'À : '+pre.to+'\nObjet : '+pre.subject+'\n\n'+pre.body;
    html += '<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal">'
      + '<h3>Email prêt à envoyer</h3>'
      + '<div class="hint" style="margin-bottom:10px;">Si votre messagerie ne s\'est pas ouverte automatiquement, copiez ce texte ci-dessous et collez-le dans un nouvel email.</div>'
      + '<label class="field">À<input type="text" readonly value="'+esc(pre.to)+'"></label>'
      + '<label class="field">Objet<input type="text" readonly value="'+esc(pre.subject)+'"></label>'
      + '<label class="field">Message<textarea id="email-preview-full" readonly rows="12" style="width:100%;font-family:inherit;" onclick="this.select()">'+esc(fullText)+'</textarea></label>'
      + '<div class="actions">'
      + '<button type="button" class="btn" onclick="closeModal()">Fermer</button>'
      + '<button type="button" class="btn btn-primary" onclick="copyEmailPreview()">Copier le texte</button>'
      + '</div></div></div>';
  }

  if (state.modal && state.modal.type==='alertQueue'){
    const q = state.modal.payload;
    const coopId = q.ids[q.index];
    const e = buildAlertEmailForCoop(coopId);
    const fullText = e ? ('À : '+e.emails.join(', ')+'\nObjet : '+e.subject+'\n\n'+e.body) : '';
    html += '<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal">'
      + '<h3>Alertes à traiter — '+(q.index+1)+' / '+q.ids.length+'</h3>'
      + (e ? (
        '<div class="hint" style="margin-bottom:10px;">'+esc(e.coop.nom)+' — '+e.count+' producteur(s) concerné(s). Copiez le texte, collez-le dans votre messagerie, puis passez à la suivante.</div>'
        + '<label class="field">À<input type="text" readonly value="'+esc(e.emails.join(', '))+'"></label>'
        + '<label class="field">Objet<input type="text" readonly value="'+esc(e.subject)+'"></label>'
        + '<label class="field">Message<textarea id="email-preview-full" readonly rows="10" style="width:100%;font-family:inherit;" onclick="this.select()">'+esc(fullText)+'</textarea></label>'
      ) : '<div class="hint">Adresse email introuvable pour cette coopérative — passage à la suivante.</div>')
      + '<div class="actions">'
      + '<button type="button" class="btn" onclick="closeModal()">Fermer</button>'
      + (q.index>0 ? '<button type="button" class="btn" onclick="alertQueueGo(-1)">Précédente</button>' : '')
      + (e ? '<button type="button" class="btn btn-primary" onclick="copyEmailPreview()">Copier le texte</button>' : '')
      + '<button type="button" class="btn btn-primary" onclick="alertQueueGo(1)">'+(q.index+1<q.ids.length?'Suivante':'Terminer')+'</button>'
      + '</div></div></div>';
  }

  if (state.modal && state.modal.type==='contratRA'){
    const pl = state.modal.payload;
    const coop = coopById(pl.coopId);
    const volumeRDUEApercu = coop ? fmtNum(Math.round(coopStats(coop.id).potentiel)) : '—';
    html += '<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal">'
      + '<h3>Générer le contrat RA — '+esc(coop?coop.nom:'')+'</h3>'
      + '<div class="hint" style="margin-bottom:10px;">Ces informations sont reprises automatiquement depuis la fiche de la coopérative. Vérifie qu\'elles sont correctes avant de générer :</div>'
      + '<div class="info-grid" style="margin-bottom:14px;background:var(--surface-2);padding:10px;border-radius:8px;">'
      + '<div><span>N° RCCM :</span> '+esc(coop&&coop.rccm?coop.rccm:'⚠ VIDE')+'</div>'
      + '<div><span>N° agrément CCC :</span> '+esc(coop&&coop.ccc_num?coop.ccc_num:'⚠ VIDE')+'</div>'
      + '<div><span>Identifiant de certification :</span> '+esc(coop&&coop.identifiant_certification?coop.identifiant_certification:'⚠ VIDE')+'</div>'
      + '<div><span>Représentant légal :</span> '+esc(coop&&coop.representant_legal_nom?coop.representant_legal_nom:'⚠ VIDE')+'</div>'
      + '<div><span>Ville / Siège social :</span> '+esc(coop?(coop.siege_social||coop.ville||'⚠ VIDE'):'⚠ VIDE')+'</div>'
      + '<div><span>Volume conforme RDUE (potentiel registre) :</span> '+volumeRDUEApercu+' kg</div>'
      + '<div><span>Capacité totale fournisseur (certificat) :</span> '+esc(coop&&coop.volume_certificat?fmtNum(Math.round(coop.volume_certificat))+' kg':'⚠ VIDE')+'</div>'
      + '</div>'
      + '<div id="modal-fields">'
      + '<label class="field">Campagne (libellé court)<input type="text" name="campagne_label" value="'+esc(pl.campagne_label)+'" placeholder="ex : 2026-2027"></label>'
      + '<label class="field">Période (texte affiché)<input type="text" name="periode_label" value="'+esc(pl.periode_label)+'" placeholder="ex : Septembre 2026 à août 2027"></label>'
      + '<label class="field">Date de début du contrat<input type="date" name="date_debut" value="'+esc(pl.date_debut)+'"></label>'
      + '</div>'
      + '<div class="actions">'
      + '<button type="button" class="btn" onclick="closeModal()">Annuler</button>'
      + '<button type="button" class="btn btn-primary" onclick="genererContratRA()">Générer le contrat</button>'
      + '</div></div></div>';
  }

  if (state.modal && state.modal.type==='contratsGroupe'){
    const pl = state.modal.payload;
    html += '<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal wide">'
      + '<h3>Génération de contrats en masse</h3>'
      + '<div class="hint" style="margin-bottom:14px;">Champs communs à toutes les coopératives cochées ci-dessous. Chaque contrat est généré individuellement, puis envoyé à sa coopérative via une demande « Autres documents » — elle devra le télécharger, le signer, et retourner la version signée.</div>'
      + '<div id="modal-fields" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:16px;">'
      + '<label class="field">Campagne<input type="text" name="grp_campagne_label" value="'+esc(pl.campagne_label)+'"></label>'
      + '<label class="field">Période (texte affiché)<input type="text" name="grp_periode_label" value="'+esc(pl.periode_label)+'"></label>'
      + '<label class="field">Date de début du contrat<input type="date" name="grp_date_debut" value="'+esc(pl.date_debut)+'"></label>'
      + '</div>'
      + '<div style="max-height:320px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;">'
      + '<div class="row" style="grid-template-columns:40px 1fr 170px 170px;font-size:11px;text-transform:uppercase;color:var(--ink-faint);font-weight:600;padding:8px 14px;border-bottom:1px solid var(--border);"><div></div><div>Coopérative</div><div>Volume RDUE (kg)</div><div>Capacité certificat (kg)</div></div>'
      + pl.coops.map(c=>{
          const coopC = coopById(c.id);
          const volRDUE = fmtNum(Math.round(coopStats(c.id).potentiel));
          const capaCert = coopC&&coopC.volume_certificat ? fmtNum(Math.round(coopC.volume_certificat)) : '⚠ manquant';
          return '<div class="row" style="grid-template-columns:40px 1fr 170px 170px;padding:8px 14px;">'
          + '<div><input type="checkbox" id="grp_inclus_'+c.id+'" '+(c.inclus?'checked':'')+'></div>'
          + '<div>'+esc(c.nom)+'</div>'
          + '<div class="hint">'+volRDUE+'</div>'
          + '<div class="hint">'+esc(capaCert)+'</div>'
          + '</div>';
        }).join('')
      + '</div>'
      + '<div class="actions" style="margin-top:16px;">'
      + '<button type="button" class="btn" onclick="closeModal()">Annuler</button>'
      + '<button type="button" class="btn btn-primary" onclick="genererContratsGroupe()">Générer et envoyer à toutes</button>'
      + '</div></div></div>';
  }

  if (state.modal && state.modal.type==='nomsComplets'){
    const pl = state.modal.payload;
    html += '<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal wide">'
      + '<h3>Compléter les noms complets</h3>'
      + '<div class="hint" style="margin-bottom:14px;">Proposition automatique : « La Société Coopérative [nom] », sauf ECOPAK (« L\'Entreprise Coopérative »). Vérifie et corrige chaque ligne avant d\'enregistrer — les noms déjà renseignés ne sont pas modifiés ici, mais restent éditables si besoin.</div>'
      + '<div style="max-height:400px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;">'
      + '<div class="row" style="grid-template-columns:180px 1fr;font-size:11px;text-transform:uppercase;color:var(--ink-faint);font-weight:600;padding:8px 14px;border-bottom:1px solid var(--border);"><div>Sigle</div><div>Nom complet</div></div>'
      + pl.coops.map(c=>
          '<div class="row" style="grid-template-columns:180px 1fr;padding:8px 14px;">'
          + '<div>'+esc(c.nom)+'</div>'
          + '<div><input type="text" id="nc_'+c.id+'" value="'+esc(c.propose)+'" style="width:100%;"></div>'
          + '</div>'
        ).join('')
      + '</div>'
      + '<div class="actions" style="margin-top:16px;">'
      + '<button type="button" class="btn" onclick="closeModal()">Annuler</button>'
      + '<button type="button" class="btn btn-primary" onclick="enregistrerNomsComplets()">Enregistrer tout</button>'
      + '</div></div></div>';
  }

  app.innerHTML = html;
  renderMapIfNeeded();
}

async function checkForUpdates(){
  try{
    const resp = await fetch(window.location.pathname + '?_v=' + Date.now(), { cache: 'no-store' });
    if (!resp.ok) return;
    const text = await resp.text();
    const m = text.match(/const APP_VERSION = '([^']+)'/);
    if (m && m[1] !== APP_VERSION){
      const banner = document.getElementById('update-banner');
      if (banner) banner.style.display = 'flex';
    }
  }catch(e){ /* pas grave -- on retentera plus tard */ }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState==='visible') checkForUpdates(); });
setInterval(checkForUpdates, 3*60*1000);

initAuth();
</script>
