<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ECORIGINE — Plateforme de traçabilité cacao</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{
    --bg:#F5F6F5; --surface:#FFFFFF; --surface-2:#F7F8F6;
    --ink:#1E2B29; --ink-soft:#5B6B68; --ink-faint:#93A19E;
    --accent:#1F6E5C; --accent-soft:#E3F0EB; --accent-line:#A9CFC1;
    --border:#E2E6E4;
    --teal:#0E3B36; --teal-dark:#092A26; --teal-mid:#12463F;
    --gold:#F2B705; --gold-ink:#2A1E00;
    --ok:#2E7D46; --ok-bg:#E6F4EA; --ok-line:#B7DEC0;
    --warn:#B8720A; --warn-bg:#FCEFD9; --warn-line:#F0CE94;
    --info:#2C5FAE; --info-bg:#E7EEFA; --info-line:#B9CBEF;
    --danger:#B3261E; --danger-bg:#FBE7E4; --danger-line:#E9B2AB;
    --gray-bg:#EDEEEC;
    --sans:'IBM Plex Sans', system-ui, sans-serif;
    --mono:'IBM Plex Mono', ui-monospace, monospace;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;}
  .app-shell{display:flex;min-height:100vh;}
  .sidebar{width:86px;flex-shrink:0;background:var(--teal);display:flex;flex-direction:column;align-items:center;padding:20px 0 16px;}
  .sidebar .logo-badge{width:36px;height:36px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:2px;}
  .sidebar .logo-badge img{width:26px;height:26px;object-fit:contain;}
  .sidebar .brand-name{color:#fff;font-size:9.5px;font-weight:700;letter-spacing:0.05em;margin:6px 0 22px;text-align:center;}
  .sidebar-nav{display:flex;flex-direction:column;gap:4px;width:100%;}
  .sidebar-nav-item{display:flex;flex-direction:column;align-items:center;gap:5px;padding:11px 4px;cursor:pointer;color:rgba(255,255,255,0.62);font-size:10px;text-align:center;border-left:3px solid transparent;line-height:1.25;background:none;border-top:none;border-right:none;border-bottom:none;width:100%;font-family:inherit;position:relative;}
  .nav-badge{position:absolute;top:6px;right:10px;background:var(--gold);color:var(--teal);font-size:10px;font-weight:700;border-radius:9px;min-width:16px;height:16px;display:flex;align-items:center;justify-content:center;padding:0 4px;line-height:1;}
  .sidebar-nav-item svg{width:18px;height:18px;}
  .sidebar-nav-item:hover{color:#fff;}
  .sidebar-nav-item.active{color:#fff;background:rgba(255,255,255,0.08);border-left-color:var(--gold);}
  .main-area{flex:1;min-width:0;}
  .top-utility{display:flex;justify-content:flex-end;align-items:center;gap:16px;padding:16px 24px 0;}
  .top-utility .coop-name{margin-right:auto;font-size:13px;color:var(--ink-soft);}
  .top-utility .coop-name strong{color:var(--ink);}
  .top-utility .user-chip{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-soft);cursor:pointer;border:none;background:none;font-family:inherit;}
  .top-utility .avatar{width:26px;height:26px;border-radius:50%;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;flex-shrink:0;}
  #app{}
  .wrap{max-width:100%;padding:18px 32px 60px;}
  .top{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:16px;margin-bottom:14px;}
  .top h1{font-size:20px;font-weight:600;margin:0 0 4px;letter-spacing:-0.01em;}
  .top .sub{font-size:13px;color:var(--ink-soft);margin:0;max-width:560px;}
  .tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:20px;flex-wrap:wrap;}
  .tab-btn{font-family:var(--sans);font-size:13.5px;font-weight:500;padding:10px 4px;margin-right:24px;border:none;background:none;color:var(--ink-soft);cursor:pointer;border-bottom:2px solid transparent;}
  .tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);}
  .controls{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:20px;}
  .campaign-selector{margin-bottom:20px;}
  .campaign-selector-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .campaign-selector-head h2{font-size:15px;font-weight:600;margin:0;}
  .campaign-chips{display:flex;gap:8px;flex-wrap:wrap;}
  .campaign-chip{padding:10px 18px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--ink);font-size:13px;font-weight:600;cursor:pointer;}
  .campaign-chip:hover{border-color:var(--ink-faint);}
  .campaign-chip.active{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);}
  select, input[type=number], input[type=text], input[type=date], input[type=email]{
    font-family:var(--sans);font-size:13px;padding:7px 10px;border:1px solid var(--border);
    border-radius:8px;background:var(--surface);color:var(--ink);
  }
  label.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink-soft);}
  fieldset{border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin:0;}
  fieldset legend{font-size:11.5px;color:var(--ink-soft);padding:0 4px;}
  fieldset .field{margin-bottom:8px;}
  fieldset .field:last-child{margin-bottom:0;}
  .btn{font-family:var(--sans);font-size:13px;font-weight:500;padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--ink);cursor:pointer;}
  .btn:hover{border-color:var(--ink-faint);}
  .btn-primary{background:var(--gold);color:var(--gold-ink);border-color:var(--gold);font-weight:700;text-transform:uppercase;letter-spacing:0.02em;font-size:12.5px;}
  .btn-primary:hover{opacity:0.9;}
  .btn-teal{border:1px solid var(--accent-line);background:var(--accent-soft);color:var(--accent);font-weight:600;}
  .btn-teal:hover{background:#D9EBE3;}
  .btn:disabled{opacity:0.5;cursor:not-allowed;}
  .btn-ghost{border:none;background:none;color:var(--accent);padding:6px 8px;font-size:12.5px;white-space:nowrap;cursor:pointer;}
  .btn-danger-text{border:none;background:none;color:var(--danger);font-size:12px;cursor:pointer;padding:2px 4px;white-space:nowrap;}

  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;}
  .card .label{font-size:12px;color:var(--ink-soft);margin-bottom:6px;}
  .card .value{font-family:var(--mono);font-size:22px;font-weight:500;}
  .card.alert .value{color:var(--danger);}

  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:20px;}
  .panel-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:8px;}
  .panel-head h2{font-size:15px;font-weight:600;margin:0;}
  .panel-note{padding:10px 18px;font-size:12px;color:var(--ink-faint);border-bottom:1px solid var(--border);background:var(--surface-2);}
  .group-header{padding:9px 18px;font-size:12.5px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-bottom:1px solid var(--border);}

  .row{display:grid;grid-template-columns:2fr 1fr 1fr 1.4fr 1fr auto;gap:14px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--border);}
  .row.coop-row{grid-template-columns:2fr 1fr 1fr 1fr auto;}
  .coop-columns{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start;}
  .coop-card-list{padding:14px 16px;}
  .coop-card{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;margin-bottom:12px;}
  .coop-card:last-child{margin-bottom:0;}
  .coop-card.unverified{border-color:var(--warn-line);}
  .coop-card-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:4px;}
  .coop-card-name{font-size:15px;font-weight:600;line-height:1.3;}
  .coop-card-name .coop-card-ccc{font-size:11.5px;font-weight:400;color:var(--ink-faint);}
  .verified-badge{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;background:var(--accent);color:#fff;font-size:10px;line-height:1;vertical-align:middle;margin-left:2px;}
  .coop-card-cert{font-size:12.5px;color:var(--ink-soft);margin-bottom:12px;}
  .coop-card-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;padding:12px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin-bottom:12px;}
  .coop-card-stats > div{display:flex;flex-direction:column;gap:3px;}
  .coop-card-stats .lbl{font-size:10.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.03em;font-weight:600;}
  .coop-card-stats .val{font-family:var(--mono);font-size:13.5px;font-weight:500;color:var(--ink);}
  .coop-card-actions{display:flex;flex-wrap:wrap;gap:6px;}
  @media (max-width:900px){ .coop-columns{grid-template-columns:1fr;} }
  .row.achat-row{grid-template-columns:1.8fr 1.1fr 1fr 1fr 1fr 0.7fr auto;}
  .achat-card{padding:14px 18px;border-bottom:1px solid var(--border);}
  .achat-card:last-child{border-bottom:none;}
  .achat-card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
  .achat-compare{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .achat-compare-col{border:1px solid var(--border);border-radius:8px;padding:10px 12px;background:var(--surface-2);}
  .achat-compare-col.pending{opacity:0.75;}
  .achat-compare-col h4{font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-faint);margin:0 0 8px;font-weight:600;}
  .achat-field{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;padding:3px 0;gap:10px;}
  .achat-field .lbl{color:var(--ink-soft);}
  .achat-field .val{font-family:var(--mono);font-weight:500;white-space:nowrap;}
  .achat-field .val.empty{color:var(--ink-faint);font-family:var(--sans);font-weight:400;font-style:italic;}
  .row:last-child{border-bottom:none;}
  .row-head{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-faint);background:var(--surface-2);}
  .stat-label{display:none;}
  .p-name .name{font-weight:500;}
  .p-name .coop{font-size:12px;color:var(--ink-soft);}
  .num{font-family:var(--mono);font-size:13.5px;}
  .bar-wrap{display:flex;flex-direction:column;gap:4px;}
  .bar-track{position:relative;height:8px;border-radius:6px;background:var(--gray-bg);overflow:visible;}
  .bar-fill{height:100%;border-radius:6px;}
  .bar-pct{font-family:var(--mono);font-size:12px;color:var(--ink-soft);}
  .badge{display:inline-block;font-size:11.5px;font-weight:500;padding:3px 9px;border-radius:20px;white-space:nowrap;}
  .badge.ok{background:var(--ok-bg);color:var(--ok);}
  .badge.warn{background:var(--warn-bg);color:var(--warn);}
  .badge.danger{background:var(--danger-bg);color:var(--danger);}
  .badge.neutral{background:var(--gray-bg);color:var(--ink-soft);}
  .badge.info{background:#E7EEFA;color:#2C5FAE;}
  .row-actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}

  .detail{background:var(--surface-2);padding:16px 18px 20px;border-bottom:1px solid var(--border);}
  .detail-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:24px;}
  .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;font-size:12.5px;margin-bottom:14px;}
  .info-grid div span{color:var(--ink-soft);}
  .achat-list{border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--surface);}
  .achat-item{display:flex;justify-content:space-between;align-items:center;padding:9px 14px;font-size:13px;border-bottom:1px solid var(--border);gap:10px;flex-wrap:wrap;}
  .achat-item:last-child{border-bottom:none;}
  .achat-item .num{color:var(--ink);}
  .nc-item{border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin:0 18px 12px;background:var(--surface-2);}
  .nc-item:last-child{margin-bottom:18px;}
  .empty{padding:40px 20px;text-align:center;color:var(--ink-soft);}
  .empty .btn{margin-top:10px;}

  .modal-overlay{position:fixed;inset:0;background:rgba(36,31,25,0.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .modal{background:var(--surface);border-radius:12px;padding:22px 24px;width:100%;max-width:460px;max-height:86vh;overflow:auto;}
  .modal.wide{max-width:600px;}
  .modal h3{margin:0 0 16px;font-size:16px;font-weight:600;}
  .modal form{display:flex;flex-direction:column;gap:12px;}
  .modal .field input, .modal .field select{width:100%;}
  .modal .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:6px;}
  .hint{font-size:11px;color:var(--ink-faint);}
  .error-banner{background:var(--danger-bg);color:var(--danger);border:1px solid var(--danger-line);border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;}
  .toast{position:sticky;top:10px;z-index:60;border-radius:8px;padding:12px 16px;font-size:13.5px;font-weight:500;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;gap:12px;box-shadow:0 4px 16px rgba(0,0,0,0.12);}
  .toast.error{background:var(--danger-bg);color:var(--danger);border:1px solid var(--danger-line);}
  .toast.success{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok-line);}
  .toast button.close{background:none;border:none;font-size:16px;cursor:pointer;color:inherit;line-height:1;padding:0 4px;}
  .loading{padding:60px 0;text-align:center;color:var(--ink-soft);font-size:14px;}
  .login-screen{min-height:100vh;width:100%;background:var(--teal);background-image:radial-gradient(circle at 15% 20%, rgba(255,255,255,0.04) 0, transparent 45%),radial-gradient(circle at 85% 80%, rgba(255,255,255,0.04) 0, transparent 45%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;}
  .login-lockup{display:flex;align-items:center;gap:12px;margin-bottom:24px;}
  .login-lockup .badge-logo{width:42px;height:42px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;}
  .login-lockup .badge-logo img{width:30px;height:30px;object-fit:contain;}
  .login-lockup .name{color:#fff;font-weight:800;font-size:19px;letter-spacing:0.02em;}
  .login-lockup .tagline{color:rgba(255,255,255,0.65);font-size:12px;margin-top:1px;}
  .login-box{background:var(--surface);border:none;border-radius:14px;padding:34px 32px 30px;width:100%;max-width:380px;box-shadow:0 20px 50px rgba(0,0,0,0.28);text-align:center;}
  .login-box h2{margin:0 0 18px;font-size:15px;color:var(--teal);text-transform:uppercase;letter-spacing:0.04em;font-weight:800;}
  .footer-note{font-size:11.5px;color:var(--ink-faint);margin-top:18px;text-align:right;}
  .footer-note button{background:none;border:none;color:var(--ink-faint);text-decoration:underline;cursor:pointer;font-size:11.5px;padding:0;}
  .preview-table{border:1px solid var(--border);border-radius:8px;overflow:hidden;margin:12px 0;}
  .preview-row{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px;padding:7px 10px;font-size:12.5px;border-bottom:1px solid var(--border);}
  .preview-row:last-child{border-bottom:none;}
  .preview-head{background:var(--surface-2);font-weight:500;color:var(--ink-soft);font-size:11px;text-transform:uppercase;}
  .check-item{display:flex;justify-content:space-between;align-items:center;padding:10px 18px;font-size:13.5px;border-bottom:1px solid var(--border);gap:10px;}
  .checklist-grid{display:grid;grid-template-columns:1fr 1fr;}
  .checklist-grid > *:nth-child(even){border-left:1px solid var(--border);}
  @media (max-width:820px){ .checklist-grid{grid-template-columns:1fr;} .checklist-grid > *:nth-child(even){border-left:none;} }
  .check-item:last-child{border-bottom:none;}
  .check-item label{display:flex;align-items:center;gap:10px;cursor:pointer;flex:1;}
  .check-item input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);}

  @media (max-width:820px){
    .cards{grid-template-columns:repeat(2,1fr);}
    .row-head{display:none;}
    .row{grid-template-columns:1fr;gap:8px;padding:14px;}
    .row.coop-row{grid-template-columns:1fr;}
    .row.achat-row{grid-template-columns:1fr;}
    .achat-compare{grid-template-columns:1fr;}
    .stat-label{display:inline;font-size:11px;color:var(--ink-faint);margin-right:6px;}
    .row-actions{justify-content:flex-start;}
    .detail-grid{grid-template-columns:1fr;}
    .info-grid{grid-template-columns:1fr;}
    .preview-row{grid-template-columns:1fr 1fr;}
  }
</style>
</head>
<body>
<div id="update-banner" style="display:none;position:fixed;top:0;left:0;right:0;z-index:999;background:var(--accent);color:#fff;padding:10px 18px;font-size:13.5px;justify-content:center;align-items:center;gap:16px;">
  <span>⟳ Une nouvelle version de la plateforme est disponible.</span>
  <button onclick="location.reload()" style="background:#fff;color:var(--accent);border:none;border-radius:6px;padding:5px 14px;font-weight:600;cursor:pointer;">Actualiser maintenant</button>
</div>
<div id="app"><div class="loading">Chargement des données…</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docx@8.5/build/index.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Turf.js/6.5.0/turf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const KEY_COOP = 'ecorigine_cooperatives';
const KEY_PROD = 'ecorigine_producteurs';
const KEY_ACHATS = 'ecorigine_achats';
const KEY_SETTINGS = 'ecorigine_settings';
const KEY_DOCCHECK = 'ecorigine_doc_checklist';
const KEY_NONCONF = 'ecorigine_nonconformites';
const KEY_CAMPAGNES = 'ecorigine_campagnes';

// Colonnes alignées sur le modele fourni (feuille "3. Farm-Farmer Data")
const NOM_KEYS = ['farmer name','nom du producteur','nom producteur','producteur','nom','name'];
const CODE_KEYS = ['farmer id','code producteur','code_producteur','id producteur','code','id'];
const FARMID_KEYS = ['farm id'];
const PAYS_KEYS = ['country','pays'];
const VILLAGE_KEYS = ['village, district','village','district','region'];
const MATRICULE_KEYS = ['national traceability id','traceability id','matricule ccc','matricule_ccc','matricule','code ccc'];
const AGGREGATOR_KEYS = ['agrregator name','aggregator name','first aggregator','aggregator','premier agregateur'];
const POLYGON_KEYS = ['boundary polygon','polygon'];
const MAPDATE_KEYS = ['mapping date'];
const SURFACE_KEYS = ['farm size','surface ha','surface (ha)','surface_ha','superficie ha','superficie (ha)','superficie','surface'];
const VOLUME_KEYS = ['estimated volume','volume per farm','volume estime','volume estimé'];
const RENDEMENT_KEYS = ['rendement kg/ha','rendement (kg/ha)','rendement_kg_ha','rendement estime','rendement estime (kg/ha)','rendement estimé','rendement estimé (kg/ha)','rendement'];
const LAT_KEYS = ['lat for geopoint','latitude','coordonnee y','coordonnée y','lat'];
const LON_KEYS = ['long for geopoint','longitude','coordonnee x','coordonnée x','long','lon'];

// Colonnes pour l'import du fichier de tracabilite (livraisons)
const LIV_CODE_KEYS = ['farmer id','code producteur','code'];
const LIV_DATE_KEYS = ["date d'emission",'date emission','date de livraison','date'];
const LIV_POIDS_KEYS = ['poids livre','poids livré','poids','quantite livree','quantite','weight','kg'];
const LIV_SACS_KEYS = ['nombre de sacs','nb sacs','sacs','bags'];
const LIV_CONN_KEYS = ['numero de connaissement','numero connaissement','connaissement','waybill','bl number'];
const PLAFOND_PRINCIPALE = 0.70;   // plafond pendant la campagne principale
const PLAFOND_ANNUEL = 1.00;       // plafond cumule (principale + intermediaire), continuite sur l'annee

const DOCS_REQUIS = [
  'Registre de commerce',
  'Délégation de pouvoir',
  'BIC (si disponible)',
  'Journal officiel',
  'DFE',
  "Attestation d'agrément",
  'ARF (Attestation de Régularité Fiscale)',

function genId(prefix){
  return prefix + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,7);
}
function esc(str){
  return String(str==null?'':str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function showEmailPreview(to, subject, body){
  state.modal = {type:'emailPreview', payload:{to, subject, body}};
  render();
  // tentative discrete d'ouverture directe du client mail, sans dependre de son succes
  try { window.open('mailto:'+to+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body), '_blank'); } catch(e){}
}
function copyEmailPreview(){
  const ta = document.getElementById('email-preview-full');
  if (ta){
    ta.select();
    ta.setSelectionRange(0, 999999);
    try {
      document.execCommand('copy');
      showToast('Copié dans le presse-papiers.', 'success');
    } catch(e){
      showToast("Impossible de copier automatiquement — sélectionnez le texte et faites Ctrl+C (Cmd+C sur Mac).");
    }
  }
}

const PORTAIL_URL = 'https://nabiouague-cpu.github.io/eco-traca/portail.html';

function buildNouvelleDemandeEmail(demande, coop){
  const emails = [coop.email1, coop.email2, coop.email3].map(e=>String(e||'').trim()).filter(Boolean);
  const types = (demande.types||[]).map(t=>DEMANDE_TYPE_LABELS[t]||t).join(', ');
  const echeance = demande.deadline ? new Date(demande.deadline+'T00:00:00').toLocaleDateString('fr-FR') : null;
  const lien = PORTAIL_URL + '?demande=' + demande.id;
  const subject = 'Action requise — ' + demande.name + ' — ' + coop.nom;
  const bodyLines = [
    'Bonjour,', '',
    'ECORIGINE vous a adressé une nouvelle demande de données pour '+coop.nom+' :', '',
    'Nom de la demande : '+demande.name,
    'Type(s) de données : '+types,
    (echeance ? 'Échéance : '+echeance : null),
    '',
    (demande.message ? '« '+demande.message+' »' : null),
    (demande.message ? '' : null),
    'Merci de vous connecter à votre portail coopérative pour consulter le détail et transmettre les informations demandées :',
    lien, '',
    "Besoin d'aide ? Contactez nabi.ouague@ecorigine.ci", '',
    'Cordialement,', "L'équipe ECORIGINE",
  ].filter(l=>l!==null);
  return { coop, emails, subject, body: bodyLines.join('\n'), lien };
}

function buildAlertEmailForCoop(coopId){
  const coop = coopById(coopId);
  if (!coop) return null;
  const emails = [coop.email1, coop.email2, coop.email3].map(e=>String(e||'').trim()).filter(Boolean);
  const rows = computeRows();
  const concerned = rows.filter(x=> x.p.cooperative_id===coopId && (x.st.key==='warn' || x.st.key==='danger'));
  if (concerned.length===0) return null;
  const r0 = concerned[0];
  const label = r0.periode==='principale' ? "50% et plus de leur potentiel — plafond de la campagne principale fixé à 70%"
    : r0.periode==='intermediaire' ? "un niveau élevé du plafond cumulé sur l'année (principale + intermédiaire, 100%)"
    : 'un niveau élevé de leur potentiel de production estimé';
  const subject = 'Alerte livraisons — ' + concerned.length + ' producteur(s) — ' + coop.nom;
  const bodyLines = [
    'Bonjour,', '',
    'Les producteurs suivants ont atteint '+label+' :', '',
    buildTexteTableau(concerned), '',
    'Merci de vérifier ces situations avec les producteurs concernés, notamment ceux en dépassement.', '',
    'Cordialement,', "L'équipe Durabilité — ECORIGINE"
  ];
  return { coop, emails, count: concerned.length, subject, body: bodyLines.join('\n') };
}

function pendingAlertCoopIds(){
  const rows = computeRows();
  const ids = new Set();
  rows.forEach(r=>{ if (r.st.key==='warn'||r.st.key==='danger') ids.add(r.p.cooperative_id); });
  return Array.from(ids).filter(id=>{
    const e = buildAlertEmailForCoop(id);
    return e && e.emails.length>0;
  });
}

function openAlertQueue(){
  const ids = pendingAlertCoopIds();
  if (ids.length===0){ showToast("Aucune coopérative en alerte n'a d'adresse email enregistrée pour le moment.", 'success'); return; }
  state.modal = {type:'alertQueue', payload:{ids, index:0}};
  render();
}
function alertQueueGo(delta){
  const m = state.modal;
  if (!m || m.type!=='alertQueue') return;
  const next = m.payload.index + delta;
  if (next < 0 || next >= m.payload.ids.length){ closeModal(); return; }
  m.payload.index = next;
  render();
}

function openContratRAModal(coopId){
  const coop = coopById(coopId);
  if (!coop) return;
  if (coop.statut==='Non certifiée'){ showToast("Cette coopérative n'est pas certifiée."); return; }
  const missing = [];
  if (!coop.rccm) missing.push('N° RCCM');
  if (!coop.ccc_num) missing.push('N° agrément CCC');
  if (!coop.identifiant_certification) missing.push('Identifiant de certification');
  if (!coop.representant_legal_nom) missing.push('Nom du représentant légal');
  if (!coop.siege_social && !coop.ville) missing.push('Ville ou Siège social');
  if (missing.length>0){
    showToast('Champs manquants pour générer le contrat : '+missing.join(', ')+'. Complète la fiche coopérative (Modifier) avant de continuer.');
    return;
  }
  state.modal = {type:'contratRA', payload:{coopId, campagne_label:'2026-2027', periode_label:'Septembre 2026 à août 2027', date_debut:'2026-09-01', volume:''}};
  render();
}

function fonctionRepresentantFor(nom){
  const n = String(nom||'').trim().toUpperCase();
  if (n.startsWith('COOP-CA') || n.includes('COOP-CA')) return 'Président du Conseil d\'Administration';
  if (n.startsWith('SCOOPS') || n.includes('SCOOPS')) return 'Président du Comité de gestion';
  return 'Représentant légal';
}

function genererContratRA(){
  const m = state.modal;
  if (!m || m.type!=='contratRA') return;
  const coop = coopById(m.payload.coopId);
  if (!coop) return;
  const campagne_label = fv('campagne_label').trim() || '—';
  const periode_label = fv('periode_label').trim() || '—';
  const date_debut_raw = fv('date_debut');
  const volume = fv('volume').trim();
  if (!volume){ showToast('Indique le volume contractuel.'); return; }
  if (typeof docx === 'undefined'){ showToast("La bibliothèque de génération Word n'a pas pu se charger (connexion internet requise). Réessaie dans un instant."); return; }
  const dateDebut = date_debut_raw ? new Date(date_debut_raw+'T00:00:00').toLocaleDateString('fr-FR') : '—';
  const capaciteTotale = fmtNum(Math.round(coopStats(coop.id).potentiel)) + ' kg (potentiel estimé cumulé)';
  const fonctionRepresentant = fonctionRepresentantFor(coop.nom);
  construireContratDocxBlob(coop, campagne_label, periode_label, dateDebut, volume, capaciteTotale, fonctionRepresentant).then(blob=>{
    const url = URL.createObjectURL(blob);
    const aTag = document.createElement('a');
    aTag.href = url;
    aTag.download = 'Contrat_'+(coop.certifications==='Fairtrade'?'FT':coop.certifications==='Cocoa Horizon'?'CH':'RA')+'_'+coop.nom.replace(/[^a-z0-9]+/gi,'_')+'_'+campagne_label.replace(/[^a-z0-9]+/gi,'_')+'.docx';
    document.body.appendChild(aTag); aTag.click(); document.body.removeChild(aTag);
    URL.revokeObjectURL(url);
    showToast('Contrat Word généré et téléchargé.', 'success');
    closeModal();
  }).catch(err=>{
    showToast("Erreur lors de la génération du contrat Word : "+err.message);
  });
}

// Construit le document Word du contrat -- reutilisable en generation individuelle (telechargement local)
// ou en generation groupee (upload + creation d'une demande "Autres documents" par cooperative).
function construireContratDocxBlob(coop, campagne_label, periode_label, dateDebut, volume, capaciteTotale, fonctionRepresentant){
  const { Document, Packer, Paragraph, TextRun, AlignmentType, LevelFormat, Table, TableRow, TableCell, WidthType, ShadingType, BorderStyle, VerticalAlign, Header, Footer, PageNumber, ImageRun } = docx;

  const INK="1A1A1A", ACCENT="42693C", SOFT_GRAY="5A5A5A", BORDER="A9BBA3", HEAD_FILL="42693C", FONT="Times New Roman";
  function run(text, opts){ opts=opts||{}; return new TextRun({ text:String(text==null?'':text), font:FONT, size:22, bold:!!opts.bold, italics:!!opts.italics, color: opts.color||INK }); }
  function p(children, opts){ opts=opts||{}; return new Paragraph({ spacing:Object.assign({after:160, line:300}, opts.spacing||{}), alignment: opts.align || AlignmentType.JUSTIFIED, children }); }
  function artTitle(num, title){ return new Paragraph({ spacing:{before:340, after:180}, children:[ new TextRun({ text:'Article '+num+' — '+title, font:FONT, size:24, bold:true, color:ACCENT }) ] }); }
  function subArt(text){ return new Paragraph({ spacing:{before:140, after:120}, children:[ new TextRun({ text, font:FONT, size:22, bold:true, color:INK }) ] }); }
  function bullet(text){ return new Paragraph({ numbering:{reference:"main-bullets", level:0}, spacing:{after:110, line:290}, alignment:AlignmentType.JUSTIFIED, children:[run(text)] }); }
  function spacer(h){ return new Paragraph({spacing:{after:h||120}, children:[]}); }

// Propose un nom complet selon la regle : "La Societe Cooperative [nom]" par defaut.
// Deux cas connus sont traites en exception avec leur vrai nom (les sigles etant des
// acronymes qui ne reprennent pas les mots du nom reel, la regle generique ne peut
// pas les deviner correctement). Pour toutes les autres cooperatives, c'est une
// proposition de depart a verifier/corriger -- jamais une valeur figee.
const NOMS_COMPLETS_CONNUS = {
  'SCOOPS ECOPAK': "L'Entreprise Coopérative des Producteurs Agricoles de Kouan-Houlé",
  'SCOOPS UM': 'La Société Coopérative Unité de Mahapleu',
};
function normaliserSigle(s){ return String(s||'').toUpperCase().replace(/[\s\-_]+/g,' ').trim(); }
function proposerNomComplet(coop){
  if (coop.nom_complet) return coop.nom_complet;
  const nom = String(coop.nom||'').trim();
  const connu = NOMS_COMPLETS_CONNUS[normaliserSigle(nom)];
  if (connu) return connu;
  let core = nom
    .replace(/^(SCOOPS|COOP-CA|COOPCA)[\s\-_]*/i, '')
    .replace(/[\s\-_]*(COOP-CA|COOPCA)$/i, '')
    .trim();
  if (!core) core = nom;
  const isEcopak = /ECOPAK/i.test(nom);
  const determinant = isEcopak ? "L'Entreprise Coopérative" : 'La Société Coopérative';
  return determinant + ' ' + core;
}

function ouvrirCompletionNomsComplets(){
  if (state.cooperatives.length===0){ showToast('Aucune coopérative enregistrée.'); return; }
  const coops = state.cooperatives.slice()
    .sort((a,b)=>String(a.nom||'').localeCompare(String(b.nom||''),'fr',{sensitivity:'base'}))
    .map(c=>({ id:c.id, nom:c.nom, propose: proposerNomComplet(c) }));
  state.modal = {type:'nomsComplets', payload:{ coops }};
  render();
}

async function enregistrerNomsComplets(){
  const m = state.modal;
  if (!m || m.type!=='nomsComplets') return;
  const coopsAMaj = [];
  m.payload.coops.forEach(ligne=>{
    const input = document.getElementById('nc_'+ligne.id);
    if (!input) return;
    const val = input.value.trim();
    const coop = coopById(ligne.id);
    if (coop && val && coop.nom_complet !== val){
      coop.nom_complet = val;
      coopsAMaj.push({ id: coop.id, nom_complet: val });
    }
  });
  if (coopsAMaj.length===0){ showToast('Aucune modification à enregistrer.'); return; }
  // Ecriture ciblee sur les seules fiches modifiees, jamais une resynchronisation
  // de toute la table cooperatives.
  const { error } = await supabaseClient.from('cooperatives').upsert(coopsAMaj);
  if (!error){
    showToast(coopsAMaj.length+' nom(s) complet(s) enregistré(s).', 'success');
    closeModal();
  } else {
    showToast('Échec de la mise à jour : '+error.message);
  }
}

  if (!m || m.type!=='contratsGroupe') return;
  const campagne_label = fv('grp_campagne_label').trim() || '—';
  const periode_label = fv('grp_periode_label').trim() || '—';
  const date_debut_raw = fv('grp_date_debut');
  const dateDebut = date_debut_raw ? new Date(date_debut_raw+'T00:00:00').toLocaleDateString('fr-FR') : '—';
  if (typeof docx === 'undefined'){ showToast("La bibliothèque de génération Word n'a pas pu se charger (connexion internet requise). Réessaie dans un instant."); return; }

  const lignes = m.payload.coops.filter(l=>{
    const cb = document.getElementById('grp_inclus_'+l.id);
    return cb ? cb.checked : l.inclus;
  });
  if (lignes.length===0){ showToast('Sélectionne au moins une coopérative.'); return; }

  const btn = document.querySelector('.modal .actions .btn-primary');
  if (btn){ btn.disabled = true; }

  let ok = 0, sansEmail = [], ignorees = [];
  for (const ligne of lignes){
    const coop = coopById(ligne.id);
    if (!coop) continue;
    const volumeInput = document.getElementById('grp_volume_'+ligne.id);
    const volume = (volumeInput ? volumeInput.value : ligne.volume || '').trim();
    if (btn) btn.textContent = 'Génération… ('+(ok+ignorees.length+1)+'/'+lignes.length+') — '+coop.nom;

    const missing = [];
    if (!volume) missing.push('volume contractuel');
    if (!coop.rccm) missing.push('N° RCCM');
    if (!coop.ccc_num) missing.push('N° agrément CCC');
    if (!coop.identifiant_certification) missing.push('Identifiant de certification');
    if (!coop.representant_legal_nom) missing.push('Nom du représentant légal');
    if (!coop.siege_social && !coop.ville) missing.push('Ville ou Siège social');
    if (missing.length>0){ ignorees.push(coop.nom+' ('+missing.join(', ')+')'); continue; }

    try{
      const capaciteTotale = fmtNum(Math.round(coopStats(coop.id).potentiel)) + ' kg (potentiel estimé cumulé)';
      const fonctionRepresentant = fonctionRepresentantFor(coop.nom);
      const blob = await construireContratDocxBlob(coop, campagne_label, periode_label, dateDebut, volume, capaciteTotale, fonctionRepresentant);
      const fileName = 'Contrat_'+(coop.certifications==='Fairtrade'?'FT':coop.certifications==='Cocoa Horizon'?'CH':'RA')+'_'+coop.nom.replace(/[^a-z0-9]+/gi,'_')+'_'+campagne_label.replace(/[^a-z0-9]+/gi,'_')+'.docx';
      const file = new File([blob], fileName, { type: blob.type });

      const newId = 'req_'+Date.now()+'_'+coop.id;
      const path = coop.id + '/demandes/' + newId + '/source/' + fileName;
      const { error: upErr } = await supabaseClient.storage.from('documents-coop').upload(path, file, { upsert: true });
      if (upErr){ ignorees.push(coop.nom+' (échec envoi : '+upErr.message+')'); continue; }

      const demandeObj = {
        id: newId, name: 'Contrat '+campagne_label, cooperative_id: coop.id,
        statut: 'demandee', types: ['autres'],
        deadline: null, requested_at: new Date().toISOString().slice(0,10),
        demandeur_nom: (state.session && state.session.user ? state.session.user.email : 'ECORIGINE'),
        message: 'Merci de télécharger votre contrat, de le signer, puis de nous retourner la version signée.',
        fichier_source_path: path, fichier_source_nom: fileName,
      };
      const { error } = await supabaseClient.from('demandes').insert(demandeObj);
      if (error){ ignorees.push(coop.nom+' (échec création demande : '+error.message+')'); continue; }

      supabaseClient.functions.invoke('email-nouvelle-demande', { body: { demande_id: newId } }).catch(()=>{});
      if (![coop.email1, coop.email2, coop.email3].some(e=>String(e||'').trim())) sansEmail.push(coop.nom);
      ok++;
    }catch(err){
      ignorees.push(coop.nom+' (erreur : '+err.message+')');
    }
  }

  closeModal();
  await refreshDemandesTab();
  let msg = ok+' contrat(s) généré(s) et envoyé(s) sur '+lignes.length+' coopérative(s).';
  if (sansEmail.length>0) msg += ' ⚠ Sans email enregistré : '+sansEmail.join(', ')+'.';
  if (ignorees.length>0) msg += ' ⚠ Non générés : '+ignorees.join(' · ');
  showToast(msg, ok>0 ? 'success' : 'error');
}

function fmtKg(n){
  if (n==null || isNaN(n)) return '—';
  return Math.round(n).toLocaleString('fr-FR') + ' kg';
}
function fmtNum(n){
  return Math.round(n).toLocaleString('fr-FR');
}
function stripAccents(s){
  return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}
function normKey(s){
  return stripAccents(s).trim().toLowerCase();
}
function pickField(row, candidates){
  const keys = Object.keys(row);
  for (const cand of candidates){
    const nc = normKey(cand);
    const found = keys.find(k => normKey(k) === nc);
    if (found !== undefined) return row[found];
  }
  return undefined;
}
function normHeader(s){
  return stripAccents(String(s||''))
    .replace(/\r?\n/g,' ')
    .replace(/\*.*$/,'')
    .trim().toLowerCase()
    .replace(/\s+/g,' ');
}
function pickFieldContains(row, phrases){
  const keys = Object.keys(row);
  for (const phrase of phrases){
    const found = keys.find(k => normHeader(k).includes(phrase));
    if (found !== undefined && String(row[found]).trim()!=='') return row[found];
  }
  return undefined;
}

async function recupererDonneesLocales(){
  if (typeof window.storage === 'undefined' || !window.storage){
    showToast("Le stockage Claude.ai n'est pas accessible ici. Ouvre ce document comme aperçu directement dans la conversation (pas un fichier téléchargé) pour récupérer les anciennes données.");
    return;
  }
  const oldKeys = {
    cooperatives: 'ecorigine_cooperatives',
    producteurs: 'ecorigine_producteurs',
    achats: 'ecorigine_achats',
    settings: 'ecorigine_settings',
    doc_check: 'ecorigine_doc_checklist',
    nonconformites: 'ecorigine_nonconformites',
    campagnes: 'ecorigine_campagnes',
  };
  const out = {};
  let totalFound = 0;
  for (const [name, key] of Object.entries(oldKeys)){
    try{
      const res = await window.storage.get(key, false);
      if (res && res.value != null){
        out[name] = JSON.parse(res.value);
        if (Array.isArray(out[name])) totalFound += out[name].length;
      } else {
        out[name] = name==='settings' ? {} : [];
      }
    }catch(e){
      out[name] = name==='settings' ? {} : [];
    }
  }
  if (totalFound === 0){
    showToast("Aucune ancienne donnée trouvée dans le stockage Claude.ai de cette conversation.");
    return;
  }
  const blob = new Blob([JSON.stringify(out, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const aTag = document.createElement('a');
  aTag.href = url;
  aTag.download = 'ecorigine_sauvegarde_'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(aTag); aTag.click(); document.body.removeChild(aTag);
  URL.revokeObjectURL(url);
  showToast(totalFound+' enregistrement(s) récupéré(s) et téléchargé(s) en fichier JSON. Garde-le précieusement — on va s\'en servir pour tout réimporter dans Supabase.', 'success');
}

async function importerSauvegardeJSON(input){
  const file = input.files[0];
  if (!file) return;
  if (window.self !== window.top){
    showToast("Import impossible depuis l'aperçu du chat. Téléchargez ce fichier et ouvrez-le dans un onglet de navigateur séparé avant de réessayer.");
    input.value = '';
    return;
  }
  try{
    const text = await file.text();
    const data = JSON.parse(text);
    let imported = 0;
    const errors = [];
    async function tryImport(label, arr, applyToState, key){
      if (!arr || !arr.length) return;
      applyToState(arr);
      const ok = await saveKey(key, arr);
      if (ok) imported += arr.length;
      else errors.push(label + ' : ' + (state.storageErrorMsg||'erreur inconnue'));
    }
    await tryImport('Coopératives', data.cooperatives, v=>state.cooperatives=v, KEY_COOP);
    await tryImport('Producteurs', data.producteurs, v=>state.producteurs=v, KEY_PROD);
    await tryImport('Campagnes', data.campagnes, v=>state.campagnes=v, KEY_CAMPAGNES);
    await tryImport('Achats', data.achats, v=>state.achats=v, KEY_ACHATS);
    await tryImport('Documents à vérifier', data.doc_check, v=>state.docCheck=v, KEY_DOCCHECK);
    await tryImport('Non-conformités', data.nonconformites, v=>state.nonconformites=v, KEY_NONCONF);
    if (data.settings && Object.keys(data.settings).length){
      state.settings = data.settings;
      const ok = await saveKey(KEY_SETTINGS, state.settings);
      if (!ok) errors.push('Réglages : ' + (state.storageErrorMsg||'erreur inconnue'));
    }
    if (errors.length===0){
      showToast(imported+' enregistrement(s) réimporté(s) et confirmés dans Supabase.', 'success');
    } else {
      showToast('Échec sur : '+errors.join(' | '), 'error');
    }
    render();
  }catch(e){
    showToast("Le fichier n'a pas pu être lu : "+e.message);
  }
  input.value = '';
}

async function safeGet(key, fallback){
  try{
    if (!supabaseClient) return fallback;
    if (key === 'ecorigine_settings'){
      const { data, error } = await supabaseClient.from('settings').select('*').eq('id','default').maybeSingle();
      if (error || !data) return fallback;
      return { seuil: data.seuil, prime_ra: data.prime_ra, prime_ft: data.prime_ft };
    }
    const table = KEY_TO_TABLE[key];
    if (!table) return fallback;
    // doc_check utilise soumis_le et nonconformites utilise date_creation --
    // ni l'une ni l'autre n'a de colonne created_at. Trier par created_at sur ces
    // tables faisait echouer la requete en silence, et safeGet retournait alors
    // le tableau vide de secours a chaque chargement, sans jamais remonter d'erreur.
    const ORDER_COL_OVERRIDES = { doc_check: 'soumis_le', nonconformites: 'date_creation' };
    const orderCol = ORDER_COL_OVERRIDES[table] || 'created_at';
    const { data, error } = await supabaseClient.from(table).select('*').order(orderCol, {ascending:true, nullsFirst:true});
    if (error) return fallback;
    return (data||[]).map(rowToRecord);
  }catch(e){
    return fallback;
  }
}

// Supabase renvoie null pour les champs vides ; l'outil attend des chaines vides ('')
function rowToRecord(row){
  const out = {};
  for (const k in row){
    if (k==='created_at') continue;
    out[k] = row[k]==null ? '' : row[k];
  }
  return out;
}

async function saveKey(key, value){
  state.changesSinceExport++;
  try{
    if (!supabaseClient){ state.storageOk = false; return false; }

    if (key === 'ecorigine_settings'){
      const { error } = await supabaseClient.from('settings').upsert({ id:'default', seuil:value.seuil, prime_ra:value.prime_ra, prime_ft:value.prime_ft });
      if (error){ state.storageOk = false; state.storageErrorMsg = error.message; return false; }
      state.storageOk = true; return true;
    }

    const table = KEY_TO_TABLE[key];
    if (!table){ state.storageOk = false; return false; }

    // Postgres exige NULL (pas '') pour les references vers d'autres tables (cle etrangere)
    const FK_FIELDS = ['cooperative_id','producteur_id','campagne_id','created_by'];
    // Postgres refuse aussi '' pour une colonne numeric (peut arriver sur d'anciennes lignes) --
    // on force ces champs vers un nombre valide (0 par defaut, coherent avec le reste de l'app
    // qui traite deja 0 comme "non renseigne" pour ces valeurs).
    const NUMERIC_FIELDS = {
      achats: ['quantite_kg','poids_brut','poids_brut_accepte','poids_net_produit','nombre_sacs','nombre_sacs_accepte'],
      producteurs: ['surface_ha','rendement_kg_ha','volume_estime_kg'],
    };
    const numericFieldsForTable = NUMERIC_FIELDS[table] || [];
    const sanitized = value.map(row=>{
      const r = Object.assign({}, row);
      FK_FIELDS.forEach(f=>{ if (r[f] === '') r[f] = null; });
      numericFieldsForTable.forEach(f=>{ if (f in r) r[f] = Number(r[f])||0; });
      return r;
    });

    // 1) enregistre (insere ou met a jour) chaque ligne du tableau actuel
    if (sanitized.length > 0){
      const { error: upsertErr } = await supabaseClient.from(table).upsert(sanitized);
      if (upsertErr){ state.storageOk = false; state.storageErrorMsg = upsertErr.message; return false; }
    }
    // 2) supprime dans la table les lignes qui ne sont plus dans le tableau local
    const { data: existing, error: listErr } = await supabaseClient.from(table).select('id');
    if (!listErr && existing){
      const currentIds = new Set(sanitized.map(v=>v.id));
      const toDelete = existing.map(r=>r.id).filter(id=>!currentIds.has(id));
      if (toDelete.length>0){
        await supabaseClient.from(table).delete().in('id', toDelete);
      }
    }
    state.storageOk = true;
    return true;
  }catch(e){
    state.storageOk = false;
    state.storageErrorMsg = (e && e.message) ? e.message : String(e);
    return false;
  }
}

async function refreshBaseDonnees(){

async function uploadBaseDonneesFichiers(){
  const coopSelect = document.querySelector('[name="basedonnees_coop_id"]');
  const coopId = coopSelect ? coopSelect.value : '';
  if (!coopId){ showToast('Choisis une coopérative.'); return; }

  const aEnvoyer = ['registre','geolocalisation'].map(type=>{
    const input = document.getElementById('basedonnees_'+type+'_input');
    const file = input && input.files[0];
    return file ? { type, input, file } : null;
  }).filter(Boolean);
  if (aEnvoyer.length===0){ showToast('Choisis au moins un fichier (registre ou géolocalisation).'); return; }

  const btn = document.getElementById('basedonnees_envoyer_btn');
  if (btn){ btn.disabled = true; btn.textContent = 'Envoi…'; }

  let ok = 0; const echecs = []; const fichiersEnvoyes = []; let registreInput = null; let geojsonFile = null;
  for (const { type, input, file } of aEnvoyer){
    const path = coopId + '/database/' + type + '_' + file.name;
    const { error: upErr } = await supabaseClient.storage.from('documents-coop').upload(path, file, { upsert: true });
    if (upErr){ echecs.push(type+' : '+upErr.message); continue; }
    const { error } = await supabaseClient.from('coop_database_files').upsert({
      id: 'bdd_'+coopId+'_'+type,
      cooperative_id: coopId,
      type, path, nom: file.name,
      campagne: '2026-2027',
      uploaded_at: new Date().toISOString(),
    });
    if (error){ echecs.push(type+' : '+error.message); continue; }
    ok++;
    fichiersEnvoyes.push({ type, file });
    if (type==='registre') registreInput = input;
    else { geojsonFile = file; input.value = ''; }
  }

  if (btn){ btn.disabled = false; btn.textContent = 'Téléverser'; }
  if (ok>0){
    showToast(ok+' fichier(s) envoyé(s) avec succès.'+(echecs.length>0?' ⚠ Échec pour : '+echecs.join(', '):''), echecs.length===0?'success':undefined);
    await creerDemandeBaseDonnees(coopId, fichiersEnvoyes);
  } else {
    showToast('Échec : '+echecs.join(', '));
  }
  await refreshBaseDonnees();

  // Reutilise exactement la meme analyse que le bouton "Importer (Excel)" de la
  // carte coopérative -- ouvre la fenetre de previsualisation habituelle, pour que
  // le registre depose ici alimente aussi la liste des producteurs, sans dupliquer
  // la logique de lecture du fichier.
  if (registreInput) await handleExcelFile(registreInput, coopId, geojsonFile);
}

async function creerDemandeBaseDonnees(coopId, fichiers){
  const coop = coopById(coopId);
  if (!coop) return;
  if (typeof JSZip === 'undefined'){ showToast("Fichiers déposés, mais la notification de demande n'a pas pu être créée (bibliothèque de compression indisponible)."); return; }
  try{
    const zip = new JSZip();
    fichiers.forEach(({file})=> zip.file(file.name, file));
    const blob = await zip.generateAsync({type:'blob'});
    const newId = 'req_'+Date.now()+'_'+coopId;
    const zipName = 'donnees_campagne_'+coop.nom.replace(/[^a-z0-9]+/gi,'_')+'.zip';
    const path = coopId + '/demandes/' + newId + '/source/' + zipName;
    const { error: upErr } = await supabaseClient.storage.from('documents-coop').upload(path, blob, { upsert: true });
    if (upErr){ showToast("Fichiers déposés, mais la notification de demande a échoué : "+upErr.message); return; }

    const labels = fichiers.map(f=>f.type==='registre'?'le registre des membres':'les données de géolocalisation');
    const demandeObj = {
      id: newId, name: 'Données pour la campagne 2026-2027', cooperative_id: coopId,
      statut: 'demandee', types: ['autres'],
      deadline: null, requested_at: new Date().toISOString().slice(0,10),
      demandeur_nom: (state.session && state.session.user ? state.session.user.email : 'ECORIGINE'),
      message: "ECORIGINE possède déjà une base de données de votre coopérative ; une analyse déforestation et conformité a déjà été menée sur ces données. Vous trouverez ci-joint "+labels.join(' et ')+", qui serviront de référence pour la campagne 2026-2027. Téléchargez-les pour votre suivi — aucune signature ni retour n'est nécessaire.",
      fichier_source_path: path, fichier_source_nom: zipName,
    };
    const { error } = await supabaseClient.from('demandes').insert(demandeObj);
    if (error){ showToast("Fichiers déposés, mais la création de la demande a échoué : "+error.message); return; }
    supabaseClient.functions.invoke('email-nouvelle-demande', { body: { demande_id: newId } }).catch(()=>{});
    await refreshDemandesTab();
  }catch(e){
    showToast("Fichiers déposés, mais la notification de demande a échoué : "+e.message);
  }
}

async function creerDemande(){
  const name = fv('demande_name').trim();
  const coopId = fv('demande_cooperative_id');
  const deadline = fv('demande_deadline');
  const message = fv('demande_message').trim();
  const demandeurNom = fv('demande_demandeur_nom').trim();
  // Sauvegarde immediate des champs dans le payload de la modale : si une validation
  // echoue plus bas, showToast() va redessiner la modale, et c'est ce payload qui
  // repeuple les champs -- sans ca, tout ce qui a ete tape disparait au premier echec.
  if (state.modal && state.modal.type==='nouvelleDemande'){
    const fileInput = document.getElementById('demande_fichier_source_input');
    const fichierSelectionne = (fileInput && fileInput.files[0]) ? fileInput.files[0] : (state.modal.payload && state.modal.payload.fichierSource);
    state.modal.payload = {
      demande_name: name, demande_cooperative_id: coopId, demande_deadline: deadline,
      demande_demandeur_nom: demandeurNom, demande_message: message,
      fichierSource: fichierSelectionne,
    };
  }
  if (!name || !coopId){ showToast('Renseigne au moins un nom et une coopérative.'); restaurerFichierSourceInput(); return; }
  if (state.newDemandeTypes.size===0){ showToast('Sélectionne au moins un type de données.'); restaurerFichierSourceInput(); return; }

  const fileInput = document.getElementById('demande_fichier_source_input');
  const fichierSource = (fileInput && fileInput.files[0]) ? fileInput.files[0] : (state.modal.payload && state.modal.payload.fichierSource);
  const typesArr = Array.from(state.newDemandeTypes);

  const targetCoops = coopId==='__all__' ? state.cooperatives.slice() : [coopById(coopId)].filter(Boolean);
  if (targetCoops.length===0){ showToast('Aucune coopérative à cibler.'); return; }

  const btn = document.querySelector('.modal .actions .btn-primary');
  if (btn){ btn.disabled = true; btn.textContent = targetCoops.length>1 ? 'Création en cours… (0/'+targetCoops.length+')' : 'Création…'; }

  let created = 0, sansEmail = [], lastCreated = null;
  for (const coop of targetCoops){
    const newId = 'req_'+Date.now()+'_'+coop.id;
    let fichier_source_path = null, fichier_source_nom = null;
    if (fichierSource){
      const path = coop.id + '/demandes/' + newId + '/source/' + fichierSource.name;
      const { error: upErr } = await supabaseClient.storage.from('documents-coop').upload(path, fichierSource, { upsert: true });
      if (upErr){ showToast("Échec de l'envoi du document pour "+coop.nom+" : "+upErr.message); continue; }
      fichier_source_path = path;
      fichier_source_nom = fichierSource.name;
    }
    const demandeObj = {
      id: newId,
      name, cooperative_id: coop.id,
      statut: 'demandee',
      types: typesArr,
      deadline: deadline || null,
      requested_at: new Date().toISOString().slice(0,10),
      demandeur_nom: demandeurNom || (state.session && state.session.user ? state.session.user.email : 'ECORIGINE'),
      message: message || null,
      fichier_source_path, fichier_source_nom,
    };
    const { error } = await supabaseClient.from('demandes').insert(demandeObj);
    if (error){ showToast('Échec de la création pour '+coop.nom+' : '+error.message); continue; }
    created++;
    lastCreated = { coop, demandeObj };
    // Tentative d'envoi automatique par coopérative (silencieuse, en tache de fond)
    supabaseClient.functions.invoke('email-nouvelle-demande', { body: { demande_id: newId } }).catch(()=>{});
    if (![coop.email1, coop.email2, coop.email3].some(e=>String(e||'').trim())) sansEmail.push(coop.nom);
    if (btn && targetCoops.length>1) btn.textContent = 'Création en cours… ('+created+'/'+targetCoops.length+')';
  }

  if (btn){ btn.disabled = false; btn.textContent = 'Créer la demande'; }
  state.newDemandeTypes = new Set();
  closeModal();

  if (targetCoops.length===1 && lastCreated){
    // Comportement inchange pour une seule coopérative : apercu email pret a copier
    const emailData = buildNouvelleDemandeEmail(lastCreated.demandeObj, lastCreated.coop);
    if (emailData.emails.length>0){
      showEmailPreview(emailData.emails.join(', '), emailData.subject, emailData.body);
    } else {
      showToast('Demande créée, mais aucune adresse email enregistrée sur la fiche de cette coopérative.', 'success');
    }
  } else {
    showToast(
      created+' demande(s) créée(s) sur '+targetCoops.length+' coopérative(s).'
      + (sansEmail.length>0 ? ' ⚠ Sans email enregistré : '+sansEmail.join(', ') : ''),
      created>0 ? 'success' : 'error'
    );
  }

  await refreshDemandesTab();
}

async function validerDemande(id){
  const demande = (state.demandesCoop||[]).find(d=>d.id===id);
  askConfirm('Valider cette demande ? La coopérative verra le statut passer à "Accepté".', async ()=>{
    const { error } = await supabaseClient.from('demandes').update({statut:'acceptee', commentaire_ecorigine: null}).eq('id', id);
    if (error){ showToast('Échec : '+error.message); return; }
    showToast('Demande validée.', 'success');
    if (demande && (demande.types||[]).includes('masterdata') && demande.fichier_path){
      await extraireProducteursValides(demande);
    }

async function extraireProducteursValides(demande){
  try{
    const { data: fileBlob, error: dlErr } = await supabaseClient.storage.from('documents-coop').download(demande.fichier_path);
    if (dlErr){ showToast("Registre validé, mais échec de l'extraction des producteurs : "+dlErr.message); return; }
    const buf = await fileBlob.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array'});
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
    // Colonnes attendues (Template_registre_membres.xlsx) : ... 3=Farmer ID, 4=Farmer Name ...
    const dataRows = rows.slice(1).filter(r=>r.some(c=>String(c||'').trim()!==''));
    const producteurs = dataRows.map((r,i)=>{
      const code = String(r[2]||'').trim();
      const nomComplet = String(r[3]||'').trim();
      const espace = nomComplet.indexOf(' ');
      const prenom = espace>0 ? nomComplet.slice(0,espace) : '';
      const nom = espace>0 ? nomComplet.slice(espace+1) : nomComplet;
      return { id: 'pv_'+demande.cooperative_id+'_'+i, cooperative_id: demande.cooperative_id, code, nom, prenom };
    }).filter(p=>p.code);

    if (producteurs.length===0){ showToast('Registre validé, mais aucune ligne producteur exploitable trouvée dans le fichier.'); return; }

    // remplace entierement la liste precedente par la nouvelle version validee
    await supabaseClient.from('producteurs_valides').delete().eq('cooperative_id', demande.cooperative_id);
    const { error: insErr } = await supabaseClient.from('producteurs_valides').insert(producteurs);
    if (insErr){ showToast("Registre validé, mais échec de l'enregistrement des producteurs : "+insErr.message); return; }
    showToast(producteurs.length+' producteur(s) validé(s) et enregistré(s) pour cette coopérative.', 'success');
  }catch(e){
    showToast("Registre validé, mais échec de l'extraction : "+e.message);
  }
}

function coopById(id){ return state.cooperatives.find(c=>c.id===id) || null; }
function coopStats(coopId){
  const list = state.producteurs.filter(p=>p.cooperative_id===coopId);
  const pot = list.reduce((s,p)=> s + potentiel(p), 0);
  const achete = list.reduce((s,p)=> s + cumulAchats(p.id, 'all', 'all'), 0);
  const pct = pot>0 ? (achete/pot*100) : null;
  const connList = state.achats.filter(a=>!a.producteur_id && a.cooperative_id===coopId);
  const netProduit = connList.reduce((s,a)=>s+(Number(a.poids_net_produit)||0),0);
  const netProduitPending = connList.filter(a=>!(Number(a.poids_net_produit)>0)).length;
  return { count: list.length, potentiel: pot, achete, pct, netProduit, netProduitPending, connCount: connList.length };
}

function potentiel(p){
  const v = Number(p.volume_estime_kg);
  if (v > 0) return v;
  const s = Number(p.surface_ha)||0;
  const r = Number(p.rendement_kg_ha)||0;
  return s*r;
}
// filtre continu : en periode "intermediaire", on compte aussi les livraisons "principale"
// de la meme campagne, pour que le plafond soit une continuite sur l'annee (70% puis 100%)
function achatsProducteur(producteurId, campagneId, periode){
  return state.achats.filter(a=>{
    if (a.producteur_id !== producteurId) return false;
    if (campagneId==='all') return true; // toutes campagnes : la notion de periode ne s'applique pas
    if ((a.campagne_id||'')!==campagneId) return false;
    if (periode==='principale') return a.periode==='principale';
    if (periode==='intermediaire') return a.periode==='principale' || a.periode==='intermediaire';
    return true;
  });
}
function cumulAchats(producteurId, campagneId, periode){
  return achatsProducteur(producteurId, campagneId, periode)
    .reduce((sum,a) => sum + (Number(a.quantite_kg)||0), 0);
}
function statusFor(pot, ceiling, cumul, seuil, periode){
  if (!ceiling || ceiling<=0) return {key:'neutral', label:'À configurer'};
  const pct = (cumul/ceiling)*100;
  if (periode==='principale' && pot>0){
    const pctOfPot = (cumul/pot)*100;
    if (pctOfPot >= 70) return {key:'danger', label:'Dépassement', pct};
    if (pctOfPot >= 50) return {key:'warn', label:'Alerte précoce (50%)', pct};
    return {key:'ok', label:'Conforme', pct};
  }
  if (pct >= 100) return {key:'danger', label:'Dépassement', pct};
  if (pct >= seuil) return {key:'warn', label:'À surveiller', pct};
  return {key:'ok', label:'Conforme', pct};
}
function effectiveCeiling(p, campagneId, periode){
  const pot = potentiel(p);
  if (campagneId==='all' || !campagneId) return pot;
  if (periode==='principale') return pot * PLAFOND_PRINCIPALE;
  if (periode==='intermediaire') return pot * PLAFOND_ANNUEL;
  return pot;
}

function computeRows(){
  const seuil = Number(state.settings.seuil)||90;
  const periode = state.periodeFilter;
  return state.producteurs
    .filter(p => state.coopFilter==='all' || p.cooperative_id===state.coopFilter)
    .map(p=>{
      const pot = potentiel(p);
      const ceiling = effectiveCeiling(p, state.campagneFilter, periode);
      const cumul = cumulAchats(p.id, state.campagneFilter, periode);
      const st = statusFor(pot, ceiling, cumul, seuil, state.campagneFilter!=='all' ? periode : null);
      const restant = ceiling>0 ? Math.max(ceiling - cumul, 0) : null;
      return { p, pot, ceiling, cumul, restant, st, periode: state.campagneFilter!=='all' ? periode : null };
    }).sort((a,b)=>{
      const pa = a.st.pct==null ? -1 : a.st.pct;
      const pb = b.st.pct==null ? -1 : b.st.pct;
      return pb-pa;
    });
}

  const editId = fv('edit_id');
  const data = {
    nom: nom,
    nom_complet: fv('nom_complet').trim(),
    statut: fv('statut'),
    certifications: fv('certifications').trim(),
    representant_legal_nom: fv('representant_legal_nom').trim(),
    representant_legal_contact: fv('representant_legal_contact').trim(),
    contact_nom: fv('contact_nom').trim(),
    contact_contact: fv('contact_contact').trim(),

    siege_social: fv('siege_social').trim(),
    identifiant_certification: fv('identifiant_certification').trim(),
    email1: fv('email1').trim(),
    email2: fv('email2').trim(),
    email3: fv('email3').trim()
  };
  let coopId;

    coopId = editId;

  // coopérative vient de creer elle-meme entre-temps.
  const { error } = await supabaseClient.from('cooperatives').upsert(Object.assign({ id: coopId }, data));

async function deleteCooperative(id){
  const linked = state.producteurs.filter(p=>p.cooperative_id===id);
  const msg = linked.length>0
    ? 'Cette coopérative a ' + linked.length + ' producteur(s) enregistré(s). Les supprimer également avec leurs achats et supprimer la coopérative ?'
    : 'Supprimer cette coopérative ?';
  askConfirm(msg, async ()=>{
    const linkedIds = Array.from(new Set(linked.map(p=>p.id)));
    state.cooperatives = state.cooperatives.filter(c=>c.id!==id);
    state.producteurs = state.producteurs.filter(p=>p.cooperative_id!==id);
    state.achats = state.achats.filter(a=>!linkedIds.includes(a.producteur_id));
    state.docCheck = state.docCheck.filter(d=>d.cooperative_id!==id);
    state.nonconformites = state.nonconformites.filter(n=>n.cooperative_id!==id);
    // Suppressions ciblees uniquement -- jamais de resynchronisation globale d'une
    // table entiere, pour ne jamais risquer d'effacer par erreur les donnees d'une
    // AUTRE cooperative (c'est ce mecanisme, via saveKey, qui a cause la perte de
    // donnees sur doc_check).
    try{
      if (linkedIds.length>0) await supabaseClient.from('achats').delete().in('producteur_id', linkedIds);
      await supabaseClient.from('producteurs').delete().eq('cooperative_id', id);
      await supabaseClient.from('doc_check').delete().eq('cooperative_id', id);
      await supabaseClient.from('nonconformites').delete().eq('cooperative_id', id);
      await supabaseClient.from('cooperatives').delete().eq('id', id);
      showToast('Coopérative supprimée.', 'success');
    }catch(e){ showToast('Échec de la suppression : '+e.message); }
    render();
  });
}

async function deleteCampagne(id){

// Repere une valeur associee a un libelle, dans une feuille lue en mode "array of arrays"
// (utile pour un formulaire avec libelle + valeur juxtaposes, comme la fiche d'accompagnement)
function normDateValue(v){
  if (v instanceof Date && !isNaN(v)) return v.toISOString().slice(0,10);
  if (v==null || v==='') return '';
  return String(v).trim();
}

function padCol(str, width){
  str = String(str==null?'':str);
  if (str.length >= width) return str.slice(0, width-1)+'…';
  return str + ' '.repeat(width-str.length);
}
function buildTexteTableau(entries){
  const cols = [
    {label:'Producteur', w:22, get:r=>r.p.nom},
    {label:'Section', w:12, get:r=>r.p.section||'—'},
    {label:'Code producteur', w:16, get:r=>r.p.code||'—'},
    {label:'Code parcelle', w:14, get:r=>r.p.code_parcelle||'—'},
    {label:'Livré (kg)', w:12, get:r=>Math.round(r.cumul)},
    {label:'Restant (kg)', w:13, get:r=>r.restant!=null?Math.round(r.restant):'—'}
  ];
  const headerLine = cols.map(c=>padCol(c.label,c.w)).join('| ');
  const sepLine = cols.map(c=>'-'.repeat(c.w)).join('|-');
  const rowLines = entries.map(r=> cols.map(c=>padCol(c.get(r), c.w)).join('| '));
  return [headerLine, sepLine].concat(rowLines).join('\n');
}

/* ============================================================
   Import du rapport de réception CCC (Conseil Café-Cacao)
   Remplace la saisie manuelle des achats : le rapport officiel
   fournit directement le nombre de sacs et le poids accepte/paye
   par livraison (numero de connaissement), pour chaque cooperative
   (retrouvee via son numero d'agrement CCC = Code Fournisseur).
   ============================================================ */
function parseRapportCCC(aoa){
  let headerRow = -1;
  for (let r=0;r<Math.min(20,aoa.length);r++){
    const row = aoa[r]||[];
    if (row.some(c=>normHeader(String(c||'')).includes('date pesee'))) { headerRow = r; break; }
  }
  if (headerRow===-1) return { error: "Impossible de trouver l'en-tête du rapport (colonne « Date Pesée » introuvable). Vérifie qu'il s'agit bien d'un export « État de réception de produits » du CCC." };

  const hdr = (aoa[headerRow]||[]).map(c=>normHeader(String(c||'')));
  const findCol = (...patterns) => hdr.findIndex(h => patterns.every(p=>h.includes(p)));
  const cDate = findCol('date','pesee');
  const cCnsment = findCol('cnsment');
  const cCodeFourn = findCol('code','fournisseur');
  const cNomFourn = findCol('nom','fournisseur');
  const cSacs = findCol('sacs');
  const cPoids = findCol('poids','accepte');
  const cGradNat = findCol('grad','nat');
  const cGradFcc = findCol('grad','fcc');
  if (cDate<0 || cCodeFourn<0 || cSacs<0 || cPoids<0){
    return { error: "Colonnes attendues introuvables dans ce fichier (Date Pesée / Code Fournisseur / Nbre Sacs / Poids Accepté)." };
  }

  let campagneLabel = '';
  for (let r=0;r<Math.min(10,aoa.length) && !campagneLabel;r++){
    const row = aoa[r]||[];
    for (let c=0;c<row.length && !campagneLabel;c++){
      if (normHeader(String(row[c]||'')).includes('campagne')){
        for (let cc=c; cc<row.length; cc++){
          const m = String(row[cc]||'').match(/(\d{4})\s*-\s*(\d{4})/);
          if (m){ campagneLabel = m[1]+'-'+m[2]; break; }
        }
      }
    }
  }

  function normDateFromCCC(v){
    if (v instanceof Date && !isNaN(v)) return v.toISOString().slice(0,10);
    const m = String(v||'').trim().match(/^(\d{4}-\d{2}-\d{2})/);
    return m ? m[1] : '';
  }

  const rows = [];
  for (let r=headerRow+1; r<aoa.length; r++){
    const row = aoa[r]||[];
    const dateVal = row[cDate];
    if (dateVal==null || String(dateVal).trim()==='') continue;
    const codeFourn = String(row[cCodeFourn]||'').trim();
    if (!codeFourn) continue;
    rows.push({
      date: normDateFromCCC(dateVal),
      connaissement: cCnsment>=0 ? String(row[cCnsment]||'').trim() : '',
      code_fournisseur: codeFourn,
      nom_fournisseur: cNomFourn>=0 ? String(row[cNomFourn]||'').trim() : '',
      sacs: Number(row[cSacs])||0,
      poids_accepte: Number(row[cPoids])||0,
      grad_nat: cGradNat>=0 ? String(row[cGradNat]||'').trim() : '',
      grad_fcc: cGradFcc>=0 ? String(row[cGradFcc]||'').trim() : '',
    });
  }
  return { campagneLabel, rows };
}

async function handleRapportCCCFile(input){
  const file = input.files && input.files[0];
  if (!file) return;
  try{
    const data = await file.arrayBuffer();
    const wb = XLSX.read(data, {type:'array', cellDates:true});
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const aoa = XLSX.utils.sheet_to_json(sheet, {header:1, defval:''});
    const parsed = parseRapportCCC(aoa);
    if (parsed.error){ showToast(parsed.error); input.value=''; return; }
    if (parsed.rows.length===0){ showToast("Aucune ligne de réception trouvée dans ce fichier."); input.value=''; return; }

    let campagne = null;
    if (parsed.campagneLabel){
      const norm = s => String(s||'').replace(/\s+/g,'');
      campagne = state.campagnes.find(c=> norm(c.nom)===norm(parsed.campagneLabel)) || null;
    }

    const parCoop = {};
    const nonReconnues = new Set();
    parsed.rows.forEach(r=>{
      const coop = state.cooperatives.find(c=> String(c.ccc_num||'').trim()===r.code_fournisseur);
      if (!coop){ nonReconnues.add(r.code_fournisseur+' ('+r.nom_fournisseur+')'); return; }
      if (!parCoop[coop.id]) parCoop[coop.id] = { coop, rows: [] };
      parCoop[coop.id].rows.push(r);
    });

    state.pendingRapportCCC = { fileName: file.name, campagneLabel: parsed.campagneLabel, campagneId: campagne?campagne.id:'', parCoop, nonReconnues: Array.from(nonReconnues), totalRows: parsed.rows.length };
    render();
  }catch(e){
    showToast("Impossible de lire ce fichier : "+e.message);
  }
  input.value = '';
}

async function confirmImportRapportCCC(){
  const pi = state.pendingRapportCCC;
  if (!pi) return;
  const campagneId = fv('rapport_ccc_campagne') || pi.campagneId;
  if (!campagneId){ showToast('Sélectionne la campagne correspondant à ce rapport avant de confirmer.'); return; }

  let created = 0, updated = 0, unchanged = 0;
  const aEnregistrer = [];
  Object.values(pi.parCoop).forEach(({coop, rows})=>{
    rows.forEach(r=>{
      const month = r.date ? Number(r.date.slice(5,7)) : 0;
      const periode = (month>=4 && month<=9) ? 'intermediaire' : 'principale';
      const existing = r.connaissement ? state.achats.find(a=>a.cooperative_id===coop.id && a.connaissement===r.connaissement) : null;
      if (existing){
        const changed = Number(existing.nombre_sacs_accepte||0)!==r.sacs || Number(existing.poids_brut_accepte||0)!==r.poids_accepte || Number(existing.poids_net_produit||0)!==r.poids_accepte;
        if (changed){
          existing.nombre_sacs_accepte = r.sacs;
          existing.poids_brut_accepte = r.poids_accepte;
          existing.poids_net_produit = r.poids_accepte;
          aEnregistrer.push(existing);
          updated++;
        } else {
          unchanged++;
        }
      } else {
        const nouvel = {
          id: genId('a'), cooperative_id: coop.id, producteur_id: '',
          date: r.date || new Date().toISOString().slice(0,10),
          quantite_kg: 0, poids_brut: 0, nombre_sacs: 0,
          poids_brut_accepte: r.poids_accepte, poids_net_produit: r.poids_accepte, nombre_sacs_accepte: r.sacs,
          connaissement: r.connaissement, type_cacao: '', campagne_id: campagneId, periode,
        };
        state.achats.push(nouvel);
        aEnregistrer.push(nouvel);
        created++;
      }
    });
  });

  // Deduplique par id avant l'envoi (meme raison que pour l'import producteurs :
  // deux connaissements identiques dans le rapport donneraient sinon le meme achat
  // deux fois dans le tableau).
  const dedupMap = new Map();
  aEnregistrer.forEach(r=> dedupMap.set(r.id, r));
  const aEnregistrerUnique = Array.from(dedupMap.values());
  let ok = true;
  if (aEnregistrerUnique.length>0){
    const { error } = await supabaseClient.from('achats').upsert(aEnregistrerUnique);
    if (error){ ok = false; state.storageErrorMsg = error.message; }
  }
  state.pendingRapportCCC = null;
  closeModal();
  if (ok){
    showToast(created+' nouveau(x) achat(s), '+updated+' mis à jour, '+unchanged+' déjà à jour.', 'success');
  } else {
    showToast("Les données ont été mises à jour à l'écran, mais l'enregistrement a échoué : "+(state.storageErrorMsg||'erreur inconnue'));
  }
}

async function handleExcelFile(input, cooperativeId, geojsonFile){

  }

    const wb = XLSX.read(data, {type:'array', cellDates:true});
    let sheetName = wb.SheetNames.find(n => normHeader(n).includes('farm') && normHeader(n).includes('data'));
    if (!sheetName) sheetName = wb.SheetNames.find(n => normHeader(n).includes('farm'));
    if (!sheetName) sheetName = wb.SheetNames[0];
    const sheet = wb.Sheets[sheetName];
    // Le modele a son entete en ligne 2 (ligne 1 = titre de section fusionne) ; on essaie range:1,
    // et si ca ne detecte aucune colonne utile on retente sans range (feuille "simple").
    let json = XLSX.utils.sheet_to_json(sheet, {range:1, defval:''});
    const hasUsefulHeaders = (rows) => rows.length>0 && Object.keys(rows[0]).some(k=>{
      const nk = normHeader(k);

    });
    if (!hasUsefulHeaders(json)){
      const alt = XLSX.utils.sheet_to_json(sheet, {defval:''});
      if (hasUsefulHeaders(alt)) json = alt;
    }
    const rows = []; let skipped = 0;
    json.forEach(r=>{
      const nom = pickFieldContains(r, NOM_KEYS) ?? pickField(r, NOM_KEYS);
      if (!nom || String(nom).trim()===''){ skipped++; return; }
      const rawDate = pickFieldContains(r, MAPDATE_KEYS);
      rows.push({
        nom: String(nom).trim(),
        code: String(pickFieldContains(r, CODE_KEYS) ?? pickField(r, CODE_KEYS) ?? '').trim(),
        farm_id: String(pickFieldContains(r, FARMID_KEYS) || '').trim(),
        pays: String(pickFieldContains(r, PAYS_KEYS) || '').trim(),
        village_district: String(pickFieldContains(r, VILLAGE_KEYS) || '').trim(),
        matricule_ccc: String(pickFieldContains(r, MATRICULE_KEYS) ?? pickField(r, MATRICULE_KEYS) ?? '').trim(),
        first_aggregator: String(pickFieldContains(r, AGGREGATOR_KEYS) || '').trim(),
        polygon_filename: String(pickFieldContains(r, POLYGON_KEYS) || '').trim(),
        farm_mapping_date: rawDate ? normDateValue(rawDate) : '',
        surface_ha: Number(pickFieldContains(r, SURFACE_KEYS) ?? pickField(r, SURFACE_KEYS))||0,
        rendement_kg_ha: Number(pickFieldContains(r, RENDEMENT_KEYS) ?? pickField(r, RENDEMENT_KEYS))||0,
        volume_estime_kg: Number(pickFieldContains(r, VOLUME_KEYS))||0,
        lat: String(pickFieldContains(r, LAT_KEYS) ?? pickField(r, LAT_KEYS) ?? '').trim(),
        lon: String(pickFieldContains(r, LON_KEYS) ?? pickField(r, LON_KEYS) ?? '').trim()
      });
    });
    // Un meme producteur (meme code) peut legitimement avoir plusieurs parcelles
    // (plusieurs lignes) -- ce n'est jamais un doublon en soi. Le vrai probleme,
    // c'est un Farm ID (identifiant de PARCELLE) qui se retrouve sur deux lignes :
    // soit la meme parcelle saisie deux fois (doublon reel, a supprimer), soit deux
    // parcelles distinctes ayant recu le meme identifiant par erreur de numerotation
    // (a corriger en renumerotant -P1/-P2/... dans l'ordre).
    const reconciliation = reconcilierDoublonsFarmId(rows, polygones);
    state.pendingImport = { cooperative_id: cooperativeId, fileName: file.name, sheetUsed: sheetName, rows: reconciliation.rows, skipped, reconciliation };
    state.modal = { type: 'importPreview' };
