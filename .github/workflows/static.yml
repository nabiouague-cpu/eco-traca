# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # La banniere « nouvelle version » compare APP_VERSION de la page ouverte avec celle du fichier en ligne.
      # Si quelqu'un oublie de changer APP_VERSION, la banniere ne s'affiche jamais. Ce pas ajoute donc,
      # a chaque deploiement, l'identifiant du commit a APP_VERSION (uniquement dans la copie publiee) :
      # la version change a coup sur, bump manuel ou non.
      - name: Stamp APP_VERSION with commit id
        run: |
          for f in index.html portail.html terrain.html; do
            [ -f "$f" ] && sed -i -E "s/(const APP_VERSION = '[^']*)'/\1-${GITHUB_SHA::7}'/" "$f"
          done
          grep -n "const APP_VERSION" index.html | head -2
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      # GitHub's artifact API is sometimes not yet consistent right after the upload step reports success,
      # which makes deploy-pages fail immediately with "No artifacts named github-pages were found" even
      # though the artifact really was just uploaded. A short pause avoids that race.
      - name: Pause for artifact metadata to propagate
        run: sleep 20
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
