name: Compiler l'application Android
on:
  workflow_dispatch:
  push:
    paths:
      - 'terrain.html'
      - 'terrain-sw.js'
      - 'app-android/**'
      - '.github/workflows/apk.yml'
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Licences Android (SDK déjà installé sur la machine)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Préparer l'application
        working-directory: app-android
        run: |
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          node prep-www.js
          npx cap sync android
      - name: Numéro de version
        working-directory: app-android/android
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" app/build.gradle
          grep -n "versionCode\|versionName" app/build.gradle
      - name: Clé de signature (mêmes mises à jour par-dessus l'ancienne version)
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PW: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ]; then echo 'ATTENTION : pas de clé fixe, signature temporaire'; exit 0; fi
          CLEAN=$(printf %s "$KS_B64" | tr -d ' \r\n\t')
          echo "Longueur du secret KEYSTORE_B64 : ${#CLEAN} caractères (attendu : 3512)"
          printf %s "$CLEAN" | base64 -d > "$RUNNER_TEMP/origen.keystore" || { echo "ERREUR : KEYSTORE_B64 n'est pas un bloc valide : il faut coller uniquement la longue ligne du fichier"; exit 1; }
          keytool -list -keystore "$RUNNER_TEMP/origen.keystore" -storepass "$KS_PW" > /dev/null || { echo "ERREUR : la clé ne s'ouvre pas avec KEYSTORE_PASSWORD"; exit 1; }
          echo "KEYSTORE_PATH=$RUNNER_TEMP/origen.keystore" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=$KS_PW" >> $GITHUB_ENV
          echo 'Clé fixe utilisée'
      - name: Compiler l'APK
        working-directory: app-android/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Publier l'APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app-android/android/app/build/outputs/apk/debug/app-debug.apk ORIGEN-Terrain.apk
          gh release delete android-latest --cleanup-tag --yes || true
          gh release create android-latest ORIGEN-Terrain.apk --title "ORIGEN Terrain (Android)" --notes "Version ${{ github.run_number }} — $(date -u +%d/%m/%Y\ %H:%M) UTC" --latest=false
      - uses: actions/upload-artifact@v4
        with: { name: ORIGEN-Terrain-apk, path: ORIGEN-Terrain.apk }
