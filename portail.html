<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ECORIGINE — Portail coopérative</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
<style>
  :root{
    --bg:#F6F4EE; --surface:#FFFFFF; --surface-2:#FBFAF6;
    --ink:#241F19; --ink-soft:#6B6255; --ink-faint:#9A9184;
    --accent:#42693C; --accent-soft:#E9F0E7; --accent-line:#A9C2A3;
    --border:#E4DFD1;
    --ok:#3F7A4D; --ok-bg:#E6F0E6; --ok-line:#B7D2B9;
    --warn:#9A6512; --warn-bg:#FBEEDA; --warn-line:#E7C384;
    --danger:#A6392C; --danger-bg:#FBE7E2; --danger-line:#E4AFA4;
    --gray-bg:#EDEAE2;
    --sans:'IBM Plex Sans', system-ui, sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:14px;}
  .topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;}
  .topbar .brand{display:flex;align-items:center;gap:10px;}
  .topbar .brand img{width:34px;height:34px;}
  .topbar .brand .name{font-weight:700;color:var(--accent);font-size:16px;}
  .topbar .brand .sub{font-size:11.5px;color:var(--ink-soft);}
  .wrap{max-width:1100px;margin:0 auto;padding:24px 20px 60px;}
  .btn{border:1px solid var(--border);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:7px;font-size:13px;cursor:pointer;}
  .btn:hover{background:var(--surface-2);}
  .btn-primary{background:var(--accent);color:#fff;border-color:var(--accent);}
  .btn-primary:hover{opacity:0.92;}
  .btn-ghost{border:none;background:none;color:var(--accent);padding:6px 8px;font-size:12.5px;cursor:pointer;}
  .btn-danger-text{border:none;background:none;color:var(--danger);padding:6px 8px;font-size:12.5px;cursor:pointer;}
  .hint{color:var(--ink-soft);font-size:12.5px;}
  .loading{padding:80px 0;text-align:center;color:var(--ink-soft);}
  .login-screen{min-height:90vh;display:flex;align-items:center;justify-content:center;}
  .login-box{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:36px 32px;width:100%;max-width:380px;box-shadow:0 4px 20px rgba(0,0,0,0.06);text-align:center;}
  .login-box img{width:52px;height:52px;margin-bottom:10px;}
  .login-box h2{margin:0 0 6px;font-size:18px;color:var(--accent);}
  .field{display:block;margin-bottom:14px;text-align:left;}
  .field label, .field-label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:4px;}
  .field input, .field select, .field textarea, input[type=text], input[type=email], input[type=password], input[type=date], select, textarea{
    width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:7px;font-size:13.5px;font-family:inherit;background:var(--surface);color:var(--ink);
  }
  .tabs{display:flex;gap:6px;margin-bottom:18px;border-bottom:1px solid var(--border);}
  .tab-btn{border:none;background:none;padding:10px 16px;font-size:13.5px;color:var(--ink-soft);cursor:pointer;border-bottom:2px solid transparent;}
  .tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600;}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:18px;overflow:hidden;}
  .panel-head{padding:14px 18px;border-bottom:1px solid var(--border);}
  .panel-head h2{margin:0;font-size:15px;}
  table.data-table{width:100%;border-collapse:collapse;}
  table.data-table th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:0.03em;color:var(--ink-soft);padding:10px 16px;border-bottom:1px solid var(--border);background:var(--surface-2);}
  table.data-table td{padding:12px 16px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle;}
  table.data-table tr:last-child td{border-bottom:none;}
  .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:600;}
  .badge.demandee{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-line);}
  .badge.acceptee{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok-line);}
  .badge.annulee{background:var(--gray-bg);color:var(--ink-soft);border:1px solid var(--border);}
  .type-chip{display:inline-block;background:var(--accent-soft);color:var(--accent);padding:2px 8px;border-radius:5px;font-size:11px;margin:1px 3px 1px 0;}
  .empty{padding:40px 20px;text-align:center;color:var(--ink-faint);font-size:13px;}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .modal{background:var(--surface);border-radius:12px;padding:24px 26px;max-width:520px;width:100%;max-height:85vh;overflow-y:auto;}
  .modal h3{margin:0 0 14px;font-size:16px;color:var(--accent);}
  .modal .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}
  .toast{position:fixed;bottom:20px;right:20px;background:var(--ink);color:#fff;padding:12px 18px;border-radius:8px;font-size:13px;display:flex;align-items:center;gap:14px;z-index:200;max-width:420px;}
  .toast.success{background:var(--ok);}
  .toast.error{background:var(--danger);}
  .toast .close{background:none;border:none;color:#fff;cursor:pointer;font-size:14px;opacity:0.8;}
  .error-banner{background:var(--danger-bg);color:var(--danger);border:1px solid var(--danger-line);border-radius:8px;padding:12px 16px;font-size:13px;margin-bottom:16px;}
  .checklist-item{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--border);}
  .checklist-item:last-child{border-bottom:none;}
  .checklist-item input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent);}
  .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 20px;padding:16px 18px;}
  .info-grid div span{color:var(--ink-soft);font-size:12px;display:block;}

  /* Ecran de detail de demande (3 colonnes) */
  .detail-back{color:var(--accent);font-size:13px;text-decoration:none;display:inline-block;margin-bottom:16px;cursor:pointer;}
  .detail-grid{display:grid;grid-template-columns:1.1fr 1fr 0.9fr;gap:20px;align-items:start;}
  @media (max-width:900px){ .detail-grid{grid-template-columns:1fr;} }
  .detail-col .panel{margin-bottom:16px;}
  .req-message{background:var(--surface-2);border-left:3px solid var(--accent-line);padding:10px 14px;border-radius:6px;font-size:13px;font-style:italic;color:var(--ink-soft);margin:10px 0 18px;}
  .step-item{display:flex;gap:12px;margin-bottom:16px;}
  .step-num{width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12.5px;flex-shrink:0;}
  .step-item h4{margin:0 0 3px;font-size:13.5px;}
  .step-item p{margin:0;font-size:12.5px;color:var(--ink-soft);line-height:1.5;}
  .due-date-box{background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:8px;padding:12px 16px;margin-top:16px;}
  .due-date-box .label{font-size:11px;text-transform:uppercase;letter-spacing:0.03em;color:var(--warn);font-weight:700;}
  .due-date-box .value{font-size:16px;font-weight:700;color:var(--ink);margin-top:2px;}
  .template-card{border:1px solid var(--border);border-radius:9px;padding:14px 16px;margin-bottom:12px;}
  .template-card .row-top{display:flex;align-items:flex-start;gap:10px;}
  .template-card .file-icon{width:34px;height:34px;background:var(--accent-soft);color:var(--accent);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}
  .template-card h4{margin:0 0 4px;font-size:13.5px;}
  .template-card p{margin:0 0 10px;font-size:12px;color:var(--ink-soft);line-height:1.5;}
  .geo-note{font-size:11.5px;color:var(--ink-faint);background:var(--surface-2);padding:10px 12px;border-radius:7px;margin-top:6px;line-height:1.5;}
  .geo-note a{color:var(--accent);}
  .glossary-item{padding:12px 0;border-bottom:1px solid var(--border);}
  .glossary-item:last-child{border-bottom:none;}
  .glossary-item .fmt{display:inline-block;background:var(--gray-bg);color:var(--ink-soft);font-size:10.5px;padding:2px 7px;border-radius:5px;margin-left:6px;font-family:monospace;}
  .glossary-item h4{margin:0 0 3px;font-size:13px;}
  .glossary-item p{margin:0;font-size:12px;color:var(--ink-soft);line-height:1.5;}
  .action-bar{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;margin:24px -20px -60px;box-shadow:0 -2px 12px rgba(0,0,0,0.04);}
  .btn-start-upload{background:#E8A317;color:#2A1E00;border:none;padding:12px 26px;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;}
  .btn-start-upload:hover{background:#D6960F;}
</style>
</head>

function genererTemplate(type){
  if (type==='plots_boundaries'){
    const geojson = { type:'FeatureCollection', features:[
      { type:'Feature', properties:{ Nom_producteur:'', Code_producteur:'', PlotID:'' }, geometry:{ type:'Polygon', coordinates:[[]] } }
    ]};
    const blob = new Blob([JSON.stringify(geojson, null, 2)], {type:'application/geo+json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url; a.download='template_parcelles.geojson';
    document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
    return;
  }
  let headers, sheetName, fname;
  if (type==='product_movements'){
    headers = ['Date','Producteur (nom)','Code producteur','Origine','Destination','Type de produit','Volume (kg)','Certification','N° connaissement'];
    sheetName = 'Mouvements'; fname = 'template_mouvements_produit.xlsx';
  } else if (type==='farms_facilities'){
    headers = ['Nom producteur','Code producteur','Village / District','Pays','Surface (ha)','Latitude','Longitude','Type de site'];
    sheetName = 'Exploitations'; fname = 'template_exploitations.xlsx';
  } else {
    headers = ['Question','Réponse'];
    sheetName = 'Questionnaire'; fname = 'template_questionnaire.xlsx';
  }
  const ws = XLSX.utils.aoa_to_sheet([headers]);
  ws['!cols'] = headers.map(()=>({wch:22}));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, sheetName);
  XLSX.writeFile(wb, fname);
}

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

const DEPOT_THRESHOLDS = {
  geometrieDegenereeHa: 0.01,
  tauxEchecMax: 0.15,           // C8
  civBounds: { latMin: 4, latMax: 11, lonMin: -9, lonMax: -2 },

function normaliserCode(s){ return String(s==null?'':s).replace(/[\s_\-]/g,'').toUpperCase(); }

function trouverIdentifiantParcelle(props){
  const candidats = ['PlotID','Plot_ID','plot_id','Name','ID','Identifiant','Code'];
  for (const c of candidats){ if (props && props[c]) return String(props[c]); }
  return null;
}

function validerGeoJSON(text){
  let fc;
  try{ fc = JSON.parse(text); }
  catch(e){ return { accepted:false, blocking:['C1 : fichier illisible (JSON invalide)'], reports:[] }; }
  if (!fc || fc.type!=='FeatureCollection' || !Array.isArray(fc.features)){
    return { accepted:false, blocking:['C1 : structure GeoJSON invalide (FeatureCollection attendue)'], reports:[] };
  }

  const reports = [];
  const seenIds = {};

  fc.features.forEach((f, idx)=>{
    const r = { index: idx, errors: [], warnings: [] };
    const plotId = trouverIdentifiantParcelle(f.properties);
    r.plotId = plotId;
    if (!plotId){ r.errors.push('C3 : identifiant de parcelle manquant'); reports.push(r); return; }
    seenIds[plotId] = (seenIds[plotId]||0) + 1;

    if (!f.geometry || !f.geometry.coordinates || !f.geometry.coordinates.length){
      r.errors.push('C2 : géométrie manquante ou vide'); reports.push(r); return;
    }
    if (f.geometry.type!=='Polygon' && f.geometry.type!=='MultiPolygon'){
      r.errors.push('C2 : type de géométrie non supporté ('+f.geometry.type+')'); reports.push(r); return;
    }

    let valid = true;
    try{
      if (typeof turf!=='undefined' && turf.booleanValid){ valid = turf.booleanValid(f); }
    }catch(e){ valid = false; }
    if (!valid){ r.warnings.push('C5 : géométrie invalide (anneau non fermé ou auto-intersection) — à corriger'); }

    let areaHa = 0, centroid = null;
    try{
      areaHa = turf.area(f) / 10000;
      centroid = turf.centroid(f).geometry.coordinates; // [lon, lat]
    }catch(e){ r.warnings.push('C5 : impossible de calculer surface/centroïde sur cette géométrie'); }

    if (areaHa && areaHa < DEPOT_THRESHOLDS.geometrieDegenereeHa){
      r.warnings.push('C6 : surface quasi nulle ('+areaHa.toFixed(4)+' Ha)');
    }
    if (centroid){
      const [lon, lat] = centroid;
      const b = DEPOT_THRESHOLDS.civBounds;
      if (!(lat>=b.latMin && lat<=b.latMax && lon>=b.lonMin && lon<=b.lonMax)){
        r.warnings.push('C7 : centroïde hors de la zone attendue ('+lat.toFixed(4)+', '+lon.toFixed(4)+')');
      }
    }
    r.surfaceHa = areaHa ? Number(areaHa.toFixed(4)) : null;
    r.centroid = centroid;
    reports.push(r);
  });

  // C4 : identifiants dupliques
  Object.entries(seenIds).forEach(([pid, count])=>{
    if (count>1){
      reports.forEach(r=>{ if (r.plotId===pid) r.errors.push('C4 : identifiant "'+pid+'" utilisé '+count+' fois dans le fichier'); });
    }
  });

  const total = reports.length;
  const failed = reports.filter(r=>r.errors.length>0).length;
  const failureRate = total ? failed/total : 1;

  const blocking = [];
  if (failureRate > DEPOT_THRESHOLDS.tauxEchecMax){
    blocking.push('C8 : '+(failureRate*100).toFixed(0)+'% des parcelles en échec (seuil autorisé : '+(DEPOT_THRESHOLDS.tauxEchecMax*100)+'%) — fichier refusé dans son ensemble.');
  }

  return { accepted: blocking.length===0, blocking, total, failed, failureRate, reports };
}

// ---- R1-R4 : validation d'un registre Excel ----
function detecterLigneEntete(rows){
  const motifs = /identifiant|^id$|code|^nom$|producteur/i;
  for (let i=0;i<Math.min(rows.length, 20);i++){
    const row = rows[i] || [];
    const hits = row.filter(cell=>motifs.test(String(cell||''))).length;
    if (hits>=2) return i;
  }
  return -1;
}

function validerRegistre(arrayBuffer){
  let wb;
  try{ wb = XLSX.read(arrayBuffer, {type:'array'}); }
  catch(e){ return { accepted:false, blocking:['R1 : fichier Excel illisible'], rows:[] }; }
  const sheetName = wb.SheetNames[0];
  if (!sheetName) return { accepted:false, blocking:['R1 : aucune feuille de données détectée'], rows:[] };
  const raw = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], {header:1, defval:''});

  const headerIdx = detecterLigneEntete(raw);
  if (headerIdx===-1) return { accepted:false, blocking:["R1 : ligne d'en-tête introuvable"], rows:[] };

  const headers = raw[headerIdx].map(h=>String(h||'').trim());
  const idColIdx = headers.findIndex(h=>/identifiant|^id$|code.?parcelle|plotid/i.test(h));
  if (idColIdx===-1) return { accepted:false, blocking:['R2 : colonne identifiant de parcelle introuvable'], rows:[], headers };

  const dataRows = raw.slice(headerIdx+1).filter(r=>r.some(c=>String(c||'').trim()!==''));
  const seen = {};
  const warnings = [];
  dataRows.forEach(r=>{
    const id = String(r[idColIdx]||'').trim();
    if (id) seen[id] = (seen[id]||0)+1;
  });
  const duplicates = Object.entries(seen).filter(([,c])=>c>1);
  if (duplicates.length>0){
    warnings.push('R3 : '+duplicates.length+' identifiant(s) en double dans le registre ('+duplicates.slice(0,5).map(([id,c])=>id+' x'+c).join(', ')+(duplicates.length>5?'…':'')+')');
  }
  const hasNom = headers.some(h=>/nom|producteur/i.test(h));
  const hasSurface = headers.some(h=>/surface|superficie|ha\b/i.test(h));
  const hasCoords = headers.some(h=>/lat|lon/i.test(h));
  if (!hasNom || !hasSurface || !hasCoords){
    warnings.push('R4 : colonnes attendues manquantes ('+[!hasNom&&'nom producteur',!hasSurface&&'surface',!hasCoords&&'coordonnées'].filter(Boolean).join(', ')+')');
  }

  return {
    accepted: true, blocking: [], warnings,
    headers, idColIdx, total: dataRows.length,
    ids: dataRows.map(r=>String(r[idColIdx]||'').trim()).filter(Boolean),
  };
}

function formatRapportDepot(result, type){
  let html = '';
  if (type==='geo'){
    html += '<p><b>'+result.total+'</b> parcelle(s) analysée(s), <b>'+result.failed+'</b> en échec ('+(result.failureRate*100).toFixed(0)+'%).</p>';
    const withIssues = result.reports.filter(r=>r.errors.length || r.warnings.length).slice(0,15);
    if (withIssues.length){
      html += '<ul style="font-size:12px;max-height:180px;overflow-y:auto;padding-left:18px;">';
      withIssues.forEach(r=>{
        html += '<li><b>'+esc(r.plotId||'(sans identifiant)')+'</b> : '+[...r.errors,...r.warnings].map(esc).join(' — ')+'</li>';
      });
      html += '</ul>';
      if (result.reports.length>15) html += '<p class="hint">… et '+(result.reports.length-15)+' de plus.</p>';
    }
  } else {
    html += '<p><b>'+result.total+'</b> ligne(s) détectée(s) dans le registre.</p>';
    if (result.warnings && result.warnings.length){
      html += '<ul style="font-size:12px;">'+result.warnings.map(w=>'<li>'+esc(w)+'</li>').join('')+'</ul>';
    }
  }
  return html;
}

async function initAuth(){
  state.authLoading = true; render();
  if (!supabaseClient){ state.authLoading = false; render(); return; }
  const { data } = await supabaseClient.auth.getSession();
  state.session = data && data.session ? data.session : null;
  state.authLoading = false;
  supabaseClient.auth.onAuthStateChange((event, session)=>{
    state.session = session;
    if (session) loadAll(); else render();
  });
  render();
  if (state.session) await loadAll();
}
async function signIn(){

  if (!email || !password){ state.authError = 'Renseigne ton email et ton mot de passe.'; render(); return; }
  state.authError = '';
  const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
  if (error){ state.authError = "Connexion refusée : email ou mot de passe incorrect."; render(); }
}
async function signUp(){
  const email = fv('signup_email').trim();
  const password = fv('signup_password');
  const password2 = fv('signup_password2');
  if (!email || !password){ state.authError = 'Renseigne un email et un mot de passe.'; render(); return; }

  if (data.session){
    // connexion immediate (confirmation email desactivee sur le projet)
  } else {
    showToast("Compte créé. Si une confirmation par email est requise, vérifiez votre boîte mail avant de vous connecter.", 'success');

  }
}

/* ============================================================

   ============================================================ */
async function loadAll(){
  state.loading = true; state.error=''; state.needsOnboarding=false; render();
  try{
    const userId = state.session.user.id;
    const { data: link, error: linkErr } = await supabaseClient.from('cooperative_users').select('cooperative_id').eq('user_id', userId).maybeSingle();
    if (linkErr || !link){
      state.needsOnboarding = true;
      state.loading = false; render(); return;
    }
    const coopId = link.cooperative_id;
    const { data: coop } = await supabaseClient.from('cooperatives').select('*').eq('id', coopId).maybeSingle();
    state.coop = coop;
    const { data: demandes } = await supabaseClient.from('demandes').select('*').eq('cooperative_id', coopId).order('requested_at', {ascending:false});
    state.demandes = demandes || [];
    const { data: docs } = await supabaseClient.from('doc_check').select('*').eq('cooperative_id', coopId);
    state.docChecks = docs || [];
  }catch(e){
    state.error = "Erreur de chargement : "+e.message;
  }
  state.loading = false; render();
}

   ============================================================ */
async function soumettreDemande(input, demandeId){
  const file = input.files[0];
  if (!file) return;
  const d = state.demandes.find(x=>x.id===demandeId);
  if (!d) return;

  const nomFichier = file.name.toLowerCase();
  const estGeo = nomFichier.endsWith('.geojson') || nomFichier.endsWith('.json');
  const estExcel = nomFichier.endsWith('.xlsx') || nomFichier.endsWith('.xls') || nomFichier.endsWith('.csv');

  try{
    let controle = null, typeControle = null;
    if (estGeo){
      const text = await file.text();
      controle = validerGeoJSON(text);
      typeControle = 'geo';
    } else if (estExcel){
      const buf = await file.arrayBuffer();
      controle = validerRegistre(buf);
      typeControle = 'registre';
    }

    if (controle && !controle.accepted){
      openModal('depotRejete', { demandeId, fileName: file.name, controle, typeControle });
      input.value = '';
      return;
    }
    if (controle && ((controle.reports||[]).some(r=>r.warnings.length) || (controle.warnings||[]).length)){
      state.pendingUpload = { input, demandeId, file };
      openModal('depotAvertissement', { controle, typeControle });
      return; // l'envoi reel se fera si l'utilisateur confirme malgre les avertissements
    }

    await envoyerFichierDemande(demandeId, file);
  }catch(e){
    showToast('Erreur lors du contrôle du fichier : '+e.message);
  }
  input.value = '';
}

async function confirmerEnvoiMalgreAvertissements(){
  const p = state.pendingUpload;
  if (!p) return;
  closeModal();
  await envoyerFichierDemande(p.demandeId, p.file);
  p.input.value = '';
  state.pendingUpload = null;
}

async function envoyerFichierDemande(demandeId, file){
  try{
    const path = state.coop.id + '/demandes/' + demandeId + '_' + file.name;
    const { error: upErr } = await supabaseClient.storage.from('documents-coop').upload(path, file, { upsert: true });
    if (upErr){ showToast("Échec de l'envoi du fichier : "+upErr.message); return; }
    const { error } = await supabaseClient.from('demandes').update({
      statut: 'acceptee', fichier_path: path, fichier_nom: file.name,
      soumis_par: state.session.user.id, soumis_le: new Date().toISOString()
    }).eq('id', demandeId);
    if (error){ showToast("Échec de l'enregistrement : "+error.message); return; }
    showToast('Document soumis avec succès.', 'success');
    await loadAll();
    closeRequestDetail();
  }catch(e){
    showToast('Erreur : '+e.message);
  }
}

async function telechargerFichier(path, nom){
  try{
    const { data, error } = await supabaseClient.storage.from('documents-coop').download(path);
    if (error){ showToast('Impossible de télécharger ce fichier : '+error.message); return; }
    const url = URL.createObjectURL(data);
    const a = document.createElement('a'); a.href = url; a.download = nom || 'document';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }catch(e){ showToast('Erreur : '+e.message); }
}

  html += '</div>';

  if (state.modal) html += renderModal();
  if (state.toast) html += '<div class="toast '+(state.toast.type==='success'?'success':'error')+'"><span>'+esc(state.toast.message)+'</span><button class="close" onclick="dismissToast()">✕</button></div>';

  app.innerHTML = html;
}

function renderTypeRequestsTab(type){
  const forType = state.demandes.filter(d=>(d.types||[]).includes(type));
  const pending = forType.filter(d=>d.statut==='demandee' || d.statut==='annulee');
  const accepted = forType.filter(d=>d.statut==='acceptee');

  let html = '<div class="panel"><div class="panel-head"><h2>Data Requests — Demandes en attente ('+pending.length+')</h2></div>';
  html += renderRequestsTable(pending, false);
  html += '</div>';

  html += '<div class="panel"><div class="panel-head"><h2>Accepted Data — Données soumises ('+accepted.length+')</h2></div>';
  html += renderRequestsTable(accepted, true);
  html += '</div>';
  return html;
}

function renderRequestsTable(list, isAccepted){
  if (list.length===0) return '<div class="empty">Aucune demande'+(isAccepted?' soumise':' en attente')+' pour le moment.</div>';
  let html = '<table class="data-table"><thead><tr><th>Nom</th><th>Type(s)</th><th>Statut</th><th>Échéance</th><th>Demandée le</th><th></th></tr></thead><tbody>';
  list.forEach(d=>{
    const types = (d.types||[]).map(t=>'<span class="type-chip">'+esc(TYPE_LABELS[t]||t)+'</span>').join('');
    html += '<tr><td>'+esc(d.name)+'</td><td>'+types+'</td>'
      + '<td><span class="badge '+d.statut+'">'+(d.statut==='demandee'?'Requested':d.statut==='acceptee'?'Accepted':'Canceled')+'</span></td>'
      + '<td>'+fmtDate(d.deadline)+'</td><td>'+fmtDate(d.requested_at)+'</td>'
      + '<td><button class="btn" onclick="'+(isAccepted?"openModal('demandeSummary', {id:'"+d.id+"'})":"openRequestDetail('"+d.id+"')")+'">'+(isAccepted?'Summary':'View')+'</button></td></tr>';
  });
  html += '</tbody></table>';
  return html;
}

function renderDocumentsTab(){
  let html = '<div class="panel"><div class="panel-head"><h2>Documents de conformité</h2></div>';
  if (state.docChecks.length===0){
    html += '<div class="empty">Aucun document à vérifier pour le moment.</div>';
  } else {
    state.docChecks.forEach(d=>{
      html += '<div class="checklist-item">'
        + '<input type="checkbox" '+(d.disponible?'checked':'')+' onchange="toggleDocDisponible(\''+d.id+'\', this.checked)">'
        + '<div style="flex:1;">'+esc(d.doc)+(d.fichier_nom?' <span class="hint">— '+esc(d.fichier_nom)+'</span>':'')+'</div>'
        + (d.fichier_path ? '<button class="btn-ghost" onclick="telechargerFichier(\''+d.fichier_path+'\',\''+esc(d.fichier_nom||'')+'\')">Télécharger</button>' : '')
        + '<input type="file" style="display:none" id="doc-file-'+d.id+'" onchange="soumettreDocument(this,\''+d.id+'\')">'
        + '<button class="btn" onclick="document.getElementById(\'doc-file-'+d.id+'\').click()">Joindre un fichier</button>'
        + '</div>';
    });
  }
  html += '</div>';
  return html;
}

function renderRequestDetail(id){
  const d = state.demandes.find(x=>x.id===id);
  if (!d) return '<div class="empty">Demande introuvable.</div>';
  const types = d.types || [];

  let html = '<span class="detail-back" onclick="closeRequestDetail()">← All Requests</span>';
  html += '<div class="detail-grid">';

  // ---- Colonne 1 : detail de la demande ----
  html += '<div class="detail-col"><div class="panel"><div class="panel-head">'
    + '<h2>Data Request From '+esc(d.demandeur_nom||'ECORIGINE')+'</h2></div>'
    + '<div style="padding:16px 18px;">'
    + (d.message ? '<div class="req-message">"'+esc(d.message)+'"</div>' : '')
    + '<div class="step-item"><div class="step-num">1</div><div><h4>Review the Request</h4><p>Prends connaissance des données demandées ci-contre avant de commencer.</p></div></div>'
    + '<div class="step-item"><div class="step-num">2</div><div><h4>Submit your Response</h4><p>Télécharge le(s) modèle(s) fourni(s), remplis les informations demandées (localisation des fermes, données de traçabilité, certifications...).</p></div></div>'
    + '<div class="step-item"><div class="step-num">3</div><div><h4>Confirm Submission</h4><p>Charge le(s) fichier(s) complété(s) et valide — ECORIGINE est notifié automatiquement dès la soumission.</p></div></div>'
    + (d.deadline ? '<div class="due-date-box"><div class="label">Due Date</div><div class="value">'+fmtDate(d.deadline)+'</div></div>' : '')
    + '</div></div></div>';

  // ---- Colonne 2 : telechargement des templates ----
  html += '<div class="detail-col"><div class="panel"><div class="panel-head"><h2>Download Data Templates</h2></div><div style="padding:16px 18px;">';
  types.forEach(t=>{
    const meta = TYPE_META[t]; if (!meta) return;
    html += '<div class="template-card"><div class="row-top">'
      + '<div class="file-icon">'+meta.icon+'</div>'
      + '<div style="flex:1;"><h4>'+esc(meta.label)+' <span class="hint" title="'+esc(meta.format)+'">ⓘ</span></h4>'
      + '<p>'+esc(meta.desc)+'</p>'
      + '<button class="btn btn-primary" onclick="genererTemplate(\''+t+'\')">Download</button>'
      + '</div></div>'
      + (t==='plots_boundaries' ? '<div class="geo-note">ECORIGINE applique automatiquement de légers ajustements géométriques aux données géo transmises, afin de garantir leur conformité réglementaire (RDUE), sans invalider les limites de parcelles déclarées. <a href="#" onclick="return false;">Learn more</a></div>' : '')
      + '</div>';
  });
  html += '</div></div></div>';

  // ---- Colonne 3 : glossaire general ----
  html += '<div class="detail-col"><div class="panel"><div class="panel-head"><h2>Types de données</h2></div><div style="padding:6px 18px 16px;">'
    + '<div class="glossary-item"><h4>Master Data<span class="fmt">.XLSX / .CSV</span></h4><p>Détails de localisation de la ferme, du groupe de producteurs ou du site.</p></div>'
    + '<div class="glossary-item"><h4>Traceability Data<span class="fmt">.XLSX / .CSV</span></h4><p>Mouvements de produit : localisations de départ/arrivée, certifications, chaîne de traçabilité, volume.</p></div>'
    + '<div class="glossary-item"><h4>Geolocation Data<span class="fmt">GeoJSON</span></h4><p>Polygones et points des fermes ou groupes de producteurs.</p></div>'
    + '<div class="glossary-item"><h4>Other Documents<span class="fmt">.PDF / .JPG / .DOCX</span></h4><p>Certifications, déclarations fournisseurs, rapports d\'audit, images justificatives.</p></div>'
    + '</div><div style="padding:14px 18px;border-top:1px solid var(--border);"><div class="hint">Besoin d\'aide ?<br>Contacte <strong>nabi.ouague@ecorigine.ci</strong></div></div>'
    + '</div></div>';

  html += '</div>'; // fin detail-grid

  html += '<input type="file" style="display:none" id="detail-upload-input" onchange="soumettreDemande(this,\''+d.id+'\')">'
    + '<div class="action-bar"><span class="hint">Download and fill data templates before uploading</span>'
    + '<button class="btn-start-upload" onclick="document.getElementById(\'detail-upload-input\').click()">Start Uploading</button></div>';

  return html;
}

    + '<label class="field">N° agrément CCC<input type="text" name="onb_ccc_num"></label>'

    + '<label class="field">Siège social (adresse)<input type="text" name="onb_siege_social"></label>'

function renderModal(){
  const m = state.modal;
  if (m.type==='changerMotDePasse'){
    return '<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal">'
      + '<h3>Changer mon mot de passe</h3>'
      + '<div id="modal-fields">'
      + '<label class="field">Nouveau mot de passe<input type="password" name="newpass1" autocomplete="new-password"></label>'
      + '<label class="field">Confirmer le nouveau mot de passe<input type="password" name="newpass2" autocomplete="new-password"></label>'
      + '</div>'
      + '<div class="actions"><button class="btn" onclick="closeModal()">Annuler</button><button class="btn btn-primary" onclick="changerMotDePasse()">Mettre à jour</button></div>'
      + '</div></div>';
  }
  if (m.type==='depotRejete'){
    const p = m.payload;
    return '<div class="modal-overlay"><div class="modal">'
      + '<h3 style="color:var(--danger);">Fichier refusé</h3>'
      + '<p class="hint">'+esc(p.fileName)+' n\'a pas passé le contrôle de dépôt :</p>'
      + '<ul style="font-size:13px;color:var(--danger);padding-left:18px;">'+(p.controle.blocking||[]).map(b=>'<li>'+esc(b)+'</li>').join('')+'</ul>'
      + formatRapportDepot(p.controle, p.typeControle)
      + '<div class="actions"><button class="btn btn-primary" onclick="closeModal()">Corriger et réessayer</button></div>'
      + '</div></div>';
  }
  if (m.type==='depotAvertissement'){
    const p = m.payload;
    return '<div class="modal-overlay"><div class="modal">'
      + '<h3 style="color:var(--warn);">Le fichier est accepté, avec des remarques</h3>'
      + '<p class="hint">Vous pouvez continuer, ou corriger d\'abord ces points :</p>'
      + formatRapportDepot(p.controle, p.typeControle)
      + '<div class="actions"><button class="btn" onclick="closeModal();state.pendingUpload=null;">Annuler</button><button class="btn btn-primary" onclick="confirmerEnvoiMalgreAvertissements()">Envoyer quand même</button></div>'
      + '</div></div>';
  }
  if (m.type==='demandeSummary'){
    const d = state.demandes.find(x=>x.id===m.payload.id);
    if (!d) return '';
    return '<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal">'
      + '<h3>'+esc(d.name)+'</h3>'
      + '<div class="info-grid" style="padding:0 0 14px;grid-template-columns:1fr;">'
      + '<div><span>Fichier soumis</span>'+esc(d.fichier_nom||'—')+'</div>'
      + '<div><span>Soumis le</span>'+(d.soumis_le?new Date(d.soumis_le).toLocaleString('fr-FR'):'—')+'</div>'
      + '</div>'
      + '<button class="btn btn-primary" style="width:100%;" onclick="telechargerFichier(\''+d.fichier_path+'\',\''+esc(d.fichier_nom||'')+'\')">Télécharger le fichier</button>'
      + '<div class="actions"><button class="btn" onclick="closeModal()">Fermer</button></div>'
      + '</div></div>';
  }
  if (m.type==='majIdentite'){
    const c = state.coop;
    return '<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal">'
      + '<h3>Demander une mise à jour de la fiche</h3>'
      + '<div class="hint" style="margin-bottom:14px;">Modifie les champs concernés ci-dessous. La demande sera envoyée à ECORIGINE pour validation avant application.</div>'
      + '<div id="modal-fields">'
      + '<label class="field">Responsable — Nom<input type="text" name="maj_responsable_nom" value="'+esc(c.responsable_nom||'')+'"></label>'
      + '<label class="field">Responsable — Contact<input type="text" name="maj_responsable_contact" value="'+esc(c.responsable_contact||'')+'"></label>'
      + '<label class="field">Personne contact — Nom<input type="text" name="maj_adg_nom" value="'+esc(c.adg_nom||'')+'"></label>'
      + '<label class="field">Personne contact — Contact<input type="text" name="maj_adg_contact" value="'+esc(c.adg_contact||'')+'"></label>'
      + '<label class="field">RCCM<input type="text" name="maj_rccm" value="'+esc(c.rccm||'')+'"></label>'
      + '<label class="field">Ville<input type="text" name="maj_ville" value="'+esc(c.ville||'')+'"></label>'
      + '<label class="field">Siège social<input type="text" name="maj_siege_social" value="'+esc(c.siege_social||'')+'"></label>'
      + '<label class="field">Adresse postale<input type="text" name="maj_adresse_postale" value="'+esc(c.adresse_postale||'')+'"></label>'
      + '<label class="field">Email principal<input type="email" name="maj_email1" value="'+esc(c.email1||'')+'"></label>'
      + '<label class="field">Email secondaire<input type="email" name="maj_email2" value="'+esc(c.email2||'')+'"></label>'
      + '</div>'
      + '<div class="actions"><button class="btn" onclick="closeModal()">Annuler</button><button class="btn btn-primary" onclick="demanderMajIdentite()">Envoyer la demande</button></div>'
      + '</div></div>';
  }
  return '';
}

initAuth();
