/* ============================================================
   Stockage -- tous les fichiers echanges avec ECORIGINE, ranges en
   dossiers par type (meme organisation que l'onglet Stockage cote
   ECORIGINE). Consultation et telechargement seulement : aucune
   suppression ni depot ici (les depots se font depuis « Demandes de
   donnees » et « Documents de conformite »). Simple reorganisation de
   ce qui est deja charge dans state : demandes, demandeFichiers,
   docChecks, baseDonneesFiles, envoisCoop -- aucune donnee dupliquee.
   ============================================================ */
const STOCKAGE_DOSSIERS = [
  { cle: 'compliance', label: 'Documents de conformité (Compliance)' },
  { cle: 'masterdata', label: 'Registre des membres et données de géolocalisation' },
  { cle: 'product_movements', label: 'Fiches de traçabilité' },
  { cle: 'questionnaires', label: 'Questionnaires' },
  { cle: 'autres', label: 'Autres documents' },
  { cle: 'envois', label: 'Documents envoyés par ECORIGINE' },
];

function stockageFichiers(){
  const dossiers = {};
  STOCKAGE_DOSSIERS.forEach(d=>{ dossiers[d.cle] = { label: d.label, fichiers: [] }; });
  const demandesParId = {};
  (state.demandes||[]).forEach(d=>{ demandesParId[d.id] = d; });
  const nomDe = (nom, path)=> nom || String(path||'').split('/').pop();

  // Fichiers que la cooperative a soumis en repondant a une demande. Les depots
  // du registre et de la geolocalisation sont enregistres avec le type
  // « registre » / « geolocalisation » : ils vont dans le dossier Masterdata.
  (state.demandeFichiers||[]).forEach(f=>{
    if (!f.path) return;
    let cle = f.type;
    let sousTitre = '';
    if (cle==='registre' || cle==='geolocalisation'){
      sousTitre = cle==='registre' ? 'Registre des membres' : 'Données de géolocalisation';
      cle = 'masterdata';
    }
    if (!dossiers[cle]) cle = 'autres';
    const dem = demandesParId[f.demande_id];
    const parts = [];
    if (sousTitre) parts.push(sousTitre);
    if (dem && dem.name) parts.push(dem.name);
    else if (f.connaissement) parts.push('Connaissement '+f.connaissement);
    dossiers[cle].fichiers.push({ path: f.path, nom: nomDe(f.nom, f.path), date: f.uploaded_at, titre: parts.join(' — '), origine: 'coop' });
  });

  // Documents de conformite deposes depuis la checklist
  (state.docChecks||[]).filter(d=>d.disponible && d.fichier_path).forEach(d=>{
    dossiers.compliance.fichiers.push({ path: d.fichier_path, nom: nomDe(d.fichier_nom, d.fichier_path), date: d.soumis_le, titre: d.doc, origine: 'coop' });
  });

  // Registre et geolocalisation transmis par ECORIGINE
  (state.baseDonneesFiles||[]).forEach(f=>{
    if (!f.path) return;
    const titre = f.type==='registre' ? 'Registre des membres' : (f.type==='geolocalisation' ? 'Données de géolocalisation' : '');
    dossiers.masterdata.fichiers.push({ path: f.path, nom: nomDe(f.nom, f.path), date: f.uploaded_at, titre, origine: 'ecorigine' });
  });

  // Document joint par ECORIGINE a une demande (contrat a signer, document informatif...)
  (state.demandes||[]).filter(d=>d.fichier_source_path).forEach(d=>{
    let cle = (d.types && d.types[0]) || 'autres';
    if (!dossiers[cle]) cle = 'autres';
    dossiers[cle].fichiers.push({ path: d.fichier_source_path, nom: nomDe(d.fichier_source_nom, d.fichier_source_path), date: d.requested_at, titre: d.name, origine: 'ecorigine' });
  });

  // Documents envoyes par ECORIGINE pour information (onglet « Documents recus »)
  (state.envoisCoop||[]).forEach(e=>{
    (e.fichiers||[]).forEach(f=>{
      if (!f || !f.path) return;
      dossiers.envois.fichiers.push({ path: f.path, nom: nomDe(f.nom, f.path), date: e.created_at, titre: e.titre, origine: 'ecorigine' });
    });
  });
  return dossiers;
}

function stockageDate(d){
  if (!d) return '';
  if (/^\d{4}-\d{2}-\d{2}$/.test(String(d))) return fmtDate(d);
  try{ return new Date(d).toLocaleDateString('fr-FR'); }catch(e){ return ''; }
}

function stockageExtension(nom){
  const ext = String(nom||'').split('.').pop().toUpperCase();
  return (ext.length>0 && ext.length<=4) ? ext : ext.slice(0,3);
}

// Nom sans accents ni caracteres speciaux, pour un nom de fichier ou de dossier dans un ZIP
function stockageNomSur(s){
  return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/gi,'_').replace(/^_+|_+$/g,'') || 'fichier';
}

function toggleDossierStockage(cle){

}

function toggleSelectionDossierStockage(cle){
  if (!state.stockageSelection) state.stockageSelection = [];
  const i = state.stockageSelection.indexOf(cle);
  if (i>=0) state.stockageSelection.splice(i,1); else state.stockageSelection.push(cle);
  render();
}

function telechargerStockageFichier(i){

  telechargerFichier(f.path, f.nom);

    + '<div class="stock-layout" style="border:none;border-radius:0;">'
    + '<div class="stock-folders">'
    + cles.map(cle=>{
        const d = dossiers[cle];
        return '<div class="stock-folder'+(cle===cleActive?' active':'')+'">'
          + '<span class="stock-check"><input type="checkbox" '+(selection.includes(cle)?'checked':'')+' '+(d.fichiers.length===0?'disabled':'')+' onclick="event.stopPropagation();toggleSelectionDossierStockage(\''+cle+'\')"><span class="box"><svg viewBox="0 0 24 24"><polyline points="4 12 10 18 20 6"/></svg></span></span>'
          + '<span class="stock-folder-name" onclick="toggleDossierStockage(\''+cle+'\')">'+esc(d.label)+'</span>'
          + '<span class="stock-folder-count">'+d.fichiers.length+'</span>'
          + '</div>';
      }).join('')
    + '</div>'
    + '<div>'
    + '<div class="stock-files-head">'
    + '<input class="stock-search" type="text" placeholder="Rechercher un fichier dans ce dossier..." value="'+esc(state.stockageRecherche||'')+'" oninput="state.stockageRecherche=this.value;render();document.querySelector(\'.stock-search\').focus();document.querySelector(\'.stock-search\').setSelectionRange(this.value.length,this.value.length);">'
    + '<button class="stock-sort-btn" onclick="state.stockageTri=\''+(tri==='date'?'nom':'date')+'\';render();">Trier par '+(tri==='date'?'nom':'date')+'</button>'
    + '</div>'
    + (affiches.length===0
        ? '<div class="stock-empty">'+(dossierActif.fichiers.length===0?'Aucun fichier dans ce dossier.':'Aucun fichier ne correspond à la recherche.')+'</div>'
        : affiches.map((f,i)=>{
            const origine = f.origine==='ecorigine' ? 'Reçu d\'ECORIGINE' : 'Déposé par vous';
            const date = stockageDate(f.date);
            return '<div class="stock-file-row">'
              + '<div class="stock-file-icon">'+esc(stockageExtension(f.nom))+'</div>'
              + '<div class="stock-file-name" title="'+esc(f.nom)+(f.titre?' — '+esc(f.titre):'')+'">'+esc(f.nom)+(f.titre?' <span class="hint">— '+esc(f.titre)+'</span>':'')+'</div>'
              + '<div class="stock-file-meta">'+(date?esc(date)+' · ':'')+esc(origine)+'</div>'
              + '<button class="btn-ghost" onclick="telechargerStockageFichier('+i+')">Télécharger</button>'
              + '</div>';
          }).join(''))
    + '</div>'
    + '</div>'
    + '</div>';
  return html;
}

async function exporterStockageZip(tout){
  const dossiers = stockageFichiers();
  const cles = tout ? Object.keys(dossiers) : (state.stockageSelection||[]).filter(c=>dossiers[c]);
  if (typeof JSZip === 'undefined'){ showToast("La bibliothèque de compression n'a pas pu se charger (connexion internet requise). Réessaie dans un instant."); return; }
  const totalFichiers = cles.reduce((s,c)=>s+dossiers[c].fichiers.length, 0);
  if (totalFichiers===0){ showToast('Aucun fichier à exporter pour cette sélection.'); return; }

  const btn = document.getElementById(tout ? 'stock-export-tout-btn' : 'stock-export-selection-btn');
  if (btn){ btn.disabled = true; btn.textContent = 'Préparation…'; }
  try{
    const zip = new JSZip();
    let ok = 0, echecs = 0;
    for (const cle of cles){
      const d = dossiers[cle];
      if (d.fichiers.length===0) continue;
      const sousDossier = stockageNomSur(d.label);
      const utilises = {};
      for (const f of d.fichiers){
        const { data, error } = await supabaseClient.storage.from('documents-coop').download(f.path);
        if (error){ echecs++; continue; }
        let name = f.nom;
        if (utilises[name]){
          const parts = name.split('.');
          const ext = parts.length>1 ? '.'+parts.pop() : '';
          name = parts.join('.') + '_' + (++utilises[name]) + ext;
        } else {
          utilises[name] = 1;
        }
        zip.file(sousDossier+'/'+name, data);
        ok++;
      }
    }
    if (ok===0){ showToast("Aucun fichier n'a pu être récupéré."); return; }
    const blob = await zip.generateAsync({type:'blob'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = 'stockage_'+stockageNomSur(state.coop ? state.coop.nom : 'cooperative')+(tout?'_complet':'_selection')+'.zip';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast(echecs>0 ? ok+' fichier(s) exporté(s), mais '+echecs+' n\'ont pas pu être téléchargés. Vérifiez votre connexion et réessayez.' : ok+' fichier(s) exporté(s).', echecs>0?'error':'success');
    return;
  }catch(e){
    showToast('Échec de l\'export : '+e.message);
    return;
  }
}

        + '<div style="font-weight:600;">Connaissement '+esc(f.connaissement)+' — achat pas encore enregistré</div>'
        + '<div class="hint">Fiche « '+esc(f.nom)+' » déjà envoyée, mais les informations complémentaires (campagne, type de cacao) n\'ont jamais été renseignées.</div>'
        + '</div><button class="btn btn-primary" onclick="reprendreEnregistrementAchat(\''+f.path+'\')">Compléter</button></div></div>';
    });
    html += '</div>';
  }
  if (ventes.length===0){
    html += '<div class="empty">Aucune vente déclarée pour le moment.</div>';
  } else {
    ventes.forEach(v=>{
      const camp = (state.campagnes||[]).find(c=>c.id===v.campagne_id);
      const verif = v.verification_tracabilite ? VERIF_LABELS[v.verification_tracabilite] : null;
      html += '<div class="checklist-item-v2"><div class="checklist-row" style="align-items:flex-start;"><div style="flex:1;">'
        + '<div style="font-weight:600;">'+esc(v.connaissement||'(sans numéro)')+(v.type_cacao?' <span class="badge neutral">'+esc(v.type_cacao)+'</span>':'')+'</div>'
        + '<div class="hint">'+esc(fmtDate(v.date))+(camp?' · '+esc(camp.nom):'')+(v.periode?' · '+(v.periode==='principale'?'principale':'intermédiaire'):'')+'</div>'
        + '<div style="margin-top:4px;">'+(v.nombre_sacs?esc(v.nombre_sacs)+' sacs · ':'')+'<b>'+fmtKgVente(v.quantite_kg)+'</b> (poids net) déclarés'+(v.poids_brut?' · '+fmtKgVente(v.poids_brut)+' (poids brut)':'')+'</div>'
        + (verif ? '<div class="hint" style="margin-top:4px;'+(verif.classe==='ok'?'color:var(--ok);':verif.classe==='warn'?'color:var(--warn);':'')+'">'+esc(verif.texte)+(v.verification_tracabilite==='ecart'&&v.ecart_kg?' ('+(v.ecart_kg>0?'+':'')+fmtKgVente(v.ecart_kg)+')':'')+'</div>' : '')
        + '</div></div></div>';
    });
  }
  html += '</div>';
  return html;
}

// Parcourt les fiches de tracabilite deja envoyees (acceptees) par cette
// cooperative, et signale celles dont le connaissement n'a jamais donne lieu a
// un achat enregistre -- filet de securite si la fenetre d'enregistrement a ete
// fermee sans etre completee (session perdue, onglet ferme par erreur...).
async function calculerFichesSansAchat(){
  const candidats = (state.demandeFichiers||[]).filter(f=>f.type==='product_movements');
  if (candidats.length===0){ state.fichesTracabiliteSansAchat = []; render(); return; }
  const connaissementsExistants = new Set((state.mesVentes||[]).map(v=>String(v.connaissement||'').toUpperCase()).filter(Boolean));
  const manquants = [];
  for (const f of candidats){
    try{
      const { data: blob, error } = await supabaseClient.storage.from('documents-coop').download(f.path);
      if (error) continue;
      const buf = await blob.arrayBuffer();
      const wb = XLSX.read(buf, {type:'array', cellDates:true});
      const sheetName = wb.SheetNames.includes('Delivery Data') ? 'Delivery Data' : wb.SheetNames[0];
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], {header:1, defval:''});
      const connaissement = String((rows[7]||[])[8]||'').trim();
      if (connaissement && !connaissementsExistants.has(connaissement.toUpperCase())){
        manquants.push({ path: f.path, nom: f.nom, connaissement });
      }
    }catch(e){ continue; }
  }
  state.fichesTracabiliteSansAchat = manquants;
  render();
}

async function reprendreEnregistrementAchat(path){
  const f = (state.demandeFichiers||[]).find(x=>x.path===path);
  if (!f){ showToast('Fichier introuvable.'); return; }
  try{
    const { data: blob, error } = await supabaseClient.storage.from('documents-coop').download(path);
    if (error){ showToast('Échec du téléchargement : '+error.message); return; }
    const file = new File([blob], f.nom||'fiche.xlsx');
    const verif = await validerFicheTracabilite(file);
    if (!verif.valide){ showToast("Cette fiche n'est plus lisible : "+verif.erreurs.join(' ')); return; }
    ouvrirEnregistrementAchat(verif);
  }catch(e){
    showToast('Erreur : '+e.message);
  }
}

function fmtKgVente(n){ return (Number(n)||0).toLocaleString('fr-FR')+' kg'; }

// Ouvre la fenetre d'enregistrement de l'achat, pre-remplie avec ce qui a pu etre
// extrait de la fiche de tracabilite deja validee (connaissement, poids brut,
// sacs) -- la cooperative n'a plus qu'a completer ce que la fiche ne contient pas
// (campagne, periode, type de cacao).
function ouvrirEnregistrementAchat(ficheValidee){
  const suggestion = devinerCampagnePeriode(ficheValidee.dateConnaissement);
  state.modal = { type:'enregistrerAchat', payload: Object.assign({}, ficheValidee, suggestion) };
  render();
}

async function enregistrerAchatFinal(){
  const pl = state.modal.payload;
  const campagneId = fv('achat_campagne');
  const dateConnaissement = fv('achat_date_connaissement');
  const usineDechargement = fv('achat_usine_dechargement').trim();
  const lieuOrigine = fv('achat_lieu_origine').trim();
  const poidsBrut = Number(fv('achat_poids_brut'))||0;
  const tkm = Number(fv('achat_tkm'))||0;
  const produitCertifie = fv('achat_certifie')==='oui';
  if (!campagneId){ showToast('Sélectionne la campagne concernée.'); return; }
  if (!dateConnaissement){ showToast('Indique la date de connaissement.'); return; }
  // La periode suit la date reellement saisie ici (la cooperative a pu corriger
  // la date suggeree au depart), pas la suggestion initiale.
  const periode = periodeDepuisDateIso(dateConnaissement);
  // Si certifie, reprend le type de certification de la cooperative elle-meme
  // (une cooperative ne detient generalement qu'un seul schema) -- code court
  // attendu par le calcul des primes (RA/Fairtrade), pas le libelle complet.
  let typeCacao = '';
  if (produitCertifie){
    const certifCoop = state.coop.certifications || '';
    typeCacao = certifCoop==='Rainforest Alliance' ? 'RA' : (certifCoop || 'Certifié');
  }

  const achat = {
    id: 'a_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),
    cooperative_id: state.coop.id,
    producteur_id: '',
    date: dateConnaissement,
    // "Poids net" (cacao seul, sans les sacs) correspond au champ existant
    // "Poids net declare" (deja affiche cote admin) -- rempli depuis le total de
    // la fiche de tracabilite, qui suit le cacao livre par chaque producteur.
    quantite_kg: pl.poidsBrutTotal,
    // Poids brut (cacao + poids des sacs) n'est PAS deductible de la fiche --
    // valeur distincte, a relever manuellement sur le connaissement.
    poids_brut: poidsBrut || null,
    poids_brut_accepte: 0, poids_net_produit: 0, nombre_sacs_accepte: 0,
    nombre_sacs: pl.sacsTotal,
    connaissement: pl.connaissement, type_cacao: typeCacao,
    campagne_id: campagneId, periode: periode,
    usine_dechargement: usineDechargement || null,
    lieu_origine: lieuOrigine || null,
    tkm: tkm || null,
    // Issu directement de la fiche de tracabilite qui vient d'etre validee : rien
    // a comparer, la source est unique -- toujours "concordant" par construction.
    declare_par_coop: true, verification_tracabilite: 'concordant', ecart_kg: 0,
  };

  try{
    const { error } = await supabaseClient.from('achats').insert(achat);
    if (error){ showToast("Fiche envoyée, mais échec de l'enregistrement de l'achat : "+error.message); return; }
    state.mesVentes = (state.mesVentes||[]).concat(achat);
    // Ajoute automatiquement (ou met a jour le volume cumule si deja presente)
    // la cooperative dans les "Cooperatives partenaires" du module Certification
    // -- des sa PREMIERE livraison effective, comme convenu : pas d'ajout manuel
    // requis, le lien se fait tout seul a la premiere vente reelle.
    majPartenaireCertification(achat.cooperative_id, achat.quantite_kg);
    closeModal();
    showToast('Achat de '+fmtKgVente(achat.quantite_kg)+' (poids net) enregistré pour le connaissement '+achat.connaissement+'.', 'success');
  }catch(e){
    showToast("Échec de l'enregistrement de l'achat : "+e.message);
  }
}

// Met a jour (ou cree) la ligne de cette cooperative dans cert_partenaires --
// echoue silencieusement en cas de probleme reseau : ne doit jamais bloquer
// ni faire echouer l'enregistrement de l'achat lui-meme, qui est la vraie
// action que la cooperative est en train de faire.
async function majPartenaireCertification(cooperativeId, quantiteKgLivree){
  try{
    const nomCoop = state.coop && state.coop.id===cooperativeId ? state.coop.nom : cooperativeId;
    const { data: existante } = await supabaseClient.from('cert_partenaires').select('id, volume_tonnes').eq('cooperative_nom', nomCoop).maybeSingle();
    const tonnesLivrees = (Number(quantiteKgLivree)||0) / 1000;
    if (existante){
      const volumeActuel = parseFloat(String(existante.volume_tonnes||'0').replace(',', '.')) || 0;
      const nouveauVolume = (volumeActuel + tonnesLivrees).toFixed(1);
      await supabaseClient.from('cert_partenaires').update({ volume_tonnes: nouveauVolume }).eq('id', existante.id);
    } else {
      await supabaseClient.from('cert_partenaires').insert({
        cooperative_nom: nomCoop,
        volume_tonnes: tonnesLivrees.toFixed(1),
        code_conduite: '—',
        contrat_prime: '—',
      });
    }
  }catch(e){ /* n'interrompt jamais le flux principal de l'achat */ }
}

// Colonnes exactes du modele de registre ECORIGINE (feuille "Registre"), dans l'ordre.
// Une soumission qui ne suit pas ce modele exactement est rejetee.
const COLONNES_REGISTRE_ECORIGINE = ['Pays','Village / District / Region','Farmer ID','Farmer Name','Farmer National Traceability ID','Premier Agregateur (Cooperative)','Type de Geocoordonnees','Fichier Polygone Associe','Latitude','Longitude','Farm ID','Date de Cartographie','Surface (Ha)','Volume Estime (kg)'];

// Verification stricte du registre par rapport au modele ECORIGINE -- contrairement
// a l'import flexible cote admin, ici toute colonne manquante ou renommee entraine
// un rejet, pour garantir que seules des soumissions de bonne qualite arrivent.
async function validerRegistreMasterdata(file){
  let wb;
  try{
    const data = await file.arrayBuffer();
    wb = XLSX.read(data, {type:'array', cellDates:true});
  }catch(e){
    return { valide:false, resume:"Le fichier n'a pas pu être lu — vérifiez qu'il s'agit bien d'un fichier Excel (.xlsx).", csvRows:[{anomalie:'Fichier illisible', parcelle:'—', detail:"Vérifiez qu'il s'agit bien du modèle .xlsx téléchargé."}] };
  }
  const sheetName = wb.SheetNames.includes('Registre') ? 'Registre' : wb.SheetNames[0];
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], {header:1, defval:''});
  if (rows.length===0) return { valide:false, resume:"Le fichier est vide.", csvRows:[{anomalie:'Fichier vide', parcelle:'—', detail:'Aucune ligne trouvée.'}] };
  const headerRow = (rows[0]||[]).map(h=>String(h||'').trim());
  const manquantes = COLONNES_REGISTRE_ECORIGINE.filter(c=>!headerRow.some(h=>h.toLowerCase()===c.toLowerCase()));
  if (manquantes.length>0){
    return {
      valide:false,
      resume: manquantes.length+' colonne(s) manquante(s) ou renommée(s) par rapport au modèle ECORIGINE.',
      csvRows: manquantes.map(c=>({ anomalie:'Colonne manquante ou renommée', parcelle:'—', detail: c })),
    };
  }
  const nbLignes = rows.slice(1).filter(r=>r.some(v=>String(v||'').trim()!=='')).length;
  if (nbLignes===0) return { valide:false, resume:"Le modèle est correct, mais aucune ligne de données n'a été trouvée sous l'en-tête.", csvRows:[{anomalie:'Aucune donnée', parcelle:'—', detail:"Le modèle est correct mais ne contient aucune ligne remplie."}] };
  return { valide:true, resume:'Fichier conforme au modèle ECORIGINE : '+nbLignes+' ligne(s) de données détectée(s).', csvRows:[] };
}

// Verification du GeoJSON : geometrie valide (pas d'auto-intersection), pas de
// chevauchement de plus de 20% entre parcelles du meme fichier, et table
// attributaire contenant les 4 champs obligatoires avec un code de parcelle
// (pas le nom du producteur) dans PlotID/Name.
async function validerGeojsonMasterdata(file){
  let geojson;
  try{
    geojson = JSON.parse(await file.text());
  }catch(e){
    return { valide:false, resume:"Le fichier n'est pas un GeoJSON valide (JSON illisible).", csvRows:[{anomalie:"JSON illisible", parcelle:"—", detail:"Le fichier n'a pas pu être interprété comme un GeoJSON valide."}] };
  }
  const features = geojson.features || (geojson.type==='Feature' ? [geojson] : []);
  if (features.length===0) return { valide:false, resume:"Aucune parcelle trouvée dans ce fichier.", csvRows:[{anomalie:"Fichier vide", parcelle:"—", detail:"Aucune parcelle (feature) trouvée."}] };
  if (typeof turf === 'undefined') return { valide:false, resume:"Impossible de vérifier ce fichier pour le moment (connexion internet requise).", csvRows:[] };

  const csvRows = [];
  // Identifiant lisible d'une parcelle pour le rapport : PlotID/Name si present,
  // sinon un repli base sur sa position dans le fichier.
  const idParcelle = (f, idx) => {
    const p = f.properties || {};
    const keysLower = {};
    Object.keys(p).forEach(k=> keysLower[k.toLowerCase()] = k);
    const key = keysLower['plotid'] || keysLower['name'];
    const val = key ? String(p[key]||'').trim() : '';
    return val || ('Parcelle #'+(idx+1)+' (sans identifiant)');
  };

  // 1) champs obligatoires + code plutot que nom du producteur
  features.forEach((f,idx)=>{
    const p = f.properties || {};
    const keysLower = {};
    Object.keys(p).forEach(k=> keysLower[k.toLowerCase()] = k);
    const plotIdKey = keysLower['plotid'] || keysLower['name'];
    const ok = plotIdKey && keysLower['surface'] && keysLower['latitude'] && keysLower['longitude'];
    if (!ok){
      const manquants = [!plotIdKey&&'PlotID/Name', !keysLower['surface']&&'Surface', !keysLower['latitude']&&'Latitude', !keysLower['longitude']&&'Longitude'].filter(Boolean).join(', ');
      csvRows.push({ anomalie:'Champ(s) manquant(s)', parcelle: idParcelle(f,idx), detail:'Manque : '+manquants });
      return;
    }
    const val = String(p[plotIdKey]||'').trim();
    const ressembleANom = /^[a-zA-ZÀ-ÿ]+(\s+[a-zA-ZÀ-ÿ]+)+$/.test(val) && !/\d/.test(val);
    if (ressembleANom) csvRows.push({ anomalie:'Nom au lieu de code', parcelle: idParcelle(f,idx), detail:'Valeur "'+val+'" ressemble à un nom de producteur, pas à un code de parcelle.' });
  });

  // 2) auto-intersection (une parcelle dont le tracé se croise lui-même)
  features.forEach((f,idx)=>{
    try{
      if (f.geometry && (f.geometry.type==='Polygon' || f.geometry.type==='MultiPolygon') && turf.kinks(f).features.length>0){
        csvRows.push({ anomalie:'Auto-intersection', parcelle: idParcelle(f,idx), detail:'Le tracé du polygone se croise lui-même.' });
      }
    }catch(e){}
  });

  // 3) chevauchement de plus de 20% entre deux parcelles du meme fichier
  const withGeom = features.map((f,idx)=>{ try{ return { f, idx, aire: turf.area(f), bbox: turf.bbox(f) }; }catch(e){ return null; } }).filter(x=>x && x.aire>0);
  const bboxChevauche = (a,b)=> a[0]<=b[2] && b[0]<=a[2] && a[1]<=b[3] && b[1]<=a[3];
  for (let i=0;i<withGeom.length;i++){
    for (let j=i+1;j<withGeom.length;j++){
      if (!bboxChevauche(withGeom[i].bbox, withGeom[j].bbox)) continue;
      try{
        const inter = turf.intersect(withGeom[i].f, withGeom[j].f);
        if (inter){
          const aireInter = turf.area(inter);
          const minAire = Math.min(withGeom[i].aire, withGeom[j].aire);
          if (minAire>0 && aireInter/minAire > 0.20){
            const pct = Math.round(aireInter/minAire*100);
            csvRows.push({ anomalie:'Chevauchement >20%', parcelle: idParcelle(withGeom[i].f,withGeom[i].idx)+' / '+idParcelle(withGeom[j].f,withGeom[j].idx), detail: pct+'% de la plus petite des deux parcelles est en chevauchement.' });
          }
        }
      }catch(e){}
    }
  }

  const valide = csvRows.length===0;
  return {
    valide,
    resume: valide ? 'Fichier conforme : '+features.length+' parcelle(s) vérifiée(s), aucune anomalie détectée.' : csvRows.length+' anomalie(s) détectée(s) sur '+features.length+' parcelle(s).',
    csvRows,
  };
}

// Gere le depot d'un fichier dans l'un des deux emplacements Masterdata : bascule
// sur "en cours de verification", lance le controle correspondant, puis affiche
// le resultat -- accepte ou rejete avec son rapport. Chaque emplacement est
// independant : le rejet ou l'acceptation de l'un ne touche jamais l'autre.
async function onMasterdataFileChange(input, soustype){
  const file = input.files && input.files[0];
  input.value = '';
  if (!file) return;
  state.masterdataSlots[soustype] = { file, status:'checking', resume:null, csvRows:[] };
  render();
  const resultat = soustype==='registre' ? await validerRegistreMasterdata(file) : await validerGeojsonMasterdata(file);
  state.masterdataSlots[soustype] = { file, status: resultat.valide?'accepted':'rejected', resume: resultat.resume, csvRows: resultat.csvRows||[] };
  render();
}
function retirerMasterdataFichier(soustype){
  state.masterdataSlots[soustype] = null;
  render();
}
// Rapport CSV des anomalies -- une ligne par anomalie, avec la ou les parcelle(s)
// concernee(s) pour les problemes de geometrie (auto-intersection, chevauchement).
function telechargerRapportRejetMasterdata(soustype){
  const slot = state.masterdataSlots && state.masterdataSlots[soustype];
  if (!slot || !slot.csvRows || slot.csvRows.length===0) return;
  const entetes = ['Anomalie','Parcelle(s) concernée(s)','Détail'];
  const echapper = v => '"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const lignes = [entetes.map(echapper).join(',')]
    .concat(slot.csvRows.map(r=>[r.anomalie, r.parcelle, r.detail].map(echapper).join(',')));
  const blob = new Blob(['\uFEFF'+lignes.join('\r\n')], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download='rapport_rejet_'+soustype+'_'+(slot.file?slot.file.name.replace(/\.[^.]+$/,''):'fichier')+'.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
}

async function telechargerMesFichiersZip(type){
  const mine = (state.demandeFichiers||[]).filter(f=>f.type===type);
  if (mine.length===0){ showToast('Aucun fichier déjà soumis pour ce type.'); return; }
  if (typeof JSZip === 'undefined'){ showToast("La bibliothèque de compression n'a pas pu se charger (connexion internet requise). Réessaie dans un instant."); return; }
  const btn = document.getElementById('dl-mes-fichiers-'+type);
  if (btn){ btn.disabled = true; btn.textContent = 'Préparation…'; }
  try{
    const zip = new JSZip();
    const usedNames = new Set();
    let ok = 0;
    for (const f of mine){
      const { data, error } = await supabaseClient.storage.from('documents-coop').download(f.path);
      if (error){ showToast("Échec du téléchargement de "+(f.nom||f.path)+" : "+error.message); continue; }
      let name = f.nom || f.path.split('/').pop();
      if (usedNames.has(name)){
        const parts = name.split('.');
        const ext = parts.length>1 ? '.'+parts.pop() : '';
        name = parts.join('.') + '_' + f.id + ext;
      }
      usedNames.add(name);
      zip.file(name, data);
      ok++;
    }
    if (ok===0){ showToast("Aucun fichier n'a pu être récupéré."); if(btn){btn.disabled=false;btn.textContent='Télécharger (ZIP)';} return; }
    const blob = await zip.generateAsync({type:'blob'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = 'mes_fichiers_'+(TYPE_LABELS[type]||type).replace(/[^a-z0-9]+/gi,'_')+'.zip';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast(ok+' fichier(s) regroupé(s) dans le ZIP.', 'success');
  }catch(e){
    showToast('Erreur : '+e.message);
  }
  if (btn){ btn.disabled = false; btn.textContent = 'Télécharger (ZIP)'; }
}

      + (state.campagnes||[]).slice().sort((a,b)=>String(b.nom||'').localeCompare(String(a.nom||''))).map(c=>'<option value="'+c.id+'"'+(pl.campagneId===c.id?' selected':'')+'>'+esc(c.nom)+'</option>').join('')
      + '</select></label>'
      + '<label class="field">Date de connaissement<input type="date" name="achat_date_connaissement" value="'+esc(pl.dateIso||'')+'"></label>'
      + '<div class="info-grid" style="margin:4px 0 10px;background:var(--surface-2);padding:10px;border-radius:8px;">'
      + '<div><span>Numéro de connaissement :</span> '+esc(pl.connaissement)+'</div>'
      + '<div><span>Nombre de sacs déclarés :</span> '+esc(pl.sacsTotal||0)+'</div>'
      + '<div><span>Poids net déclaré :</span> '+fmtKgVente(pl.poidsBrutTotal)+'</div>'
      + '</div>'
      + '<label class="field">Origine<input type="text" name="achat_lieu_origine" placeholder="ex : MAHAPLEU — voir « Lieu de départ » sur le connaissement"></label>'
      + '<label class="field">Produit certifié ?<select name="achat_certifie"><option value="oui">Oui</option><option value="non">Non</option></select></label>'
      + '<label class="field">Usine de déchargement<input type="text" name="achat_usine_dechargement" value="'+esc(USINE_DECHARGEMENT_DEFAUT)+'"></label>'
      + '<label class="field">Poids brut déclaré (cacao + sacs, en kg)<input type="number" step="1" min="0" name="achat_poids_brut" placeholder="ex : 40108"></label>'
      + '<label class="field">TKM (coût au kilomètre)<input type="number" step="0.01" min="0" name="achat_tkm" placeholder="voir « Coût TKM » sur le connaissement"></label>'
      + '</div>'
      + '<div class="hint" style="margin-top:4px;">Si vous fermez sans enregistrer, vous pourrez terminer plus tard depuis l\'onglet « Mes ventes ».</div>'
      + '<div class="actions"><button type="button" class="btn" onclick="closeModal()">Plus tard</button><button type="button" class="btn btn-primary" onclick="enregistrerAchatFinal()">Enregistrer la vente</button></div>'
      + '</div></div>';
  }

  if (m.type==='majIdentite'){
    const c = state.coop;
    return '<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal">'
      + '<h3>Demander une mise à jour de la fiche</h3>'
      + '<div class="hint" style="margin-bottom:14px;">Modifie les champs concernés ci-dessous. La demande sera envoyée à ECORIGINE pour validation avant application.</div>'
      + '<div id="modal-fields">'
      + '<label class="field">Nom (sigle)<input type="text" name="maj_nom" value="'+esc(c.nom||'')+'"></label>'
      + '<label class="field">Nom complet<input type="text" name="maj_nom_complet" value="'+esc(c.nom_complet||'')+'"></label>'
      + '<label class="field">Statut de certification<select name="maj_statut">'
      + ['Non certifiée','En cours de certification','Certifiée'].map(s=>'<option value="'+s+'"'+(c.statut===s?' selected':'')+'>'+s+'</option>').join('')
      + '</select></label>'
      + '<label class="field">Certification<select name="maj_certifications">'
      + '<option value=""'+(!c.certifications?' selected':'')+'>—</option>'
      + ['Rainforest Alliance','Fairtrade','Cocoa Horizon'].map(s=>'<option value="'+s+'"'+(c.certifications===s?' selected':'')+'>'+s+'</option>').join('')
      + '</select></label>'
      + '<label class="field">Identifiant de certification<input type="text" name="maj_identifiant_certification" value="'+esc(c.identifiant_certification||'')+'"></label>'
      + '<label class="field">Date de fin de licence RA / Fairtrade<input type="date" name="maj_date_fin_licence" value="'+esc(c.date_fin_licence||'')+'"></label>'
      + '<label class="field">Volume certificat (kg)<input type="number" name="maj_volume_certificat" value="'+esc(c.volume_certificat||'')+'"></label>'
      + '<label class="field">N° agrément CCC<input type="text" name="maj_ccc_num" value="'+esc(c.ccc_num||'')+'"></label>'
      + '<label class="field">Représentant légal — Nom<input type="text" name="maj_representant_legal_nom" value="'+esc(c.representant_legal_nom||'')+'"></label>'
      + '<label class="field">Représentant légal — Contact<input type="text" name="maj_representant_legal_contact" value="'+esc(c.representant_legal_contact||'')+'"></label>'
      + '<label class="field">Personne contact — Nom<input type="text" name="maj_contact_nom" value="'+esc(c.contact_nom||'')+'"></label>'
      + '<label class="field">Personne contact — Contact<input type="text" name="maj_contact_contact" value="'+esc(c.contact_contact||'')+'"></label>'
      + '<label class="field">RCCM<input type="text" name="maj_rccm" value="'+esc(c.rccm||'')+'"></label>'
      + '<label class="field">Ville<input type="text" name="maj_ville" value="'+esc(c.ville||'')+'"></label>'
      + '<label class="field">Siège social<input type="text" name="maj_siege_social" value="'+esc(c.siege_social||'')+'"></label>'
      + '<label class="field">Adresse postale<input type="text" name="maj_adresse_postale" value="'+esc(c.adresse_postale||'')+'"></label>'
      + '<label class="field">Email 1<input type="email" name="maj_email1" value="'+esc(c.email1||'')+'"></label>'
      + '<label class="field">Email 2<input type="email" name="maj_email2" value="'+esc(c.email2||'')+'"></label>'
      + '<label class="field">Email 3<input type="email" name="maj_email3" value="'+esc(c.email3||'')+'"></label>'
      + '<label class="field">Libellé de chèque possible 1 (personne mandatée à recevoir un paiement en votre nom)<input type="text" name="maj_libelle1" value="'+esc(c.libelle1||'')+'"></label>'
      + '<label class="field">Libellé de chèque possible 2<input type="text" name="maj_libelle2" value="'+esc(c.libelle2||'')+'"></label>'
      + '<label class="field">Libellé de chèque possible 3<input type="text" name="maj_libelle3" value="'+esc(c.libelle3||'')+'"></label>'
      + '</div>'
      + '<div class="actions"><button class="btn" onclick="closeModal()">Annuler</button><button class="btn btn-primary" onclick="demanderMajIdentite()">Envoyer la demande</button></div>'
      + '</div></div>';
  }
  return '';
}

async function checkForUpdates(){
  try{
    const resp = await fetch(window.location.pathname + '?_v=' + Date.now(), { cache: 'no-store' });
    if (!resp.ok) return false;
    const text = await resp.text();
    const m = text.match(/const APP_VERSION = '([^']+)'/);
    if (m && m[1] !== APP_VERSION){
      const banner = document.getElementById('update-banner');
      if (banner) banner.style.display = 'flex';
      return true;
    }
    return false;
  }catch(e){ return false; /* pas grave -- on retentera plus tard */ }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState==='visible') checkForUpdates(); });
setInterval(checkForUpdates, 3*60*1000);

initAuth();
</script>
