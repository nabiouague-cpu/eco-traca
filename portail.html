<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ECORIGINE — Portail coopérative</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Turf.js/6.5.0/turf.min.js"></script>
<style>
  :root{
    --bg:#F5F6F5; --surface:#FFFFFF; --surface-2:#F7F8F6;
    --ink:#1E2B29; --ink-soft:#5B6B68; --ink-faint:#93A19E;
    --accent:#1F6E5C; --accent-soft:#E3F0EB; --accent-line:#A9CFC1;
    --border:#E2E6E4;
    --teal:#0E3B36; --teal-dark:#092A26; --teal-mid:#12463F;
    --gold:#F2B705; --gold-ink:#2A1E00;
    --ok:#2E7D46; --ok-bg:#E6F4EA; --ok-line:#B7DEC0;
    --warn:#B8720A; --warn-bg:#FCEFD9; --warn-line:#F0CE94;
    --info:#2C5FAE; --info-bg:#E7EEFA; --info-line:#B9CBEF;
    --danger:#B3261E; --danger-bg:#FBE7E4; --danger-line:#E9B2AB;
    --gray-bg:#EDEEEC;
    --sans:'IBM Plex Sans', system-ui, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:14px;}
  .app-shell{display:flex;min-height:100vh;}
  .sidebar{width:86px;flex-shrink:0;background:var(--teal);display:flex;flex-direction:column;align-items:center;padding:20px 0 16px;}
  .sidebar .logo-badge{width:36px;height:36px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:2px;}
  .sidebar .logo-badge img{width:26px;height:26px;object-fit:contain;}
  .sidebar .brand-name{color:#fff;font-size:9.5px;font-weight:700;letter-spacing:0.05em;margin:6px 0 22px;text-align:center;}
  .sidebar-nav{display:flex;flex-direction:column;gap:4px;width:100%;}
  .sidebar-nav-item{display:flex;flex-direction:column;align-items:center;gap:5px;padding:11px 4px;cursor:pointer;color:rgba(255,255,255,0.62);font-size:10.5px;text-align:center;border-left:3px solid transparent;line-height:1.25;background:none;border-top:none;border-right:none;border-bottom:none;width:100%;font-family:inherit;position:relative;}
  .nav-badge{position:absolute;top:6px;right:10px;background:var(--gold);color:var(--teal);font-size:10px;font-weight:700;border-radius:9px;min-width:16px;height:16px;display:flex;align-items:center;justify-content:center;padding:0 4px;line-height:1;}
  .sidebar-nav-item svg{width:19px;height:19px;}
  .sidebar-nav-item:hover{color:#fff;}
  .sidebar-nav-item.active{color:#fff;background:rgba(255,255,255,0.08);border-left-color:var(--gold);}
  .main-area{flex:1;min-width:0;}
  .top-utility{display:flex;justify-content:flex-end;align-items:center;gap:16px;padding:16px 24px 0;}
  .top-utility .coop-name{margin-right:auto;font-size:13px;color:var(--ink-soft);}
  .top-utility .coop-name strong{color:var(--ink);}
  .top-utility .user-chip{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-soft);cursor:pointer;border:none;background:none;font-family:inherit;}
  .top-utility .avatar{width:26px;height:26px;border-radius:50%;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;flex-shrink:0;}
  .wrap{max-width:100%;padding:18px 32px 60px;}
  .btn{border:1px solid var(--border);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:7px;font-size:13px;cursor:pointer;}
  .btn:hover{background:var(--surface-2);}
  .btn-primary{background:var(--gold);color:var(--gold-ink);border-color:var(--gold);font-weight:700;text-transform:uppercase;letter-spacing:0.02em;font-size:12.5px;}
  .btn-primary:hover{opacity:0.9;}
  .btn-teal{border:1px solid var(--accent-line);background:var(--accent-soft);color:var(--accent);font-weight:600;}
  .btn-teal:hover{background:#D9EBE3;}
  .btn-ghost{border:none;background:none;color:var(--accent);padding:6px 8px;font-size:12.5px;cursor:pointer;}
  .link-action{color:var(--accent);font-size:13px;cursor:pointer;}
  .link-action:hover{text-decoration:underline;}
  .btn-danger-text{border:none;background:none;color:var(--danger);padding:6px 8px;font-size:12.5px;cursor:pointer;}
  .hint{color:var(--ink-soft);font-size:12.5px;}
  .loading{padding:80px 0;text-align:center;color:var(--ink-soft);}
  .login-screen{min-height:100vh;width:100%;background:var(--teal);background-image:radial-gradient(circle at 15% 20%, rgba(255,255,255,0.04) 0, transparent 45%),radial-gradient(circle at 85% 80%, rgba(255,255,255,0.04) 0, transparent 45%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;}
  .login-lockup{display:flex;align-items:center;gap:12px;margin-bottom:24px;}
  .login-lockup .badge-logo{width:42px;height:42px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;}
  .login-lockup .badge-logo img{width:30px;height:30px;object-fit:contain;}
  .login-lockup .name{color:#fff;font-weight:800;font-size:19px;letter-spacing:0.02em;}
  .login-lockup .tagline{color:rgba(255,255,255,0.65);font-size:12px;margin-top:1px;}
  .login-box{background:var(--surface);border:none;border-radius:14px;padding:34px 32px 30px;width:100%;max-width:380px;box-shadow:0 20px 50px rgba(0,0,0,0.28);text-align:center;}
  .login-box img{width:52px;height:52px;margin-bottom:10px;}
  .login-box h2{margin:0 0 18px;font-size:15px;color:var(--teal);text-transform:uppercase;letter-spacing:0.04em;font-weight:800;}
  .field{display:block;margin-bottom:14px;text-align:left;}
  .field label, .field-label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:4px;}
  .field input, .field select, .field textarea, input[type=text], input[type=email], input[type=password], input[type=date], select, textarea{
    width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:7px;font-size:13.5px;font-family:inherit;background:var(--surface);color:var(--ink);
  }
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:18px;overflow:hidden;}
  .panel-head{padding:14px 18px;border-bottom:1px solid var(--border);}
  .panel-head h2{margin:0;font-size:15px;}
  table.data-table{width:100%;border-collapse:collapse;}
  table.data-table th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:0.03em;color:var(--ink-soft);padding:10px 16px;border-bottom:1px solid var(--border);background:var(--surface-2);}
  table.data-table td{padding:12px 16px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle;}
  table.data-table tr:last-child td{border-bottom:none;}
  .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:600;}
  .badge.demandee{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-line);}
  .badge.en_validation{background:var(--info-bg);color:var(--info);border:1px solid var(--info-line);}
  .badge.acceptee{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok-line);}
  .badge.rejetee{background:var(--danger-bg);color:var(--danger);border:1px solid var(--danger-line);}
  .badge.annulee{background:var(--gray-bg);color:var(--ink-soft);border:1px solid var(--border);}
  .field .required{color:var(--danger);}
  .type-chip{display:inline-block;background:var(--accent-soft);color:var(--accent);padding:2px 8px;border-radius:5px;font-size:11px;margin:1px 3px 1px 0;}
  .empty{padding:40px 20px;text-align:center;color:var(--ink-faint);font-size:13px;}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .modal{background:var(--surface);border-radius:12px;padding:24px 26px;max-width:520px;width:100%;max-height:85vh;overflow-y:auto;}
  .modal h3{margin:0 0 14px;font-size:16px;color:var(--accent);}
  .modal .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}
  .toast{position:fixed;bottom:20px;right:20px;background:var(--ink);color:#fff;padding:12px 18px;border-radius:8px;font-size:13px;display:flex;align-items:center;gap:14px;z-index:200;max-width:420px;}
  .toast.success{background:var(--ok);}
  .toast.error{background:var(--danger);}
  .toast .close{background:none;border:none;color:#fff;cursor:pointer;font-size:14px;opacity:0.8;}
  .error-banner{background:var(--danger-bg);color:var(--danger);border:1px solid var(--danger-line);border-radius:8px;padding:12px 16px;font-size:13px;margin-bottom:16px;}
  .checklist-item{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--border);}
  .checklist-item-v2{border-bottom:1px solid var(--border);}
  .checklist-item-v2:last-child{border-bottom:none;}
  .checklist-row{display:flex;align-items:center;gap:12px;padding:14px 18px;cursor:pointer;}
  .checklist-row:hover{background:var(--surface-2);}
  .checklist-status{width:24px;height:24px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;flex-shrink:0;}
  .checklist-status.ok{background:var(--accent);border-color:var(--accent);}
  .chevron{color:var(--ink-faint);font-size:11px;}
  .checklist-upload-zone{padding:0 18px 18px;}
  .checklist-item:last-child{border-bottom:none;}
  .checklist-item input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent);}
  .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 20px;padding:16px 18px;}
  .info-grid div span{color:var(--ink-soft);font-size:12px;display:block;}

  /* Ecran de detail de demande (3 colonnes) */
  .detail-back{color:var(--accent);font-size:13px;text-decoration:none;display:inline-block;margin-bottom:16px;cursor:pointer;}
  .detail-grid{display:grid;grid-template-columns:0.85fr 1.5fr 0.8fr;gap:20px;align-items:start;}
  @media (max-width:900px){ .detail-grid{grid-template-columns:1fr;} }
  .detail-col .panel{margin-bottom:16px;}
  .req-message{background:var(--surface-2);border-left:3px solid var(--accent-line);padding:10px 14px;border-radius:6px;font-size:13px;font-style:italic;color:var(--ink-soft);margin:10px 0 18px;}
  .step-item{display:flex;gap:12px;margin-bottom:16px;}
  .step-num{width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12.5px;flex-shrink:0;}
  .step-item h4{margin:0 0 3px;font-size:13.5px;}
  .step-item p{margin:0;font-size:12.5px;color:var(--ink-soft);line-height:1.5;}
  .due-date-box{background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:8px;padding:12px 16px;margin-top:16px;}
  .due-date-box .label{font-size:11px;text-transform:uppercase;letter-spacing:0.03em;color:var(--warn);font-weight:700;}
  .due-date-box .value{font-size:16px;font-weight:700;color:var(--ink);margin-top:2px;}
  .template-card{border:1px solid var(--border);border-radius:9px;padding:14px 16px;margin-bottom:12px;}
  .dropzone{border:2px dashed var(--border);border-radius:9px;padding:22px 14px;text-align:center;color:var(--ink-soft);font-size:13px;cursor:pointer;margin-top:10px;}
  .spinner-check{width:22px;height:22px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;margin:0 auto 8px;animation:spin-check 0.8s linear infinite;}
  @keyframes spin-check{to{transform:rotate(360deg);}}
  .dropzone:hover{border-color:var(--accent-line);background:var(--accent-soft);}
  .dropzone.dragover{border-color:var(--accent);background:var(--accent-soft);}
  .dropzone-icon{font-size:20px;color:var(--accent);margin-bottom:4px;}
  .dropzone-browse{color:var(--accent);font-weight:600;text-decoration:underline;}
  .staged-file{display:flex;align-items:center;gap:10px;border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-top:8px;background:var(--surface-2);}
  .file-icon-sm{font-size:15px;color:var(--accent);flex-shrink:0;}
  .staged-file-name{font-size:13px;color:var(--ink);font-weight:600;}
  .staged-file-status{font-size:11.5px;margin-top:1px;}
  .staged-file-status.ok{color:var(--ok);}
  .staged-file-status.warn{color:var(--warn);}
  .btn-icon-danger{border:none;background:none;color:var(--danger);cursor:pointer;font-size:14px;padding:4px 6px;flex-shrink:0;}
  .template-card .row-top{display:flex;align-items:flex-start;gap:10px;}
  .template-card .file-icon{width:34px;height:34px;background:var(--accent-soft);color:var(--accent);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}
  .template-card h4{margin:0 0 4px;font-size:13.5px;}
  .template-card p{margin:0 0 10px;font-size:12px;color:var(--ink-soft);line-height:1.5;}
  .geo-note{font-size:11.5px;color:var(--ink-faint);background:var(--surface-2);padding:10px 12px;border-radius:7px;margin-top:6px;line-height:1.5;}
  .geo-note a{color:var(--accent);}
  .glossary-item{padding:12px 0;border-bottom:1px solid var(--border);}
  .glossary-item:last-child{border-bottom:none;}
  .glossary-item .fmt{display:inline-block;background:var(--gray-bg);color:var(--ink-soft);font-size:10.5px;padding:2px 7px;border-radius:5px;margin-left:6px;font-family:monospace;}
  .glossary-item h4{margin:0 0 3px;font-size:13px;}
  .glossary-item p{margin:0;font-size:12px;color:var(--ink-soft);line-height:1.5;}
  .action-bar{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;margin:24px -20px -60px;box-shadow:0 -2px 12px rgba(0,0,0,0.04);}
  .btn-start-upload{background:#E8A317;color:#2A1E00;border:none;padding:12px 26px;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;}
  .btn-start-upload:hover{background:#D6960F;}
</style>
</head>

// Deduit la fonction du representant legal a partir du prefixe du nom de la cooperative
function deduireFonctionRepresentant(nom){
  const n = (nom||'').trim().toUpperCase();
  if (n.startsWith('SCOOPS')) return 'Président du Comité de gestion';
  if (n.startsWith('COOP-CA') || n.startsWith('COOP CA')) return 'Président du Conseil d\'Administration';
  return '';

function telechargerFichierBase64(b64, filename, mime){
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  const blob = new Blob([bytes], {type: mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

  if (type==='geolocalisation'){
    // Modele avec les 4 champs obligatoires exacts (PlotID, Surface, Latitude,
    // Longitude) et un exemple de parcelle valide (petit polygone reel), pour que
    // la coopérative voie a la fois la structure de la table attributaire et une
    // geometrie correcte a suivre.
    const geojson = { type:'FeatureCollection', features:[
      { type:'Feature', properties:{ PlotID:'FARM-0001', Surface:2.5, Latitude:6.8206, Longitude:-5.2767 },
        geometry:{ type:'Polygon', coordinates:[[[-5.2769,6.8204],[-5.2765,6.8204],[-5.2765,6.8208],[-5.2769,6.8208],[-5.2769,6.8204]]] } }
    ]};
    const blob = new Blob([JSON.stringify(geojson, null, 2)], {type:'application/geo+json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url; a.download='Modele_geolocalisation_ECORIGINE.geojson';
    document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
    return;
  }
  if (type==='registre'){
    // Vrai modele de production (Template_registre_membres.xlsx), avec ses couleurs
    // d'origine — la bibliotheque XLSX cote navigateur ne sait pas ecrire de styles,
    // donc on sert le fichier reel integre plutot que d'en generer un sans mise en forme.
    telechargerFichierBase64(TEMPLATE_REGISTRE_MEMBRES_B64, 'Template_registre_membres.xlsx', 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
    return;
  }
  let headers, sheetName, fname;
  if (type==='product_movements'){
    headers = ['Date','Producteur (nom)','Code producteur','Origine','Destination','Type de produit','Volume (kg)','Certification','N° connaissement'];
    sheetName = 'Mouvements'; fname = 'template_mouvements_produit.xlsx';
  } else {
    headers = ['Question','Réponse'];
    sheetName = 'Questionnaire'; fname = 'template_questionnaire.xlsx';
  }
  const ws = XLSX.utils.aoa_to_sheet([headers]);
  ws['!cols'] = headers.map(()=>({wch:22}));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, sheetName);
  XLSX.writeFile(wb, fname);
}

function escXmlTracabilite(s){
  return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;');
}
// Un producteur est enregistre en un seul champ "nom" -- separe en LASTNAME/FIRSTNAME
// pour la fiche en considerant que les mots ecrits entierement en MAJUSCULES forment
// le nom de famille (convention deja observee dans les registres : "KOUASSI Jean").
function splitNomProducteurTracabilite(nomComplet){
  const mots = String(nomComplet||'').trim().split(/\s+/).filter(Boolean);
  const lastname = [], firstname = [];
  mots.forEach(m=>{
    if (m.length>=2 && m===m.toUpperCase() && m!==m.toLowerCase()) lastname.push(m);
    else firstname.push(m);
  });
  if (lastname.length===0 && firstname.length>0) lastname.push(firstname.shift());
  return { lastname: lastname.join(' '), firstname: firstname.join(' ') };
}

// Genere la Fiche de lot ECORIGINE personnalisee pour la cooperative connectee :
// injecte sa propre liste de producteurs conformes dans la feuille (tres) cachee
// "COMPLIANT FARMERS" du modele reel, en respectant la structure interne du fichier
// (table Excel nommee CompliantFarmers, format XML) afin que la recherche automatique
// du nom a partir du code producteur (deja integree au modele) fonctionne directement,
// sans que la cooperative ait quoi que ce soit a configurer.
async function genererTemplateTracabiliteDynamique(){
  if (typeof JSZip === 'undefined'){ showToast("La bibliothèque de compression n'a pas pu se charger (connexion internet requise). Réessaie dans un instant."); return; }
  try{
    const { data: producteurs, error } = await supabaseClient.from('producteurs').select('code, nom').eq('cooperative_id', state.coop.id);
    if (error){ showToast('Échec de la récupération de vos producteurs : '+error.message); return; }

    const bin = atob(TEMPLATE_TRACABILITE_B64);
    const bytes = new Uint8Array(bin.length);
    for (let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
    const zip = await JSZip.loadAsync(bytes);

    const lignesValides = (producteurs||[]).filter(p=>p.code);
    let rowsXml = '';
    lignesValides.forEach((p, i)=>{
      const r = 3+i;
      const { lastname, firstname } = splitNomProducteurTracabilite(p.nom);
      rowsXml += '<row r="'+r+'">'
        + '<c r="A'+r+'" t="inlineStr"><is><t>'+escXmlTracabilite(p.code)+'</t></is></c>'
        + '<c r="B'+r+'" t="inlineStr"><is><t>'+escXmlTracabilite(p.nom)+'</t></is></c>'
        + '<c r="C'+r+'" t="inlineStr"><is><t>'+escXmlTracabilite(lastname)+'</t></is></c>'
        + '<c r="D'+r+'" t="inlineStr"><is><t>'+escXmlTracabilite(firstname)+'</t></is></c>'
        + '<c r="E'+r+'" t="inlineStr"><is><t>'+escXmlTracabilite(state.coop.nom)+'</t></is></c>'
        + '</row>';
    });

    const dernRow = lignesValides.length>0 ? (2+lignesValides.length) : 2;
    let sheet2 = await zip.file('xl/worksheets/sheet2.xml').async('string');
    sheet2 = sheet2.replace(/<dimension ref="[^"]*"\/>/, '<dimension ref="A2:K'+dernRow+'"/>');
    sheet2 = sheet2.replace('</sheetData>', rowsXml+'</sheetData>');
    zip.file('xl/worksheets/sheet2.xml', sheet2);

    let table2 = await zip.file('xl/tables/table2.xml').async('string');
    table2 = table2.replace(/ref="A2:E\d+"/g, 'ref="A2:E'+dernRow+'"');
    zip.file('xl/tables/table2.xml', table2);

    const blob = await zip.generateAsync({type:'blob', mimeType:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url; a.download='Fiche_de_lot_'+String(state.coop.nom||'coop').replace(/[^a-z0-9]+/gi,'_')+'.xlsx';
    document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
    showToast(lignesValides.length>0 ? lignesValides.length+' producteur(s) pré-chargé(s) dans le modèle.' : 'Modèle téléchargé (aucun producteur enregistré pour le moment).', 'success');
  }catch(e){
    showToast('Erreur lors de la génération du modèle : '+e.message);
  }
}

async function initAuth(){

  if (!supabaseClient){ state.authLoading = false; render(); return; }
  const { data } = await supabaseClient.auth.getSession();
  state.session = data && data.session ? data.session : null;
  state.authLoading = false;
  supabaseClient.auth.onAuthStateChange((event, session)=>{
    if (event === 'PASSWORD_RECOVERY'){
      state.session = session;
      state.passwordRecovery = true;
      render();
      return;
    }
    state.session = session;
    if (session && !state.passwordRecovery) loadAll(); else render();
  });
  render();
  if (state.session && !state.passwordRecovery) await loadAll();
}

async function loadAll(){
  state.loading = true; state.error=''; state.needsOnboarding=false; render();
  try{
    const userId = state.session.user.id;
    const { data: link, error: linkErr } = await supabaseClient.from('cooperative_users').select('cooperative_id').eq('user_id', userId).maybeSingle();
    if (linkErr || !link){
      state.needsOnboarding = true;
      state.loading = false; render(); return;
    }
    const coopId = link.cooperative_id;
    const { data: coop } = await supabaseClient.from('cooperatives').select('*').eq('id', coopId).maybeSingle();
    state.coop = coop;
    const { data: demandes } = await supabaseClient.from('demandes').select('*').eq('cooperative_id', coopId).order('requested_at', {ascending:false});
    state.demandes = demandes || [];
    const demandeIds = state.demandes.map(d=>d.id);
    const { data: fichiers } = demandeIds.length>0
      ? await supabaseClient.from('demande_fichiers').select('*').in('demande_id', demandeIds)
      : { data: [] };
    state.demandeFichiers = fichiers || [];
    const { data: docs } = await supabaseClient.from('doc_check').select('*').eq('cooperative_id', coopId);
    state.docChecks = docs || [];
    const { data: bdd } = await supabaseClient.from('coop_database_files').select('*').eq('cooperative_id', coopId);
    state.baseDonneesFiles = bdd || [];
    // Lien direct depuis un email (?demande=req_xxx) : ouvre cette requete precise,
    // une seule fois par session pour ne pas re-forcer la navigation a chaque actualisation.
    if (!state.deepLinkHandled){
      state.deepLinkHandled = true;
      const demandeId = new URLSearchParams(window.location.search).get('demande');
      if (demandeId && state.demandes.some(d=>d.id===demandeId)){
        state.tab = 'requests';
        state.view = 'requestDetail';
        state.detailId = demandeId;
        state.uploadStaging = {};
      }
    }
  }catch(e){
    state.error = "Erreur de chargement : "+e.message;
  }
  state.loading = false; render();
}

async function creerMaFiche(){
  const nom = fv('onb_nom').trim();
  const nom_complet = fv('onb_nom_complet').trim();
  const statut = fv('onb_statut');
  const certifications = fv('onb_certifications');
  const identifiant_certification = fv('onb_identifiant_certification').trim();
  const rccm = fv('onb_rccm').trim();
  const ccc_num = fv('onb_ccc_num').trim();
  const ville = fv('onb_ville').trim();
  const siege_social = fv('onb_siege_social').trim();
  const adresse_postale = fv('onb_adresse_postale').trim();
  const representant_legal_nom = fv('onb_representant_legal_nom').trim();
  const representant_legal_contact = fv('onb_representant_legal_contact').trim();
  const contact_nom = fv('onb_contact_nom').trim();
  const contact_contact = fv('onb_contact_contact').trim();
  const email1 = fv('onb_email1').trim();
  const email2 = fv('onb_email2').trim();
  const email3 = fv('onb_email3').trim();

  const manquants = [];
  if (!nom) manquants.push('Nom de la coopérative');
  if (!rccm) manquants.push('N° RCCM');
  if (!ccc_num) manquants.push('N° agrément CCC');
  if (!ville) manquants.push('Ville');
  if (!siege_social) manquants.push('Siège social');
  if (statut !== 'Non certifiée'){
    if (!certifications) manquants.push('Certification');
    if (!identifiant_certification) manquants.push('Identifiant de certification');
  }
  if (!representant_legal_nom) manquants.push('Représentant légal — Nom');
  if (!representant_legal_contact) manquants.push('Représentant légal — Contact');
  if (!contact_nom) manquants.push('Personne contact — Nom');
  if (!contact_contact) manquants.push('Personne contact — Contact');
  if (!email1) manquants.push('Email 1');
  if (manquants.length){
    showToast('Champs obligatoires manquants : '+manquants.join(', '));
    return;
  }

  const userId = state.session.user.id;
  const payload = {
    nom, nom_complet,
    statut,
    certifications,
    rccm, ccc_num,
    identifiant_certification,
    ville, siege_social, adresse_postale,
    representant_legal_nom, representant_legal_contact,
    contact_nom, contact_contact,
    email1, email2, email3,
    created_by: userId,
  };
  try{
    // Si une tentative precedente a echoue APRES la creation de la fiche mais AVANT
    // la liaison du compte (ex. erreur reseau, bug cote serveur), une fiche orpheline
    // existe deja pour ce compte. On la reutilise au lieu d'en creer une nouvelle a
    // chaque nouvel essai -- ca evite les doublons.
    let coopId = null;
    const { data: dejaLie } = await supabaseClient.from('cooperative_users').select('cooperative_id').eq('user_id', userId).maybeSingle();
    if (dejaLie){ showToast('Un compte est déjà lié à une fiche coopérative.'); return; }

    const { data: fichesOrphelines } = await supabaseClient.from('cooperatives').select('id').eq('created_by', userId).order('created_at', {ascending:true});
    if (fichesOrphelines && fichesOrphelines.length > 0){
      coopId = fichesOrphelines[0].id;
      const { error: updErr } = await supabaseClient.from('cooperatives').update(payload).eq('id', coopId);
      if (updErr){ showToast("Échec de la mise à jour de la fiche existante : "+updErr.message); return; }
    } else {
      coopId = 'coop_'+Date.now();
      const { error: coopErr } = await supabaseClient.from('cooperatives').insert(Object.assign({id: coopId}, payload));
      if (coopErr){ showToast("Échec de la création de la fiche : "+coopErr.message); return; }
    }

    const { error: linkErr } = await supabaseClient.from('cooperative_users').insert({ user_id: userId, cooperative_id: coopId });
    if (linkErr){ showToast("La fiche a été créée mais la liaison du compte a échoué : "+linkErr.message); return; }
    showToast('Votre fiche coopérative a été créée avec succès.', 'success');
    state.tab = 'documents';
    await loadAll();
  }catch(e){ showToast('Erreur : '+e.message); }
}

const FORMAT_EXT = {
  product_movements: ['.xlsx', '.csv'],
  questionnaires: ['.pdf'],
  autres: ['.pdf', '.jpg', '.jpeg', '.png', '.docx', '.xlsx', '.zip'],
};

function extOf(name){ const m = /\.[^.]+$/.exec(name||''); return m ? m[0].toLowerCase() : ''; }
function formatOk(type, name){ const allowed = FORMAT_EXT[type]||[]; return allowed.includes(extOf(name)); }

function onDropZoneDragOver(e){ e.preventDefault(); e.currentTarget.classList.add('dragover'); }
function onDropZoneDragLeave(e){ e.currentTarget.classList.remove('dragover'); }

function onDropZoneDrop(e, type){
  e.preventDefault();
  e.currentTarget.classList.remove('dragover');
  addFilesToStaging(type, e.dataTransfer.files);
}

function onFileInputChange(input, type){
  addFilesToStaging(type, input.files);
  input.value = '';
}

function addFilesToStaging(type, fileList){
  if (!fileList || !fileList.length) return;
  if (!state.uploadStaging[type]) state.uploadStaging[type] = [];
  Array.from(fileList).forEach(f => state.uploadStaging[type].push(f));
  render();
}

function removeStagedFile(type, idx){
  if (!state.uploadStaging[type]) return;
  state.uploadStaging[type].splice(idx, 1);
  render();
}

function hasAnyStagedFile(){
  return Object.values(state.uploadStaging).some(arr => arr && arr.length);
}

async function finalizeUpload(demandeId){
  const d = state.demandes.find(x=>x.id===demandeId);
  if (!d) return;
  const estMasterdata = (d.types||[]).includes('masterdata');
  if (estMasterdata && !masterdataPret()) return;
  if (!estMasterdata && !hasAnyStagedFile()) return;
  try{
    const entries = [];
    for (const type of Object.keys(state.uploadStaging)){
      for (const file of state.uploadStaging[type]){
        const path = state.coop.id + '/demandes/' + demandeId + '/' + type + '/' + file.name;
        const { error: upErr } = await supabaseClient.storage.from('documents-coop').upload(path, file, { upsert: true });
        if (upErr){ showToast("Échec de l'envoi de "+file.name+" : "+upErr.message); return; }
        entries.push({ demande_id: demandeId, type, path, nom: file.name, uploaded_by: state.session.user.id });
      }
    }
    // Les deux fichiers Masterdata (deja verifies et acceptes individuellement)
    // ne sont reellement televerses qu'a cet instant, au moment de la soumission
    // effective de la demande.
    if (estMasterdata){
      for (const soustype of ['registre','geolocalisation']){
        const slot = state.masterdataSlots[soustype];
        const path = state.coop.id + '/demandes/' + demandeId + '/' + soustype + '/' + slot.file.name;
        const { error: upErr } = await supabaseClient.storage.from('documents-coop').upload(path, slot.file, { upsert: true });
        if (upErr){ showToast("Échec de l'envoi de "+slot.file.name+" : "+upErr.message); return; }
        entries.push({ demande_id: demandeId, type: soustype, path, nom: slot.file.name, uploaded_by: state.session.user.id });
      }
    }
    if (entries.length){
      const { error: insErr } = await supabaseClient.from('demande_fichiers').insert(entries);
      if (insErr){ showToast("Fichiers envoyés mais non enregistrés en base : "+insErr.message); return; }
    }
    const { error } = await supabaseClient.from('demandes').update({
      statut: 'en_validation',
      soumis_par: state.session.user.id, soumis_le: new Date().toISOString()
    }).eq('id', demandeId);
    if (error){ showToast("Échec de l'enregistrement : "+error.message); return; }
    showToast('Document(s) soumis avec succès.', 'success');
    // Notifie ECORIGINE par email -- non-bloquant : la soumission a deja reussi,
    // un souci d'envoi d'email ne doit pas remettre ca en cause pour la cooperative.
    supabaseClient.functions.invoke('email-soumission-demande', { body: { demande_id: demandeId } }).catch(()=>{});
    state.uploadStaging = {};
    state.masterdataSlots = { registre: null, geolocalisation: null };
    await loadAll();
    closeRequestDetail();
  }catch(e){
    showToast('Erreur : '+e.message);
  }
}

  try{

    if (error){ showToast('Impossible de télécharger ce fichier : '+error.message); return; }

function findOrNewDocCheckId(docName){
  const existing = (state.docChecks||[]).find(d=>d.doc===docName);
  return existing ? existing.id : ('dc_'+state.coop.id+'_'+docName.replace(/[^a-z0-9]+/gi,'_').toLowerCase());
}

function slugifyNomDocument(docName){
  return String(docName||'')
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-zA-Z0-9]+/g,'_')
    .replace(/^_+|_+$/g,'') || 'document';
}

async function soumettreDocument(input, docName){
  const file = input.files[0];
  if (!file) return;
  try{
    const id = findOrNewDocCheckId(docName);
    // Le fichier soumis par la cooperative peut avoir un nom peu clair (scan, photo...) --
    // on le renomme selon le document de conformite auquel il correspond, extension conservee.
    const nomRenomme = slugifyNomDocument(docName) + extOf(file.name);
    const path = state.coop.id + '/documents/' + id + '_' + nomRenomme;
    const { error: upErr } = await supabaseClient.storage.from('documents-coop').upload(path, file, { upsert: true });
    if (upErr){ showToast("Échec de l'envoi : "+upErr.message); return; }
    const { error } = await supabaseClient.from('doc_check').upsert({
      id, cooperative_id: state.coop.id, doc: docName,
      disponible: true, fichier_path: path, fichier_nom: nomRenomme,
      soumis_par: state.session.user.id, soumis_le: new Date().toISOString()
    });
    if (error){ showToast('Échec : '+error.message); return; }
    showToast('Document envoyé.', 'success');
    await loadAll();
  }catch(e){ showToast('Erreur : '+e.message); }
  input.value = '';
}

async function telechargerBaseDonneesZip(){
  const files = (state.baseDonneesFiles||[]).filter(f=>f.type==='registre'||f.type==='geolocalisation');
  if (files.length===0){ showToast('Aucune donnée disponible pour le moment.'); return; }
  if (typeof JSZip === 'undefined'){ showToast("La bibliothèque de compression n'a pas pu se charger (connexion internet requise). Réessaie dans un instant."); return; }
  try{
    const zip = new JSZip();
    let ok = 0;
    for (const f of files){
      const { data, error } = await supabaseClient.storage.from('documents-coop').download(f.path);
      if (error){ showToast("Échec du téléchargement de "+(f.nom||f.path)+" : "+error.message); continue; }
      zip.file(f.nom || f.path.split('/').pop(), data);
      ok++;
    }
    if (ok===0){ showToast("Aucun fichier n'a pu être récupéré."); return; }
    const blob = await zip.generateAsync({type:'blob'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = 'donnees_ecorigine_'+String(state.coop.nom||'coop').replace(/[^a-z0-9]+/gi,'_')+'.zip';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast(ok+' fichier(s) regroupé(s) dans le ZIP.', 'success');
  }catch(e){
    showToast('Erreur : '+e.message);
  }
}

    + '<button class="btn-start-upload" '+(enabled?'':'disabled style="opacity:.45;cursor:not-allowed;"')+' onclick="finalizeUpload(\''+d.id+'\')">Soumettre la requête</button></div>';

  return html;
}

// Colonnes exactes du modele de registre ECORIGINE (feuille "Registre"), dans l'ordre.
// Une soumission qui ne suit pas ce modele exactement est rejetee.
const COLONNES_REGISTRE_ECORIGINE = ['Pays','Village / District / Region','Farmer ID','Farmer Name','Farmer National Traceability ID','Premier Agregateur (Cooperative)','Type de Geocoordonnees','Fichier Polygone Associe','Latitude','Longitude','Farm ID','Date de Cartographie','Surface (Ha)','Volume Estime (kg)'];

// Verification stricte du registre par rapport au modele ECORIGINE -- contrairement
// a l'import flexible cote admin, ici toute colonne manquante ou renommee entraine
// un rejet, pour garantir que seules des soumissions de bonne qualite arrivent.
async function validerRegistreMasterdata(file){
  let wb;
  try{
    const data = await file.arrayBuffer();
    wb = XLSX.read(data, {type:'array', cellDates:true});
  }catch(e){
    return { valide:false, resume:"Le fichier n'a pas pu être lu — vérifiez qu'il s'agit bien d'un fichier Excel (.xlsx).", csvRows:[{anomalie:'Fichier illisible', parcelle:'—', detail:"Vérifiez qu'il s'agit bien du modèle .xlsx téléchargé."}] };
  }
  const sheetName = wb.SheetNames.includes('Registre') ? 'Registre' : wb.SheetNames[0];
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], {header:1, defval:''});
  if (rows.length===0) return { valide:false, resume:"Le fichier est vide.", csvRows:[{anomalie:'Fichier vide', parcelle:'—', detail:'Aucune ligne trouvée.'}] };
  const headerRow = (rows[0]||[]).map(h=>String(h||'').trim());
  const manquantes = COLONNES_REGISTRE_ECORIGINE.filter(c=>!headerRow.some(h=>h.toLowerCase()===c.toLowerCase()));
  if (manquantes.length>0){
    return {
      valide:false,
      resume: manquantes.length+' colonne(s) manquante(s) ou renommée(s) par rapport au modèle ECORIGINE.',
      csvRows: manquantes.map(c=>({ anomalie:'Colonne manquante ou renommée', parcelle:'—', detail: c })),
    };
  }
  const nbLignes = rows.slice(1).filter(r=>r.some(v=>String(v||'').trim()!=='')).length;
  if (nbLignes===0) return { valide:false, resume:"Le modèle est correct, mais aucune ligne de données n'a été trouvée sous l'en-tête.", csvRows:[{anomalie:'Aucune donnée', parcelle:'—', detail:"Le modèle est correct mais ne contient aucune ligne remplie."}] };
  return { valide:true, resume:'Fichier conforme au modèle ECORIGINE : '+nbLignes+' ligne(s) de données détectée(s).', csvRows:[] };
}

// Verification du GeoJSON : geometrie valide (pas d'auto-intersection), pas de
// chevauchement de plus de 20% entre parcelles du meme fichier, et table
// attributaire contenant les 4 champs obligatoires avec un code de parcelle
// (pas le nom du producteur) dans PlotID/Name.
async function validerGeojsonMasterdata(file){
  let geojson;
  try{
    geojson = JSON.parse(await file.text());
  }catch(e){
    return { valide:false, resume:"Le fichier n'est pas un GeoJSON valide (JSON illisible).", csvRows:[{anomalie:"JSON illisible", parcelle:"—", detail:"Le fichier n'a pas pu être interprété comme un GeoJSON valide."}] };
  }
  const features = geojson.features || (geojson.type==='Feature' ? [geojson] : []);
  if (features.length===0) return { valide:false, resume:"Aucune parcelle trouvée dans ce fichier.", csvRows:[{anomalie:"Fichier vide", parcelle:"—", detail:"Aucune parcelle (feature) trouvée."}] };
  if (typeof turf === 'undefined') return { valide:false, resume:"Impossible de vérifier ce fichier pour le moment (connexion internet requise).", csvRows:[] };

  const csvRows = [];
  // Identifiant lisible d'une parcelle pour le rapport : PlotID/Name si present,
  // sinon un repli base sur sa position dans le fichier.
  const idParcelle = (f, idx) => {
    const p = f.properties || {};
    const keysLower = {};
    Object.keys(p).forEach(k=> keysLower[k.toLowerCase()] = k);
    const key = keysLower['plotid'] || keysLower['name'];
    const val = key ? String(p[key]||'').trim() : '';
    return val || ('Parcelle #'+(idx+1)+' (sans identifiant)');
  };

  // 1) champs obligatoires + code plutot que nom du producteur
  features.forEach((f,idx)=>{
    const p = f.properties || {};
    const keysLower = {};
    Object.keys(p).forEach(k=> keysLower[k.toLowerCase()] = k);
    const plotIdKey = keysLower['plotid'] || keysLower['name'];
    const ok = plotIdKey && keysLower['surface'] && keysLower['latitude'] && keysLower['longitude'];
    if (!ok){
      const manquants = [!plotIdKey&&'PlotID/Name', !keysLower['surface']&&'Surface', !keysLower['latitude']&&'Latitude', !keysLower['longitude']&&'Longitude'].filter(Boolean).join(', ');
      csvRows.push({ anomalie:'Champ(s) manquant(s)', parcelle: idParcelle(f,idx), detail:'Manque : '+manquants });
      return;
    }
    const val = String(p[plotIdKey]||'').trim();
    const ressembleANom = /^[a-zA-ZÀ-ÿ]+(\s+[a-zA-ZÀ-ÿ]+)+$/.test(val) && !/\d/.test(val);
    if (ressembleANom) csvRows.push({ anomalie:'Nom au lieu de code', parcelle: idParcelle(f,idx), detail:'Valeur "'+val+'" ressemble à un nom de producteur, pas à un code de parcelle.' });
  });

  // 2) auto-intersection (une parcelle dont le tracé se croise lui-même)
  features.forEach((f,idx)=>{
    try{
      if (f.geometry && (f.geometry.type==='Polygon' || f.geometry.type==='MultiPolygon') && turf.kinks(f).features.length>0){
        csvRows.push({ anomalie:'Auto-intersection', parcelle: idParcelle(f,idx), detail:'Le tracé du polygone se croise lui-même.' });
      }
    }catch(e){}
  });

  // 3) chevauchement de plus de 20% entre deux parcelles du meme fichier
  const withGeom = features.map((f,idx)=>{ try{ return { f, idx, aire: turf.area(f), bbox: turf.bbox(f) }; }catch(e){ return null; } }).filter(x=>x && x.aire>0);
  const bboxChevauche = (a,b)=> a[0]<=b[2] && b[0]<=a[2] && a[1]<=b[3] && b[1]<=a[3];
  for (let i=0;i<withGeom.length;i++){
    for (let j=i+1;j<withGeom.length;j++){
      if (!bboxChevauche(withGeom[i].bbox, withGeom[j].bbox)) continue;
      try{
        const inter = turf.intersect(withGeom[i].f, withGeom[j].f);
        if (inter){
          const aireInter = turf.area(inter);
          const minAire = Math.min(withGeom[i].aire, withGeom[j].aire);
          if (minAire>0 && aireInter/minAire > 0.20){
            const pct = Math.round(aireInter/minAire*100);
            csvRows.push({ anomalie:'Chevauchement >20%', parcelle: idParcelle(withGeom[i].f,withGeom[i].idx)+' / '+idParcelle(withGeom[j].f,withGeom[j].idx), detail: pct+'% de la plus petite des deux parcelles est en chevauchement.' });
          }
        }
      }catch(e){}
    }
  }

  const valide = csvRows.length===0;
  return {
    valide,
    resume: valide ? 'Fichier conforme : '+features.length+' parcelle(s) vérifiée(s), aucune anomalie détectée.' : csvRows.length+' anomalie(s) détectée(s) sur '+features.length+' parcelle(s).',
    csvRows,
  };
}

// Gere le depot d'un fichier dans l'un des deux emplacements Masterdata : bascule
// sur "en cours de verification", lance le controle correspondant, puis affiche
// le resultat -- accepte ou rejete avec son rapport. Chaque emplacement est
// independant : le rejet ou l'acceptation de l'un ne touche jamais l'autre.
async function onMasterdataFileChange(input, soustype){
  const file = input.files && input.files[0];
  input.value = '';
  if (!file) return;
  state.masterdataSlots[soustype] = { file, status:'checking', resume:null, csvRows:[] };
  render();
  const resultat = soustype==='registre' ? await validerRegistreMasterdata(file) : await validerGeojsonMasterdata(file);
  state.masterdataSlots[soustype] = { file, status: resultat.valide?'accepted':'rejected', resume: resultat.resume, csvRows: resultat.csvRows||[] };
  render();
}
function retirerMasterdataFichier(soustype){
  state.masterdataSlots[soustype] = null;
  render();
}
// Rapport CSV des anomalies -- une ligne par anomalie, avec la ou les parcelle(s)
// concernee(s) pour les problemes de geometrie (auto-intersection, chevauchement).
function telechargerRapportRejetMasterdata(soustype){
  const slot = state.masterdataSlots && state.masterdataSlots[soustype];
  if (!slot || !slot.csvRows || slot.csvRows.length===0) return;
  const entetes = ['Anomalie','Parcelle(s) concernée(s)','Détail'];
  const echapper = v => '"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const lignes = [entetes.map(echapper).join(',')]
    .concat(slot.csvRows.map(r=>[r.anomalie, r.parcelle, r.detail].map(echapper).join(',')));
  const blob = new Blob(['\uFEFF'+lignes.join('\r\n')], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download='rapport_rejet_'+soustype+'_'+(slot.file?slot.file.name.replace(/\.[^.]+$/,''):'fichier')+'.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
}
function masterdataPret(){
  const s = state.masterdataSlots || {};
  return s.registre && s.registre.status==='accepted' && s.geolocalisation && s.geolocalisation.status==='accepted';
}

async function telechargerMesFichiersZip(type){
  const mine = (state.demandeFichiers||[]).filter(f=>f.type===type);
  if (mine.length===0){ showToast('Aucun fichier déjà soumis pour ce type.'); return; }
  if (typeof JSZip === 'undefined'){ showToast("La bibliothèque de compression n'a pas pu se charger (connexion internet requise). Réessaie dans un instant."); return; }
  const btn = document.getElementById('dl-mes-fichiers-'+type);
  if (btn){ btn.disabled = true; btn.textContent = 'Préparation…'; }
  try{
    const zip = new JSZip();
    const usedNames = new Set();
    let ok = 0;
    for (const f of mine){
      const { data, error } = await supabaseClient.storage.from('documents-coop').download(f.path);
      if (error){ showToast("Échec du téléchargement de "+(f.nom||f.path)+" : "+error.message); continue; }
      let name = f.nom || f.path.split('/').pop();
      if (usedNames.has(name)){
        const parts = name.split('.');
        const ext = parts.length>1 ? '.'+parts.pop() : '';
        name = parts.join('.') + '_' + f.id + ext;
      }
      usedNames.add(name);
      zip.file(name, data);
      ok++;
    }
    if (ok===0){ showToast("Aucun fichier n'a pu être récupéré."); if(btn){btn.disabled=false;btn.textContent='Télécharger (ZIP)';} return; }
    const blob = await zip.generateAsync({type:'blob'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = 'mes_fichiers_'+(TYPE_LABELS[type]||type).replace(/[^a-z0-9]+/gi,'_')+'.zip';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast(ok+' fichier(s) regroupé(s) dans le ZIP.', 'success');
  }catch(e){
    showToast('Erreur : '+e.message);
  }
  if (btn){ btn.disabled = false; btn.textContent = 'Télécharger (ZIP)'; }
}

async function telechargerSommaireDemande(demandeId, linkEl){

  if (!d) return;
  const types = d.types || [];
  const mine = (state.demandeFichiers||[]).filter(f=>types.includes(f.type));

  if (typeof JSZip === 'undefined'){ showToast("La bibliothèque de compression n'a pas pu se charger (connexion internet requise). Réessaie dans un instant."); return; }
  const el = linkEl || (event && event.target);
  const originalText = el ? el.textContent : '';
  if (el){ el.textContent = 'Préparation…'; el.style.pointerEvents = 'none'; }
  try{
    const zip = new JSZip();
    const usedNames = new Set();
    let ok = 0;
    for (const f of mine){
      const { data, error } = await supabaseClient.storage.from('documents-coop').download(f.path);
      if (error){ showToast("Échec du téléchargement de "+(f.nom||f.path)+" : "+error.message); continue; }
      let name = f.nom || f.path.split('/').pop();
      if (usedNames.has(name)){
        const parts = name.split('.');
        const ext = parts.length>1 ? '.'+parts.pop() : '';
        name = parts.join('.') + '_' + f.id + ext;
      }
      usedNames.add(name);
      zip.file(name, data);
      ok++;
    }
    if (ok===0){ showToast("Aucun document n'a pu être récupéré."); }
    else {
      const blob = await zip.generateAsync({type:'blob'});
      const url = URL.createObjectURL(blob);
      const label = types.map(t=>TYPE_LABELS[t]||t).join('_') || 'documents';
      const a = document.createElement('a'); a.href = url; a.download = 'sommaire_'+label.replace(/[^a-z0-9]+/gi,'_')+'.zip';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast(ok+' document(s) regroupé(s) dans le ZIP.', 'success');
    }
  }catch(e){
    showToast('Erreur : '+e.message);
  }
  if (el){ el.textContent = originalText; el.style.pointerEvents = ''; }
}

    + '<label class="field">Personne contact — Nom <span class="required">*</span><input type="text" name="onb_contact_nom" placeholder="ADG, Directeur..."></label>'
    + '<label class="field">Personne contact — Contact <span class="required">*</span><input type="text" name="onb_contact_contact"></label>'
    + '<label class="field">Email 1 <span class="required">*</span><input type="email" name="onb_email1" value="'+esc(state.session.user.email||'')+'"></label>'
    + '<label class="field">Email 2<input type="email" name="onb_email2"></label>'
    + '<label class="field">Email 3<input type="email" name="onb_email3"></label>'
    + '</div>'
    + '<button class="btn btn-primary" style="width:100%;" onclick="creerMaFiche()">Créer ma fiche et accéder au portail</button>'
    + '</div></div>';
}

function onbToggleCertificationFields(){
  const statut = fv('onb_statut');
  const block = document.getElementById('onb-certif-block');
  if (!block) return;
  block.style.display = (statut === 'Non certifiée') ? 'none' : '';
}

function onbUpdateFonctionHint(){
  const hint = document.getElementById('onb-fonction-hint');
  if (!hint) return;
  const fonction = deduireFonctionRepresentant(fv('onb_nom'));
  hint.textContent = fonction ? ('Fonction déduite : '+fonction) : '';
}

function renderModal(){
  const m = state.modal;
  if (m.type==='sommaireDemande'){
    const d = state.demandes.find(x=>x.id===m.payload.id);
    if (!d) return '';
    const types = d.types || [];
    const mine = (state.demandeFichiers||[]).filter(f=>types.includes(f.type));
    let mhtml = '<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal wide">'
      + '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:4px;">'
      + '<h3 style="margin:0;">'+esc(d.name)+'</h3>'
      + '<span class="badge '+esc(d.statut)+'" style="flex-shrink:0;">'+esc(STATUT_LABELS[d.statut]||d.statut)+'</span>'
      + '</div>'
      + '<div class="hint" style="margin-bottom:16px;">'+types.map(t=>esc(TYPE_LABELS[t]||t)).join(', ')+' · '+mine.length+' fichier(s) soumis</div>'
      + '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;">'
      + types.filter(t=>t!=='autres').map(t=>'<button class="btn btn-teal" onclick="'+(t==='product_movements'?'genererTemplateTracabiliteDynamique()':'genererTemplate(\''+t+'\')')+'">Télécharger un nouveau modèle'+(types.length>1?' — '+esc(TYPE_LABELS[t]||t):'')+'</button>').join('')
      + '</div>';
    if (mine.length===0){
      mhtml += '<div class="empty">Aucun fichier soumis pour le moment.</div>';
    } else {
      mhtml += '<div class="achat-list" style="margin-bottom:6px;">'
        + mine.map(f=>{
            const meta = TYPE_META[f.type];
            return '<div class="achat-item"><span>'+(meta?meta.icon+' ':'')+esc(f.nom||f.path.split('/').pop())+'</span>'
              + '<button class="btn-ghost" onclick="telechargerFichier(\''+esc(f.path)+'\',\''+esc(f.nom||'')+'\')">Télécharger</button></div>';
          }).join('')
        + '</div>';
    }
    mhtml += '<div class="actions" style="justify-content:space-between;align-items:center;">'
      + '<span class="link-action" onclick="telechargerSommaireDemande(\''+d.id+'\',this)">Télécharger tout (ZIP) ⭳</span>'
      + '<button class="btn" onclick="closeModal()">Fermer</button>'
      + '</div>'
      + '</div></div>';
    return mhtml;
  }

  if (m.type==='majIdentite'){
    const c = state.coop;
    return '<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal">'
      + '<h3>Demander une mise à jour de la fiche</h3>'
      + '<div class="hint" style="margin-bottom:14px;">Modifie les champs concernés ci-dessous. La demande sera envoyée à ECORIGINE pour validation avant application.</div>'
      + '<div id="modal-fields">'
      + '<label class="field">Nom (sigle)<input type="text" name="maj_nom" value="'+esc(c.nom||'')+'"></label>'
      + '<label class="field">Nom complet<input type="text" name="maj_nom_complet" value="'+esc(c.nom_complet||'')+'"></label>'
      + '<label class="field">Statut de certification<select name="maj_statut">'
      + ['Non certifiée','En cours de certification','Certifiée'].map(s=>'<option value="'+s+'"'+(c.statut===s?' selected':'')+'>'+s+'</option>').join('')
      + '</select></label>'
      + '<label class="field">Certification<select name="maj_certifications">'
      + '<option value=""'+(!c.certifications?' selected':'')+'>—</option>'
      + ['Rainforest Alliance','Fairtrade','Cocoa Horizon'].map(s=>'<option value="'+s+'"'+(c.certifications===s?' selected':'')+'>'+s+'</option>').join('')
      + '</select></label>'
      + '<label class="field">Identifiant de certification<input type="text" name="maj_identifiant_certification" value="'+esc(c.identifiant_certification||'')+'"></label>'
      + '<label class="field">N° agrément CCC<input type="text" name="maj_ccc_num" value="'+esc(c.ccc_num||'')+'"></label>'
      + '<label class="field">Représentant légal — Nom<input type="text" name="maj_representant_legal_nom" value="'+esc(c.representant_legal_nom||'')+'"></label>'
      + '<label class="field">Représentant légal — Contact<input type="text" name="maj_representant_legal_contact" value="'+esc(c.representant_legal_contact||'')+'"></label>'
      + '<label class="field">Personne contact — Nom<input type="text" name="maj_contact_nom" value="'+esc(c.contact_nom||'')+'"></label>'
      + '<label class="field">Personne contact — Contact<input type="text" name="maj_contact_contact" value="'+esc(c.contact_contact||'')+'"></label>'
      + '<label class="field">RCCM<input type="text" name="maj_rccm" value="'+esc(c.rccm||'')+'"></label>'
      + '<label class="field">Ville<input type="text" name="maj_ville" value="'+esc(c.ville||'')+'"></label>'
      + '<label class="field">Siège social<input type="text" name="maj_siege_social" value="'+esc(c.siege_social||'')+'"></label>'
      + '<label class="field">Adresse postale<input type="text" name="maj_adresse_postale" value="'+esc(c.adresse_postale||'')+'"></label>'
      + '<label class="field">Email 1<input type="email" name="maj_email1" value="'+esc(c.email1||'')+'"></label>'
      + '<label class="field">Email 2<input type="email" name="maj_email2" value="'+esc(c.email2||'')+'"></label>'
      + '<label class="field">Email 3<input type="email" name="maj_email3" value="'+esc(c.email3||'')+'"></label>'
      + '</div>'
      + '<div class="actions"><button class="btn" onclick="closeModal()">Annuler</button><button class="btn btn-primary" onclick="demanderMajIdentite()">Envoyer la demande</button></div>'
      + '</div></div>';
  }
  return '';
}

async function checkForUpdates(){
  try{
    const resp = await fetch(window.location.pathname + '?_v=' + Date.now(), { cache: 'no-store' });
    if (!resp.ok) return;
    const text = await resp.text();
    const m = text.match(/const APP_VERSION = '([^']+)'/);
    if (m && m[1] !== APP_VERSION){
      const banner = document.getElementById('update-banner');
      if (banner) banner.style.display = 'flex';
    }
  }catch(e){ /* pas grave -- on retentera plus tard */ }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState==='visible') checkForUpdates(); });
setInterval(checkForUpdates, 3*60*1000);

initAuth();
</script>
