<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ECORIGINE — Portail coopérative</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root{
    --bg:#F5F6F5; --surface:#FFFFFF; --surface-2:#F7F8F6;
    --ink:#1E2B29; --ink-soft:#5B6B68; --ink-faint:#93A19E;
    --accent:#1F6E5C; --accent-soft:#E3F0EB; --accent-line:#A9CFC1;
    --border:#E2E6E4;
    --teal:#0E3B36; --teal-dark:#092A26; --teal-mid:#12463F;
    --gold:#F2B705; --gold-ink:#2A1E00;
    --ok:#2E7D46; --ok-bg:#E6F4EA; --ok-line:#B7DEC0;
    --warn:#B8720A; --warn-bg:#FCEFD9; --warn-line:#F0CE94;
    --info:#2C5FAE; --info-bg:#E7EEFA; --info-line:#B9CBEF;
    --danger:#B3261E; --danger-bg:#FBE7E4; --danger-line:#E9B2AB;
    --gray-bg:#EDEEEC;
    --sans:'IBM Plex Sans', system-ui, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:14px;}
  .app-shell{display:flex;min-height:100vh;}
  .sidebar{width:86px;flex-shrink:0;background:var(--teal);display:flex;flex-direction:column;align-items:center;padding:20px 0 16px;}
  .sidebar .logo-badge{width:36px;height:36px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:2px;}
  .sidebar .logo-badge img{width:26px;height:26px;object-fit:contain;}
  .sidebar .brand-name{color:#fff;font-size:9.5px;font-weight:700;letter-spacing:0.05em;margin:6px 0 22px;text-align:center;}
  .sidebar-nav{display:flex;flex-direction:column;gap:4px;width:100%;}
  .sidebar-nav-item{display:flex;flex-direction:column;align-items:center;gap:5px;padding:11px 4px;cursor:pointer;color:rgba(255,255,255,0.62);font-size:10.5px;text-align:center;border-left:3px solid transparent;line-height:1.25;background:none;border-top:none;border-right:none;border-bottom:none;width:100%;font-family:inherit;}
  .sidebar-nav-item svg{width:19px;height:19px;}
  .sidebar-nav-item:hover{color:#fff;}
  .sidebar-nav-item.active{color:#fff;background:rgba(255,255,255,0.08);border-left-color:var(--gold);}
  .main-area{flex:1;min-width:0;}
  .top-utility{display:flex;justify-content:flex-end;align-items:center;gap:16px;padding:16px 24px 0;}
  .top-utility .coop-name{margin-right:auto;font-size:13px;color:var(--ink-soft);}
  .top-utility .coop-name strong{color:var(--ink);}
  .topbar-dark{background:var(--teal-dark);display:flex;align-items:center;justify-content:space-between;padding:14px 24px;}
  .topbar-logo{color:#fff;font-weight:700;font-size:16px;letter-spacing:0.02em;}
  .topbar-right{display:flex;align-items:center;gap:18px;}
  .lang-select{color:#fff;font-size:12.5px;opacity:0.85;display:flex;align-items:center;gap:4px;cursor:pointer;}
  .user-menu-wrap{position:relative;}
  .user-chip-dark{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#fff;cursor:pointer;border:none;background:none;font-family:inherit;}
  .user-chip-dark .avatar{width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;flex-shrink:0;}
  .user-menu-dropdown{position:absolute;top:calc(100% + 8px);right:0;background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,0.12);min-width:200px;overflow:hidden;z-index:50;}
  .user-menu-dropdown button{display:block;width:100%;text-align:left;padding:10px 14px;border:none;background:none;font-size:13px;color:var(--ink);cursor:pointer;font-family:inherit;}
  .user-menu-dropdown button:hover{background:var(--surface-2);}
  .wrap{max-width:1100px;margin:0 auto;padding:18px 24px 60px;}
  .btn{border:1px solid var(--border);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:7px;font-size:13px;cursor:pointer;}
  .btn:hover{background:var(--surface-2);}
  .btn-primary{background:var(--gold);color:var(--gold-ink);border-color:var(--gold);font-weight:700;text-transform:uppercase;letter-spacing:0.02em;font-size:12.5px;}
  .btn-primary:hover{opacity:0.9;}
  .btn-teal{border:1px solid var(--accent-line);background:var(--accent-soft);color:var(--accent);font-weight:600;}
  .btn-teal:hover{background:#D9EBE3;}
  .btn-ghost{border:none;background:none;color:var(--accent);padding:6px 8px;font-size:12.5px;cursor:pointer;}
  .btn-danger-text{border:none;background:none;color:var(--danger);padding:6px 8px;font-size:12.5px;cursor:pointer;}
  .hint{color:var(--ink-soft);font-size:12.5px;}
  .loading{padding:80px 0;text-align:center;color:var(--ink-soft);}
  .login-screen{min-height:100vh;width:100%;background:var(--teal);background-image:radial-gradient(circle at 15% 20%, rgba(255,255,255,0.04) 0, transparent 45%),radial-gradient(circle at 85% 80%, rgba(255,255,255,0.04) 0, transparent 45%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;}
  .login-lockup{display:flex;align-items:center;gap:12px;margin-bottom:24px;}
  .login-lockup .badge-logo{width:42px;height:42px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;}
  .login-lockup .badge-logo img{width:30px;height:30px;object-fit:contain;}
  .login-lockup .name{color:#fff;font-weight:800;font-size:19px;letter-spacing:0.02em;}
  .login-lockup .tagline{color:rgba(255,255,255,0.65);font-size:12px;margin-top:1px;}
  .login-box{background:var(--surface);border:none;border-radius:14px;padding:34px 32px 30px;width:100%;max-width:380px;box-shadow:0 20px 50px rgba(0,0,0,0.28);text-align:center;}
  .login-box img{width:52px;height:52px;margin-bottom:10px;}
  .login-box h2{margin:0 0 18px;font-size:15px;color:var(--teal);text-transform:uppercase;letter-spacing:0.04em;font-weight:800;}
  .field{display:block;margin-bottom:14px;text-align:left;}
  .field label, .field-label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:4px;}
  .field input, .field select, .field textarea, input[type=text], input[type=email], input[type=password], input[type=date], select, textarea{
    width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:7px;font-size:13.5px;font-family:inherit;background:var(--surface);color:var(--ink);
  }
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:18px;overflow:hidden;}
  .panel-head{padding:14px 18px;border-bottom:1px solid var(--border);}
  .panel-head h2{margin:0;font-size:15px;}
  table.data-table{width:100%;border-collapse:collapse;}
  table.data-table th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:0.03em;color:var(--ink-soft);padding:10px 16px;border-bottom:1px solid var(--border);background:var(--surface-2);}
  table.data-table td{padding:12px 16px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle;}
  table.data-table tr:last-child td{border-bottom:none;}
  .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:600;}
  .badge.demandee{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-line);}
  .badge.en_validation{background:var(--info-bg);color:var(--info);border:1px solid var(--info-line);}
  .badge.acceptee{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok-line);}
  .badge.rejetee{background:var(--danger-bg);color:var(--danger);border:1px solid var(--danger-line);}
  .badge.annulee{background:var(--gray-bg);color:var(--ink-soft);border:1px solid var(--border);}
  .field .required{color:var(--danger);}
  .type-chip{display:inline-block;background:var(--accent-soft);color:var(--accent);padding:2px 8px;border-radius:5px;font-size:11px;margin:1px 3px 1px 0;}
  .empty{padding:40px 20px;text-align:center;color:var(--ink-faint);font-size:13px;}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .modal{background:var(--surface);border-radius:12px;padding:24px 26px;max-width:520px;width:100%;max-height:85vh;overflow-y:auto;}
  .modal h3{margin:0 0 14px;font-size:16px;color:var(--accent);}
  .modal .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}
  .toast{position:fixed;bottom:20px;right:20px;background:var(--ink);color:#fff;padding:12px 18px;border-radius:8px;font-size:13px;display:flex;align-items:center;gap:14px;z-index:200;max-width:420px;}
  .toast.success{background:var(--ok);}
  .toast.error{background:var(--danger);}
  .toast .close{background:none;border:none;color:#fff;cursor:pointer;font-size:14px;opacity:0.8;}
  .error-banner{background:var(--danger-bg);color:var(--danger);border:1px solid var(--danger-line);border-radius:8px;padding:12px 16px;font-size:13px;margin-bottom:16px;}
  .checklist-item{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--border);}
  .checklist-item:last-child{border-bottom:none;}
  .checklist-item input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent);}
  .checklist-item-v2{border-bottom:1px solid var(--border);}
  .checklist-item-v2:last-child{border-bottom:none;}
  .checklist-row{display:flex;align-items:center;gap:12px;padding:14px 18px;cursor:pointer;}
  .checklist-row:hover{background:var(--surface-2);}
  .checklist-status{width:24px;height:24px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;flex-shrink:0;}
  .checklist-status.ok{background:var(--accent);border-color:var(--accent);}
  .chevron{color:var(--ink-faint);font-size:11px;}
  .checklist-upload-zone{padding:0 18px 18px;}
  .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 20px;padding:16px 18px;}
  .info-grid div span{color:var(--ink-soft);font-size:12px;display:block;}

  /* Ecran de detail de demande (3 colonnes) */
  .detail-back{color:var(--accent);font-size:13px;text-decoration:none;display:inline-block;margin-bottom:16px;cursor:pointer;}
  .detail-grid{display:grid;grid-template-columns:0.85fr 1.5fr 0.8fr;gap:20px;align-items:start;}
  @media (max-width:900px){ .detail-grid{grid-template-columns:1fr;} }
  .detail-col .panel{margin-bottom:16px;}
  .req-message{background:var(--surface-2);border-left:3px solid var(--accent-line);padding:10px 14px;border-radius:6px;font-size:13px;font-style:italic;color:var(--ink-soft);margin:10px 0 18px;}
  .step-item{display:flex;gap:12px;margin-bottom:16px;}
  .step-num{width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12.5px;flex-shrink:0;}
  .step-item h4{margin:0 0 3px;font-size:13.5px;}
  .step-item p{margin:0;font-size:12.5px;color:var(--ink-soft);line-height:1.5;}
  .due-date-box{background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:8px;padding:12px 16px;margin-top:16px;}
  .due-date-box .label{font-size:11px;text-transform:uppercase;letter-spacing:0.03em;color:var(--warn);font-weight:700;}
  .due-date-box .value{font-size:16px;font-weight:700;color:var(--ink);margin-top:2px;}
  .template-card{border:1px solid var(--border);border-radius:9px;padding:14px 16px;margin-bottom:12px;}
  .template-card .row-top{display:flex;align-items:flex-start;gap:10px;}
  .template-card .file-icon{width:34px;height:34px;background:var(--accent-soft);color:var(--accent);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}
  .template-card h4{margin:0 0 4px;font-size:13.5px;}
  .template-card p{margin:0 0 10px;font-size:12px;color:var(--ink-soft);line-height:1.5;}
  .geo-note{font-size:11.5px;color:var(--ink-faint);background:var(--surface-2);padding:10px 12px;border-radius:7px;margin-top:6px;line-height:1.5;}
  .geo-note a{color:var(--accent);}
  .glossary-item{padding:12px 0;border-bottom:1px solid var(--border);}
  .glossary-item:last-child{border-bottom:none;}
  .glossary-item .fmt{display:inline-block;background:var(--gray-bg);color:var(--ink-soft);font-size:10.5px;padding:2px 7px;border-radius:5px;margin-left:6px;font-family:monospace;}
  .glossary-item h4{margin:0 0 3px;font-size:13px;}
  .glossary-item p{margin:0;font-size:12px;color:var(--ink-soft);line-height:1.5;}
  .action-bar{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;margin:24px -20px -60px;box-shadow:0 -2px 12px rgba(0,0,0,0.04);}
  .btn-start-upload{background:#E8A317;color:#2A1E00;border:none;padding:12px 26px;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;}
  .btn-start-upload:hover:not(:disabled){background:#D6960F;}
  .btn-start-upload:disabled{background:var(--gray-bg);color:var(--ink-faint);cursor:not-allowed;}
  .drop-zone{border:2px dashed var(--accent-line);border-radius:10px;padding:36px 20px;text-align:center;cursor:pointer;color:var(--ink-soft);font-size:14px;transition:background 0.15s, border-color 0.15s;}
  .drop-zone:hover{background:var(--accent-soft);border-color:var(--accent);}
  .drop-zone.has-file{border-style:solid;border-color:var(--accent);background:var(--accent-soft);}
  .drop-zone-icon{font-size:26px;margin-bottom:8px;color:var(--accent);}
  .drop-zone-file{font-size:15px;color:var(--ink);margin-bottom:4px;}
  .upload-controls-row{display:flex;align-items:center;gap:16px;margin-top:10px;flex-wrap:wrap;}
  .crop-select{padding:6px 10px;border:1px solid var(--border);border-radius:6px;font-size:12.5px;background:var(--surface);color:var(--ink);}
  .toggle-row{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-soft);cursor:pointer;}
  .toggle-row input{accent-color:var(--accent);}
  .uploaded-file-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--border);border-radius:8px;margin-top:14px;background:var(--surface-2);}
  .btn-icon-trash{border:none;background:none;cursor:pointer;font-size:16px;color:var(--danger);padding:4px;}
</style>
</head>

// Deduit la fonction du representant legal a partir du prefixe du nom de la cooperative
function deduireFonctionRepresentant(nom){
  const n = (nom||'').trim().toUpperCase();
  if (n.startsWith('SCOOPS')) return 'Président du Comité de gestion';
  if (n.startsWith('COOP-CA') || n.startsWith('COOP CA')) return 'Président du Conseil d\'Administration';

function xmlEscape(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

async function genererTemplateTracabiliteDynamique(){
  try{
    const { data: producteurs, error } = await supabaseClient.from('producteurs_valides').select('*').eq('cooperative_id', state.coop.id);
    if (error){ showToast("Impossible de charger la liste des producteurs valides : "+error.message); return; }
    if (!producteurs || producteurs.length===0){
      showToast("Aucun producteur valide n'est encore enregistre pour votre cooperative — contactez ECORIGINE pour faire valider votre registre des membres au prealable.");
      return;
    }

    const binary = atob(TEMPLATE_TRACABILITE_B64);
    const bytes = new Uint8Array(binary.length);
    for (let i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);
    const zip = await JSZip.loadAsync(bytes);

    let rowsXml = '';
    producteurs.forEach((p, i)=>{
      const r = i + 3;
      rowsXml += `<row r="${r}">`
        + `<c r="A${r}" t="inlineStr"><is><t>${xmlEscape(p.code)}</t></is></c>`
        + `<c r="B${r}" t="inlineStr"><is><t>${xmlEscape((p.prenom?p.prenom+' ':'')+(p.nom||''))}</t></is></c>`
        + `<c r="C${r}" t="inlineStr"><is><t>${xmlEscape(p.nom)}</t></is></c>`
        + `<c r="D${r}" t="inlineStr"><is><t>${xmlEscape(p.prenom)}</t></is></c>`
        + `<c r="E${r}" t="inlineStr"><is><t>${xmlEscape(state.coop.nom)}</t></is></c>`
        + `</row>`;
    });
    const dernLigne = producteurs.length + 2;

    let sheet2 = await zip.file('xl/worksheets/sheet2.xml').async('string');
    sheet2 = sheet2.replace('<dimension ref="A2:K2"/>', `<dimension ref="A2:K${dernLigne}"/>`);
    sheet2 = sheet2.replace('</sheetData>', rowsXml + '</sheetData>');
    zip.file('xl/worksheets/sheet2.xml', sheet2);

    let table2 = await zip.file('xl/tables/table2.xml').async('string');
    table2 = table2.replace(/ref="A2:E3"/g, `ref="A2:E${dernLigne}"`);
    zip.file('xl/tables/table2.xml', table2);

    const blob = await zip.generateAsync({type:'blob', mimeType:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'Fiche_de_lot_'+state.coop.nom.replace(/[^a-z0-9]+/gi,'_')+'.xlsx';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('Modele genere avec '+producteurs.length+' producteur(s) valide(s) integre(s).', 'success');
  }catch(e){
    showToast('Erreur lors de la generation du modele : '+e.message);
  }
}


function telechargerFichierBase64(b64, filename, mime){
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for (let i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);
  const blob = new Blob([bytes], {type: mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
}

function genererTemplate(type){
  state.templatesTelecharges = state.templatesTelecharges || new Set();
  state.templatesTelecharges.add(type);
  if (type==='plots_boundaries'){
    const geojson = { type:'FeatureCollection', features:[
      { type:'Feature', properties:{ Nom_producteur:'', Code_producteur:'', PlotID:'' }, geometry:{ type:'Polygon', coordinates:[[]] } }
    ]};
    const blob = new Blob([JSON.stringify(geojson, null, 2)], {type:'application/geo+json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url; a.download='template_parcelles.geojson';
    document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
    render();
    return;
  }
  if (type==='farms_facilities'){
    telechargerFichierBase64(TEMPLATE_REGISTRE_MEMBRES_B64, 'Template_registre_membres.xlsx', 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
    render();
    return;
  }
  let headers, sheetName, fname;
  if (type==='product_movements'){
    headers = ['Date','Producteur (nom)','Code producteur','Origine','Destination','Type de produit','Volume (kg)','Certification','N° connaissement'];
    sheetName = 'Mouvements'; fname = 'template_mouvements_produit.xlsx';
  } else {
    headers = ['Question','Réponse'];
    sheetName = 'Questionnaire'; fname = 'template_questionnaire.xlsx';
  }
  const ws = XLSX.utils.aoa_to_sheet([headers]);
  ws['!cols'] = headers.map(()=>({wch:22}));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, sheetName);
  XLSX.writeFile(wb, fname);
  render();
}

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* ============================================================
   Contrôle de dépôt — C1-C8 (cartographie), R1-R4 (registre)
   ============================================================ */
const DEPOT_THRESHOLDS = {
  geometrieDegenereeHa: 0.01,
  tauxEchecMax: 0.15,
  civBounds: { latMin: 4, latMax: 11, lonMin: -9, lonMax: -2 },
};

function normaliserCode(s){ return String(s==null?'':s).replace(/[\s_\-]/g,'').toUpperCase(); }

function trouverIdentifiantParcelle(props){
  const candidats = ['PlotID','Plot_ID','plot_id','Name','ID','Identifiant','Code'];
  for (const c of candidats){ if (props && props[c]) return String(props[c]); }
  return null;
}

function validerGeoJSON(text){
  let fc;
  try{ fc = JSON.parse(text); }
  catch(e){ return { accepted:false, blocking:['C1 : fichier illisible (JSON invalide)'], reports:[] }; }
  if (!fc || fc.type!=='FeatureCollection' || !Array.isArray(fc.features)){
    return { accepted:false, blocking:['C1 : structure GeoJSON invalide (FeatureCollection attendue)'], reports:[] };
  }
  const reports = [];
  const seenIds = {};
  fc.features.forEach((f, idx)=>{
    const r = { index: idx, errors: [], warnings: [] };
    const plotId = trouverIdentifiantParcelle(f.properties);
    r.plotId = plotId;
    if (!plotId){ r.errors.push('C3 : identifiant de parcelle manquant'); reports.push(r); return; }
    seenIds[plotId] = (seenIds[plotId]||0) + 1;
    if (!f.geometry || !f.geometry.coordinates || !f.geometry.coordinates.length){
      r.errors.push('C2 : géométrie manquante ou vide'); reports.push(r); return;
    }
    if (f.geometry.type!=='Polygon' && f.geometry.type!=='MultiPolygon'){
      r.errors.push('C2 : type de géométrie non supporté ('+f.geometry.type+')'); reports.push(r); return;
    }
    let valid = true;
    try{ if (typeof turf!=='undefined' && turf.booleanValid){ valid = turf.booleanValid(f); } }catch(e){ valid = false; }
    if (!valid){ r.warnings.push('C5 : géométrie invalide (anneau non fermé ou auto-intersection) — à corriger'); }
    let areaHa = 0, centroid = null;
    try{
      areaHa = turf.area(f) / 10000;
      centroid = turf.centroid(f).geometry.coordinates;
    }catch(e){ r.warnings.push('C5 : impossible de calculer surface/centroïde sur cette géométrie'); }
    if (areaHa && areaHa < DEPOT_THRESHOLDS.geometrieDegenereeHa){
      r.warnings.push('C6 : surface quasi nulle ('+areaHa.toFixed(4)+' Ha)');
    }
    if (centroid){
      const [lon, lat] = centroid;
      const b = DEPOT_THRESHOLDS.civBounds;
      if (!(lat>=b.latMin && lat<=b.latMax && lon>=b.lonMin && lon<=b.lonMax)){
        r.warnings.push('C7 : centroïde hors de la zone attendue ('+lat.toFixed(4)+', '+lon.toFixed(4)+')');
      }
    }
    r.surfaceHa = areaHa ? Number(areaHa.toFixed(4)) : null;
    r.centroid = centroid;
    reports.push(r);
  });
  Object.entries(seenIds).forEach(([pid, count])=>{
    if (count>1){ reports.forEach(r=>{ if (r.plotId===pid) r.errors.push('C4 : identifiant "'+pid+'" utilisé '+count+' fois dans le fichier'); }); }
  });
  const total = reports.length;
  const failed = reports.filter(r=>r.errors.length>0).length;
  const failureRate = total ? failed/total : 1;
  const blocking = [];
  if (failureRate > DEPOT_THRESHOLDS.tauxEchecMax){
    blocking.push('C8 : '+(failureRate*100).toFixed(0)+'% des parcelles en échec (seuil autorisé : '+(DEPOT_THRESHOLDS.tauxEchecMax*100)+'%) — fichier refusé dans son ensemble.');
  }
  return { accepted: blocking.length===0, blocking, total, failed, failureRate, reports };
}

function detecterLigneEntete(rows){
  const motifs = /identifiant|^id$|code|^nom$|producteur/i;
  for (let i=0;i<Math.min(rows.length, 20);i++){
    const row = rows[i] || [];
    const hits = row.filter(cell=>motifs.test(String(cell||''))).length;
    if (hits>=2) return i;
  }
  return -1;
}

function validerRegistre(arrayBuffer){
  let wb;
  try{ wb = XLSX.read(arrayBuffer, {type:'array'}); }
  catch(e){ return { accepted:false, blocking:['R1 : fichier Excel illisible'], rows:[] }; }
  const sheetName = wb.SheetNames[0];
  if (!sheetName) return { accepted:false, blocking:['R1 : aucune feuille de données détectée'], rows:[] };
  const raw = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], {header:1, defval:''});
  const headerIdx = detecterLigneEntete(raw);
  if (headerIdx===-1) return { accepted:false, blocking:["R1 : ligne d'en-tête introuvable"], rows:[] };
  const headers = raw[headerIdx].map(h=>String(h||'').trim());
  const idColIdx = headers.findIndex(h=>/identifiant|^id$|code.?parcelle|plotid/i.test(h));
  if (idColIdx===-1) return { accepted:false, blocking:['R2 : colonne identifiant de parcelle introuvable'], rows:[], headers };
  const dataRows = raw.slice(headerIdx+1).filter(r=>r.some(c=>String(c||'').trim()!==''));
  const seen = {};
  const warnings = [];
  dataRows.forEach(r=>{ const id = String(r[idColIdx]||'').trim(); if (id) seen[id] = (seen[id]||0)+1; });
  const duplicates = Object.entries(seen).filter(([,c])=>c>1);
  if (duplicates.length>0){
    warnings.push('R3 : '+duplicates.length+' identifiant(s) en double dans le registre ('+duplicates.slice(0,5).map(([id,c])=>id+' x'+c).join(', ')+(duplicates.length>5?'…':'')+')');
  }
  const hasNom = headers.some(h=>/nom|producteur/i.test(h));
  const hasSurface = headers.some(h=>/surface|superficie|ha\b/i.test(h));
  const hasCoords = headers.some(h=>/lat|lon/i.test(h));
  if (!hasNom || !hasSurface || !hasCoords){
    warnings.push('R4 : colonnes attendues manquantes ('+[!hasNom&&'nom producteur',!hasSurface&&'surface',!hasCoords&&'coordonnées'].filter(Boolean).join(', ')+')');
  }
  return { accepted: true, blocking: [], warnings, headers, idColIdx, total: dataRows.length, ids: dataRows.map(r=>String(r[idColIdx]||'').trim()).filter(Boolean) };
}

function formatRapportDepot(result, type){
  let html = '';
  if (type==='geo'){
    html += '<p><b>'+result.total+'</b> parcelle(s) analysée(s), <b>'+result.failed+'</b> en échec ('+(result.failureRate*100).toFixed(0)+'%).</p>';
    const withIssues = result.reports.filter(r=>r.errors.length || r.warnings.length).slice(0,15);
    if (withIssues.length){
      html += '<ul style="font-size:12px;max-height:180px;overflow-y:auto;padding-left:18px;">';
      withIssues.forEach(r=>{ html += '<li><b>'+esc(r.plotId||'(sans identifiant)')+'</b> : '+[...r.errors,...r.warnings].map(esc).join(' — ')+'</li>'; });
      html += '</ul>';
      if (result.reports.length>15) html += '<p class="hint">… et '+(result.reports.length-15)+' de plus.</p>';
    }
  } else {
    html += '<p><b>'+result.total+'</b> ligne(s) détectée(s) dans le registre.</p>';
    if (result.warnings && result.warnings.length){ html += '<ul style="font-size:12px;">'+result.warnings.map(w=>'<li>'+esc(w)+'</li>').join('')+'</ul>'; }
  }
  return html;
}

async function loadAll(){
  state.loading = true; state.error=''; state.needsOnboarding=false; render();
  try{
    const userId = state.session.user.id;
    const { data: link, error: linkErr } = await supabaseClient.from('cooperative_users').select('cooperative_id').eq('user_id', userId).maybeSingle();
    if (linkErr || !link){
      state.needsOnboarding = true;
      state.loading = false; render(); return;
    }
    const coopId = link.cooperative_id;
    const { data: coop } = await supabaseClient.from('cooperatives').select('*').eq('id', coopId).maybeSingle();
    state.coop = coop;
    const { data: demandes } = await supabaseClient.from('demandes').select('*').eq('cooperative_id', coopId).order('requested_at', {ascending:false});
    state.demandes = demandes || [];
    const { data: docs } = await supabaseClient.from('doc_check').select('*').eq('cooperative_id', coopId);
    state.docChecks = docs || [];
  }catch(e){
    state.error = "Erreur de chargement : "+e.message;
  }
  state.loading = false; render();
}

async function confirmerUploadDemande(demandeId){
  const sel = state.uploadSelectionne;
  if (!sel || sel.demandeId!==demandeId || !sel.file) return;
  const file = sel.file;
  const d = state.demandes.find(x=>x.id===demandeId);
  if (!d) return;

  const nomFichier = file.name.toLowerCase();
  const estGeo = nomFichier.endsWith('.geojson') || nomFichier.endsWith('.json');
  const estExcel = nomFichier.endsWith('.xlsx') || nomFichier.endsWith('.xls') || nomFichier.endsWith('.csv');

  try{
    let controle = null, typeControle = null;
    if (estGeo){
      const text = await file.text();
      controle = validerGeoJSON(text);
      typeControle = 'geo';
    } else if (estExcel){
      const buf = await file.arrayBuffer();
      controle = validerRegistre(buf);
      typeControle = 'registre';
    }

    if (controle && !controle.accepted){
      openModal('depotRejete', { demandeId, fileName: file.name, controle, typeControle });
      return;
    }
    if (controle && ((controle.reports||[]).some(r=>r.warnings.length) || (controle.warnings||[]).length)){
      state.pendingUpload = { demandeId, file };
      openModal('depotAvertissement', { controle, typeControle });
      return;
    }

    await envoyerFichierDemande(demandeId, file);
    state.uploadSelectionne = null;
  }catch(e){
    showToast('Erreur lors du contrôle du fichier : '+e.message);
  }
}

async function confirmerEnvoiMalgreAvertissements(){
  const p = state.pendingUpload;
  if (!p) return;
  closeModal();
  await envoyerFichierDemande(p.demandeId, p.file);
  state.uploadSelectionne = null;
  state.pendingUpload = null;
}

async function envoyerFichierDemande(demandeId, file){
  try{
    const path = state.coop.id + '/demandes/' + demandeId + '_' + file.name;
    const { error: upErr } = await supabaseClient.storage.from('documents-coop').upload(path, file, { upsert: true });
    if (upErr){ showToast("Échec de l'envoi du fichier : "+upErr.message); return; }
    const { error } = await supabaseClient.from('demandes').update({
      statut: 'en_validation', fichier_path: path, fichier_nom: file.name,
      soumis_par: state.session.user.id, soumis_le: new Date().toISOString()
    }).eq('id', demandeId);
    if (error){ showToast("Échec de l'enregistrement : "+error.message); return; }
    showToast('Document soumis avec succès — en attente de validation par ECORIGINE.', 'success');
    await loadAll();
    closeRequestDetail();
    try{
      const { error: fnErr } = await supabaseClient.functions.invoke('email-soumission-demande', { body: { demande_id: demandeId } });
      if (fnErr) showToast("Fichier soumis, mais la notification email a échoué : "+fnErr.message);
    }catch(e){ showToast("Fichier soumis, mais la notification email a échoué : "+e.message); }
  }catch(e){
    showToast('Erreur : '+e.message);
  }
}

async function telechargerFichier(path, nom){
  try{
    const { data, error } = await supabaseClient.storage.from('documents-coop').download(path);
    if (error){ showToast('Impossible de télécharger ce fichier : '+error.message); return; }
    const url = URL.createObjectURL(data);
    const a = document.createElement('a'); a.href = url; a.download = nom || 'document';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }catch(e){ showToast('Erreur : '+e.message); }
}

  } else if (state.needsOnboarding){
    html += renderOnboarding();
  } else if (state.error){
    html += '<div class="error-banner">'+esc(state.error)+'</div>';
  } else if (state.view==='requestDetail'){
    html += renderRequestDetail(state.detailId);
  } else if (state.tab==='requests'){
    html += renderRequestsTab();
  } else if (state.tab==='documents'){
    html += renderDocumentsTab();
  } else {
    html += renderProfileTab();
  }

  html += '</div></div></div>'; // fin .wrap / .main-area / .app-shell

  if (state.modal) html += renderModal();
  if (state.toast) html += '<div class="toast '+(state.toast.type==='success'?'success':'error')+'"><span>'+esc(state.toast.message)+'</span><button class="close" onclick="dismissToast()">✕</button></div>';

  app.innerHTML = html;
}

function renderRequestsTab(){
  const pending = state.demandes.filter(d=>d.statut==='demandee' || d.statut==='en_validation' || d.statut==='rejetee' || d.statut==='annulee');

  let html = '<div class="panel"><div class="panel-head"><h2>Demandes en attente ('+pending.length+')</h2></div>';
  html += renderRequestsTable(pending, false);

async function envoyerMajConformite(){
  const btn = document.getElementById('envoyer-maj-conformite-btn');
  if (btn){ btn.disabled = true; btn.textContent = 'Envoi en cours…'; }
  try{
    const { data, error } = await supabaseClient.functions.invoke('email-documents-manquants', { body: { cooperative_id: state.coop.id } });
    if (error){ showToast("Échec de l'envoi : "+error.message); }
    else if (data && data.error){ showToast("Échec de l'envoi : "+data.error); }
    else { showToast('Mise à jour envoyée — vérifiez votre boîte mail.', 'success'); }
  }catch(e){ showToast('Erreur : '+e.message); }
  if (btn){ btn.disabled = false; btn.textContent = 'Envoyer ma mise à jour'; }
}

      + '<label class="field">Email 3<input type="email" name="maj_email3" value="'+esc(c.email3||'')+'"></label>'

  }
  return '';
}

</script>
